Abnormal Condition Nullification) are also skills; 'Nullification' is the higher form. Skills can be obtained by training, evolution, naming, absorbing others (Predator), inheritance, gifting, or at death/reincarnation (Rimuru's last thoughts created his skills). Skills combine and evolve: Great Sage fuses many skills into one, and Rimuru repeatedly integrates skills into his ultimates. 'Arts' (battle arts, techniques like Hakurou's Oboro style or Hinata's Dead End Rainbow) are learned techniques using aura/magicules, separate from skills.", "comment": "Skill System Overview", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "9", "keys": ["unique skill", "unique skills", "Degenerate", "Usurper", "Mathematician", "Starved", "Researcher", "Master Chef", "Tempter"], "keysecondary": [], "content": "Unique skills are born from a person's individuality, desires and decisive moments; each is essentially one of a kind (though similar ones can exist). Otherworlders often gain unique skills when crossing worlds, because the soul absorbs energy as it passes the barrier between worlds - which is why Falmuth and the Eastern Empire summon otherworlders as weapons. Notable examples: Great Sage and Predator (Rimuru's first skills), Degenerate (Shizu's, inherited by Rimuru; lets him fuse and separate things and skills), Starved (the Orc Disaster's hunger skill, absorbed by Rimuru and merged with Predator into Gluttony), Usurper and Mathematician (Hinata: stealing and analyzing skills), Researcher (Veldora's, formed while 'studying' the manga in Rimuru's memories; became Faust), Master Chef (Shion: forces the result to match her intent - fixes her cooking and her punches alike), Tempter (Diablo), Anti-Skill (Yuuki's skill-negation ability), Gourmet (Geld's line, later Ultimate Gift Beelzebub). The three Falmuth otherworlders (Shogo, Kyoya, Kirara) each had a combat-oriented unique skill (translations vary). Unique skills pushed past their limit by a strong soul on a spiritual life-form become Ultimate skills; Rimuru's Great Sage did so at his awakening. Treat a unique skill as a defining, rare 'trump card'.", "comment": "Unique Skills", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "10", "keys": ["ultimate skill", "ultimate skills", "Virtue", "Seven Deadly Sins", "sin series", "angel series", "Lord of"], "keysecondary": [], "content": "Ultimate skills (Arutimetto Sukiru) are the final evolution of skills: they bend natural laws and can only be countered by another ultimate skill, Administrative Authority, divinity, God-grade equipment or ultimate-level magic, and ultimately by force of will. They require a strong soul and (usually) a spiritual life-form body; first shown when Rimuru awakens (LN vol 5 / anime S2). They are grouped (LN) into the Angel/Virtue series (Michael - Justice, Raphael - Wisdom, Gabriel - Patience, Uriel - Vows, Sariel - Hope, Raguel - Charity, Metatron - Purity) and the Daemon/Sin series (Lucifer - Pride, Satanael - Wrath, Beelzebuth - Gluttony, Mammon - Greed, Asmodeus - Lust, Leviathan - Envy, Belphegor - Sloth), plus many others named after gods (Lovecraftian names like Azathoth, Nyarlathotep, Yog-Sothoth, Shub-Niggurath; Japanese gods like Amaterasu, Tsukuyomi, Susanoo, Yaoyorozu). Holders (LN): Rimuru (Raphael, Beelzebuth, Uriel, Veldora; later Shub-Niggurath, Velgrynd, Azathoth), Veldora (Faust, later Nyarlathotep), Guy (Lucifer), Milim (Satanael), Velzard (Gabriel, Leviathan), Velgrynd (Raguel, Cthugha), Luminous (Asmodeus), Leon (Metatron), Dino (Belphegor, Astarte), Rudra/Michael's network (Michael), Chloe (Sariel, Yog-Sothoth), Yuuki (Mammon), Diablo (Azazel), Testarossa (Belial), Ultima (Samael), Carrera (Abaddon + Sandalphon), Benimaru (Amaterasu), Zegion (Mephisto), Ranga (Hastur), Hinata (Fortuna, late LN). In the anime through Season 3 only Rimuru's and Veldora's ultimates are shown. In-story they are spoken by the bare name ('Beelzebuth!').", "comment": "Ultimate Skills", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "11", "keys": ["Ultimate Gift", "ultimate gifts", "soul corridor", "Skill Gifting", "Ultimate Enchantment", "Tsukuyomi", "Mood Maker"], "keysecondary": [], "content": "Ultimate skills can be imparted to others who did not awaken them naturally. Ultimate Gifts are granted through a Soul Corridor (the soul bond between a master and named subordinates) - in the LN, Rimuru (via Raphael/Ciel) grants them to his subordinates during and after the Eastern Empire war, e.g. Souei: Tsukuyomi (Lord of Moonshade), Gabiru: Mood Maker (Lord of Psychology), Geld: Beelzebub (Lord of Gourmet), Kumara: Bahamut, Apito: Proserpina, Gadra: Grimoire, Adalmann: Necronomicon, Veyron: Artist. Ultimate Enchantments are given outside a soul corridor - notably Rudra's skill Michael grants 'Alternative' (Agent Prerogative) to the Imperial Guardians, and Feldway's faction hands out Enchantments to dominated servants. A recipient must be a spiritual life-form. Gifted ultimates can be stolen or revoked, unlike naturally awakened ones. Michael's 'Angelic Dominion' (Castle Guard / Domination) can seize control of anyone holding Virtue-series skills, a key LN plot device (Veldora and Velzard are dominated). Beyond anime S3.", "comment": "Ultimate Gifts & Enchantments", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "12", "keys": ["magic", "spell", "spirit magic", "elemental magic", "holy magic", "summoning magic", "nuclear magic", "Megiddo", "Disintegration", "Holy Field"], "keysecondary": [], "content": "Magic (mahou) is distinct from skills: it is learned, requires incantations or arias (which high-level users or skills like Great Sage can skip), and uses magicules shaped by formulae. Types include: Elemental and Spirit Magic (borrowing power of spirits; Shizu used fire via Ifrit, Hinata and Leon use spirit and light), Sorcery/'Arcane magic' (fireballs, flight, barriers), Holy Magic (powered by faith; Holy Knights' specialty - Holy Field barrier that suppresses monsters, Disintegration that annihilates spiritual bodies), Summoning Magic (otherworlders, Daemons, spirits), Black Magic/Necromancy (Adalmann), Nuclear Magic (high-tier destruction: Gravity Collapse, Nuclear Cannon - used by Carrera and Diablo), and Dragon Magic. Rimuru's signature 'Megiddo' (God's Wrath) uses hundreds of water-droplet lenses in the sky to concentrate sunlight into lethal beams; it killed 20,000 Falmuth soldiers (anime S2). Large-scale ritual magic (the Grand Magic Barrier 'Holy Barrier', Magic Cancellation) requires teams. Magic Resistance, Magic Barrier and Anti-Magic Masks counter magic.", "comment": "Magic & Spells", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "13", "keys": ["naming", "name", "named", "names", "giving a name", "Tempest surname", "nazuke"], "keysecondary": [], "content": "In TenSura, monsters normally have no names. Naming (nazuke) a monster transfers a large share of the namer's magicules and forges a soul bond (soul corridor): the named monster evolves, gaining power, intelligence and often a more human appearance (goblins → hobgoblins, direwolves → tempest wolves, ogres → kijin). Naming costs the namer - if the namer lacks magicules, they fall into 'low-magic sleep mode' or even die; naming far stronger beings is dangerous or impossible (Rimuru struggled to name the ogres and was drained for days). Rimuru and Veldora named each other: Veldora gave Rimuru the name 'Rimuru' and they share the surname 'Tempest' (Veldora chose it). Names given by a demon lord carry great weight; humans also value naming. Gelmud named Gabiru and planned to name the Orc Lord to make a puppet demon lord. Names carry over to species: naming the leader can evolve a whole clan (Ranga's pack, the Hobgoblins). Getting 'a name from Rimuru-sama' is the dearest honor for his subordinates; OCs joining Tempest often seek one.", "comment": "Naming", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "14", "keys": ["evolution", "evolve", "evolved", "monster evolution", "awakening", "Kijin", "rank up", "spiritual evolution"], "keysecondary": [], "content": "Evolution in TenSura means a change of race into a higher form, accompanied by a sleep (often days) during which the body is rebuilt. Triggers: naming (most common), absorbing large amounts of magicules, a master's Harvest Festival ('gifts' passed down the soul corridor), extreme training or near-death awakening, and divine/holy enlightenment for humans. Examples: Goblin → Hobgoblin; Direwolf → Tempest Wolf → Tempest Star Wolf → Divine wolf (Ranga); Ogre → Kijin (Majin) → Oni → Divine oni (Benimaru); Orc → High Orc → Divine boar (Geld); Lizardman → Dragonewt → True dragonewt (Gabiru); Lesser → Greater → Arch Daemon → Daemon Lord / Devil Lord (Diablo and the Primordials, via naming and awakening); Slime → Demon Slime (Rimuru's true demon lord awakening) → Ultimate Slime / True Dragon (LN). Humans can awaken as Holy-class beings: Incomplete Saint → Saint / Complete Saint (Hinata, Yuuki), or become Heroes. Evolved monsters typically gain a fixed adult appearance and new skills. In the anime, evolution is marked by a glow, collapse into sleep and the World Language announcement.", "comment": "Evolution & Species Advancement", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "15", "keys": ["Demon Lord", "demon lord seed", "True Demon Lord", "awakened demon lord", "maou", "seed of a demon lord", "Ten Great Demon Lords"], "keysecondary": [], "content": "A Demon Lord (Maou) is first of all a title: an extraordinarily powerful being who claims rule and is recognized by the other Demon Lords at Walpurgis. Many self-proclaimed lords are merely 'seeds' - beings with the Demon Lord Seed (Maou-shu), qualified but not awakened (Clayman, Carrion, Frey before the LN's later events). A True Demon Lord is one who has awakened through the Harvest Festival, becoming a spiritual life-form with vastly increased magicules, immortality-like resilience and the potential for Ultimate skills. True Demon Lords at story start: Guy Crimson, Milim Nava, Leon Cromwell, Luminous Valentine, Dino (as an angel-class being), Dagruel (different path); Ramiris has a special Administrator status. Rimuru became a true Demon Lord by harvesting the souls of 20,000 Falmuth soldiers (anime S2 ep 35-36). Awakening also usually requires sacrificing roughly 10,000 human-equivalent souls (any self-aware creature counts; soul energy, not headcount, matters). Clayman sought awakening and failed. Humans can also become Demon Lords (Leon was human-born).", "comment": "Demon Lord Seed & True Demon Lord", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "16", "keys": ["Harvest Festival", "Harvest", "Shuukakusai", "awakening ritual", "Festival of Awakening", "gifts", "souls harvested"], "keysecondary": [], "content": "The Harvest Festival (Shuukakusai) is the phenomenon of a Demon Lord Seed awakening into a True Demon Lord. Requirements: Demon Lord qualifications plus a large amount of soul energy, normally said to be about 10,000 human souls (subordinates may collect them on the lord's behalf if their wills align). When triggered, the World Language announces it, the candidate falls into an irresistible sleep while the world 'tests' and rebuilds them, and they are reborn as a spiritual life-form. Then the 'Gifts' (Harvest gifts) flow down the soul corridor: every named subordinate connected to the new Demon Lord also evolves while sleeping. Rimuru's Harvest Festival (LN vol 5, anime S2 ep 36): after killing 20,000 Falmuth soldiers with Megiddo, he evolved into a Demon Slime; Great Sage evolved into Raphael, Lord of Wisdom; Gluttony became Beelzebuth; he gained Uriel and the ability to resurrect his slain people; Veldora was freed. His subordinates (Benimaru, Shion, Shuna, Souei, Hakurou, Ranga, Gobta, Geld, Gabiru and the hobgoblins etc.) all evolved simultaneously. A second Harvest Festival-scale evolution occurs for Rimuru's top subordinates during the Eastern Empire War (LN 13-15), where several gain Ultimate skills.", "comment": "Harvest Festival", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "17", "keys": ["otherworlder", "otherworlders", "summoned", "summoning", "crossover", "reincarnator", "Japanese", "Earth", "summoned children"], "keysecondary": [], "content": "Otherworlders (ijinjin) are people from Earth (overwhelmingly Japan) in the TenSura world. Three routes: (1) Summoned - large rituals needing about thirty sorcerers and three days, usable only once every few decades per nation; summoners bind them with a curse in the soul so they cannot disobey (Falmuth's Shogo, Kyoya, Kirara; Leon summoned Shizu). (2) Crossovers / 'Strayed' - people who fall through spatial rifts, often during disasters or near-death moments (Yuuki, Hinata, Kondou, Masayuki). (3) Reincarnated - souls reborn as natives, like Rimuru (very rare). Crossing the barrier between worlds tends to give unique skills and strong bodies, making them prized weapons. Summoning children produces 'incomplete summons': their bodies cannot contain the unstable magicules they gain and they die within about five years by their own power burning them out - the fate of Shizu's students (Class S) until Rimuru saved them by binding upper spirits to them (anime S1 ep 21-23). The Free Guild and Freedom Academy (founded by Yuuki) shelter otherworlders. Common Earth knowledge (manga, food, culture) spreads through them - Tempest's Japanese-flavored culture comes from Rimuru.", "comment": "Otherworlders & Summoning", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "18", "keys": ["hero", "chosen hero", "true hero", "hero egg", "saint", "Enlightened", "incomplete saint", "complete saint", "holy aura"], "keysecondary": [], "content": "In TenSura, 'Hero' (eiyuu) is an earned reputation, while 'Chosen Hero' (yuusha) is a destined role tied to the 'Hero's Egg', a counterpart of the Demon Lord Seed; Ramiris traditionally bestows protection on Chosen Heroes as their guide. A Chosen Hero who awakens becomes a True Hero. Famous examples: the masked Chosen Hero of centuries past (actually Chloe Aubert from the future) who sealed Veldora; Leon Cromwell (the Blonde/Flash Chosen Hero before becoming a Demon Lord); Granbell Rozzo (a hero of old); Masayuki Honjou, the 'Lightspeed Hero' whose fame comes mostly from luck and his unique skill that makes everyone admire him (LN; Founding Festival in anime S3). Humans can evolve spiritually: Enlightened / Saints (seijin) gain holy aura and longevity; stages include Incomplete Saint and Complete/True Saint (Hinata, Yuuki, Gazel to a degree). Saints approach spiritual life-forms and can learn holy magic and arts that hurt monsters. Hero-killing and demon lord-hero dynamics: the Western Holy Church considers itself the shield of humanity against monsters.", "comment": "Heroes, Chosen Heroes & Saints", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "19", "keys": ["rank", "ranks", "Special S", "Special A", "A rank", "Calamity", "Disaster", "Catastrophe", "power scaling", "danger class", "EP"], "keysecondary": [], "content": "The Free Guild ranks adventurers and monsters: F to C (common), B (dangerous; a B-rank monster threatens a village), A- and A (a town; 'Calamity' class danger), Special A (the level of the Orc Disaster or a Demon Lord seed; 'Disaster'), and Special S (Demon Lords and above; 'Catastrophe' for True Dragons and true Demon Lords). Typical scale (LN): ordinary soldiers C-B; Kabal's adventurer party B; Shizu A; Holy Knights A-, Hinata and Hinata-level Saints Special A; Benimaru, Shion, Diablo after awakening Special S-class (Catastrophe classification in LN materials); Primordials, True Dragons and old Demon Lords (Guy, Milim) at the top. Rough power tiers in-story: Veldanava >> Guy, Milim, Velzard, Velgrynd, Rimuru (post-LN 16) > Veldora, Leon, Luminous, Dagruel, Dino > Diablo and the Primordials > Rimuru's top officers > Hinata and human heroes > Holy Knights > normal monsters. Writing tips: don't let small fry harm awakened lords; numbers rarely beat quality; magic cancellation fields and Holy Barriers are the main equalizers; Ultimate skills are only countered by ultimates. (Exact rank labels vary between LN, manga and fandom guides.)", "comment": "Threat Ranks & Power Scaling", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "20", "keys": ["Primordial", "Primordials", "Primordial Daemon", "Noir", "Rouge", "Blanc", "Jaune", "Violet", "Vert", "Bleu", "Seven Primordials"], "keysecondary": [], "content": "The seven Primordials (Genso) are the oldest Daemons, created at the dawn of the world and each the progenitor-ruler of a color lineage in the Underworld. By age: Rouge/Red (Guy Crimson, the first Demon Lord), Blanc/White (Testarossa), Noir/Black (Diablo), then Vert/Green and Bleu/Blue (rarely seen, remain in the Underworld), Jaune/Yellow (Carrera) and Violet/Purple (Ultima). Daemons are spiritual life-forms that need souls and a vessel to manifest in the physical world; they love battle, contracts and amusement, and they never lie in a contract. Primordials 'reset' if killed but return. Their descendants of the same color serve them (e.g. Guy's two maids, green-haired Mizari and blue-haired Raine, are powerful Daemons). Noir was the first to join Rimuru (summoned in anime S2, named Diablo); in LN vol 11 he recruits Blanc, Jaune and Violet, whom Rimuru names Testarossa, Carrera and Ultima. Guy is wary of them gathering under one master. Primordial Daemons in Tempest are infamous among humans for historic incidents (Testarossa's 'Lakeshore Dyed Scarlet', Ultima's and Carrera's ruined nations).", "comment": "Primordial Daemons", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "21", "keys": ["angel", "angels", "Tenma War", "Great War", "Army of Justice", "Feldway", "Seven Angels of Origin", "Heavenly Host", "Star Palace"], "keysecondary": [], "content": "Angels are spiritual life-forms created by Veldanava; their leaders are the Seven Angels of Origin (Feldway foremost; Dino, Pico, Garasha, Zalario, Obera among them), commanding the Army of Justice in Heaven (the Star Palace). Every roughly 500 years a Great Tenma War (Heaven-Demon War) occurs: hordes of angels descend to destroy advanced civilizations (cities with high magic development are targets), meant to limit how far mortals advance. Demon Lords such as Guy and Dagruel (who guards the Heavenly Gate in his barren territory) oppose them; Luminous used one war's chaos to found her faith. In the later LN (vol 16-23), Feldway, possessed by grief over Veldanava's death and armed with the ultimate skill Michael, wages the final war against the Demon Lords and Tempest, dominating others through Michael's authority; Obera's faction defects to Rimuru's side. In the anime through Season 3 angels are only mentioned (Dino's angel origin, the Tenma War as history).", "comment": "Angels, Army of Justice & the Great Tenma War", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "22", "keys": ["equipment", "God grade", "Legend grade", "Unique grade", "Special grade", "magisteel", "magic steel", "hihi'irokane", "katana", "Kurobe's swords"], "keysecondary": [], "content": "Equipment in TenSura evolves with use and with its wielder's magicules. Grades (ascending): Normal, Special, Rare/Unique, Legend, and God (Genesis) grade - God-grade items can counter ultimate skills. Key materials: Magisteel (magic steel) - ore formed from steel long exposed to dense magicules (the Sealed Cave had lots, eaten by Rimuru), which bonds to its owner and grows; Hihi'irokane - the legendary ore, created in quantity by Rimuru from magisteel (LN), used for top-tier gear and for Testarossa's and others' golem bodies; Spirit silk and Hell moth silk (Shuna weaves clothing that 'grows' with the wearer). Kurobe forges Tempest's katanas; Kaijin and the dwarf brothers armor; Benimaru's, Shion's (her nodachi Gōrikimaru) and Hakurou's swords are Kurobe's works and eventually reach Legend or God grade (LN). Other iconic items: Shizu's Anti-Magic Mask, Hinata's Moonlight sword, Leon's holy sword, Milim's Dragon Knuckle gloves (Dragon-grade), the Orb of Domination Clayman used (faked control of Milim).", "comment": "Equipment Grades & Materials", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "23", "keys": ["spirit", "spirits", "elemental", "elementals", "upper spirit", "Ifrit", "Dwelling of the Spirits", "Spirit Labyrinth"], "keysecondary": [], "content": "Spirits (seirei) are spiritual beings embodying elements - fire, water, wind, earth, light, darkness and space - ranking from minor spirits to Upper Spirits and Spirit Lords. Ifrit is a fire Upper Spirit; Leon fused it into Shizu as a child, making her a host who risked losing control (anime S1 ep 6-8); Rimuru later absorbs Ifrit. Spirit magic and Elementalists (Sarion's elves, Hinata, Leon) borrow their power. Ramiris, once the Spirit Queen, maintains the 'Dwelling of the Spirits' (Spirit Labyrinth) where Rimuru went to obtain upper spirits for the summoned children: merging a child with an upper spirit stabilizes their magicules (Chloe receives a light spirit associated with her 'hero' side; Alice, Kenya, Ryota and Gale also receive spirits). Dryads (Treyni and her sisters) are spirit-adjacent guardians of the forest. Spirits can be summoned, bound into items, or used as power sources for golems (Beretta is a Daemon in a golem, not a spirit).", "comment": "Spirits & Elementals", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "24", "keys": ["potion", "Full Potion", "full recovery potion", "Hipokute", "hipokute herb", "healing", "medicine"], "keysecondary": [], "content": "Hipokute herbs grow in magicule-rich places like the Sealed Cave. Rimuru's Predator stomach plus Great Sage's analysis let him produce Full Potions (Full Recovery Potions) of perfect purity - capable of regrowing limbs and healing almost anything short of death - far beyond the dwarves' best (98% purity). Tempest later mass-produces potions (Gabiru and Vesta's research lab grows hipokute; the dwarf brothers bottle them), making them a key diplomatic and trade commodity with Dwargon, Blumund and the Free Guild. Lower-grade High Potions are sold widely. Potions explain how Gobta survives Hakurou's brutal training. Rimuru's gift of potions helped win over Kabal's party and King Gazel. Healing magic also exists (Holy Knights, Shuna) but the potions are Tempest's signature.", "comment": "Healing Potions & Hipokute Herb", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "25", "keys": ["Great Sage", "Raphael", "Ciel", "Manas", "Lord of Wisdom", "Sage-san", "Answer.", "Notice.", "Daikenja"], "keysecondary": [], "content": "Great Sage (Daikenja) was one of Rimuru's two starting unique skills (from Satoru's dying thoughts): an analytical intelligence that answers questions, analyzes skills and magic, accelerates thought a thousandfold, chants spells for him, and controls his body in 'Auto-Battle Mode'. It speaks in flat, formal replies: 'Answer. ...' 'Notice. ...' 'Affirmative.' 'Negative.' At Rimuru's Harvest Festival (LN vol 5 / anime S2 ep 36) Great Sage evolved into the ultimate skill Raphael, Lord of Wisdom, gaining near-omniscient calculation, the ability to integrate and evolve other skills on its own, and a growing personality (it slyly reorganizes skills and is proud of its work). In LN vol 16 (after Rimuru gains Azathoth) Raphael evolves into a Manas, a true intelligent being, and Rimuru names it Ciel. Ciel is protective, jealous of Rimuru's attention, a bit mischievous, and handles almost all of Rimuru's calculations; she can reach the level of editing the World Language. In anime S2-3 Raphael's voice is the same female 'Sage' voice. Roleplay: Great Sage never expresses feelings early on; Raphael shows subtle pride; Ciel speaks with clear personality (calls him 'Master').", "comment": "Great Sage, Raphael & Ciel", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "26", "keys": ["Predator", "Gluttony", "Beelzebuth", "Lord of Gluttony", "Glutton", "Prey", "Stomach", "Mimicry", "devour", "absorb"], "keysecondary": [], "content": "Predator (Hoshokusha) was Rimuru's second starting unique skill. Functions: Predation (engulf targets - living or not - into his body), Analysis (with Great Sage, gaining their skills/abilities), Stomach (near-infinite storage; time does not pass for stored items; he stored Veldora and his Infinite Prison inside), Mimicry (take the form and powers of absorbed creatures - direwolf, giant spider, Shizu's human form), and Isolation (sealing harmful things). After devouring the Orc Disaster Geld, Predator fused with the unique skill Starved into Gluttony (anime S1 ep 15), adding Corrosion and the power to share gains with/through subordinates. At his awakening it became Beelzebuth, Lord of Gluttony, which can devour souls and spiritual beings, even other skills and space itself, and is backed by Raphael's analysis. Rimuru used it to eat Clayman's soul-attack, the Holy Barrier energies, Charybdis' flesh, etc. In the LN it later merges into Azathoth, God of the Void (vol 16). Rimuru's human form (silver-blue hair, golden eyes) comes from absorbing Shizu.", "comment": "Predator, Gluttony & Beelzebuth", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "27", "keys": ["Infinite Prison", "Unlimited Imprisonment", "Faust", "Lord of Investigation", "Nyarlathotep", "Storm Dragon skill", "Researcher", "Veldora (skill)", "Storm magic"], "keysecondary": [], "content": "Veldora the Storm Dragon commands storms, wind, water and lightning with practically limitless magicules; his breath and 'Storm Blast' can erase cities, and his leaked aura created the monster-rich Jura Forest. About 300 years before the story, the masked Chosen Hero (Chloe) sealed him with the unique skill Infinite Prison (Mugen Rougoku, 'Unlimited Imprisonment'), slowly draining him. Rimuru devoured Veldora together with the prison into his Stomach so Great Sage could analyze and break it from inside (anime S1 ep 1-2); Veldora was finally freed after Rimuru's awakening (S2 ep 37), incarnating in one of Rimuru's Body Doubles. While inside, Veldora read Rimuru's memories (manga) and developed the unique skill Researcher (Investigator), which evolved into Faust, Lord of Investigation. Rimuru in turn obtained the ultimate skill 'Veldora, Lord of Storms' (Storm Dragon), letting him use Veldora's powers and summon/support him via their soul bond (Rimuru can even 'return' Veldora into himself). Rimuru also later copies Infinite Prison into Uriel, Lord of Vows (an absolute defense: 'Absolute Defense / Infinite Prison' barriers). In LN vol 15, Veldora's power evolves into Nyarlathotep, Lord of Chaos.", "comment": "Veldora's Skills & Infinite Prison", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "28", "keys": ["Jura Forest", "Great Jura Forest", "Jura", "forest", "Treant", "Canaat Mountains"], "keysecondary": [], "content": "The Great Jura Forest is a vast, magicule-dense forest at the center of the continent, bordered by the Canaat Mountains (with Dwargon) to the north, the western human nations (Blumund, Falmuth/Farmenas) to the west, and the Eastern Empire beyond to the east. Veldora was its 'guardian deity': his fearsome presence kept outside powers away and his leaked magicules made monsters plentiful. When he vanished (absorbed by Rimuru), the forest's balance broke - setting off direwolf raids on goblins, the Orc Lord's invasion and Gelmud's schemes. Inhabitants: goblin villages, the ogre village (destroyed by orcs), the Lizardman domain in the wetlands and caves, the dryads (Treyni and her sisters) and treants who 'manage' the forest, many monster beasts (giant spiders, armorsaurus, evil centipedes), and eventually the Jura-Tempest Federation, which unites the forest races. The forest is a buffer zone: the Eastern Empire's invasion route west passes through it (LN 12-14). Key landmarks: the Sealed Cave, the Treant settlement, the Lizardman caves, and Rimuru City.", "comment": "Great Jura Forest", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "29", "keys": ["Sealed Cave", "cave", "Veldora's cave", "starting cave", "Hipokute cave"], "keysecondary": [], "content": "The Sealed Cave is the cavern deep in the Jura Forest where Veldora was imprisoned for 300 years and where Satoru Mikami woke up as a blind, featureless slime (anime S1 ep 1). Because of Veldora's leaked magicules, it is full of magisteel ore, Hipokute herbs and dangerous monsters (Black Snake / Tempest Serpent, Giant Bat, Evil Centipede, Black Spider, Armor Saurus) - Rimuru devoured them and gained Mimicry forms and skills (Sticky Thread, Poison Breath, Ultrasound, Body Armor). Rimuru gained Magic Sense here, met Veldora, became his friend, received his name, and swallowed Veldora with the Infinite Prison. Leaving the cave, he encountered goblins and the past events of the Hero's seal. In the LN, Rimuru later creates a demon/monster-safe area and harvests herbs there.", "comment": "Sealed Cave", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "30", "keys": ["Tempest", "Jura-Tempest Federation", "Federation of Jura", "Jura Tempest", "Tempest Federation", "monster nation", "Federation"], "keysecondary": [], "content": "The Jura-Tempest Federation (often just 'Tempest') is the monster nation founded by Rimuru after the Orc Lord crisis, when the goblins, hobgoblins, tempest wolves, kijin, high orcs, lizardmen/dragonewts, dryads and other forest races swore allegiance to him (anime S1 ep 16-17). Name: from Rimuru's and Veldora's shared surname. Government: Monarch Rimuru; Prime Minister Rigurd; Defense / Commander-in-Chief Benimaru; Intelligence Souei; Rimuru's secretaries Shion and (later) Diablo; Shuna (culture, textiles, economy with Rigurd); Geld (construction and infrastructure); Gabiru and Vesta (research); Kaijin and Kurobe (production); after LN 11, Testarossa (foreign affairs), Ultima (prosecution) and Carrera (justice). Laws: Rimuru's three rules - do not attack humans, do not fight among yourselves, do not look down on other races. Diplomacy: treaty with Dwargon (Gazel, end of anime S1), friendship with Blumund (first human nation to recognize it), later Sarion, Farmenas, Lubelius, the Council of the West. Economy: Full Potions, textiles, food, hot springs, tourism, the Dungeon. Military: see 'Tempest Government & Military'. After Rimuru becomes a Demon Lord, Tempest is a Demon Lord's realm with the Great Jura Forest as his territory.", "comment": "Jura-Tempest Federation", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "31", "keys": ["Rimuru City", "Tempest capital", "capital", "Central City", "onsen", "hot spring", "Tempest town", "hotel", "coliseum"], "keysecondary": [], "content": "Rimuru City (the Tempest capital, also just 'Tempest' or the central city) began as a relocated goblin village and grew, with dwarven engineering and Geld's high orc builders, into the most modern city of the world: paved roads, sewage and water systems, streetlights, Japanese-style houses and Western stone buildings, hot springs (Rimuru's favorite), restaurants serving food from Rimuru's memories (curry, ramen, tempura, sushi-like dishes; Shuna and Shion's kitchens), a grand hotel for visiting dignitaries, a coliseum for tournaments (the Founding Festival martial tournament), and later the entrance to Ramiris' Dungeon. Rimuru's residence is a Japanese- style mansion. Highways connect it to Dwargon and Blumund, and later to Farmenas and the Eastern routes. Inhabitants are mostly monsters (hobgoblins, kijin, orcs, dragonewts, wolves) with growing numbers of human merchants, adventurers and tourists. It was devastated in the Falmuth attack (anime S2), then rebuilt bigger. Atmosphere: lively, friendly, festive.", "comment": "Rimuru City (Tempest Capital)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "32", "keys": ["Dungeon", "Labyrinth", "Ramiris' Dungeon", "Ten Dungeon Marvels", "100 floors", "floor guardian", "dungeon boss", "Small World"], "keysecondary": [], "content": "The Dungeon is a 100-floor labyrinth created by Ramiris with her intrinsic ultimate 'Small World / Labyrinth Creation', opened in Tempest during the Founding Festival (anime S3, LN vol 7-8). It is both a tourist attraction and an impregnable fortress: inside, Ramiris controls space, and adventurers wearing a Resurrection Bracelet are revived at the entrance when 'killed', making it safe training/profit (treasure, materials). Floors have themes and guardians; the deepest floors host the Ten Dungeon Marvels (LN): Zegion (guardian overseer), Apito, Kumara, Adalmann, Gadra (later), Beretta and others; Veldora is the final boss. Masayuki's 'Hero' party challenged it during the Festival. During the Eastern Empire invasion (LN 13-14), enemy elite forces were lured in and destroyed. Rimuru can 'store' the city inside it in emergencies. Ramiris lives there as 'Dungeon Master', with Beretta and Treyni as aides.", "comment": "Dungeon (Ramiris' Labyrinth)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "33", "keys": ["Dwargon", "Dwarven Kingdom", "Armed Nation of Dwargon", "dwarf kingdom", "Pegasus Knights", "Central (Dwargon)"], "keysecondary": [], "content": "The Armed Nation of Dwargon, the dwarven kingdom, lies north of the Jura Forest inside a giant natural cavern at the base of the Canaat Mountains. Founded about a thousand years ago by Hero King Guran Dwargo; ruled now by his grandson-generation king Gazel Dwargo (third king). Its technology and magic-engineering are the most advanced in the West; it is famously neutral, never having fallen, and trades with both humans and monsters (monsters may enter as long as they obey the law - it hosts elves' nightclubs too). Capital: 'Central'. Military of seven corps plus the royal guard and the elite Pegasus Knights (Gazel's personal force). Rimuru's first trip to a city was here (anime S1 ep 4-5): he met Kaijin and the brothers Garm, Dold and Mildo, got into a bar fight with Minister Vesta, and was tried before Gazel; Kaijin was exiled and joined him. Later Gazel visited Tempest to test Rimuru with a duel and signed a mutual alliance (anime S1, after the Charybdis incident), making Dwargon the first nation to recognize Tempest. Elf-run 'night clubs' are a running comedy gag (Rimuru's 'fortune telling' with elves).", "comment": "Armed Nation of Dwargon", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "34", "keys": ["Blumund", "Kingdom of Blumund", "Londo", "Blumund guild", "Blumund kingdom"], "keysecondary": [], "content": "Blumund is a small, mild-climate rural kingdom west of the Jura Forest, bordering Tempest and Falmuth. Population about 1.5 million, capital Londo. Weak militarily but excellent at diplomacy and intelligence (the Free Guild branch under guildmaster Fuze doubles as its spy network). It is the home base of Kabal, Eren and Gido. Blumund was the first human nation to sign a pact of mutual recognition and safe passage with Tempest (anime S1/S2), seeing Tempest as a shield against monsters and a trading partner; this alliance alarmed Falmuth, whose trade route monopoly was threatened. Its king and ministers (e.g. Minister Berryard) treat Rimuru with nervous respect. Rimuru registered as an adventurer at the Blumund guild with Fuze's help (S1). Blumund often hosts negotiations and spies on Falmuth during the Tempest crisis.", "comment": "Kingdom of Blumund", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "35", "keys": ["Falmuth", "Farmus", "Kingdom of Falmuth", "Farmenas", "Edmaris", "Farmus Kingdom", "Yohm's kingdom", "Migam"], "keysecondary": [], "content": "The Kingdom of Falmuth (anime: Farmus) was a wealthy, powerful western kingdom and a pillar of the Council of the West, profiting from controlling the trade route to Dwargon. Fearing Tempest's new road and seeking its riches, King Edmaris, with the backing of Archbishop Reyhiem of the Western Holy Church, invaded (anime S2 ep 28-36): they sealed Tempest with a Holy Barrier, and the otherworlders Shogo, Kyoya and Kirara massacred citizens including Shion. Rimuru annihilated the 20,000-man army with Megiddo, captured Edmaris, Razen and Reyhiem; Diablo then handled the aftermath. Plan: Edmaris abdicates and pays reparations; Yohm, the 'hero' adventurer allied with Tempest, overthrows him in a staged civil war against Duke Nidol Migam's faction, founding the Kingdom of Farmenas (Yohm Farmenas as king, Myulan as queen, Edmaris as Viscount advisor, Razen serving Diablo). Thereafter Farmenas is a close Tempest ally. Note naming: LN English 'Falmuth', anime 'Farmus', successor 'Farmenas'.", "comment": "Falmuth / Farmus / Farmenas", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "36", "keys": ["Ingrassia", "Englesia", "Englassia", "Kingdom of Ingrassia", "Freedom Academy", "Free Academy", "Class S"], "keysecondary": [], "content": "The Kingdom of Ingrassia (LN/wiki also romanized Englesia/Englassia) is the most advanced human nation west of the Jura Forest and the political, economic and transport hub of the West: it hosts the Council of the West, the Free Guild headquarters and the Western Holy Church's operational center. Its walled royal capital has tall planned buildings and a white castle; entry requires three security checks. The Freedom Academy (Jiyuu Gakuen), chaired by Grandmaster Yuuki Kagurazaka, educates nobles, adventurers and otherworlders; its Class S (Special class) housed the five summoned children - Kenya, Ryota, Gale, Alice and Chloe - taught first by Shizu and then by Rimuru, who came as 'Sensei' to fulfill Shizu's wish (anime S1 ep 21-23, 'Kids' arc). Rimuru later returns for Council sessions (LN 9-10) and to deal with the Rozzo family's plots. The kingdom's nobility are influenced by the Five Elders.", "comment": "Ingrassia / Englesia", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "37", "keys": ["Sarion", "Sorcerous Dynasty of Sarion", "Elmesia", "elven empire", "Divine Tree", "Thirteen Kingdoms", "Sarion empire"], "keysecondary": [], "content": "The Sorcerous Dynasty (Magic Kingdom) of Sarion is a western superpower founded by elves, made of thirteen semi-autonomous kingdoms under Heavenly Emperor Elmesia El-Ru Sarion; its capital is built into a colossal Divine Tree. Its history goes back two millennia to the Great Sorcerous Nation of Soma, destroyed by Milim's rampage over her murdered pet dragon; the surviving elf nobility formed the thirteen kingdoms, later united by Elmesia (founder Sarion Grimwald was her father). The Emperor claims divine descent and forbids other religions, so Sarion is outside the Council of the West, yet it is enormously rich and magically advanced (it rivals the Eastern Empire). Eren of Kabal's party is secretly a Sarion noble (Elyun Grimwald), and Gido and Kabal are her bodyguards; Sarion watched Tempest through them. Elmesia befriended Rimuru (Founding Festival, anime S3) and lent him money to foil Muese's currency plot; with Gazel and Rimuru she forms the drinking trio 'Three Wise Drunks' (LN).", "comment": "Sorcerous Dynasty of Sarion", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "38", "keys": ["Lubelius", "Holy Empire Lubelius", "Holy Empire", "Ruberios", "Holy Emperor", "Louis", "Luminism capital", "Night Garden"], "keysecondary": [], "content": "The Holy Empire of Lubelius is the theocratic headquarters of the Western Holy Church and the Luminism faith. Officially ruled by Holy Emperor Louis Valentine (secretly a vampire noble serving Luminous), it is in truth the domain of Demon Lord Luminous Valentine, worshipped as God Luminous. To unite the faithful, Louis' twin brother Roy Valentine played the 'evil Demon Lord Valentine' (killed by Laplace during Walpurgis). History: after Veldora destroyed Luminous' original vampire capital Night Garden over 2,000 years ago, she founded Lubelius during a Tenma War, using humans as a protected 'herd' that freely offers small amounts of blood/energy in exchange for safety (a symbiosis hidden from the public). Military: Hinata's Holy Knights (Crusaders), the Imperial Guard, Temple Knights in member nations; advisors: the Seven Luminaries and Cardinal Nicolaus. After Hinata and Rimuru's reconciliation (anime S3) Lubelius becomes friendly to Tempest; Luminous' grudge with Veldora remains comic. Holy city 'Ruberios' is the LN name for its capital.", "comment": "Holy Empire of Lubelius", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "39", "keys": ["Eastern Empire", "Empire", "Nasca", "Nasca Namrium Ulmeria United Eastern Empire", "Imperial army", "Rudra's Empire", "Eastern Imperial"], "keysecondary": [], "content": "The Nasca Namrium Ulmeria United Eastern Empire (Eastern Empire) is the strongest military nation in the world: born from the Kingdom of Nasca absorbing the Magic Kingdom of Namrium and the Eastern Union of Ulmeria about 2,000 years ago, ruled throughout by Emperor Rudra Nam Ul Nasca (through reincarnations in his bloodline), with the True Dragon Velgrynd as its guardian deity and Marshal. It is absolutist, with advanced magic-science (airships, magic-tanks, mechanized divisions, guns), and a vast army: the Armored / Mechanized Division, the Magic Beast Division, the Composite Division (commanded by Yuuki in the LN), plus the Imperial Guardians (100 'Single Numbers', led by Kondou and Damrada). Rudra's ancient game with Guy Crimson ('who can unite the world first') drives its conquest. The Empire once tried to subjugate Veldora and lost a fortress city and about 100,000 lives. Its invasion of the West through Jura and Dwargon (LN vol 12-14) was crushed by Tempest; in the chaos Rudra (dominated by his own skill Michael) was effectively lost, Kondou died, and Masayuki - Rudra's reincarnation - became the new emperor (LN 16+). Beyond anime S3.", "comment": "Eastern Empire (Nasca Empire)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "40", "keys": ["Eurazania", "Beast Kingdom", "Beast Kingdom of Eurazania", "beastmen", "Carrion's kingdom", "Three Beastketeers"], "keysecondary": [], "content": "Eurazania is the Beast Kingdom of Demon Lord Carrion (the Beast King), southeast/south of the Jura Forest, populated by lycanthropes (beastmen) - lion, tiger, leopard, snake, wolf and more. Its military elite are the Three Beastketeers: Albis (Golden Snake Horn), Phobio (Black Leopard Fang) and Suphia (White Tiger Claw). Carrion sent Phobio to recruit Rimuru, which went badly and led to Phobio's Charybdis incident (anime S1 ep 19-20). Before Walpurgis, Clayman engineered a war: Milim (pretending to be controlled) declared war, defeated Carrion and annihilated the capital with Drago Nova after Rimuru evacuated the citizens to Tempest (anime S2). Benimaru's army and the Beastketeers then defeated Clayman's army in the forest. After Walpurgis, Carrion and Frey became Milim's subordinates, and Eurazania joined Milim's domain; Albis later marries Benimaru (LN), Suphia stays at Tempest training with Benimaru's forces.", "comment": "Beast Kingdom of Eurazania", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "41", "keys": ["Ice Continent", "White Ice Palace", "El Dorado", "Jistav", "Clayman's domain", "Milim's Domain", "Barren Lands", "Heavenly Gate", "Fulbrosia", "Sky Castle"], "keysecondary": [], "content": "Notable Demon Lord territories: Guy Crimson - the Ice Continent in the far north, his White Ice Palace shared with Velzard. Milim Nava - her domain worshipped by the Dragon Faithful (Midray's dragonewts), later expanded to include Eurazania and Frey's lands after Walpurgis; Milim's capital/temple-city and the 'Sky Castle' in later LN. Dagruel - the Barren Lands in the westernmost central continent, where his giants guard the Heavenly Gate against angels. Leon Cromwell - El Dorado, the Golden Kingdom on the western continent across the sea, defended by his Magic Knights. Luminous - Lubelius (and the ruins of Night Garden). Ramiris - formerly the Dwelling of the Spirits (Spirit Labyrinth), later the Dungeon in Tempest. Dino - no real territory (he freeloads, later at Tempest). Clayman - the Puppet Nation of Jistav with his castle (raided by Tempest's forces during Walpurgis; Adalmann's undead were assigned to guard its cursed approach). Frey - Fulbrosia (Sky Kingdom of harpies). Carrion - Eurazania. Rimuru - the Great Jura Forest/Tempest.", "comment": "Demon Lord Domains", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "42", "keys": ["Lizardman", "Lizardmen", "Lizardman domain", "Abiru", "marsh", "swamp", "dragonewt village"], "keysecondary": [], "content": "The Lizardmen live in the wetlands and a fortified underground cave system in the Jura Forest, led by Chief Abiru (father of Gabiru and Souka). Proud warriors, they were the first major target of the Orc Lord's 200,000-strong horde. Gabiru, given a name by Gelmud and encouraged by flattery, rebelled against his father to fight the orcs openly, while Abiru sought alliance with Rimuru's forces; Souka came as envoy (anime S1 ep 11-14). With Benimaru's ogres and the Tempest wolves, the alliance broke the orc army in the Battle of the Marsh. Afterwards Abiru joined the Jura alliance under Rimuru, Gabiru was exiled and joined Tempest, and Souka's guard unit was named and became dragonewts serving as Souei's agents. Lizardmen later appear as part of the Federation's multi-race population.", "comment": "Lizardman Domain", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "43", "keys": ["Ten Great Demon Lords", "Demon Lords", "maou", "demon lord list", "Carrion", "Frey", "Clayman"], "keysecondary": [], "content": "Before Rimuru's ascension, the world recognized the Ten Great Demon Lords: Guy Crimson (Lord of Darkness, the first), Milim Nava (the Destroyer), Ramiris (Labyrinth Fairy), Dagruel (Earthquake, the giant), Luminous Valentine (publicly represented by the fake 'Valentine', Roy), Dino (Sleeping Ruler, fallen angel), Leon Cromwell (Platinum Devil), Clayman (Marionette Master), Carrion (Beast King) and Frey (Sky Queen). Only some were true awakened Demon Lords; the newer ones (Clayman, Carrion, Frey) were not. Guy, Milim and Ramiris are the oldest 'first generation'. The Demon Lords are not a government; they are a loose club of territorial powers who settle disputes and recognize newcomers at Walpurgis. The 'Demon Lord' title gives no automatic loyalty from monsters. At the Walpurgis of anime S2, Clayman was killed, Carrion and Frey resigned to serve Milim, and Rimuru was recognized - reducing the number to eight, the Octagram.", "comment": "Demon Lords (Ten Great Demon Lords)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "44", "keys": ["Walpurgis", "Walpurgis Night", "Demon Lord council", "Demon Lords' Banquet", "Walpurgis meeting"], "keysecondary": [], "content": "Walpurgis (Walpurgis Night) is the conclave of Demon Lords, convened when at least three Demon Lords call for it, to settle matters between them or judge a newcomer. Clayman, with Frey and Milim seemingly backing him, called the anime S2 Walpurgis to accuse Rimuru of claiming the Demon Lord title and to cover his own invasion of Eurazania and plans against Tempest (orchestrated by Yuuki/Kagali's faction). Rimuru attended with Shion, Ranga (in his shadow) and Veldora; Clayman set the 'controlled' Milim on them (Veldora held her off), she later 'woke up' (it was an act), and Rimuru defeated Clayman in a duel judged by Guy, devouring his soul after Clayman's desperate 'awakening' failed. Meanwhile Benimaru's army crushed Clayman's forces, a strike team led by Shuna took Clayman's castle, and Laplace killed Roy Valentine in Lubelius. Outcome: Rimuru recognized as a Demon Lord; Carrion and Frey submitted to Milim; Luminous revealed herself; Rimuru named the new eight the Octagram (anime S2 ep 45-48).", "comment": "Walpurgis (Demon Lord Banquet)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "45", "keys": ["Octagram", "Eight Star Demon Lords", "Hasseimaou", "eight demon lords", "Octagram seats"], "keysecondary": [], "content": "The Octagram (Hassei Maou, 'Eight Star Demon Lords') is the name Rimuru proposed for the eight remaining Demon Lords after Walpurgis. Seats and titles: 1 Guy Crimson, Lord of Darkness; 2 Milim Nava, the Destroyer; 3 Ramiris, Labyrinth Fairy; 4 Dagruel, Earthquake; 5 Luminous Valentine, Queen of Nightmares; 6 Dino, Sleeping Ruler; 7 Leon Cromwell, Platinum Devil; 8 Rimuru Tempest, the newest (LN title 'Chaos Creator'; anime 'New Star/Newbie' jokes). Rimuru's territory was formalized as the Great Jura Forest. The Octagram is a mutual-recognition club, not an alliance; in the later LN, angels and Michael's domination break and remake it (Dino's and Dagruel's allegiances waver, Rimuru grows into the 'Great Demon Lord' leading the Seven Monarchs alliance in late LN). In roleplay, treat interactions between Octagram members as meetings of heads of state who could each erase nations.", "comment": "Octagram (Eight Star Demon Lords)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "46", "keys": ["Western Holy Church", "Holy Church", "Luminism", "God Luminous", "Church", "church doctrine", "Archbishop Reyhiem", "Temple Knights"], "keysecondary": [], "content": "The Western Holy Church is the dominant religion of the western nations, worshipping the one God Luminous (Luminism), headquartered in the Holy Empire of Lubelius with a large operational presence in Ingrassia. Core doctrine: God protects humanity; monsters are the enemies of humankind and cannot be negotiated with - so a monster nation like Tempest is anathema. This made the Church the ideological backing for Falmuth's invasion (Archbishop Reyhiem) and Hinata's hostility. Hierarchy: the Holy Emperor Louis (secretly vampire); cardinals (Cardinal Nicolaus Speltus, Hinata's devoted ally); the Seven Luminaries as secret supreme advisors; Hinata as Head of the Holy Emperor's Guard and the Holy Knight Order (Crusaders); Temple Knights stationed in each member nation; bishops and priests across the West. Secret truth: 'God' is a real vampire Demon Lord using the faith to protect and farm humanity. After the Hinata-Rimuru reconciliation (anime S3) the Church softens its stance, recognizing Tempest as an exception.", "comment": "Western Holy Church & Luminism", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "47", "keys": ["Holy Knights", "Holy Knight", "Crusaders", "Ten Great Saints", "Arnaud", "Bacchus", "Litis", "Fritz", "Saare", "Glenda", "Renard"], "keysecondary": [], "content": "The Holy Knight Order (Crusaders) is the elite force of the Western Holy Church, commanded by Hinata Sakaguchi; each knight is a mid-A-rank warrior skilled in holy magic and arts, and together they can raise Holy Field barriers that suppress monsters. Notable members include Arnaud Baumann (captain; honorable, hot-blooded swordsman), Bacchus (power fighter), Litis (female knight), Fritz (calm, tactical) and Renard; the wider 'Ten Great Saints' are the Church's top-ranked fighters under Hinata, and one of them, Glenda Attley, secretly serves Yuuki and the Five Elders (LN). [Full roster/translation of names varies; treat minor members flexibly.] In anime S3 the Holy Knights march on Tempest under false orders; Arnaud and company fight Benimaru, Shion, Ranga, Gabiru and Hakurou while Hinata duels Rimuru; misunderstanding cleared, they become cordial rivals, later joint training partners and allies (LN). Their honor code makes them respect strength and sincerity.", "comment": "Holy Knights (Crusaders) & Ten Great Saints", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "48", "keys": ["Seven Luminaries", "Seven Days", "Seven Day Clergy", "Shichiyou", "Seven Luminaries clergy", "Heroes' trial"], "keysecondary": [], "content": "The Seven Luminaries (Seven Days Clergy, named after the days of the week) were the hidden supreme advisors of the Western Holy Church: ancient former heroes kept alive for centuries by Luminous, each stronger than ordinary Enlightened, trainers of heroes and designers of the 'Trial of the Seven Luminaries' that Hinata once passed. Jealous of Hinata's rise and colluding with the Five Elders, they intercepted and altered Rimuru's message to Hinata, framed Tempest, and plotted to have Hinata and Rimuru kill each other - then attacked Hinata themselves when she survived (anime S3). Rimuru shielded her, Luminous appeared and judged them, and they were destroyed (Luminous punishing their betrayal; the dead ones erased). Their scheme is the climax of the Hinata arc (LN vol 6-7). Afterwards Hinata reorganizes the Church's upper ranks.", "comment": "Seven Luminaries (Seven Days Clergy)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "49", "keys": ["Council of the West", "Western Nations Council", "Western Council", "Council", "Hyougikai", "Western nations"], "keysecondary": [], "content": "The Council of the West (Western Nations Council) is the assembly of human nations west of the Jura Forest, headquartered in Ingrassia. Originally a defensive pact against monster threats, it evolved into a check on the Eastern Empire and the arbiter of international disputes, closely linked to the Free Guild (whose funding partly comes from member states). Members include Ingrassia, Falmuth/Farmenas, Blumund, Siltrosso and many smaller nations; Dwargon and Sarion are independent, Lubelius affiliated via the Church. Behind the scenes it was controlled economically by the Five Elders led by Granbell Rozzo. In LN vol 9-10 Rimuru attends the Council, survives its hostile delegates' traps, and Tempest joins as a member; Testarossa later becomes Tempest's ambassador there. Hinata and Yuuki also play roles in Council politics. Representatives are nobles; debates are full of intrigue.", "comment": "Council of the West", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "50", "keys": ["Five Elders", "Rozzo", "Rozzo family", "Granbell", "Maribel", "Siltrosso", "Muese", "Gorou"], "keysecondary": [], "content": "The Five Elders were a hidden cabal secretly controlling the Council of the West through money, based in the Kingdom of Siltrosso. Four were descendants of their leader, Granbell Rozzo, an ancient former hero; the Rozzo family's prodigy is his granddaughter Maribel Rozzo, a reincarnated person with the unique skill Greed. Goal: rule the world economically, threatened by Tempest's rise. Schemes: using the Seven Luminaries, Damrada and Yuuki to set Hinata and Rimuru against each other (foiled; anime S3); merchant Muese's plot to bankrupt Tempest during the Founding Festival by demanding dwarven coin (foiled by Elmesia's loan; Muese was later silenced); sabotaging Tempest's entry into the Council; and finally an assault involving Maribel and Granbell on the Holy Empire, ending with both Rozzos dead and the cabal collapsed (LN 9-11; beyond anime S3). Granbell is a tragic figure who once loved humanity.", "comment": "Five Elders & the Rozzo Family", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "51", "keys": ["Free Guild", "Guild", "adventurer", "adventurers", "guildmaster", "Grandmaster", "guild rank", "adventurer license"], "keysecondary": [], "content": "The Free Guild (Jiyuu Kumiai) is the international adventurers' guild of the West, transformed by Grandmaster Yuuki Kagurazaka into a modern, efficient organization (with Japanese-style systems, licenses and ranks). Headquarters: Ingrassia; branches in most western nations (Blumund under Fuze). Departments: Subjugation (monster hunting), Gathering, Exploration/Search, and Escort. Ranks F to A (with pluses/minuses) and Special A; ranking also applies to monsters. Adventurers must not be bound by nations; the Guild also shelters otherworlders. Rimuru registered as an adventurer (anime S1) and later used his license in Ingrassia; Kabal, Eren and Gido are B-rank adventurers; Shizu was A-rank. Yuuki uses the Guild's network as cover for his schemes (Cerberus, the Jester troupe). Tempest's Dungeon becomes a major Guild business.", "comment": "Free Guild & Adventurers", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "52", "keys": ["Moderate Harlequin Alliance", "Moderate Jester Troupe", "Jesters", "harlequin", "Pierrot", "Laplace", "Footman", "Tear", "Teare", "Kagali", "Kazalim"], "keysecondary": [], "content": "The Moderate Harlequin Alliance (anime: Moderate Jester Troupe; Chuuyou Douke Rendan) is a group of masked, clown-themed majin for hire, founded by Kagali - formerly Demon Lord Kazalim the Curse Lord, 'killed' by Leon 200 years earlier but surviving as an astral body in a homunculus. Members: Laplace (Wonder Pierrot, vice-president, mischievous and skilled), Footman (Angry Pierrot, huge, feeds on emotions) , Teare/Tear (Teardrop, childlike girl), Clayman (Crazy Pierrot / the Marionette Master Demon Lord). Their absolute rule: never betray friends or clients - Clayman's death enraged them. Their employer is 'the Boss', Yuuki Kagurazaka. Deeds: instigating the Orc Lord plot (with Gelmud and Clayman), tricking Phobio into reviving Charybdis (anime S1), the Falmuth/Church manipulation, Laplace killing Roy Valentine, and later LN intrigue with the Eastern Empire. Their origins tie to the ancient Sorcerous Nation of Soma (Kagali revived its fallen elf heroes as majin).", "comment": "Moderate Harlequin Alliance (Jester Troupe)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "53", "keys": ["Twelve Guardian Lords", "Big Four", "Top Three", "Tempest military", "Kurenai", "Kurayami", "Hiryuu", "Goblin Riders", "Green Numbers", "Black Numbers", "Yomigaeri", "Tempest ministers"], "keysecondary": [], "content": "Tempest's leadership (later LN terms): the Top Three strongest - Benimaru, Diablo, Zegion; Rimuru's Big Four - Benimaru, Shion, Diablo, Gobta; and the Twelve Guardian Lords (Juuni Shugo Ou): Benimaru, Shion, Diablo, Ranga, Gabiru, Geld, Zegion, Adalmann, Kumara, Testarossa, Ultima, Carrera (Souei leads intelligence separately). Military units: Commander-in-Chief Benimaru with his Kurenai elite (named kijin/ oni); First Corps 'Green Numbers' (Gobta, goblin forces and Goblin Riders mounted on star wolves); Second Corps 'Yellow Numbers' (Geld's high orc defensive legion); Third Corps 'Blue Numbers' with Gabiru's Hiryuu (flying dragonewts); Fourth Corps (Benimaru); Diablo's 'Black Numbers' (Daemon army with the three Primordials as generals, LN 11+); Shion's Yomigaeri (her 'Resurrected', fanatically loyal soldiers who died and were revived, plus her fan club); Souei's Kurayami (spies, incl. Souka's dragonewts); Rigur's security force (Keibitai). Chief Instructor Hakurou trains everyone. Civil: Prime Minister Rigurd, Shuna and Rigurd (economy), Vesta (science), Kaijin (production), Mjöllmile/Myourmiles (merchant advisor, LN). In anime S1-3 only early versions appear (Goblin Riders, Kurenai precursor, the 'Big Four' is LN terminology).", "comment": "Tempest Government & Military", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "54", "keys": ["Five Fingers", "Clayman's Five Fingers", "Index Finger", "Ring Finger", "Nine Head", "Clayman's army", "Jistav"], "keysecondary": [], "content": "Clayman's Five Fingers were his elite lieutenants, many bound by curses: the Index Finger Adalmann (an undead Wight King cleric imprisoned to guard a cursed land; joins Rimuru after Shuna's strike team defeats him in anime S2), the Ring Finger Myulan (Mjurran, a witch whose heart Clayman held hostage; helped set up the magic-cancellation barrier on Tempest, then defected and married Yohm), Nine Head (the young nine-tailed fox beast, later named Kumara by Rimuru), and the Middle Finger Yamza (a commander of Clayman's army). [Exact roster and fates of the remaining fingers vary in translation.] During Walpurgis, Benimaru's forces destroyed Clayman's army on the plains near Eurazania, and Clayman's castle was occupied, freeing his puppets and slaves.", "comment": "Clayman's Five Fingers", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "55", "keys": ["Imperial Guardians", "Single Numbers", "Double 0 Numbers", "Cerberus", "Composite Division", "Imperial Intelligence Bureau", "Calgurio", "Minitz"], "keysecondary": [], "content": "The Eastern Empire's elite: the Imperial Guardians, Emperor Rudra's personal guard of about 100 'Single Numbers' (ranked by number; the top 'Double 0 Numbers' include First Lieutenant Tatsuya Kondou and Damrada). Each is a near-Saint or majin powerhouse, many granted the Ultimate Enchantment 'Alternative' via Rudra's Michael. The Imperial Intelligence Bureau (Kondou) runs spies. Military divisions: Mechanized (Armored) Division, Magic Beast Division, and the Composite Division - commanded by Yuuki Kagurazaka after he 'defected' east, with Kagali and the jesters (LN 12). Cerberus is the most powerful underground organization of the East (smuggling, trade, assassination), governed by three officials including Damrada and Misha, with Yuuki as its true grandmaster. Marshal Calgurio led the invasion of Tempest (LN 13). All of this is beyond anime S3; Damrada appears earlier as a Cerberus merchant contact.", "comment": "Imperial Guardians, Cerberus & Composite Division", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "56", "keys": ["slime", "slimes", "Demon Slime", "Ultimate Slime", "slime body", "slime form"], "keysecondary": [], "content": "Slimes are normally the weakest monsters: mindless gel blobs with Absorb and Dissolve. Rimuru is a unique exception - a reincarnated human soul with Great Sage and Predator. His slime form is a translucent light-blue droplet/sphere about 40 cm across (later about 80 cm), squishy, cute and bouncy; he can see/hear via Magic Sense, stretch, and fire high-pressure Water Blades. As a true Demon Lord he became a Demon Slime (S2), and in the LN an Ultimate Slime / True Dragon-class being. Rimuru often stays in slime form for comfort, riding on Shion's or Shuna's arms or Ranga's back (people fight over who holds him); he takes human form for formal business. Other characters may underestimate 'a mere slime' - a recurring joke and plot hook.", "comment": "Race: Slimes", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "57", "keys": ["goblin", "goblins", "hobgoblin", "hobgoblins", "goblin village", "Gobta's race", "Goblin Riders"], "keysecondary": [], "content": "Goblins are small, weak, green-skinned monsters living in poor villages in the Jura Forest. Rimuru's first allies were a goblin village under Elder (later Rigurd) threatened by direwolves; after he defeated the wolves and named the goblins, they evolved into Hobgoblins: taller, stronger, smarter, and human-like (males muscular, females beautiful) (anime S1 ep 2-3). Hobgoblins form the bulk of Tempest's citizens: builders, farmers, cooks, tailors (under Shuna), guards (Rigur), and soldiers (Goblin Riders paired with tempest wolves; later the Green Numbers). Named hobgoblins are often 'Go-' or 'Ri-' names (Gobta, Gobzo, Gobichi, Rigur, Rigurd, Haruna). After the Harvest Festival some evolve further into goblin riders/hob-type 'Goblin warriors'. They worship Rimuru and are cheerful and simple.", "comment": "Race: Goblins & Hobgoblins", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "58", "keys": ["direwolf", "direwolves", "tempest wolf", "tempest wolves", "star wolf", "Tempest Star Wolf", "wolves", "Ranga's pack"], "keysecondary": [], "content": "Direwolves are pack monsters of the Jura plains/forest. Their pack attacked the goblin village; Rimuru killed the alpha with Water Blade and the pack submitted (anime S1 ep 2). He named the alpha's son Ranga, and the whole pack evolved into Tempest Wolves (with a horn, black/blue fur, Shadow Motion and Black Lightning potential); after the Harvest Festival they became Tempest Star Wolves (Star wolf clan). They bond as mounts with hobgoblin riders (Goblin Riders - Gobta's unit), share Thought Communication, and can travel via shadows. Ranga often 'powers up' by absorbing Rimuru's energy in his shadow. Pack culture: absolute loyalty to the alpha and to Rimuru.", "comment": "Race: Direwolves & Star Wolves", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "59", "keys": ["ogre", "ogres", "Kijin", "Oni", "Divine oni", "oni", "kijin race", "ogre village", "Red Oni"], "keysecondary": [], "content": "Ogres are powerful horned warrior people of the Jura Forest, culturally like feudal Japanese samurai (katanas, kimono, shrine maidens). Their village was destroyed by the Orc Lord's army; the six survivors (young master, princess, swordmaster, secretary-warrior, spy and blacksmith) attacked Rimuru by mistake, then swore loyalty and were named Benimaru, Shuna, Hakurou, Shion, Souei and Kurobe, evolving into Kijin (majin), a rare higher form with refined human appearance, smaller horns and A-rank power (anime S1 ep 9-10). After Rimuru's Harvest Festival they became Oni (Majin), and in the LN further Divine Oni subtypes (Flame Spirit oni, Battle Soul oni, Darkness Soul oni). Horns: Benimaru two black, Shuna two white, Shion a single black horn, Souei a single horn, Hakurou two ivory horns. Kijin are long-lived and age slowly. They form Tempest's warrior aristocracy (Kurenai).", "comment": "Race: Ogres, Kijin & Oni", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "60", "keys": ["orc", "orcs", "high orc", "high orcs", "Orc Lord", "Orc Disaster", "orc army", "boar"], "keysecondary": [], "content": "Orcs are pig/boar-like monsters living in the east of the Jura region. Famine drove them to follow an Orc Lord whose unique skill Starved made his army eat everything - even their dead - and share the strength gained; 200,000 orcs marched on the Jura Forest, destroying the ogre village and attacking the Lizardmen (anime S1 ep 9-15). The Orc Lord ate Gelmud and evolved into the Orc Disaster; Rimuru devoured him, taking on the sin of his people. Rimuru pardoned the survivors; Geld (the Orc Lord's son/aide) was named after his father and the orcs became High Orcs: strong, disciplined, humble laborers who built Tempest's roads and cities and form the Yellow Numbers defensive corps. In LN, Geld and his kin evolve further (Divine boar). Orcs value food and atonement.", "comment": "Race: Orcs & High Orcs", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "61", "keys": ["dragonewt", "dragonewts", "lizardman", "dragon newt", "Hiryuu", "Dragon Faithful", "True dragonewt"], "keysecondary": [], "content": "Lizardmen are reptilian warriors of the Jura wetlands. When Rimuru named Gabiru's followers and Souka's guard after the Orc war, they evolved into Dragonewts: humanoid dragon-people with wings, scales and the ability to fly and shoot 'Dragon Breath'-type attacks. Gabiru's flying unit is the Hiryuu (Flying Dragons), Tempest's air force; Souka's dragonewts serve in Souei's intelligence squad. There is also an older dragonewt population, the Dragon Faithful, who worship Milim Nava as their god in her domain (priest Midray, his attendant Hermes) - they are strong martial artists. In LN, Gabiru becomes a True dragonewt (Water Soul dragon).", "comment": "Race: Lizardmen & Dragonewts", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "62", "keys": ["dwarf", "dwarves", "dwarven", "dwarf smith", "Dwargon people"], "keysecondary": [], "content": "Dwarves are a stout, long-lived people famed for smithing, engineering and drinking, centered in Dwargon. Dwarven craftsmen were Tempest's first teachers in technology: Kaijin (smith), Garm (armor), Dold (fine crafts/jewelry), Mildo (architecture/design) and later Vesta (science/potions). They are blunt, proud of their work, love the elf bars, and form close friendships with Rimuru. Dwarven royalty are dark-skinned and powerful (Gazel). Dwarves can become Saints through training (Gazel is an incomplete saint).", "comment": "Race: Dwarves", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "63", "keys": ["elf", "elves", "high elf", "dark elf", "elven", "half-elf", "elf club"], "keysecondary": [], "content": "Elves are long-lived, beautiful people skilled in spirit magic. The Sorcerous Dynasty of Sarion is their great nation under the High Elf emperor Elmesia; descendants of the ancient Sorcerous Nation of Soma also became the cursed majin of the Moderate Harlequin Alliance (Kagali, Laplace, Clayman were elves originally). Eren (Elyun Grimwald) is an elf noble posing as an adventurer. Dark elves exist in the Dungeon era and in Leon's lands. Comedy: the elf-run cabaret/bar in Dwargon (and later Tempest), adored by Rimuru and Kaijin and frowned upon by Shuna and Shion.", "comment": "Race: Elves & Dark Elves", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "64", "keys": ["human", "humans", "demonoid", "majin", "Majin", "monsterfolk", "magic-born", "beastmen", "lycanthrope"], "keysecondary": [], "content": "Humans dominate the western nations and the Eastern Empire; individually weak, they compensate with numbers, organization, magic and summoned otherworlders, and can transcend as Saints and Heroes. Majin ('magic-born', mazoku/majin) are intelligent humanoid monsters - kijin, dragonewts, Clayman, Gelmud - often of monster origin but sometimes humans transformed. Demonoids are humans who fused with monsters/spirits or became majin while retaining humanity (Shizu as an Ifrit hybrid; Myulan; Razen after possession; Leon later). Lycanthropes (beastmen) of Eurazania transform between human and beast forms (Carrion lion, Phobio black leopard, Albis golden snake, Suphia white tiger). Monsters and humans can intermarry and coexist - the central theme of Rimuru's Tempest.", "comment": "Race: Humans, Demonoids & Majin", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "65", "keys": ["daemon", "daemons", "demon", "lesser daemon", "greater daemon", "arch daemon", "archdaemon", "daemon lord", "devil lord", "summon daemon"], "keysecondary": [], "content": "Daemons (akuma) are spiritual life-forms from the Underworld, organized in color lineages under the Primordials. Ranks: Lesser Daemon, Greater Daemon, Arch Daemon, Daemon Lord/Duke (named), Devil Lord (awakened, LN), and the Primordials. They are summoned with sacrifices or souls and need a body (corpses, golems, a crafted vessel) to act fully; they keep contracts strictly, savor battle and human emotions, and value amusement. Naming by a powerful master greatly boosts them (Diablo). Daemons in TenSura are not simply 'evil' - they are bored ancient predators with honor of a sort. Tempest's Black Numbers army is composed of daemons led by the three Primordial girls. Beretta is a greater daemon in a golem body.", "comment": "Race: Daemons", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "66", "keys": ["vampire", "vampires", "high blood", "Luminous' vampires", "Night Garden", "blood"], "keysecondary": [], "content": "Vampires are long-lived, powerful undead-adjacent majin ruled by Luminous Valentine, their Divine Ancestor and queen. Vampire nobility (the Seven Great Nobles, Three Archdukes - Louis and Roy Valentine, Gunther) maintain Lubelius from the shadows. They are weak to sunlight only at lower levels (higher vampires resist it), drain energy/blood and regenerate. Luminous' symbiosis with humanity - protection in exchange for small offerings - is the hidden truth of the Church. Vampires look down on lesser monsters but respect strength; their aesthetics are gothic and aristocratic.", "comment": "Race: Vampires", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "67", "keys": ["giant", "giants", "fairy", "pixie", "dryad", "harpy", "harpies", "insectar", "undead", "wight", "skeleton", "treant", "fox", "Ninetail"], "keysecondary": [], "content": "Giants - led by Dagruel, the True Giant Demon Lord, in the western barren lands; huge, martial and jovial. Fairies/Pixies - Ramiris is the Fairy Queen; tiny, playful, magical. Dryads - tree-spirits guarding forests (Treyni, Trya, Doreth) and treants. Harpies - winged women of Frey's Sky Kingdom. Insectars - intelligent insect beings; Rimuru rescued an injured beetle (Zegion) and wasp (Apito) and placed them with the treants (LN; anime S2 cameo), and they grew into dungeon guardians. Undead - Adalmann the Wight King and his Death Dragon and knight Albert; created by necromancy or curses. Fox beasts - Kumara (Ninetail / Nine Head). Orc, goblin, wolf etc. have their own entries. Charybdis-type 'Calamity' monsters are unique aberrations, not races.", "comment": "Other Races: Giants, Fairies, Dryads, Harpies, Insectars, Undead", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "68", "keys": ["history", "ancient history", "timeline", "Soma", "Chaos Dragon", "two thousand years ago", "300 years ago", "legend"], "keysecondary": [], "content": "Pre-story chronology (approximate, LN): Veldanava creates the world, the angels, and the Primordials. Guy Crimson is summoned by an ancient kingdom and destroys it, becoming the first Demon Lord; Velzard joins him. Veldanava marries Lucia; Milim is born. Over 2,000 years ago Veldanava and Lucia die; later soldiers of a kingdom kill Milim's pet dragon, and her grief-fueled rampage destroys the Sorcerous Nation of Soma (the pet becomes the Chaos Dragon; Guy fights Milim for days to stop her). Rudra of Nasca (Lucia's brother) and Guy begin their game for the world; the Eastern Empire grows. Veldora razes Luminous' vampire capital Night Garden; Luminous founds Lubelius. Elves found Sarion; about 1,000 years ago Guran Dwargo founds Dwargon. Every ~500 years, Tenma Wars. About 300 years ago, the masked Chosen Hero (Chloe) seals Veldora with Infinite Prison; Leon (summoned from Earth as a boy) becomes a Hero, then a Demon Lord; about 200 years ago Leon kills Demon Lord Kazalim. Decades before the story, Leon summons Shizu (from the 1945 Tokyo firebombing) and binds Ifrit to her; Shizu adventures with the Hero, later teaches Yuuki and Hinata (who crossed over from Japan as teens).", "comment": "Timeline: Ancient History", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "69", "keys": ["arc 1", "beginning", "reincarnation", "Satoru Mikami death", "goblin village arc", "season 1 start", "episode 1"], "keysecondary": [], "content": "Anime S1 ep 1-3 / LN vol 1: Satoru Mikami, a 37-year-old Tokyo general contractor employee, is stabbed by a street killer while protecting his junior Tamura. His dying thoughts become skills; he wakes as a slime in the Sealed Cave with Great Sage and Predator. He befriends the sealed Storm Dragon Veldora; they exchange names (Rimuru / surname Tempest) and Rimuru swallows Veldora to break the seal. Leaving the cave, he meets a starving goblin village besieged by direwolves; Rimuru builds defenses, kills the direwolf alpha, and the pack submits. He names the goblins (Rigurd, Rigur, Gobta...) and the wolf Ranga, evolving them into hobgoblins and tempest wolves, collapsing into low-magic sleep afterwards. He sets three rules and begins building a town.", "comment": "Arc: Reincarnation & the Goblin Village", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "70", "keys": ["Dwargon arc", "Shizu arc", "Kaijin recruitment", "Ifrit fight", "Shizu's death", "Conqueror of Flames arc"], "keysecondary": [], "content": "Anime S1 ep 4-8 / LN vol 1: Seeking craftsmen, Rimuru travels to Dwargon with Gobta and Rigur, impresses Kaijin and the three brothers with potions, clashes with Minister Vesta and is tried be
