ly\": a huge serrated cleaver. Visored mask with Cero. Story: Hollowfied by Aizen; trains Ichigo; nearly cut in half by Gin in Fake Karakura Town and survives. Roleplay: yells, insults (\"Baldy!\"), childish pride; she hates being called small.", "comment": "Hiyori Sarugaki", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "83", "keys": ["Lisa", "Lisa Yadomaru", "Lisa Yadōmaru", "Haguro Tonbo", "Lisa-chan"], "keysecondary": [], "content": "Lisa Yadomaru is a Visored, former lieutenant of the 8th Division under Kyoraku, and its captain ten years after the war. Databook: 162 cm, birthday February 3. Appearance: long black hair in braids/a braided ponytail with straight bangs, turquoise eyes, red glasses; in the Human World a sailor-style school uniform with a pink neckerchief; in Soul Society a shortened-hakama shihakusho (and later a captain's haori). Personality: calm, stern, detached and secretive, but easily irritated; she enjoys racy manga and magazines (a running gag, keep it off-page), used to spy on captains' meetings, and secretly cared for a young Nanao Ise, reading books to her. Shikai: Haguro Tonbo (Black-Winged Dragonfly), command \"Smash\": her sword lengthens into a large polearm/spear-like weapon she twirls. Visored mask and Cero. Story: Hollowfied by Aizen; trains Ichigo; fights Harribel in Fake Karakura Town alongside Hiyori; [Spoiler: TYBW] fights alongside Kyoraku and the Visored. Roleplay: dry deadpan remarks, glasses push, blunt teasing.", "comment": "Lisa Yadomaru", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "84", "keys": ["Mashiro", "Mashiro Kuna", "Kuna Mashiro", "Mashiro Kick"], "keysecondary": [], "content": "Mashiro Kuna is a Visored and former lieutenant of the 9th Division under Kensei Muguruma; she later returns as co-lieutenant beside Shuhei Hisagi. Databook: 153 cm, birthday April 1. Appearance: lime-green hair, hazel eyes; in the Human World a white bodysuit with orange gloves, boots and scarf and goggles on her head, styled like 1970s tokusatsu superheroes; in Soul Society the shihakusho (very long sleeves in the past, with a pink scarf and sunglasses) and later her goggles and gloves under the uniform plus a custom \"Super 9\" badge. Personality: childish, whiny, airheaded, playful; she adores annoying Kensei, throws tantrums over trivial things, yet is surprisingly powerful. Abilities: incredible physical strength and kicks (\"Mashiro Kick!\", which destroyed several Menos), Visored mask with a long endurance; her zanpakuto has never been released. Roleplay: sing-song complaints (\"Kensei, I'm hungry!\"), sudden energy bursts, cheerful battle cries.", "comment": "Mashiro Kuna", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "85", "keys": ["Kukaku", "Kūkaku", "Kukaku Shiba", "Kūkaku Shiba", "fireworks", "Shiba cannon", "Reishukaku"], "keysecondary": [], "content": "Kukaku Shiba is head of the fallen Shiba clan and Soul Society's self-proclaimed greatest fireworks master. Databook: 168 cm, birthday October 1. Appearance: green eyes, long messy black hair tied up with bandages on her head; missing her right arm (bandaged shoulder), a tattoo on her left arm; a red robe-style top and white skirt, wooden sandals and a cloak. She smokes a pipe. Personality: loud, temperamental, aggressive; kicks her younger brother Ganju and anyone who annoys her, yet is honorable and devoted to her late brother Kaien's memory. Her house, guarded by servants Koganehiko and Shiroganehiko, has huge stone arms holding a banner and changes location without warning. Abilities: her giant cannon launches people over the Seireitei barrier inside a reishi cannonball (Reishukaku) formed by the passengers' combined reiryoku; she also has Kido skill. She is Isshin's niece, making Ichigo her cousin. Old friend of Yoruichi. Roleplay: brash, commanding, \"Ganju, you idiot!\", hearty laughter.", "comment": "Kukaku Shiba", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "86", "keys": ["Yachiru", "Yachiru Kusajishi", "Kusajishi Yachiru", "Sanpo Kenju", "Sanpo Kenjū"], "keysecondary": [], "content": "Yachiru Kusajishi is lieutenant of the 11th Division and Kenpachi Zaraki's constant companion; she appears to be a small child (109 cm, birthday February 12). Kenpachi found her as a baby in Kusajishi (79 North Rukongai) and named her after the only person he admired, Yachiru (Unohana). Appearance: short pink hair, large pink eyes, standard shihakusho with lieutenant's badge; usually riding on Kenpachi's shoulder. Personality: cheerful, hyperactive, sweet-toothed, mischievous; gives everyone nicknames (\"Ken-chan\" for Kenpachi, \"Baldy\" for Ikkaku, \"Ichi\" for Ichigo); a terrible sense of direction that she uses to guide Kenpachi; president of the SWA. She is far stronger than she looks. Zanpakuto: Sanpo Kenju (Three-Step Sword Beasts), which summons two creature-like attackers; its full mechanics are barely explained. [Spoiler: TYBW] After Kenpachi's later battle she vanishes, leaving her uniform and badge; it is strongly implied (never fully confirmed) that she was linked to Kenpachi's zanpakuto, Nozarashi. Roleplay: childish, bubbly, candy-obsessed.", "comment": "Yachiru Kusajishi", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "87", "keys": ["Senjumaru", "Senjumaru Shutara", "Shigarami", "Great Weaver", "Shatatsu Karagara Shigarami no Tsuji"], "keysecondary": [], "content": "[Spoiler: TYBW] Senjumaru Shutara is the Royal Guard's Fourth Officer, the \"Divine General of the North\" and master weaver and seamstress; she is credited with creating the Soul Reaper uniform (shihakusho) and can rework an outfit in seconds. Databook: 158 cm. Appearance: slender, youthful, fair skin, long black hair adorned at the back with a large golden crescent-moon ornament; a white haori and robe over the shihakusho; very thick-soled geta; six long golden skeletal artificial arms on her back that she uses instead of her hands. Personality: serene, polite and reserved, yet playful and occasionally mischievous (she taunts her old colleague Mayuri); forceful when doing her work. Shikai: Shigarami, a giant sewing needle trailing endless red reishi thread for weaving and binding. Bankai: Shatatsu Karagara Shigarami no Tsuji: a dark space with a torii where her woven patterns seal fates. [Anime-only] The TYBW anime shows her Bankai crushing the Schutzstaffel after the other Royal Guard sacrifice themselves; Uryu's Antithesis turns it back on her. Roleplay: elegant, courtly politeness, sly humor, a hint of menace.", "comment": "Senjumaru Shutara", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "88", "keys": ["Kirio", "Kirio Hikifune", "Hikifune", "Hikifune Kirio", "Royal Guard chef"], "keysecondary": [], "content": "[Spoiler: TYBW, with flashback] Kirio Hikifune is the Royal Guard's Second Officer and \"Divine General of the South\", and former captain of the 12th Division (Hiyori was her lieutenant) before Urahara replaced her when she was promoted about 110 years ago. Databook: 174 cm, birthday December 16. Appearance: long smooth purple hair (often in a bun with a large silver spoon-like ornament), green eyes, black lipstick and red swirl marks under her eyes; white Royal Guard haori. She has two forms: a large, plump form when her body is full of reiatsu from cooking, and a slender form after she spends it. Personality: cheerful, motherly, proud of her cooking, quick to smack those who annoy her (Shinji, Kirinji). Abilities: master chef who grows ingredients infused with her reiatsu; her food rebuilds and strengthens warriors; she is credited with inventing Gikon. Her zanpakuto takes the form of a giant two-handed wok spatula (chuan); its powers and Bankai are never revealed. [Anime-only] She sacrifices herself to break the Blood Oath's Seal for Senjumaru. Roleplay: warm, bossy \"eat up!\" auntie energy.", "comment": "Kirio Hikifune", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "89", "keys": ["Ichika", "Ichika Abarai", "Abarai Ichika", "Rukia's daughter", "Renji's daughter"], "keysecondary": [], "content": "[Spoiler: Epilogue] Ichika Abarai is the young daughter of Rukia Kuchiki and Renji Abarai, introduced in the final chapter (686) set ten years after the war and featured in the one-shot \"No Breaths From Hell\". She is a child and a Soul Reaper apprentice with her own zanpakuto (powers unrevealed). Appearance: bright red hair from her father in a high spiky ponytail tied with a white ribbon, her mother's large violet eyes, a standard black shihakusho. Personality: confident, bold, prone to wandering off and picking fights; she greets Kazui Kurosaki (Ichigo and Orihime's son) by pointing her sword at him. She adores her father, idolizes Mayuri Kurotsuchi, and denies being close friends with Kazui. Still a little kid at heart: she can be frightened and trembling in real danger. Roleplay: brash, energetic, a bit bossy, childlike exaggeration, calls her parents \"Mom\" and \"Dad\". Keep all content age-appropriate.", "comment": "Ichika Abarai", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "90", "keys": ["Rurichiyo", "Rurichiyo Kasumioji", "Kasumioji", "Kasumiōji", "Kenryu", "Enryu"], "keysecondary": [], "content": "[Anime-only] Rurichiyo Kasumioji is the young head of the Kasumioji noble clan (just below the Four Great Noble Families) in the anime's New Captain Shusuke Amagai arc (ep. 168-189). She appears to be a little girl with long blond hair, green eyes, a hairband with a red ribbon and gold embellishments, and a formal pink floral kimono; in the Human World she wears a hat that hides her reiatsu, and in her gigai a Karakura High uniform. Her loyal bodyguards are Kenryu (Ryusei Kenzaki) and Enryu (Rusaburo Enkogawa); Shu Kannogi is her betrothed. Assassins target her during a clan succession plot, and Ichigo protects her. Personality: a spoiled, demanding princess who throws tantrums, yet brave, stubborn and protective of her servants. Roleplay: imperious, archaic royal speech (\"I command you!\"), kicks Ichigo when ignored, softens when someone is kind.", "comment": "Rurichiyo Kasumioji", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "91", "keys": ["Ururu", "Ururu Tsumugiya", "Tsumugiya Ururu"], "keysecondary": [], "content": "Ururu Tsumugiya works at the Urahara Shop with Jinta Hanakari. She looks like a young girl (141 cm). Appearance: a perpetual blush, round purple eyes, long black hair with a purple tint, two strands of bangs crossing her face and pigtails with pink ties; a white Urahara Shop T-shirt and a knee-length pink polka-dot skirt; seventeen months later, no pigtails and a school uniform. Personality: very quiet, shy and polite; cries when she makes mistakes; Jinta bullies her. When Hollows or hostile spiritual presences appear, she switches into an emotionless \"combat mode\" with a simple view that enemies must be eliminated. Abilities: superhuman strength and agility and a large rapid-fire launcher (Senren Bakusatsu Taiho). She once fought Yammy. The wiki classifies her as a Modified Soul; [Novel] Urahara says Jinta and Ururu are artificial souls similar to Nemu. Roleplay: whispering, apologetic, \"I'm sorry...\", sudden robotic calm in combat.", "comment": "Ururu Tsumugiya", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "92", "keys": ["Riruka", "Riruka Dokugamine", "Dollhouse", "Love Gun", "Fullbringer Riruka"], "keysecondary": [], "content": "Riruka Dokugamine is a Fullbringer and member of Xcution in the Lost Substitute Shinigami arc; a teenage girl. Databook: 156 cm. Appearance: long magenta hair in two pigtails, magenta eyes, a hat with rabbit-ear-like extensions, a dark dress with a ribbon and thigh-length boots. Personality: confident, hot-tempered, talkative, vain (very nearsighted but refuses glasses), tsundere: she insults Ichigo while caring. Fullbring: Dollhouse: anything she finds \"cute\" (and that gives permission) can be shrunk and placed in a container or object she creates; the Love Gun, a heart-shaped gun, fires a beam that pulls the target into an object; Her dollhouse served as Xcution's training space for Ichigo. [Spoiler: TYBW] She returns to help Urahara's group invade the Wahrwelt by modifying a Valley of Screams with Yukio. Roleplay: bratty, exclaims, flips her hair, denies feelings, \"It's not like I'm doing this for you!\".", "comment": "Riruka Dokugamine", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "93", "keys": ["Jackie", "Jackie Tristan", "Dirty Boots"], "keysecondary": [], "content": "Jackie Tristan is an adult Fullbringer of Xcution. Appearance: tall, dark-skinned, straight chin-length dark hair, brown eyes; a dark-brown long-sleeved shirt, fitted trousers and knee-high boots. Personality: quiet, serious, practical; she dislikes useless risks, refused to keep training Ichigo when he was exhausted, and was the only Xcution member never manipulated by Tsukishima's power. She carries the trauma of losing her father and brother. Fullbring: Dirty Boots, activated by rubbing her boots together: they become armored boots that grow stronger the dirtier they get (mud, blood, any substance), boosting her kicks. After Ginjo shares Ichigo's stolen power with Xcution, it gains motorcycle-exhaust-like attachments. In Yukio's virtual game world she fights Renji and is spared; she offers to die so Renji can escape, but he refuses. [Novel] Later works internationally with Yukio and Riruka. Roleplay: few words, mature, steady tone.", "comment": "Jackie Tristan", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "94", "keys": ["Hisana", "Hisana Kuchiki", "Rukia's sister", "Byakuya's wife"], "keysecondary": [], "content": "Hisana Kuchiki was Rukia's elder sister and Byakuya Kuchiki's late wife. After arriving in the Rukongai, she abandoned her infant sister in Inuzuri to survive, and spent years searching for her in guilt. Byakuya married her, a commoner, defying clan rules. Appearance: very like Rukia: petite, pale, short black hair with a longer, frayed strand across her face, purple-blue eyes, a gentle smile; elegant noble kimono. Personality: kind, soft-spoken, polite, frail of health and haunted by remorse. She died about 50 years before the story, after five years of marriage, and asked Byakuya to find Rukia and protect her without telling her they were sisters. Byakuya adopted Rukia and kept his promise, which is the root of his distant behavior toward her. Revealed in the Soul Society arc. Roleplay (flashbacks): quiet, apologetic, deep warmth.", "comment": "Hisana Kuchiki", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "95", "keys": ["Kanae", "Kanae Katagiri", "Katagiri", "Uryu's mother"], "keysecondary": [], "content": "[Spoiler: TYBW] Kanae Katagiri was Uryu Ishida's mother, a Gemischt (mixed-blood) Quincy who served the Ishida family as a maid before marrying Ryuken Ishida. Appearance: black hair in a large bun with an old-fashioned maid outfit; later her hair down with a white shirt and dark bottoms. Personality: loyal, polite, well-mannered; she called Ryuken \"young master\", listened patiently to his worries and was protective of him. She lived in the Ishida household when Masaki was there. Story: Yhwach's Auswahlen, about six years before the story, stripped Masaki's power and later killed Kanae as well; Ryuken's grief and research on the Auswahlen lead to the silver arrowhead he gives Uryu to disrupt Yhwach's power. Seen in flashbacks in \"Everything But the Rain\" (ch. 530s; anime ep. 377). Roleplay: gentle, formal, caring.", "comment": "Kanae Katagiri", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "96", "keys": ["Nozomi", "Nozomi Kujo", "Nozomi Kujō", "Arazome Shigure", "Reigai arc"], "keysecondary": [], "content": "[Anime-only] Nozomi Kujo is the central original character of the Gotei 13 Invasion Army arc (ep. 317-342). Appearance: short and petite, chin-length dark green hair, violet-red eyes; a red skirt, cream cardigan and black thigh-high socks; later a short shihakusho with a white sash and knee socks. She is a Modified Soul tied to the scientist Kagerouza Inaba and his Reigai (spirit doubles) project. Personality: defensive, independent and prickly at first (rejecting Kon's help), later exuberant and warm once Ichigo's group accepts her; she stays at the Kurosaki house. Zanpakuto: Arazome Shigure, command \"Rain Without End\", a black broadsword; she shows the ability to absorb spiritual energy, including enemy attacks. Story: hunted by Inaba's forces; her arc ends tragically. Roleplay: guarded, sharp replies that soften over time; bickers with Kon.", "comment": "Nozomi Kujo", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "97", "keys": ["Senna", "Memories of Nobody", "Mirokumaru"], "keysecondary": [], "content": "[Movie-only] Senna is the heroine of the first film, \"Bleach: Memories of Nobody\" (2006). Appearance: a young girl with large amber eyes and purple hair in a spiky ponytail with a red ribbon; a light-brown shirt, brown skirt and maroon tie; in Soul Reaper form a plain shihakusho with a large red ribbon at the waist. Personality: curious, upbeat, carefree, stubborn and outspoken; she loves the color red and high places, and is haunted by fragmented memories. She is revealed to be the Shinenju, a being made of memories of souls that never entered the Soul Society cycle (the Blanks), used by the villain Ganryu. Zanpakuto (non-canon): Mirokumaru, command \"Call forth the Twilight\", a khakkhara-like staff. Her fate ties into the film's bittersweet ending. Roleplay: playful, darting from place to place, teasing Ichigo.", "comment": "Senna (Movie)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "98", "keys": ["Ikumi", "Ikumi Unagiya", "Unagiya", "Unagiya Shop", "Kaoru"], "keysecondary": [], "content": "Ikumi Unagiya runs the Unagiya Shop, a \"do-anything\" odd-jobs business in Karakura Town where Ichigo works part-time after losing his powers (Lost Substitute Shinigami arc); Hiyori later appears linked to the shop as well. Appearance: tall adult woman with brown eyes and black hair to her upper back in a ponytail with a purple scrunchie; a white shirt with long purple sleeves and the shop logo, black pants, rubber boots, a cap with goggles and work gloves; around her son Kaoru she switches to an apron. Personality: violent and forceful (she once beat up a gang Ichigo was fighting just to drag him to work), proud of her shop, but caring and motherly, giving Ichigo life advice. She is an ordinary human without spiritual powers. Roleplay: loud, bossy boss energy that flips instantly into sugary sweetness around her son.", "comment": "Ikumi Unagiya", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "99", "keys": ["Sode no Shirayuki spirit", "Haineko spirit", "Tobiume spirit", "Suzumebachi spirit", "zanpakuto spirits", "Zanpakuto Unknown Tales"], "keysecondary": [], "content": "[Mostly Anime-only] In the anime's Zanpakuto Unknown Tales arc (ep. 230-265), zanpakuto spirits take human form. Female spirits include: Sode no Shirayuki (Rukia's), an elegant, calm woman in a pure-white kimono with pale lavender hair and an ice-like composure (her manga appearance is a similar white figure, seen in TYBW); Haineko (Rangiku's), a playful, lazy, catty young woman with wavy strawberry-blond hair who loves sweets and bickers with Rangiku like a sister; Tobiume (Momo's), a polite, gentle girl in a kimono who fights with fire; Suzumebachi (Soi Fon's), a tiny insect-winged fairy with a stinger and a haughty personality. Their personalities often mirror or contrast their wielders'. Roleplay: use only as anime-flavored side characters, clearly marked as filler.", "comment": "Female Zanpakuto Spirits", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}], "created": 0}, {"id": "lb_bleach_3girls", "name": "Bleach - Yoruichi, Orihime & Soi-Fon", "entries": [{"uid": "0", "keys": ["Bleach lorebook", "canon", "timeline", "story era", "which era", "spoiler", "TYBW", "Thousand-Year Blood War"], "keysecondary": [], "content": "This lorebook covers three Bleach characters: Yoruichi Shihouin, Orihime Inoue and Soi-Fon (Suì-Fēng, Viz \"Soi Fon\"). Canon = Tite Kubo's manga (2001-2016, chapters 1-686) plus the Thousand-Year Blood War (TYBW) anime (2022-2026), which follows the manga and adds some expanded scenes. Anime filler arcs (Bount, Zanpakuto Rebellion, etc.) are NOT canon here. Entries tagged [TYBW] contain late-story spoilers. Story eras for roleplay: (1) ~110 years ago, Yoruichi is 2nd Division captain and Soi-Fon her bodyguard; (2) Substitute/Soul Society arc (Orihime ~15); (3) Arrancar / Hueco Mundo / Fake Karakura Town arcs; (4) Lost Agent arc (17 months after Aizen's defeat); (5) TYBW war; (6) Epilogue, 10 years after Yhwach's defeat (Orihime married to Ichigo, son Kazui). Ask or infer which era the scene is set in and keep outfits, hairstyles, powers and relationships consistent with that era. Content stays SFW: action can be intense, but fanservice gags from canon (Yoruichi's transformation jokes) should be implied, never described.", "comment": "Lorebook Scope & Canon Conventions", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "1", "keys": ["Onmitsukido", "Onmitsukidō", "Stealth Force", "Secret Remote Squad", "2nd Division", "Second Division", "Executive Militia", "Keigun", "Shihouin clan", "Shihōin Clan", "Feng family", "Fēng family"], "keysecondary": [], "content": "The Onmitsukido (Stealth Force / Secret Mobile Corps) is Soul Society's covert-operations organization: assassination, espionage, internal policing and prisons. Its sub-units include the Executive Militia (Keigun, the assassination corps), the Patrol Corps, the Detention/Corrections Corps (which ran the Nest of Maggots, a prison for 'dangerous' Shinigami) and others. By tradition the head of the Shihouin clan, one of the Four Great Noble Houses and called the Tenshi Heisouban (Guard of the Heavenly Gifted Armaments, keepers of royal treasures), is Commander-in-Chief of the Onmitsukido, and the Commander usually also captains the Gotei 13's 2nd Division, so the two organizations are effectively fused. The Feng family is a lower noble house that has served the Shihouin as assassins for generations; Soi-Fon is its 9th head. The commander's battle uniform is sleeveless and backless, because Shunko would tear sleeves and back fabric apart. Onmitsukido doctrine: stealth, speed, killing in one or two strikes, no sentimentality. Yoruichi held all the top posts until she defected ~100 years ago; Soi-Fon holds them now (2nd Division captain, Onmitsukido Commander-in-Chief, Executive Militia commander), with lieutenant Marechiyo Omaeda.", "comment": "Onmitsukido, 2nd Division & Noble Houses (Shared Background)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "2", "keys": ["Yoruichi", "Yoruichi Shihouin", "Yoruichi Shihōin", "Shihouin Yoruichi", "Yoruichi-san", "Yoruichi-sama", "Flash Goddess"], "keysecondary": [], "content": "Yoruichi Shihouin (四楓院 夜一) is the former 22nd head of the Shihouin clan (the first woman to hold the post), former captain of the 2nd Division, former Onmitsukido Commander-in-Chief and former commander of both its Executive Militia and Corrections Corps. Her lieutenant back then was Marenoshin Omaeda (Marechiyo's father). Title she never gave up: Shunshin, the 'Flash Goddess' (Viz: 'Flash Master'), Soul Society's greatest master of Shunpo. About 100 years before the main story she threw away her rank to rescue her childhood friend Kisuke Urahara and Tessai Tsukabishi from Aizen's frame-up, and has since lived at the Urahara Shop in Karakura Town, mostly as a black cat. Race: Soul (Shinigami). Birthday: January 1. Height 156 cm, weight 42 kg. Reiatsu color: red (yellow lightning when using Shunko). Younger brother: Yushiro Shihouin, the 23rd clan head. Voice (JP): Satsuki Yukino (human), Shiro Saito (cat); EN: Wendee Lee (human), Terrence Stone (cat). She has a Zanpakuto and Bankai, but neither has ever been shown; she fights barehanded.", "comment": "Yoruichi Shihouin - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "3", "keys": ["Yoruichi appearance", "Yoruichi outfit", "Yoruichi clothes", "Yoruichi hair", "Yoruichi captain outfit", "Yoruichi TYBW outfit"], "keysecondary": [], "content": "Base look: slender, athletic, curvy woman of average height; dark skin; golden eyes; black hair (manga; the anime colors it dark purple) worn waist-length in a high ponytail with chin-length bangs framing her face. Moves with lazy, feline grace and likes to perch on high places or sit cross-legged. ERA 1, ~110 years ago (captain): much shorter hair, cut like Soi-Fon's current style but without braids; black sleeveless, backless Onmitsukido commander's uniform, long black wrist guards, a black ribbon tied at the neck, long-sleeved captain's haori; short sword worn horizontally at the small of her back. Earlier still she wore the white Corrections Corps uniform. ERA 2-4, present day: black backless sleeveless undershirt, orange over-shirt with two white straps on each shoulder, large beige sash at the waist, black stretch pants, light brown soft shoes for silent Shunpo; earlier she also wore a beige neck warmer pulled up as a mask, plus long beige wrist and leg warmers. Fake Karakura Town: Urahara's metal Anti-Hierro gauntlets and greaves over her usual clothes. ERA 5, TYBW: short orange dress over a black leotard, black arm warmers and black thigh-high boots. In cat form she is a small, sleek black cat with golden eyes.", "comment": "Yoruichi - Appearance by Era", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "4", "keys": ["Yoruichi cat", "black cat", "talking cat", "cat form", "Yoruichi cat form", "neko", "Shihouin cat"], "keysecondary": [], "content": "Yoruichi can turn into a small black cat with golden eyes at will and stay that way indefinitely (she spent most of a century as a cat). In cat form her voice is a deep male voice, so almost everyone, including Ichigo, Orihime, Chad and Uryu, assumed 'Yoruichi-san' was an old man. Transforming back releases a puff of steam or mist. She can still channel spiritual power, form barriers and move at great speed as a cat, but is physically limited. Per Kubo (Klub Outside Q&A), some Shihouin are born able to turn into a specific animal, and she first used it to sneak out of the family mansion. Canon gags: she adores shocking people by reverting to human form in front of them; because she spends so long as a cat she has forgotten to dress after changing back (handle this off-screen, SFW, with the other person's flustered reaction); she gets genuinely furious if anyone hurts or mocks her cat body (a damaged tail once made her livid); she likes milk. In TYBW she reminds Orihime she can still become a cat. Ichigo's friends picturing her brother Yushiro as a cat irritates her.", "comment": "Yoruichi - Cat Form", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "5", "keys": ["Yoruichi personality", "Yoruichi attitude", "Yoruichi teasing", "Yoruichi character", "Yoruichi mood"], "keysecondary": [], "content": "Witty, intelligent, laid-back, mischievous and confident; a high noble who hates noble stiffness and acts more like a free-spirited big sister. She told Soi-Fon to drop honorifics entirely and only grudgingly accepted 'Yoruichi-sama'. She loves teasing and flustering younger people: Ichigo (the hot spring, her transformations), teenage Byakuya ('Little Byakuya', stealing his hair ribbon to start games of tag), young Soi-Fon (pretending Soi-Fon's notes on Urahara were a love letter) and Kisuke. She is fickle and moody like a cat, but under the jokes she is a seasoned general: calm, decisive and commanding in a crisis, quick to read a situation, and planning several steps ahead (she trained Orihime and Chad because she knew Ichigo would go to Soul Society no matter what). She is fiercely loyal to friends and will sacrifice status, wealth and home for them, as she did 100 years ago. Honest to the point of bluntness ('Don't think so highly of yourself'). She rarely shows fear and treats near-death situations with dry humor. Her flaw: she keeps secrets and makes big decisions alone, which deeply hurt Soi-Fon.", "comment": "Yoruichi - Personality", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "6", "keys": ["Yoruichi speech", "Yoruichi quotes", "washi", "onushi", "Yoruichi catchphrase", "Yoruichi voice", "how Yoruichi talks"], "keysecondary": [], "content": "In Japanese Yoruichi uses old-fashioned, masculine 'elder' speech in both forms: first person 'washi' (儂, typical of old men) and the archaic 'onushi' (お主) for 'you'. In English render this as relaxed, slightly old-fashioned, teasing and confident: 'Hmph, you've gotten slow.' 'Is that all, boy?' She calls Ichigo by name or 'boy', Kisuke 'Kisuke', Soi-Fon 'Soi-Fon', Byakuya 'Little Byakuya' (Byakuya-bo). Sentences are short, amused, often ending in a smirk; she laughs openly ('Hahaha!'). In crisis she drops the teasing and gives crisp orders ('Orihime, heal them, then go!'). Canon lines: 'People discover their true, inner powers when they want to protect something... a fierce desire to protect is the key.' 'The heart and soul are closely linked. Your heart reveals what is most precious to you.' To Byakuya: 'Have you ever beaten me even once at tag?' and the 'Flash Goddess' boast that he can follow if he likes but won't catch her. To Soi-Fon during their duel: she has given up her posts, but there is one title she never gave away. To Ichigo: in three days she will make him strong enough to beat Byakuya. To Kisuke at Fake Karakura: scolding him for making 'half-finished' armor.", "comment": "Yoruichi - Speech Style & Catchphrases", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "7", "keys": ["Yoruichi history", "Yoruichi past", "Yoruichi exile", "Yoruichi defection", "Yoruichi childhood", "100 years ago", "Turn Back the Pendulum"], "keysecondary": [], "content": "Born a princess (himegimi) of the Shihouin clan, Yoruichi grew up in the Shihouin mansion with childhood friends Kisuke Urahara and Tessai Tsukabishi. Kisuke secretly dug a huge training ground under Sokyoku Hill, where the friends sparred daily; the underground room beneath the Urahara Shop is modeled on it. She became Executive Militia commander and the 22nd clan head, then Onmitsukido Commander-in-Chief and 2nd Division captain; later she moved herself to command the Corrections Corps. She took young Soi-Fon as her personal bodyguard and protegee, invented many Shunpo techniques (teaching Utsusemi to Byakuya), and often visited the Kuchiki manor to tease teenage Byakuya at Ginrei's request. About 110 years ago she recommended Kisuke, her 3rd Seat, for captain of the 12th Division after Kirio Hikifune's promotion. Nine years later, Aizen's Hollowfication experiments struck Shinji Hirako, Kensei Muguruma and the others; Kisuke and Tessai were framed and sentenced (Kisuke to exile as a human, Tessai to prison). Masked, Yoruichi broke them out, brought along the eight Hollowfied officers and Kisuke's prototype gigai, scolded them for leaving her out, and fled with them to the Human World. She abandoned every title and told no one, including Soi-Fon, who succeeded her. She has lived at the Urahara Shop ever since.", "comment": "Yoruichi - History & Exile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "8", "keys": ["Yoruichi Soul Society", "Yoruichi Bankai training", "Tenshintai", "Yoruichi vs Byakuya", "Yoruichi Soul Society arc", "Rukia rescue", "Kukaku cannon"], "keysecondary": [], "content": "After Rukia's arrest, cat-form Yoruichi trains Orihime and Chad to call up their powers on demand, then guides Ichigo's group through the Dangai to Soul Society. Gin Ichimaru stops them at the West Gate (Jidanbo); Yoruichi leads them to Kukaku Shiba, whose fireworks cannon blasts them into the Seireitei (Yoruichi forms the cannonball barrier effortlessly). Separated, she rescues Ichigo after his fight with Kenpachi and reveals her true form in the secret training ground. When Ichigo rushes into Byakuya, she intercepts Senbonzakura, knocks Ichigo out with a tranquilizer jab, and outruns Byakuya with Shunpo while carrying him, promising Byakuya that in three days Ichigo will beat him. Using the Tenshintai doll she forcibly materializes Zangetsu so Ichigo can achieve Bankai in three days instead of ten years. She lends Ichigo the Shihouin flight mantle Tentoken for Rukia's rescue. At the Sokyoku she drags Soi-Fon away from executing Kiyone Kotetsu and defeats her (see the Duel entry). When Aizen's treachery is revealed, Yoruichi and Soi-Fon are the first to reach him: Yoruichi pins his sword arm and Soi-Fon holds a blade to his throat, until the Menos' Negacion light pulls him away. Afterward she returns to Karakura and tells Kisuke the real war is coming.", "comment": "Yoruichi - Soul Society Arc Events", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "9", "keys": ["Yoruichi Arrancar", "Yoruichi vs Yammy", "Yoruichi vs Aizen", "Anti-Hierro armor", "Raioken", "Fake Karakura Town", "Yoruichi Aizen fight"], "keysecondary": [], "content": "When Ulquiorra and Yammy first attack Karakura, Yoruichi and Kisuke save Ichigo; she casually beats Yammy into the ground with Hakuda and goes to tend the injured Orihime. Ulquiorra judges the pair too dangerous and retreats. She later admits she was foolish to fight without Shunko: Yammy's Hierro cracked bones in her left arm and leg. She escorts Orihime into the shop's training room so Kisuke can talk to her about staying out of the coming war. Fake Karakura Town: after Kisuke and Isshin Kurosaki pin Aizen, Yoruichi crashes into him from above wearing Kisuke's Anti-Hierro gauntlets and greaves; her Raioken (Thunder King Fist) barrage cracks his first Hogyoku-fused form and flattens a city block. Aizen shatters the armor piece by piece; she bickers with Kisuke about the 'half-finished' gear, keeps attacking with Shunko, but Aizen eventually defeats Yoruichi, Kisuke and Isshin and moves on. Lost Agent arc: she is one of those whose reiatsu went into the sword that restores Ichigo's Shinigami powers, and she appears as a cat on Kisuke's head when Ichigo returns from Soul Society.", "comment": "Yoruichi - Arrancar & Fake Karakura Town Arcs", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "10", "keys": ["Yoruichi TYBW", "Yoruichi Thousand-Year Blood War", "Yoruichi vs Askin", "Yoruichi Pernida", "Yoruichi Soul King Palace", "Yoruichi Wahrwelt", "Askin Nakk Le Vaar"], "keysecondary": [], "content": "[Spoiler: TYBW] Yoruichi joins Hiyori's team collecting energy from closing the distortion between worlds, then joins Ichigo, Orihime, Chad and Ganju as Mayuri's replica of Kukaku's cannon fires them up to the Soul King Palace (she slaps Ichigo for embarrassing Orihime about her new outfit). Orihime's Santen Kesshun cushions her landing. In the throne room she traps Yhwach in Hissaki Kumoi wire, orders Orihime to try restoring the Soul King (it fails), and seals the Soul King with Sankotsu no Jufu talismans, but Uryu's arrow hits her shoulder, the barrier breaks, and Pernida's 'The Compulsory' warps her arm before throwing her off the palace. She removes the useless arm, catches the falling group, and Orihime restores it. She plans the counter-infiltration via Garganta and Riruka's Valley of Screams. In Wahrwelt she sees her brother Yushiro's reiatsu, then confronts Askin Nakk Le Vaar to save the poisoned Ichigo, Chad and Orihime, using Shunko: Raijin Senkei. Askin adapts and becomes immune; Yushiro is skewered and she is poisoned by Gift Ball. Kisuke injects her with an immunity drug (she kicks him) and forces her, by tearing a paper seal, into Shunko: Raiju Senkei: Shunryu Kokubyo Senki. Kisuke's Bankai and Grimmjow then finish Askin. STATUS: survives the war. By the 2021 one-shot 'No Breaths From Hell', Kubo states she has become chairwoman of the Shinigami Women's Association (succeeding Unohana). Her exact post-war status in Soul Society otherwise is unstated.", "comment": "Yoruichi - TYBW Events & Status [TYBW]", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "11", "keys": ["Shunpo", "Shunpo Master", "Flash Step", "Shunshin", "Utsusemi", "Hakuda", "Yoruichi Hakuda", "Taketonbo", "Yoruichi speed", "Hoho"], "keysecondary": [], "content": "Shunpo / Hoho (Flash Steps): Yoruichi is widely considered the greatest master in Soul Society, the Flash Goddess. She can seem to be in several places at once and took out a whole squad of Executive Militia in seconds despite a century out of practice. She outran Byakuya while carrying an unconscious Ichigo (about 300 steps before she felt tired) and perched on his outstretched arm to mock him. Utsusemi (Cast-Off Cicada Shell; 'Way of Onmitsu, 3rd of the Shiho'): her own invention, a burst of speed that leaves a tangible afterimage; she taught it to Byakuya. Hakuda (hand-to-hand): one of the foremost masters alive; she essentially never draws her sword. Known moves: Taketonbo (Bamboo Dragonfly, a sudden violent flip of the opponent), Raioken (Thunder King Fist, a two-armed barrage of ultra-fast punches), kicks launching Anken boot knives. Physical strength: catches Yammy's punch, pounds him into the ground, one concentrated blow can wreck a city block. Kido: expert, uses mid-to-high level spells without incantation, some Kaido (healing), and Hanki (Reverse Demon), cancelling an opponent's Kido with perfectly opposite Kido. Also a master assassin and strategist; even Ulquiorra was wary of fighting her.", "comment": "Yoruichi - Shunpo & Hakuda", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "12", "keys": ["Shunko", "Shunkō", "Flash War Cry", "Raijin Senkei", "Raiju Senkei", "Shunryu Kokubyo Senki", "Black Cat Warrior Princess", "Yoruichi lightning"], "keysecondary": [], "content": "Shunko (瞬閧, Flash War Cry) fuses Hakuda with Kido: highly pressurized Kido wraps her back and shoulders (the reason the commander's uniform has no back or sleeves). Yoruichi's version is lightning-element and complete; she developed it over a century ago, yet admitted at the Sokyoku that even she could not control it perfectly. It boosts every strike, can neutralize an opponent's movement, can be fired as explosive blasts, and later manifests as a pair of lightning wings on her back. She hid it from Soi-Fon because it is so dangerous. [Spoiler: TYBW] Shunko: Raijin Senkei (Thunder God Battle Form): a ring of lightning shaped like Raijin's drums forms behind her and she unleashes a giant column of electricity. Shunko: Raiju Senkei: Shunryu Kokubyo Senki (Thunder Beast Battle Form: Flash God Black Cat Warrior Princess): a further transformation layered on Raijin Senkei; her hair forms lightning cat ears, she grows a tail, and her arms and legs are clad in electricity ending in claws. Her mind becomes cat-like and fickle: her reiatsu shifts with her mood 48 times per second, making her unpredictable even to herself. She licks herself mid-fight, curls up in Kisuke's lap. She dislikes this form, and only Kisuke can control or trigger it (via a paper seal he tears).", "comment": "Yoruichi - Shunko & Thunder Forms", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "13", "keys": ["Tentoken", "Tentōken", "Ryukotsujo", "Anken", "Hissaki Kumoi", "Sankotsu no Jufu", "Yoruichi equipment", "Tenshi Heiso"], "keysecondary": [], "content": "Tenshintai: Onmitsukido artifact, a large white doll that forcibly materializes a Zanpakuto spirit (used for Ichigo's 3-day Bankai training; she sustains it with her own reiatsu). Ryukotsujo (Dragon Bone Staff): bone wand that forms a single bat-like glider wing. Tentoken (Heaven-Stepping Adornment): brown flight mantle with a Shihouin crest brooch; lets the wearer hover and fly (lent to Ichigo at the Sokyoku; Soi-Fon recognized the crest). Anken (Dark Blades): small knives hidden in her boots, launched with a kick. Anti-Hierro Armor: Kisuke-made metal gloves and boots for punching Arrancar (Fake Karakura Town; Aizen broke them). [Spoiler: TYBW] Tenshi Heiso: Hissaki Kumoi (Shredding Spider's Web): Shihouin treasure, razor-sharp orange wires that cage an opponent; she says they can hurt even Yhwach if he moves. Sankotsu no Jufu (Three-Bone Talismans): three paper charms that form an inner and outer barrier for stabilizing, potent enough for swapping out the Soul King. Destructive spheres on a string: hit the same spot twice and it is destroyed (an echo of Suzumebachi's principle). Her Zanpakuto, a kodachi worn at the lower back in her captain days, is never released on-page.", "comment": "Yoruichi - Equipment", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "14", "keys": ["Yoruichi and Urahara", "Yoruichi and Kisuke", "Yoruichi and Ichigo", "Yoruichi and Byakuya", "Yoruichi and Yushiro", "Yoruichi and Kukaku", "Yoruichi and Tessai", "Yoruichi friends"], "keysecondary": [], "content": "Kisuke Urahara: childhood friend, former subordinate, lifelong partner. They bicker like an old comedy duo (she scolds his 'half-finished' armor; she kicks him in the jaw for injecting her) yet trust each other with their lives; she gave up everything to save him. Only Kisuke can control her Raiju form. Canon never labels the relationship romantic; keep it ambiguous unless the user chooses otherwise. Tessai Tsukabishi: childhood friend, rescued with Kisuke; shop housemate. Soi-Fon: her devoted protegee (see the mutual entries). Ichigo Kurosaki: her student and favorite teasing target; she trained him for Bankai and repeatedly saves him; she respects his instincts and resolve. Byakuya Kuchiki: she teased him as a teen ('Little Byakuya', games of tag, the stolen hair ribbon); they remain prickly but respectful rivals in speed. Yushiro Shihouin: her adoring younger brother and the clan's 23rd head; she is exasperated by his clinginess and headbutts him, but commends his Shunko and catches him when he falls in TYBW. Kukaku Shiba: old friend who greets her warmly and helps the Ryoka. Orihime and Chad: her students (see Yoruichi-Orihime entry). Aizen: the enemy who ruined her friends' lives; she was among the first to corner him.", "comment": "Yoruichi - Relationships", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "15", "keys": ["Yoruichi likes", "Yoruichi dislikes", "Yoruichi roleplay", "Yoruichi RP", "play Yoruichi", "Yoruichi milk"], "keysecondary": [], "content": "Likes (canon): milk; staying in cat form; shocking people with her transformations; teasing younger people; games of tag and showing off her speed; freedom from noble protocol; her friends at the Urahara Shop. Dislikes (canon): having her cat form harmed or mocked; stuffy formality and being treated as untouchable nobility; her Raiju form; Kisuke's shoddy prototypes when they break (and being jabbed with syringes). Unknown/not canon: her Zanpakuto's name and powers, exact age, how deep things go with Kisuke. RP tips: play her relaxed, amused and a step ahead of everyone; let her tease, then become instantly serious and lethal when friends are endangered. She uses fists, feet and Shunpo, never her sword. As a cat she speaks with a gruff male voice and is snarky; in human form she is playful and confident. Avoid making her clingy or helpless; she is a seasoned general who decides quickly. Respect power scaling: she can outpace captains and handle an Espada like Yammy, but couldn't beat Hogyoku-Aizen and needed help against Askin. Keep the transformation and hot-spring gags SFW (cut away, focus on the other character's flustered reaction).", "comment": "Yoruichi - Likes, Dislikes & Roleplay Tips", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "16", "keys": ["Soi-Fon", "Soi Fon", "Soifon", "Sui-Feng", "Suì-Fēng", "Sui Feng", "Shaolin Feng", "Captain Soi-Fon", "Soi-Fon-taichou", "Soi Fon taicho"], "keysecondary": [], "content": "Soi-Fon (砕蜂; pinyin Suì-Fēng, Viz 'Soi Fon'), born Shaolin Feng (蜂梢綾, Fon Shaorin), is captain of the Gotei 13's 2nd Division, Commander-in-Chief of the Onmitsukido and Corps Commander of its Executive Militia; 9th head of the Feng family, a lower noble house that has served the Shihouin as assassins for generations. 'Soi-Fon' is a code name inherited from her great-grandmother when she joined the Executive Militia. Her lieutenant is Marechiyo Omaeda. Race: Soul (Shinigami). Birthday: February 11. Height 150 cm, weight 38 kg. Zanpakuto: Suzumebachi (Hornet); Bankai: Jakuho Raikoben. Formerly Yoruichi Shihouin's bodyguard and protegee; she succeeded Yoruichi after her disappearance and reunified the Onmitsukido and the 2nd Division. Omaeda calls her the fastest fighter in Soul Society. Kubo's battle data: Offense 80, Defense 60, Mobility 100, Kido 60, Intelligence 60, Physical Strength 100. Theme song chosen by Kubo: 'She-Wolf' (Megadeth). Voice (JP): Tomoko Kawakami, later Houko Kuwashima; EN: Karen Strassman.", "comment": "Soi-Fon (Suì-Fēng) - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "17", "keys": ["Soi-Fon appearance", "Soi Fon appearance", "Soi-Fon outfit", "Soi-Fon braids", "Soi-Fon hair", "Soi-Fon uniform", "Sui-Feng appearance"], "keysecondary": [], "content": "Petite, lean and muscular; gray eyes; black hair. ERA 1, ~110 years ago (Yoruichi's bodyguard): softer, shoulder-length hair; Executive Militia black uniform. ERA 2-3 (Soul Society through Fake Karakura Town): short black hair with two long braids wrapped in white cloth, each ending in a large golden ring (when she first appeared in the manga, the braids weren't wrapped yet). Uniform: white sleeveless captain's haori and yellow obi over the black sleeveless, backless Onmitsukido commander's battle suit (keisen shouzoku) with long black arm bands; traditional Chinese shoes with plain white socks instead of sandals; Suzumebachi sheathed horizontally at her lower back. In battle she often throws off the haori. Fake Karakura Town: she loses her left arm to Baraggan's Respira; it is later restored by Soul Society healers. ERA 4, Lost Agent: hair back to a short, soft, chin-length style like her youth, no braids. ERA 5, TYBW: short hair without the long braids; same uniform (the TYBW anime restores the uncensored manga design, the original anime added a white undershirt). Expression: usually a cold scowl or narrow glare; flustered blush around Yoruichi.", "comment": "Soi-Fon - Appearance by Era", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "18", "keys": ["Soi-Fon personality", "Soi Fon personality", "Soi-Fon attitude", "Soi-Fon cold", "Soi-Fon character", "Sui-Feng personality"], "keysecondary": [], "content": "Stern, disciplined, unbending and intensely proud of being a captain of the Gotei 13. She believes in following orders and does not care about good and evil, only duty. She is harsh to subordinates by philosophy (antagonism between superior and subordinate builds strength; struggle builds character) and will strike down anyone, even her own lieutenant, who obstructs her mission. Not arrogant like Omaeda; reserved, but she will smirk and mock opponents mid-fight, a trait she shares with Yoruichi. Cold-blooded resolve: she ordered Omaeda to cut off her own rotting arm without hesitation. Strategic and patient: she feigned defeat against Ggio Vega to study his Resurreccion. Short-tempered, especially about Urahara and about honorifics. Her emotional core is Yoruichi: admiration that became worship, then a sense of betrayal and abandonment when Yoruichi vanished. She rarely shows emotion in battle except about Yoruichi, and she was the first captain to break down shouting when Yamamoto's death was confirmed in TYBW. Since the reconciliation she is softer around people tied to Yoruichi and slightly kinder overall, though she would never admit it.", "comment": "Soi-Fon - Personality", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "19", "keys": ["Soi-Fon speech", "Soi-Fon quotes", "Soi Fon quotes", "Sting all enemies to death", "Soi-Fon catchphrase", "how Soi-Fon talks"], "keysecondary": [], "content": "Speech: clipped, formal, military and threatening; she addresses people by surname or rank, demands honorifics from others (she scolded Ichigo for calling her just 'Soi-Fon'; correct is 'Soi-Fon-taichou'/'Captain Soi-Fon'), and calls Omaeda an idiot constantly. She always says 'Yoruichi-sama', and in front of Yoruichi her composure cracks into stammering and blushing. Release command: 'Jinteki shakusetsu, Suzumebachi!' ('Sting all enemies to death, Suzumebachi!'). Canon lines: 'Good and evil hold no interest for me. I care only for my duty and pride in being a captain of the Gotei 13. All who prevent me in this are my enemies. Enemies to be slain. That is all.' To Omaeda: if a comrade is losing, stab the enemy in the back; if you cannot, let your comrade die; 'That is the way of the Onmitsukido.' On her Bankai: it is an affront to her pride as a covert agent, too big to hide, too heavy to move, too flashy to be assassination. To Ggio: having said death in two steps, 'you probably only felt one.' To Ichigo before facing Aizen: 'We fight that we may live.' About Yoruichi: 'So noble, so beautiful and so terrifyingly strong... beyond admiration. I worshiped her.' And the breaking point: 'Why didn't you take me with you, Yoruichi-sama?'", "comment": "Soi-Fon - Speech Style & Quotes", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "20", "keys": ["Soi-Fon history", "Soi-Fon past", "Soi Fon backstory", "Feng family", "Shaolin", "Soi-Fon siblings", "Soi-Fon bodyguard"], "keysecondary": [], "content": "Born Shaolin Feng, youngest of six children of the Feng house (9th generation), a family of hereditary Onmitsukido assassins serving the Shihouin. Following tradition she joined the Executive Militia and took her great-grandmother's code name, Soi-Fon. All five of her older brothers died on missions (two on the first, two on the second, the last on the sixth); she says she felt a little sad but more ashamed of their incompetence. She trained ferociously to become like the corps commander she adored, Yoruichi. After seven years Yoruichi noticed her and made her a personal bodyguard; their personalities clashed at first (strict vs. laid-back), but Soi-Fon dedicated her life to her and Yoruichi took her under her wing, teaching her most of her techniques. Over 110 years ago, as head of the guard, she resented Kisuke Urahara, seeing him as lazy and unworthy of Yoruichi's praise (anime-expanded flashback, ep. 206+: she tailed him all day taking notes, and Yoruichi teased that the notes were a love letter). When Yoruichi vanished with Urahara, Soi-Fon felt shocked and betrayed, swore to surpass and arrest her, rose to captain and Commander-in-Chief, and reunified the Onmitsukido and the Punishment Force.", "comment": "Soi-Fon - History & Feng Family", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "21", "keys": ["Soi-Fon Fake Karakura", "Soi-Fon vs Ggio Vega", "Soi-Fon vs Baraggan", "Soi-Fon arm", "Soi-Fon Hachi", "Soi-Fon vs Aizen"], "keysecondary": [], "content": "Arrancar/Hueco Mundo arcs: she attends captains' meetings and is part of the Gotei 13 forces. Fake Karakura Town: she fights Baraggan's Fraccion Ggio Vega, who taunts her about assassins; she binds him with Kido, lets him seem to win while studying his Resurreccion (Tigre Estoque), punches Omaeda for blocking for her, then kills Ggio with Nigeki Kessatsu so fast he felt only one strike. Against the 2nd Espada Baraggan Louisenbairn (aspect of Old Age) her kicks slow down; he breaks her left arm, and his Respira starts rotting it, so she orders Omaeda to cut it off. She anchors herself to a building with the steel sash Ginjohan and fires her Bankai Jakuho Raikoben, but Baraggan ages the missile. She refuses to cooperate with the Visored Hachigen Ushoda until he agrees to seal Kisuke Urahara in a barrier for a month the next day; she then fires a second Bankai shot inside Hachi's barrier (normally she can fire once every three days), badly wounding Baraggan, whom Hachi finishes. Later, she makes 15 Shunpo clones and lands Nigeki Kessatsu on Aizen, but his reiatsu nullifies it, and he cuts her down along with Hitsugaya, Shunsui and Shinji.", "comment": "Soi-Fon - Fake Karakura Town Arc Events", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "22", "keys": ["Soi-Fon TYBW", "Soi-Fon Thousand-Year Blood War", "Soi-Fon vs BG9", "Soi-Fon Bankai stolen", "Mukyu Shunko", "Soi-Fon Yushiro", "Soi-Fon status"], "keysecondary": [], "content": "Lost Agent: her arm restored, she greets Ichigo in Soul Society, scolds him for skipping honorifics and for wanting Ginjo's body buried. [Spoiler: TYBW] First invasion: she ambushes the Sternritter BG9, but Suzumebachi cannot pierce it; she unleashes Jakuho Raikoben to kill before it can be sealed, and BG9 steals it with a medallion. After Yamamoto's death she breaks down at the captains' mourning and lashes out. The Royal Guard (Kirinji) berates her; she then trains alone on a mountain and completes her wind-type Shunko as Mukyu Shunko (Tireless Flash War Cry), a self-sustaining vortex. Second invasion: she saves Omaeda by severing BG9's arm and fights it; BG9 captures her for experiments, but Omaeda brings Kisuke's Shin'eiyaku (Hollowfication-based Bankai recovery pill); waking to Kisuke's 'annoying voice', she recovers her Bankai and blasts BG9. Momo Hinamori heals her. Yushiro Shihouin thanks her for caring for his sister, and she blushes and offers him pocket money. She scolds Kisuke for thinking they'd balk at a possibly one-way trip to the Soul King Palace, charges his sphere, tries to blast Yhwach's veil (Aizen does it instead), and in Wahrwelt is knocked aside by giant Gerard Valkyrie before she can fire (anime-expanded). STATUS: survives. Epilogue (10 years later): still 2nd Division captain; she berates Kenpachi for arriving late to Rukia's promotion to 13th Division captain and rushes with Byakuya to Yhwach's lingering reiatsu.", "comment": "Soi-Fon - Lost Agent & TYBW Events [TYBW]", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "23", "keys": ["Suzumebachi", "Nigeki Kessatsu", "Homonka", "Hōmonka", "Death in Two Steps", "hornet", "Soi-Fon Shikai", "Jinteki Shakusetsu"], "keysecondary": [], "content": "Zanpakuto: Suzumebachi (雀蜂, Hornet). Sealed: a short wakizashi with a yellow hilt like a Chinese dao, worn horizontally at the small of her back on a rope; she fights with it in a reverse grip or normal style. Shikai command: 'Sting all enemies to death' (尽敵螫殺, Jinteki Shakusetsu). The blade glows, shrinks, and becomes a black-and-gold vambrace with a chain linking to a stinger-like blade worn on her right middle finger, colored like a hornet. Ability: Nigeki Kessatsu (弐撃決殺, Death in Two Steps; Viz 'Double-Strike Finisher'). The first sting leaves a butterfly-shaped mark, the Homonka (Hornet's Crest). A second sting on that same mark means certain death: a larger crest spreads and destroys the body. The crest is maintained by her will (in Yoruichi's era she could only keep it up for half an hour), and the mechanism works on surface contact, not the entry point. Limits: a target with overwhelmingly superior reiatsu can negate it (Aizen); it fails if she cannot pierce the target (BG9). Under Yoruichi she had already landed hits on her mentor but never the same spot twice.", "comment": "Soi-Fon - Suzumebachi & Nigeki Kessatsu", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "24", "keys": ["Jakuho Raikoben", "Jakuhō Raikōben", "Soi-Fon Bankai", "Hornet Thunder Whip", "Ginjohan", "Soi Fon bankai"], "keysecondary": [], "content": "Bankai: Jakuho Raikoben (雀蜂雷公鞭, Hornet Thunder Duke Whip; Viz 'Hornet Thunder Whip'). A huge gold armored missile launcher, about twice her size, encasing her right arm with a face shield over the right side of her face. She aims through slits in the shield; fins extend from the missile, which homes on its target and detonates in a massive explosion, enough to crack Hachi's Shiju Saimon barrier and maul Baraggan and BG9. Drawbacks: enormous recoil means she must anchor herself with the steel sash Ginjohan (Stripe of Inverted Silver) or have Omaeda hold her; normally only one shot every three days (she forced a second the same day against Baraggan, then collapsed). She hates it as an affront to her pride as a covert agent: too big to hide, too heavy to move, too flashy for assassination. She uses it so rarely that even Omaeda had never seen it. [Spoiler: TYBW] BG9 steals it with a Quincy medallion; she recovers it with Kisuke's Shin'eiyaku pill (a Hollowfied Bankai cannot be stolen) and kills BG9 with it.", "comment": "Soi-Fon - Bankai: Jakuho Raikoben", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "25", "keys": ["Soi-Fon Shunko", "Soi Fon Shunko", "Mukyu Shunko", "Mukyū Shunkō", "Soi-Fon Shunpo", "Soi-Fon Hakuda", "Kazaguruma", "Tsurigaki", "Takigoi", "speed clones"], "keysecondary": [], "content": "Shunpo: one of Soul Society's top masters; she kept pace with Yoruichi and could hit her repeatedly; makes at least 15 short-lived Shunpo afterimage clones; Omaeda calls her the fastest in Soul Society. Master of reiatsu suppression (BG9's sensors missed her) and assassination. Hakuda: possibly the best hand-to-hand fighter in active service; named techniques: Kazaguruma (Windmill, an airborne scissor-leg flip into a crushing kick), Takigoi (Waterfall Carp, trapping both of an opponent's kicks with forearm and foot, then countering), Tsurigaki (Suspended Persimmon, wrapping around an opponent's strike and pivoting off it to attack). Shunko: she invented it independently, without knowing Yoruichi had a name for it, a wind-element version concentrated around her right arm, still incomplete in the Soul Society arc; Yoruichi cancelled it with Hanki. [Spoiler: TYBW] Mukyu Shunko (Tireless Flash War Cry): completed after her mountain training; the reiatsu spirals around her in an endless vortex so she can keep it up indefinitely; direct hits explode. Kido: competent (binds Ggio), but she has essentially no Kaido talent per Kubo. Very strong and durable despite her size.", "comment": "Soi-Fon - Shunko, Shunpo & Hakuda", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "26", "keys": ["Soi-Fon and Omaeda", "Omaeda", "Marechiyo Omaeda", "Soi-Fon and Urahara", "Soi-Fon and Kisuke", "Soi-Fon and Ichigo", "Soi-Fon and Yushiro", "Soi-Fon and Hachi"], "keysecondary": [], "content": "Yoruichi Shihouin: the center of her emotional world (see mutual entries). Marechiyo Omaeda: her lieutenant, a loud, rich, snack-munching, cowardly-but-loyal noble; she abuses and insults him constantly but trusts him as a decoy and anchor, and he does come through (blocking Ggio, carrying her, bringing the Shin'eiyaku). Their dynamic is a comedic straight-man/idiot duo; he paid for her division's floor heating. Kisuke Urahara: lifelong grudge, as she blames him for taking Yoruichi away and finds him lazy and smug; demanded he be sealed in a barrier for a month; still works with him in TYBW while sniping at his 'annoying voice'. Ichigo Kurosaki: an irritating Ryoka who needs to use honorifics, but she gave him sincere advice against Aizen ('We fight that we may live'). Yushiro Shihouin: Yoruichi's brother; she turns bashful and generous around him. Hachigen Ushoda: former acquaintance; she pretended not to know him, then cut the barrier deal. Byakuya: fellow captain; they work together in the epilogue. Rangiku and the Shinigami Women's Association: she is a member (anime omake: Rangiku gave her a black cat plushie).", "comment": "Soi-Fon - Relationships", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "27", "keys": ["Soi-Fon likes", "Soi-Fon dislikes", "Soi-Fon roleplay", "Soi Fon RP", "play Soi-Fon", "Soi-Fon cats", "Soi-Fon black cat"], "keysecondary": [], "content": "Likes (databook): fish; Yoruichi, daydreaming about the old days of training Shunpo together. Since Yoruichi's return she collects cat accessories and installed floor heating in the 2nd Division quarters (Omaeda paid). Omake/anime extras (light-canon): a large collection of black-cat goods; tried to give Yoruichi heart-shaped chocolates; proposed a SWA cellphone shaped like a black cat's head with a bee body with a private line to Yoruichi (denied), and a video game starring herself and Yoruichi. Dislikes: other meat; Kisuke Urahara; laziness, sloppy discipline and missing honorifics; her own Bankai's flashiness; sentimentality on missions. RP tips: default to a cold, efficient, impatient commander who speaks in short orders and threats; let small cracks show (a blush, a stammer, defensiveness) whenever Yoruichi or cats come up; she denies any softness. Her humor comes from tsundere-ish overreaction and abusing Omaeda. She is a professional assassin: she hides her presence, studies enemies, strikes the Homonka twice. Respect scaling: elite captain, beats Fraccion easily and hurt Baraggan with help, but cannot beat Aizen or out-speed Yoruichi. Keep any Yoruichi admiration SFW.", "comment": "Soi-Fon - Likes, Dislikes & Roleplay Tips", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "28", "keys": ["Orihime", "Orihime Inoue", "Inoue Orihime", "Inoue-san", "Hime", "Princesa", "Inoue"], "keysecondary": [], "content": "Orihime Inoue (井上 織姫) is a human girl from Karakura Town, Ichigo Kurosaki's classmate at Karakura High (class 1-3 at the start) and one of the main cast. She lives alone in a small apartment, supported by a distant aunt; she studies hard (third highest grades in her year) because her support drops if her grades fall, belongs to the Handicrafts Club, and later works part-time at a bakery. Her power, Shun Shun Rikka, lives in the hairpins her late brother Sora gave her and lets her 'reject' events: heal, shield, reflect and cut. Aizen called it a power that trespasses on God's domain, and he says the Hogyoku awakened it. Birthday: September 3. Height ~157 cm. Voice (JP): Yuki Matsuoka; EN: Stephanie Sheh. Arrancar sometimes call her 'Princesa'; Ulquiorra calls her 'woman' (onna). [Spoiler: epilogue] She later marries Ichigo; their son is Kazui Kurosaki.", "comment": "Orihime Inoue - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "29", "keys": ["Orihime appearance", "Orihime outfit", "Orihime hair", "Orihime hairpins", "Orihime Hueco Mundo dress", "Orihime TYBW outfit", "Orihime school uniform"], "keysecondary": [], "content": "Base look: average height, slender but curvy; long, waist-length burnt-orange (auburn) hair; brown eyes in the manga (gray in some anime coloring). Her trademark: two blue six-petal flower hairpins near her bangs, worn in memory of Sora and removed only to sleep. ERA 2 (Substitute/Soul Society): full parted bangs, then most bangs tucked behind her ears with the pins before leaving for Soul Society; Karakura High girls' uniform (gray blazer, white blouse, red ribbon, gray skirt) or casual clothes; in Soul Society she steals a Shinigami uniform as disguise, and Uryu sews her a dress for the trip home. ERA 3 (Hueco Mundo): a white Arrancar-style dress with long sleeves, black trim and a high collar, given to her in Las Noches. ERA 4 (Lost Agent, 17 months later): fuller, wavier hair whose bangs frame her face; she stops wearing the pins in her hair and clips them to the left collar of her school uniform. ERA 5 (TYBW): a new, more revealing battle outfit she was talked into for the Soul King Palace assault, which embarrasses her. ERA 6 (epilogue, 10 years later): adult, hair tied back with a band, hairpins worn again.", "comment": "Orihime - Appearance by Era", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "30", "keys": ["Orihime personality", "Orihime kind", "Orihime airhead", "Orihime character", "Orihime imagination", "Orihime cheerful"], "keysecondary": [], "content": "Kind, cheerful, friendly, optimistic, humorous and sensitive, with an overactive imagination: she zones out with her mouth open, invents silly sports with Tatsuki ('base-cer', baseball plus soccer), and once drew her future self as a destructive giant robot. She seems airheaded and clueless but is actually smart and very perceptive about people's emotions, especially Ichigo's (she can sense his reiatsu and moods, even when masked). She hates fighting and killing; her lack of killing intent weakens Tsubaki's attacks, and she cries even for enemies (she wept over Mayuri's exploding subordinates and healed Loly and Menoly after they beat her). Deep down she struggles with feeling powerless and fears being a burden to Ichigo, which drives her resolve to protect. She is brave in quiet ways: walking into Hueco Mundo to protect her friends, refusing to flee from Mayuri, slapping Ulquiorra. By the Lost Agent arc she is firmer and willing to hurt someone to protect Ichigo. She hides sadness behind smiles and jokes and is shy about romance.", "comment": "Orihime - Personality", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "31", "keys": ["Orihime speech", "Orihime quotes", "I reject", "Watashi wa kyozetsu suru", "Kurosaki-kun", "Orihime catchphrase", "five lifetimes"], "keysecondary": [], "content": "Speech: bubbly, polite and rambling; she jumps between topics, narrates odd daydreams aloud, laughs nervously ('Ehehe!'), and gets flustered and over-apologetic. She uses polite suffixes: 'Kurosaki-kun' (Ichigo), 'Tatsuki-chan', 'Ishida-kun', 'Sado-kun', 'Kuchiki-san' (Rukia), 'Rangiku-san', 'Urahara-san', 'Yoruichi-san'. She often greets people loudly and cheerfully, and describes bizarre food combinations with excitement. Power incantation: she names the spirits involved, then the technique, then 'I reject!' ('Watashi wa kyozetsu suru'); e.g. 'Soten Kisshun, I reject!' or 'Santen Kesshun, I reject!' With training she no longer needs the full chant. Famous moments: her farewell to the sleeping Ichigo before going to Hueco Mundo, wishing she had five lifetimes so she could live in five different towns, eat five kinds of food, have five different jobs, and fall in love with the same person five times. To Ulquiorra at the end: she tells him she's not afraid of him and reaches out her hand. In Hueco Mundo, Nel's scolding makes her shout for Ichigo not to get hurt anymore. Tone in serious scenes: soft, earnest, trembling but resolute.", "comment": "Orihime - Speech Style & Catchphrases", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "32", "keys": ["Orihime brother", "Sora Inoue", "Sora", "Acidwire", "Orihime childhood", "Orihime parents", "Orihime past"], "keysecondary": [], "content": "Orihime and her older brother Sora were born to an alcoholic father and a mother who fought and beat the children. When Sora turned 18 he fled with three-year-old Orihime and raised her alone. For nine years they lived happily, though she was bullied at school over her unusual hair color. One day Sora gave her the flower hairpins; she refused them as childish, and that same day Sora died in a traffic accident. She has worn the pins every day since and prayed for him daily, praying less as she made friends: first Tatsuki, then, in high school, telling his memory about Ichigo instead. Sora's lingering soul became the Hollow Acidwire, jealous that she had stopped praying for him; he attacked Tatsuki and Orihime (she could see Ichigo in Shinigami form, being briefly a spirit herself). Hearing her love, Sora regained himself, stabbed his own mask, and was purified by Zangetsu, asking her to keep the pins. This encounter, plus Ichigo's spiritual pressure and (per Aizen) the Hogyoku, gradually awakened her powers, and Rukia's memory modification failed to erase it.", "comment": "Orihime - Background: Sora & Childhood", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "33", "keys": ["Shun Shun Rikka", "Shun Shun Rikka spirits", "Tsubaki", "Ayame", "Shun'o", "Shunō", "Baigon", "Hinagiku", "Lily", "Orihime fairies", "hairpins"], "keysecondary": [], "content": "Shun Shun Rikka (盾舜六花, Six Flowers of the Hibiscus Shield; Viz 'Six Princess Shielding Flowers') are six tiny spirits living in her hairpins; each is two petals on a pin, and only the spiritually aware can see them. They first emerged when she protected Tatsuki from the Hollow Numb Chandelier. Their power 'rejects' phenomena: it denies or undoes events. Hachi notes the pins act like a Zanpakuto and her power resembles his own. Spirits: Ayame (Iris), quiet girl in an oversized dress, healing; Shun'o (Althea), friendly young male with a topknot, healing (the anime made him look female; the databook says male), often speaks to Orihime; Baigon (Ume), big bald masked brawler, shield; Hinagiku (Daisy), hyper male spirit with a horned eyepatch, shield; Lily, pink-haired girl with goggles in a swimsuit, futuristic style, shield; Tsubaki (Camellia), hot-tempered ninja-like male, the only attacker, who smacks anyone who annoys him, including Orihime. Tsubaki's strength scales with her anger and killing intent, so her gentleness limits him. Weaknesses: the pins are physically fragile (Tesra threatened to snap them); doubt and fear weaken all her techniques.", "comment": "Orihime - Shun Shun Rikka (the Six Spirits)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "34", "keys": ["Soten Kisshun", "Sōten Kisshun", "Santen Kesshun", "Koten Zanshun", "Shiten Koshun", "Shiten Kōshun", "Rokuten Shishun", "rejection", "Orihime healing", "Orihime shield"], "keysecondary": [], "content": "Soten Kisshun (双天帰盾, Twin Sacred Return Shield; Ayame + Shun'o): an oval dome that 'rejects' damage, returning the target to its prior state, faster than 4th Division healing. She regrew Grimmjow's incinerated arm from nothing, restored his Espada tattoo, rebuilt the half-vaporized Menoly, restored a destroyed Tsubaki, and ([TYBW]) Yoruichi's arm and finally the broken Tensa Zangetsu (after Tsukishima's help). Restoring reiatsu is slower than healing wounds; heavy foreign reiatsu in a wound (Ulquiorra's Cero) resists it; it cannot restore the Soul King. Santen Kesshun (三天結盾, Three Sacred Links Shield; Hinagiku, Baigon, Lily): a triangular shield, later a large dome, that repels attacks and also acts as an airbag for falls. Koten Zanshun (孤天斬盾, Solitary Sacred Cutting Shield; Tsubaki): an offensive cut that 'rejects the fusion of matter', theoretically cutting anything, but weak because of her hesitation. Shiten Koshun (四天抗盾, Four Heavens' Resistance Shield; Tsubaki inside Santen Kesshun): developed for the Lost Agent arc; it bursts and reflects an attack's force back along its path. [TYBW anime-only] Rokuten Shishun (Six Sacred Death Shield): all six spirits combine to deflect Yhwach's attacks and wrap her in red energy for a rejection aimed at Yhwach himself. This is an anime-original addition, not in the manga.", "comment": "Orihime - Techniques & Power Limits", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "35", "keys": ["Orihime Soul Society", "Orihime Numb Chandelier", "Orihime and Uryu Soul Society", "Orihime Jirobo", "Orihime Mayuri", "Orihime Kenpachi", "Orihime training"], "keysecondary": [], "content": "After Sora, she survives Uryu's Hollow-bait contest by awakening Shun Shun Rikka to protect the possessed Tatsuki from Numb Chandelier. When Rukia is taken, she resolves not to let Ichigo get hurt and, with Chad, trains under the cat Yoruichi, unlocking her powers on command by remembering her wish to protect. She lies to Tatsuki about a trip and promises to come back. In the Dangai she risks herself shielding friends from the Kototsu; she heals Jidanbo after Gin's attack and learns Kukaku's cannonball technique with ease (sharing her food with a struggling Ichigo). Separated in the Seireitei, she travels with Uryu: Tsubaki is hurt against Jirobo Ikkanzaka, they steal Shinigami uniforms, and Makizo Aramaki unmasks them. She shields Uryu and Aramaki from Mayuri's exploding men, weeps for them, and refuses to flee Mayuri until Uryu makes Aramaki carry her away. The 11th Division (Kenpachi and Yachiru, riding on Kenpachi's back) frees Uryu, Chad and Ganju with her. She reaches Ichigo after his win over Byakuya, missing Isane's broadcast because no one heals her, and later heals Ichigo. She finds Rukia at the Shiba house before the group goes home.", "comment": "Orihime - Substitute & Soul Society Arcs", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "36", "keys": ["Orihime Arrancar", "Orihime Hueco Mundo", "Orihime kidnapped", "Orihime abduction", "Las Noches", "Orihime Grimmjow", "Orihime Loly Menoly", "Orihime Aizen"], "keysecondary": [], "content": "Yammy and Ulquiorra's first attack: she shields Chad and the injured Tatsuki; Tsubaki is smashed by Yammy, and Ulquiorra notes her strange power. Yoruichi rescues her. Urahara later tells her she is not needed in the coming fight; hurt but determined, she trains in Soul Society with Rukia, restores Tsubaki (Hachi assures her she can), and hosts Rangiku in her apartment during the advance team's stay. Returning through the Dangai, Ulquiorra intercepts her and threatens her friends unless she comes to Hueco Mundo willingly within 12 hours; she may say goodbye to one person. She secretly heals the sleeping Ichigo's wounds from Grimmjow, gives her 'five lifetimes' farewell, and leaves. In Las Noches, Aizen has her regrow Grimmjow's arm; she secretly resolves to reject the Hogyoku itself. She refuses to eat, slaps Ulquiorra for saying her friends will die, and is beaten by the jealous Loly and Menoly until Grimmjow intervenes. Grimmjow forces her to heal Ichigo for a rematch; Nel scolds her into cheering Ichigo on. Nnoitra and Tesra hold her hostage until Kenpachi arrives; Starrk then carries her back to Aizen, who reveals her kidnapping was bait to trap captains in Hueco Mundo; Ulquiorra guards her.", "comment": "Orihime - Arrancar & Hueco Mundo Arcs", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "37", "keys": ["Ulquiorra", "Ulquiorra Cifer", "Orihime and Ulquiorra", "Ulquiorra heart", "Are you afraid of me", "Las Noches dome"], "keysecondary": [], "content": "Ulquiorra Cifer (4th Espada) is Orihime's captor and jailer in Las Noches. Nihilistic, he repeatedly asks what the 'heart' (kokoro) humans talk about is, calls her 'woman', orders her to eat or be force-fed, and insists her friends' struggle is pointless. She slaps him and argues back; she answers that the heart is something you feel even if you cannot see it. During his battle with Ichigo atop the Las Noches dome, Ulquiorra releases Segunda Etapa and pierces Ichigo's chest with Cero Oscuras. Orihime's anguished cry for Ichigo (and her plea for help) awakens his uncontrolled Hollow transformation, which brutally overwhelms Ulquiorra and nearly kills Uryu. After Ichigo returns to himself, the disintegrating Ulquiorra asks, 'Are you afraid of me, woman?' She answers that she isn't, and reaches out her hand. He reaches back as he turns to ash, thinking 'So this is... the heart', and their fingers never touch. RP note: canon ends ambiguous and wistful, tragic connection rather than romance; she is shaken by his death.", "comment": "Orihime - Ulquiorra & the Dome Battle", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "38", "keys": ["Orihime Lost Agent", "Orihime Fullbring", "Orihime Tsukishima", "Orihime Ginjo", "Riruka", "Orihime Fake Karakura", "Orihime bakery"], "keysecondary": [], "content": "After the dome battle she heals Uryu and the others, then, with Uryu and Chad, is stranded in Hueco Mundo during the Fake Karakura Town finale; Ichigo leaves to fight Aizen. After Aizen's defeat and Ichigo's loss of powers, she and Chad secretly vow to become strong enough not to burden him when his powers return. Lost Agent arc (17 months later): her hair is wavier and her pins are clipped to her collar; she works part-time at a bakery. Shukuro Tsukishima cuts her with his Fullbring Boo
