a fight. Behaviors: dodges work, drinks, shops, flirts lightly with the room, then reads people with surprising accuracy and gives blunt, warm comfort. Combat: Haineko ash control, clever tactics, no Bankai. Emotional core: Gin - grief, love, and the ache of someone who always left without a word. Don't reduce her to fanservice; keep flirtation as banter and descriptions tasteful. She is fiercely loyal to Hitsugaya and her friends.", "comment": "Roleplay Guidance: Playing Rangiku", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "162", "keys": ["daily life", "slice of life", "what to do", "idle scene", "random event"], "keysecondary": [], "content": "Quick prompts: (1) Yoruichi as a cat 'adopts' {{user}}'s home and refuses to leave until fed milk. (2) Rangiku shows up at Orihime's door with three shopping bags and a hangover, asking to borrow the couch. (3) Orihime's bakery shift: Rangiku 'helps' by eating the merchandise; Yoruichi appears on the windowsill. (4) Hisagi needs Rangiku's overdue 'Many Faces of a Wet Cat' column by tonight. (5) Soi Fon interrogates {{user}} about their connection to Yoruichi-sama. (6) A Hollow interrupts a picnic by the Karakura riverbank. (7) Kisuke's new invention swaps Yoruichi's cat form onto someone else [AU]. (8) Orihime tries to teach Yoruichi to sew; Yoruichi tries to teach Orihime Shunpo.", "comment": "Daily-Life Hooks: Quick Prompts", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}], "created": 0}, {"id": "lb_bleach_outfits", "name": "Bleach - Trang phục", "entries": [{"uid": "0", "keys": ["outfit", "clothes", "bleach outfits"], "keysecondary": [], "content": "This lorebook describes what Orihime Inoue, Yoruichi Shihoin and Rangiku Matsumoto actually wear in Bleach, by arc. Source priority: Tite Kubo's manga first, then the anime (2004-2012) and the Thousand-Year Blood War anime (2022-), then official art. Tags: [Manga], [Anime], [Anime-only filler], [Official art/game art], and [Uncertain] where colors or details vary or were not confirmed. Do not invent new canon outfits; if a scene needs something unshown (e.g. a festival yukata), describe it as a plausible, simple outfit and keep it clearly non-canon. Pick one outfit per character per scene from the era of the story and keep it consistent until the story gives a reason to change. {{user}} leads the story; characters react and dress for the scene, they do not drive the plot.", "comment": "Outfits Lorebook Overview (constant)", "constant": true, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "1", "keys": ["choose outfit", "which outfit", "outfit by arc", "era outfit", "timeline outfit"], "keysecondary": [], "content": "Pick clothing from the era {{user}} has set. Quick map: Agent of the Shinigami (2001, Karakura): Orihime in Karakura High uniform or casual clothes; Yoruichi mostly as a black cat. Soul Society arc: Orihime in simple travel clothes (later a stolen shihakusho disguise); Yoruichi in her orange over-shirt, black backless undershirt and beige sash; Rangiku in her loose shihakusho, pink scarf and necklace. Arrancar arc: Rangiku in a gigai with Karakura High uniform or shopping clothes; Orihime in uniform/casual. Hueco Mundo: Orihime in the white Las Noches dress. Fake Karakura Town: Rangiku in shihakusho; Yoruichi in her standard outfit plus Urahara's Anti-Hierro armor. Lost Agent (17 months later): Rangiku short hair, slit shihakusho; Orihime pins on her collar. TYBW: Yoruichi's orange dress and black boots; Orihime's Urahara-made battle outfit; Rangiku's slit shihakusho. If no era is given, ask through the scene or default to the Arrancar arc.", "comment": "RP Guide: Choosing an Outfit by Arc", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "2", "keys": ["outfit consistency", "consistent outfit", "same outfit", "continuity"], "keysecondary": [], "content": "Once an outfit is described in a scene, keep it the same in later replies: same colors, same accessories, same state (wet, torn, dusty) unless the story changes it. Do not let a character's clothes drift mid-scene (e.g. Rangiku's scarf disappearing, Orihime's hairpins moving, Yoruichi suddenly in a haori). Damage carries over: if a fight tore Orihime's sleeve or burned Yoruichi's back fabric with Shunko, it stays damaged until she changes or Orihime's rejection restores it. Signature items persist across nearly every look: Orihime's blue six-petal hairpins (on her hair, or on her collar in the Lost Agent era), Rangiku's thin gold necklace and pink scarf with her shihakusho, Yoruichi's long black ponytail. Mention clothing briefly and naturally; do not re-describe the whole outfit every message.", "comment": "RP Guide: Consistency Rules", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "3", "keys": ["change clothes", "changing clothes", "new outfit", "get dressed", "wardrobe change"], "keysecondary": [], "content": "Characters may change clothes when the story gives a reason: a time skip, a new location (Soul Society, Hueco Mundo, the beach), weather, a disguise, a ruined outfit, a mission in a gigai, sleeping, or an outing {{user}} proposes. Show the change briefly and off-screen; never describe undressing in detail. In-character habits: Rangiku happily buys and changes into new fashion (she bought seven outfits on one shopping trip in the anime); Orihime will put on whatever is practical or whatever a friend made for her, and gets flustered if it is revealing; Yoruichi is unbothered by clothes and transforms from cat to human with no clothes, so she needs to get dressed immediately (keep it a fade-out joke, with others turning away). After a change, the new outfit becomes the consistent one.", "comment": "RP Guide: Changing Clothes When the Story Calls", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "4", "keys": ["user leads", "story lead", "plot control", "who drives plot", "narration rules"], "keysecondary": [], "content": "{{user}} decides the plot: where the scene goes, which arc it is, time skips, and major events. Orihime, Yoruichi and Rangiku respond in character, describe what they wear when relevant, and may make small natural choices (Rangiku ducking out to shop, Yoruichi stealing someone's snack), but they do not start new arcs, invent battles, or move the story to a new location on their own. Outfit changes follow {{user}}'s scene setting; if {{user}} says 'next morning at the beach', characters show up in beachwear, not before. If the era is unclear, keep clothing neutral and let {{user}} clarify. Never override {{user}}'s description of their own character or the environment.", "comment": "RP Guide: {{user}} Leads the Story", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "5", "keys": ["tasteful", "sfw outfit", "modest description", "fanservice"], "keysecondary": [], "content": "Bleach has fanservice, especially around Rangiku and Yoruichi, but descriptions here stay non-explicit. Describe outfits by cut, color, fabric and how the character carries them: Rangiku's open, loose collar and relaxed posture; Yoruichi's backless, sleeveless stealth gear built for Shunko; Orihime's embarrassment in the TYBW outfit. Do not linger on bodies or describe nudity; Yoruichi's cat-to-human transformations are handled as a gag with a cut-away. Swimwear, bath and sleepwear scenes are described as you would in a general-audience anime: color and style, then move on to the dialogue. Keep it friendly and in-character rather than sexual.", "comment": "RP Guide: Tasteful Description Standards", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "6", "keys": ["filler outfit", "anime only outfit", "official art outfit", "brave souls outfit", "canon outfit"], "keysecondary": [], "content": "Labels used in entries: [Manga] = drawn by Kubo in the manga; [Anime] = the 2004-2012 Studio Pierrot anime following the manga; [Anime-only filler] = filler episodes or omake (e.g. beach episode 228); [TYBW anime] = the 2022+ Thousand-Year Blood War series; [Official art/game art] = promotional illustrations or the licensed game Bleach: Brave Souls (swimsuit, Christmas and New Year costumes), which are not story events. Story scenes should default to Manga/Anime outfits. Filler and game-art outfits are fine for light, slice-of-life or seasonal scenes {{user}} sets up, but describe them loosely and avoid claiming exact designs, since many details were not verified for this lorebook.", "comment": "RP Guide: Canon vs. Filler vs. Official Art", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "7", "keys": ["orihime", "orihime inoue", "inoue", "karakura high", "school uniform", "orihime uniform", "blazer"], "keysecondary": [], "content": "[Manga/Anime] Orihime's default school look in Karakura (Agent of the Shinigami through the Arrancar arc): the Karakura High girls' uniform, a grey blazer and matching grey pleated skirt, a white collared blouse, and a red bow/ribbon at the throat, worn with dark socks and school shoes. She wears it neatly but not stiffly. Her long, waist-length burnt-orange hair falls loose down her back, and her blue six-petal hairpins hold her bangs at the sides. She often carries a school bag and odd homemade lunches (red-bean paste on everything). In the anime the blazer reads as a light grey; exact shade varies between seasons and episodes [Uncertain]. Use for classroom, rooftop lunch, walking home with Tatsuki, or club scenes in the Handicrafts Club.", "comment": "Orihime: Karakura High Winter Uniform", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "8", "keys": ["orihime", "orihime inoue", "inoue", "summer uniform", "short sleeve uniform", "karakura high summer"], "keysecondary": [], "content": "[Manga/Anime] In warm months the girls of Karakura High drop the blazer: Orihime wears the short-sleeved white blouse with the red bow and the grey pleated skirt. This is the look in many early chapters and episodes (the series begins in late spring/summer 2001), e.g. at school while Rukia attends class. Keep the hairpins in her bangs. Some scenes show a sweater vest or the blouse alone [Uncertain which exact days]. Good for hot days, the school rooftop, and the run-up to summer break, when Orihime chats with Rukia and Chizuru about vacation plans. Pairs well with a cheerful, slightly spacey mood.", "comment": "Orihime: Karakura High Summer Uniform", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "9", "keys": ["orihime", "orihime inoue", "inoue", "lost agent", "fullbring", "17 months later", "pins on collar", "senior orihime"], "keysecondary": [], "content": "[Manga ch. 427, 438 / Anime ep. 343+] Seventeen months after Aizen's defeat (2003, age 17), Orihime still wears the Karakura High uniform, but her hair is fuller and wavier, with bangs falling naturally over her forehead and ears. She no longer wears the hairpins in her hair: both blue six-petal pins are clipped onto the left collar of her uniform. In colder scenes of this arc she wears a coat over the uniform (anime ep. 345 profile shows her in a coat; color details [Uncertain]). She works part-time at a bakery and carries bags of leftover bread. Use this look for any Fullbring-arc or early-TYBW school scene.", "comment": "Orihime: Lost Agent School Uniform (17 Months Later)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "10", "keys": ["orihime", "orihime inoue", "inoue", "orihime casual", "casual clothes", "civilian outfit", "everyday clothes"], "keysecondary": [], "content": "[Manga/Anime] Off school, early Orihime dresses simply and cutely: knee-length or longer skirts, long-sleeved tops or light blouses, sometimes an apron at home while cooking. The databook notes she likes Asian flower-print clothing. Exact garments change from episode to episode and are not catalogued; describe them as soft colors, a skirt and a simple top rather than claiming a specific canon piece [Uncertain]. At home in her apartment she keeps a photo of her brother Sora and her teddy bear Enraku nearby. Hairpins always in her bangs. Use for shopping trips, visits to the Urahara Shop, or relaxing at her place.", "comment": "Orihime: Early Casual Clothes (Agent of the Shinigami)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "11", "keys": ["orihime", "orihime inoue", "inoue", "soul society arc", "ryoka", "travel outfit", "orihime soul society"], "keysecondary": [], "content": "[Manga/Anime] For the trip through the Senkaimon/Dangai into Soul Society, Orihime wears her own practical civilian clothes: a long-sleeved top with a skirt, worn with sturdy shoes. Just before leaving she pulls most of her bangs back behind her ears with the hairpins (manga ch. 68), the look she keeps afterwards. Specific colors differ between manga color pages and the anime [Uncertain]; keep it simple and light-colored. During the invasion her clothes get dusty and scuffed; she is bandaged after the Jidanbo/early fights in the anime. She travels with Uryu, Chad, Ichigo and cat-form Yoruichi.", "comment": "Orihime: Soul Society Travel Outfit", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "12", "keys": ["orihime", "orihime inoue", "inoue", "shihakusho disguise", "shinigami disguise", "stolen uniform", "orihime shinigami"], "keysecondary": [], "content": "[Manga/Anime ep. 42] In the Seireitei, Orihime and Uryu knock out two unseated Shinigami and take their black shihakusho to blend in. On Orihime it is the standard Shinigami uniform: black kosode over a white under-robe (shitagi), black hakama, a white tied sash, waraji sandals with white tabi. It is a little ill-fitting, being borrowed, and she has no Zanpakuto. Her orange hair and blue hairpins still make her stand out. Later Uryu makes clothes for the group; the sundress he sewed was given to Rukia [Manga ch. 180-181]. Use for infiltration scenes in the Seireitei.", "comment": "Orihime: Stolen Shihakusho Disguise", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "13", "keys": ["orihime", "orihime inoue", "inoue", "hueco mundo arrival", "dangai", "ulquiorra bracelet", "abduction"], "keysecondary": [], "content": "[Manga/Anime] Orihime is intercepted by Ulquiorra in the Dangai while being escorted back from Soul Society. She is given a bracelet that wraps her in a membrane so only Arrancar can sense her during her twelve hours to say goodbye; she wears it on her wrist with her ordinary clothes. She visits sleeping Ichigo at night in these clothes. On arrival in Las Noches she still wears what she came in, before being given the Arrancar outfit. Exact garments at the moment of abduction vary by medium [Uncertain]. Keep her hairpins in. This is the transition into her captivity look.", "comment": "Orihime: Hueco Mundo Departure & Arrival", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "14", "keys": ["orihime", "orihime inoue", "inoue", "las noches", "white dress", "arrancar outfit", "orihime arrancar", "hueco mundo dress", "captive"], "keysecondary": [], "content": "[Manga ch. ~247-248 / Anime ep. 149+] As Aizen's 'guest', Orihime wears an Arrancar-style outfit: a long white dress with long sleeves, a tall stand-up collar, and black trim/edging along the seams, cuffs and hem in the style of Arrancar uniforms. It is plain, high-necked and floor-length or close to it, worn with simple shoes. The white stands out against Las Noches' dark rooms and endless moonlit sand. She keeps her blue hairpins. In her bare room she sits by the high barred window, often with a meal tray Ulquiorra pressures her to eat. Loly and Menoly later tear at the dress during their assault (keep this non-graphic: torn sleeve and fabric). This is her signature Hueco Mundo captivity look.", "comment": "Orihime: Las Noches White Dress (Arrancar Arc)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "15", "keys": ["orihime", "orihime inoue", "inoue", "hueco mundo look", "orihime captivity", "orihime hollow era", "dome", "fake karakura"], "keysecondary": [], "content": "[Manga/Anime] Orihime's whole stay in Hueco Mundo is the white Las Noches dress; there is no separate Hollow-style costume and she never gains a Hollow mask. As the arc goes on, the dress gets dust from the dome-top battle with Ulquiorra, tears from Loly and Menoly, and smudges from Nnoitra's attack, but stays recognizably white with black trim. She carries no bag. Her face often shows strain and suppressed tears, then resolve. After Ichigo's victory and Aizen's defeat she returns home and goes back to her school uniform and casual clothes. Use the damaged version for late-arc scenes; the clean version for her first days in Las Noches.", "comment": "Orihime: Hueco Mundo Look (Mood & Damage)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "16", "keys": ["orihime", "orihime inoue", "inoue", "hairpins", "hair clips", "hairclip", "shun shun rikka", "six petal", "blue flowers"], "keysecondary": [], "content": "[Manga/Anime] Orihime's two hairpins are pale blue (anime) six-petal flower clips, one each side of her bangs. Sora bought them for her; she called them childish and refused them, then he died the same day, so she wears them every day in his memory and removes them only to sleep (anime ep. 64). They house the six Shun Shun Rikka spirits, two petals each; when a technique is used the petals detach and the hairpin looks bare. In the Lost Agent arc they move to her left collar; in the epilogue they are back in her hair. Before the TYBW final battle Urahara gave them protective covers so they would not break [Klub Outside, Uncertain appearance].", "comment": "Orihime: Hairpins (Shun Shun Rikka)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "17", "keys": ["orihime", "orihime inoue", "inoue", "santen kesshun", "shield", "soten kisshun", "shiten koshun", "koten zanshun"], "keysecondary": [], "content": "[Manga/Anime] Visual effect, not clothing, but it changes how she looks in combat: the spirits fly from the hairpins as small glowing figures. Santen Kesshun is a flat, orange-golden triangular barrier formed by Hinagiku, Baigon and Lily; Soten Kisshun is an oval dome of warm light from Ayame and Shun'o; Shiten Koshun is a four-point reflecting barrier; Koten Zanshun sends Tsubaki as a fast blade of light. While they are out, the petals are missing from her hairpins. Describe her arms outstretched, palms forward, hair stirred by the light. Use with any outfit; it pairs especially with the Las Noches dress and the TYBW battle outfit.", "comment": "Orihime: Santen Kesshun & Shield Visuals", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "18", "keys": ["orihime", "orihime inoue", "inoue", "tybw", "thousand year blood war", "orihime tybw", "urahara outfit", "battle outfit", "quincy blood war"], "keysecondary": [], "content": "[Manga ch. 589 / TYBW anime] For the assault on the Soul King Palace, Urahara made Orihime a new outfit and told her Ichigo would be happy if she wore it. It is a fitted, light-colored battle dress, shorter and more revealing than her usual clothes, worn with boots; Kubo drew it fairly simple. Exact colors and cut differ in official art and should be described loosely [Uncertain]. Ichigo remarks she is showing a lot; she panics and tries to cover up, and Yoruichi slaps Ichigo, saying she was tricked by a 'maniac'. Her hairpins are in her hair. Use from the trip in the replica Kukaku cannon through Wahrwelt and the battle with Yhwach.", "comment": "Orihime: Thousand-Year Blood War Battle Outfit", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "19", "keys": ["orihime", "orihime inoue", "inoue", "tybw early", "quilge", "hueco mundo invasion", "orihime casual tybw"], "keysecondary": [], "content": "[Manga/TYBW anime] Early in TYBW (Karakura Hollow fights, meeting Asguiaro Ebern, the trip to Hueco Mundo against Quilge Opie, training at the Negal Ruins), Orihime wears casual civilian clothes rather than a special costume, with her hairpins back in her hair. The TYBW anime shows a long-sleeved top and skirt combination; exact colors not verified here [Uncertain]. She is badly wounded by Quilge and the clothes are torn and bloodied (keep it non-graphic). Only before the palace assault does she change into Urahara's battle outfit. Official promo art by Kubo for episode 411 shows her in 'normal clothing' [Official art].", "comment": "Orihime: TYBW Early Arc Clothes (Karakura & Hueco Mundo)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "20", "keys": ["orihime", "orihime inoue", "inoue", "epilogue", "orihime kurosaki", "adult orihime", "kazui mother"], "keysecondary": [], "content": "[Manga ch. 686] Ten years after Yhwach's defeat, Orihime Kurosaki (27) wears her long hair tied back with a band and has returned to wearing the blue hairpins in her hair. Her clothes are comfortable, homely adult casual wear: a simple top and skirt or apron suited to running the Kurosaki household with Ichigo and their son Kazui. Exact garments in the single epilogue page are not detailed [Uncertain]. She hosts a reunion when Rukia, Renji and their daughter Ichika visit. Use only when {{user}} sets the scene after the time skip.", "comment": "Orihime: Epilogue Adult Look", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "21", "keys": ["orihime", "orihime inoue", "inoue", "beach", "swimsuit", "bikini", "orihime swimsuit", "summer special"], "keysecondary": [], "content": "[Anime-only filler, ep. 228] In the beach special, the Shinigami Women's Association rents a beach; Orihime, Chad and Uryu are working at the beach shack at Unohana's request. Orihime is in summer beachwear while serving ice and cooking a dubious recipe. Specific swimsuit design and color were not verified [Uncertain]; describe a simple, cute swimsuit or a cover-up with an apron for shack work. In the episode she and Rangiku joke about carrying water, Nanao scolds them, and a Hollow (actually a Research watermelon) grabs her before Soi Fon frees her. Keep the scene comedic and light.", "comment": "Orihime: Beach Episode (Filler)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "22", "keys": ["orihime", "orihime inoue", "inoue", "christmas", "new year", "festival", "yukata", "kimono", "event outfit", "brave souls"], "keysecondary": [], "content": "[Official art/game art: Bleach: Brave Souls] Bleach: Brave Souls released Orihime in two different swimsuit versions, a Christmas outfit and a New Year outfit (the New Year look is a kimono-style costume). These are game event illustrations, not anime story scenes. A festival yukata for Orihime is not confirmed in the anime story by this research [Uncertain]; if {{user}} sets a summer festival, describe a simple floral yukata (fitting her love of flower prints) as non-canon. For a Christmas scene, keep it to a winter coat, scarf and festive colors. Hairpins stay in.", "comment": "Orihime: Swimsuit, Christmas & New Year (Official/Game Art)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "23", "keys": ["orihime", "orihime inoue", "inoue", "sleepwear", "pajamas", "nightwear", "bedtime", "sleeping"], "keysecondary": [], "content": "[Anime ep. 64, details Uncertain] Orihime takes her hairpins off only to sleep, setting them beside her bed; this is the clearest canon fact about her bedtime look. The exact nightclothes are not catalogued here [Uncertain]; describe simple, comfortable pajamas or a loose nightdress in soft colors, hair loose. She lives alone in her apartment, so night scenes are quiet: talking to Sora's photo, Enraku the teddy bear on the shelf. When Rangiku stayed with her during the Arrancar arc, the two shared the apartment (Rangiku bathing there is played for comedy in the anime; keep it off-screen). Non-explicit only.", "comment": "Orihime: Sleepwear (Tasteful)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "24", "keys": ["orihime", "orihime inoue", "inoue", "apron", "cooking", "bakery", "kitchen"], "keysecondary": [], "content": "[Manga/Anime] At home Orihime cooks bizarre combinations (red bean paste with leeks, etc.) and is shown in an apron over her casual clothes. In the Lost Agent arc she works at a bakery and brings Ichigo leftover bread; a bakery uniform look is implied but not detailed [Uncertain]: describe a simple apron and maybe a cap. In the beach filler she works the beach shack. This is a good default when {{user}} visits her apartment or the bakery. Hairpins: in hair (pre-Lost Agent) or on collar (Lost Agent).", "comment": "Orihime: Apron & Cooking Look", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "25", "keys": ["orihime", "orihime inoue", "inoue", "orihime hair", "bangs", "hairstyle", "orange hair"], "keysecondary": [], "content": "[Manga] Childhood: short hair (bullies once cut it). Early series: waist-length burnt-orange hair with a full, parted fringe. From the Soul Society trip on: bangs tucked behind her ears with the hairpins. Lost Agent: fuller, wavier hair, bangs falling naturally over forehead and ears, pins on the collar. Epilogue: hair tied back with a band, pins back in. Eyes are brown in the manga and grey/silver in the anime. Match the hair to the outfit's era so the look stays coherent.", "comment": "Orihime: Hair Styles by Era", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "26", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "cat form", "black cat", "yoruichi cat", "talking cat"], "keysecondary": [], "content": "[Manga/Anime] For much of the early story Yoruichi appears as a small black cat with golden eyes and a deep male-sounding voice (because she has used the form so long). No clothing; sometimes she rides on a shoulder or sits on the Urahara Shop counter. She guides Orihime, Chad, Ichigo and Uryu to Soul Society as a cat and trains Orihime and Chad in an abandoned warehouse. When she transforms back to human she has no clothes; this is a recurring gag (Ichigo's horror in the training cave). Handle with a cut-away and have her pull on her outfit immediately. In TYBW she notes she can still become a cat when the cannon launches.", "comment": "Yoruichi: Black Cat Form", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "27", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "orange outfit", "orange shirt", "standard outfit", "yoruichi soul society", "stealth outfit"], "keysecondary": [], "content": "[Manga ch. 116-118 / Anime] Her iconic human look (Soul Society through Arrancar arcs): a black, backless, sleeveless undershirt; over it a short orange over-shirt with two white straps on each shoulder (the white trim); a broad beige sash tied at the waist; black form-fitting stretch pants; light brown, lightweight shoes made for stealth and Shunpo. Long black hair in a high ponytail with chin-length bangs framing her face; dark skin, golden eyes. The backless design is deliberate, from the Onmitsukido executive attire built for Shunko. She wears no Zanpakuto. Use for any Soul Society or Karakura scene after her reveal.", "comment": "Yoruichi: Exile Standard Outfit (Orange Over-shirt)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "28", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "neck warmer", "wrist warmers", "leg warmers", "mask", "bands"], "keysecondary": [], "content": "[Manga ch. 153 / Anime] Early in the Soul Society arc Yoruichi adds a beige neck warmer that she can pull up over her nose and mouth to hide her identity (e.g. when she snatches Ichigo away from the execution grounds and against Soi Fon); she later stops using it. She also sometimes wears long beige wrist warmers and leg warmers, each secured with bands, over the standard orange outfit. Use the neck warmer for stealth or infiltration scenes set in the Soul Society arc; omit it in later arcs. Combine with Shunpo vanishing acts.", "comment": "Yoruichi: Neck Warmer & Leg/Arm Warmers", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "29", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "captain yoruichi", "2nd division captain", "haori", "turn back the pendulum", "onmitsukido commander"], "keysecondary": [], "content": "[Manga ch. 159, -107 / Anime ep. 206+] As 2nd Division captain and Onmitsukido commander about 110 years before the story, Yoruichi wore the sleeveless, backless Onmitsukido executive uniform with long black wrist guards (the ones Soi Fon wears now), a black ribbon tied at the neck, and a long-sleeved white captain's haori over it. Her hair was much shorter, a bob similar to Soi Fon's current cut but without the braids. She carried a short Zanpakuto horizontally at the small of her back. Soi Fon, then her young bodyguard, idolized her. Use for Turn Back the Pendulum flashbacks.", "comment": "Yoruichi: 2nd Division Captain Era (110 Years Ago)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "30", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "corrections corps", "white uniform", "young yoruichi", "detention unit"], "keysecondary": [], "content": "[Manga ch. 130] Before becoming captain, Yoruichi served in the Onmitsukido's Corrections Corps (Detention Unit), whose uniform is white. In flashback she is shown with Kisuke Urahara, who was assigned to the unit. Details of the exact cut are limited [Uncertain]; describe a white, close-fitting Onmitsukido-style uniform. Hair short. Use only for deep-past flashbacks that {{user}} explicitly sets, e.g. young Yoruichi and Kisuke as childhood friends in the Shihoin mansion and secret training ground. In roleplay, this look signals a much younger, more disciplined Yoruichi still inside the noble and military system she later abandons; her teasing personality is already present.", "comment": "Yoruichi: Corrections Corps White Uniform", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "31", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "shihoin clan", "princess", "noble robes", "clan head", "mansion"], "keysecondary": [], "content": "[Klub Outside / Uncertain] Yoruichi is the former 22nd head of the Shihoin clan, one of the Four Great Noble Houses, and grew up as a princess in the Shihoin Mansion. Formal noble robes are implied but not drawn in detail in the main story [Uncertain]; do not invent a specific canon kimono. If {{user}} stages a clan ceremony, describe layered formal kimono in Shihoin colors with Yoruichi visibly impatient and itching to escape; this is in character. Her brother Yushiro is the current clan head. Shihoin treasures (Tentoken mantle, Tenshintai, Ryukotsujo) bear the clan crest.", "comment": "Yoruichi: Shihoin Noble Attire", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "32", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "shunko", "flash war cry", "shunko armor", "kido aura", "shunko yoruichi"], "keysecondary": [], "content": "[Manga ch. 158 / Anime] Shunko charges Kido into her back and shoulders while she fights with Hakuda. Visually: a white-blue, crackling aura of compressed reiatsu bursting from her back and arms, wind blasting around her; the fabric there would shred, which is why her outfits are backless and sleeveless. When she first used it against Soi Fon she was in her orange over-shirt, which she lost in the clash, ending in the black backless undershirt; Ichigo had to look away [keep tasteful]. Her ponytail whips in the gale. Use during intense melee only.", "comment": "Yoruichi: Shunko Look", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "33", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "anti hierro armor", "armor", "gauntlet", "leg armor", "aizen fight", "fake karakura"], "keysecondary": [], "content": "[Manga ch. 400-403 / Anime] In the battle against Aizen in Fake Karakura Town, Yoruichi arrives with Urahara and wears Anti-Hierro Armor he made: large, heavy gauntlets/arm guards and leg armor (greaves) over her standard orange-and-black outfit, built to break hardened skin like Hierro. It is 'half-finished' by her complaint. She cracks Aizen's first form with a barrage of ultra-fast punches; Aizen destroys the armor on her left leg, and later she loses the right arm-guard. Describe dark metallic armored limbs. Use only in that battle or a scene modeled on it.", "comment": "Yoruichi: Anti-Hierro Armor (Fake Karakura vs Aizen)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "34", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "arrancar arc yoruichi", "yoruichi arrancar", "winter war", "urahara shop"], "keysecondary": [], "content": "[Manga/Anime] Yoruichi does not go to Hueco Mundo in the Arrancar arc; she stays around Karakura and the Urahara Shop, in her standard orange over-shirt, black backless undershirt, beige sash, black pants and light shoes, or as a cat. She rescues Orihime and others after Yammy's attack and treats her injuries, then joins the Fake Karakura battle in Anti-Hierro armor. Anime filler during this era shows her in the same outfit (and in a gigai at the beach filler). Treat 'Hueco Mundo era Yoruichi' as this standard outfit unless {{user}} sets something else.", "comment": "Yoruichi: Hueco Mundo / Arrancar Arc Appearances", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "35", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "tybw", "thousand year blood war", "yoruichi tybw", "orange dress", "thigh boots", "leotard"], "keysecondary": [], "content": "[Manga ch. 656 / TYBW anime] In TYBW, Yoruichi wears a short orange dress over a black leotard, with black arm warmers and black thigh-length boots; her hair is still in a long black ponytail. She arrives at the 12th Division wearing a cloak that hides bottles of energy collected with Hiyori's team (reveal under the cloak). In this outfit she slaps Ichigo over Orihime's clothes, rides the replica Kukaku cannon to the Soul King Palace, binds Yhwach with Shihoin treasures, loses an arm to Pernida (restored by Orihime), and fights Askin Nakk Le Vaar with Yushiro. Exact shades in the TYBW anime may vary slightly [Uncertain].", "comment": "Yoruichi: Thousand-Year Blood War Outfit", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "36", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "cloak", "energy bottles", "hiyori team"], "keysecondary": [], "content": "[Manga ch. 589 / TYBW anime] When Yoruichi reunites with Urahara's group at the 12th Division, she wears a full-length cloak over her TYBW outfit. She opens it to show a set of bottles fastened inside, filled with the energy she and Hiyori's team collected by closing the distortions between worlds. The cloak's exact color is not verified here [Uncertain]; describe a plain traveling cloak. She drops it once the action starts. Useful for an arrival scene: mysterious silhouette, then a grin and the reveal.", "comment": "Yoruichi: TYBW Cloak", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "37", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "raiju senkei", "thunder beast", "lightning form", "shunryu kokubyo senki", "askin fight"], "keysecondary": [], "content": "[Manga ch. 656-657 / TYBW anime] Against Askin, Yoruichi unleashes Shunko: Raiju Senkei 'Shunryu Kokubyo Senki' (Flash God Black Cat Warrior Princess), becoming clad in lightning-like reiatsu. Her appearance turns feral and catlike: lightning crackling over her body, her hair grown long and wild, claws/feline traits. Hair color shown pale or white in color art [Uncertain]. It is draining and she is weakened afterward. Describe it as a crackling, beastly glow over her TYBW outfit, used only at the peak of a battle.", "comment": "Yoruichi: Shunko Raiju Senkei (Thunder Beast Form)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "38", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "earrings", "hair tie", "ponytail", "yoruichi accessories"], "keysecondary": [], "content": "[Manga/Anime, partly Uncertain] Yoruichi's hair is tied in a long high ponytail with a simple band/tie; chin-length bangs frame the face. She does not carry a Zanpakuto in the present day. Some art shows small earrings, but this lorebook could not confirm a consistent canon earring design [Uncertain]; if used, keep them small and plain. Her accessories are functional: wrist/leg warmers, the neck warmer in the Soul Society arc, the black ribbon at her neck in the captain era, and Shihoin tools (Tentoken mantle, Ryukotsujo staff). Golden eyes and confident grin are her real signature.", "comment": "Yoruichi: Earrings, Hair Tie & Accessories", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "39", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "tentoken", "mantle", "ryukotsujo", "tenshintai", "shihoin treasures"], "keysecondary": [], "content": "[Manga/Anime] Items Yoruichi wears or carries: the Tentoken, a brown mantle with the Shihoin crest that lets the wearer fly (she lends it to Ichigo to cross Sokyoku Hill); the Ryukotsujo, a beige bone staff with a bird skull that sprouts a wing for gliding; the Tenshintai, a large white doll for Bankai training. In TYBW she uses Shihoin sealing treasures to bind Yhwach (Hissaki Kumoi). Describe these over her current outfit only when the scene calls for them. Remember that lending these treasures is a big deal for a Shihoin, and Yoruichi does it casually.", "comment": "Yoruichi: Tentoken Mantle & Shihoin Tools (Worn Items)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "40", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "hot spring", "onsen", "healing spring", "training cave", "bath"], "keysecondary": [], "content": "[Manga/Anime, Soul Society arc] Beneath Sokyoku Hill lies a secret training ground Yoruichi and Kisuke made as children, with a healing hot spring. During Ichigo's Bankai training she relaxes in it and teases Ichigo, who is mortified. Keep this purely comedic and non-explicit: steam, her head and shoulders above the water, Ichigo turning red and fleeing. Afterward she dresses in her orange over-shirt outfit. No dedicated swimsuit is worn here. This is the main canon 'hot spring' moment for any of the three characters covered.", "comment": "Yoruichi: Hot Spring (Training Grounds)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "41", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "beach", "swimsuit", "bikini", "yoruichi swimsuit", "summer special"], "keysecondary": [], "content": "[Anime-only filler, ep. 228] While the Shinigami Women's Association shops for swimsuits, Yoruichi picks an orange and green bikini for herself and a pink swimsuit for a horrified Soi Fon, then buys it for her before she can object. At the beach she and Soi Fon leave early on a fishing trip (chasing a shark), then return to kick through a Hollow-like watermelon attacking Ichigo. Describe the orange-and-green swimwear briefly and move on; she is relaxed, playful and athletic. Brave Souls also released Yoruichi event art, not verified here [Uncertain].", "comment": "Yoruichi: Beach Episode (Filler)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "42", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "christmas", "new year", "festival", "yukata", "kimono", "event outfit"], "keysecondary": [], "content": "[Uncertain] No Christmas, festival yukata or New Year kimono scene for Yoruichi was confirmed in the anime story during this research. Bleach: Brave Souls has many seasonal costumes for characters, but Yoruichi-specific ones were not verified here. If {{user}} sets such a scene, describe it as non-canon and in character: a loosely worn yukata she can move in, sleeves tied back, eating festival food and teasing Ichigo or Soi Fon; or a casual winter coat. Avoid claiming a specific official design.", "comment": "Yoruichi: Christmas, New Year & Festival", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "43", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "sleepwear", "sleeping", "lounging", "nap"], "keysecondary": [], "content": "[Uncertain] Canon shows Yoruichi sleeping or lounging mostly as a cat curled up at the Urahara Shop. No specific human-form nightwear is catalogued [Uncertain]. If a scene needs it, keep it simple and non-explicit: a loose yukata-style robe or her black undershirt and pants, ponytail undone, sprawled lazily. She naps catlike in sunbeams. Her teasing nature should come through in dialogue, not description of her body. If {{user}} wakes her, she stretches like a cat, yawns, and immediately starts teasing; she is never self-conscious about how she looks first thing in the morning, which other characters find unsettling.", "comment": "Yoruichi: Sleepwear / Lounging (Tasteful)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "44", "keys": ["yoruichi", "yoruichi shihoin", "shihoin", "soi fon", "suifeng", "onmitsukido uniform", "keisen shozoku"], "keysecondary": [], "content": "[Manga/Anime] Soi Fon wears today what Yoruichi wore as captain: the backless, sleeveless Onmitsukido executive attire (Keisen Shozoku) with long black wrist guards, plus a sleeveless captain's haori. Use her as a visual mirror: when they fight in the Soul Society arc both wear backless gear for Shunko, and Yoruichi's orange over-shirt flies off. Soi Fon adores 'Yoruichi-sama' and is flustered by her clothing choices (e.g. the pink swimsuit Yoruichi buys her in ep. 228). In roleplay, Soi Fon commenting on Yoruichi's outfit (with admiration or embarrassment) is an easy in-character beat, and Yoruichi responds by teasing her mercilessly.", "comment": "Yoruichi: Soi Fon Contrast", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "45", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "shihakusho", "shinigami uniform", "rangiku uniform", "10th division", "lieutenant"], "keysecondary": [], "content": "[Manga/Anime] Rangiku's default look: the black Shinigami shihakusho (black kosode over a white shitagi, black hakama, white tabi and waraji) worn loose, the collar left open lower than regulation. Her 10th Division lieutenant's badge is worn tied on her sash rather than on her arm. A long pink scarf drapes over her shoulders, and a thin gold necklace sits at her collarbone. Haineko is worn at her back. Long, wavy golden-blonde hair (strawberry-blonde in the anime), blue eyes, a beauty mark below the right side of her mouth. Default for Soul Society, Arrancar and Fake Karakura battle scenes.", "comment": "Rangiku: Standard Shihakusho (Lieutenant)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "46", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "pink scarf", "scarf", "shawl"], "keysecondary": [], "content": "[Manga/Anime] Rangiku's long pink scarf/shawl is worn draped loosely across her shoulders and upper arms over her shihakusho, not tied. It drifts dramatically in Shunpo and in Haineko's ash clouds. About twenty years before the story (under Captain Isshin), she wore a scarf tied in a knot around her neck instead. It is her most recognizable accessory after her hair; keep it on in every shihakusho scene unless the story tears or removes it. In a gigai she usually wears modern clothes without it.", "comment": "Rangiku: Pink Scarf", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "47", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "necklace", "gold necklace", "pendant", "gin necklace"], "keysecondary": [], "content": "[Manga/Anime] Rangiku wears a thin gold chain necklace with every look, visible at her open collar. Canon never explains its origin. In their last moments Gin touches it, so fans link it to him and to the stolen piece of her soul; treat any backstory as headcanon, not canon. Describe it as a fine gold chain that catches the light, and maybe Rangiku touching it absently in a quiet moment thinking about Gin. Do not remove it in casual gigai outfits either; it is one of the few items that crosses every era. If it is ever lost or damaged in a scene, Rangiku would react strongly and search for it, which is a meaningful emotional beat.", "comment": "Rangiku: Gold Necklace", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "48", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "rangiku hair", "blonde hair", "short hair", "hairstyle"], "keysecondary": [], "content": "[Manga ch. 529, 489, 685] Twenty years earlier (under Isshin): shoulder-length hair. Main story (Soul Society to Fake Karakura): long, wavy golden-blonde hair past her shoulders. Lost Agent and TYBW (17 months later): a shorter cut stopping above the shoulders, curling near the chin, with the left side hanging over her face. Epilogue (10 years after Yhwach): grown out again to her upper back. The anime colors it strawberry/orange-blonde; the manga says blonde. Match hair to the outfit era. Her beauty mark under the right side of her mouth and blue eyes stay constant across eras, as do the pink scarf and gold necklace with her uniform.", "comment": "Rangiku: Hair by Era", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "49", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "isshin shiba", "20 years ago", "young rangiku", "flashback"], "keysecondary": [], "content": "[Manga ch. 529 / Anime ep. 377] As lieutenant to Captain Isshin Shiba about twenty years before the story, Rangiku wore the standard shihakusho, shoulder-length hair, and her scarf tied in a knot around her neck. Hitsugaya was 3rd seat. She scolds Isshin for skipping paperwork while dodging her own, and protests when he leaves to investigate Naruki City. Use only for that flashback era. Her personality is the same breezy, sake-loving slacker; only the hair and scarf styling mark the era. Present-day characters do not wear this look, so keep it to flashbacks {{user}} requests explicitly.", "comment": "Rangiku: Under Captain Isshin (20 Years Ago)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "50", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "rukongai", "child rangiku", "gin childhood", "starving"], "keysecondary": [], "content": "[Manga/Anime ep. 47] As a starving child in the Rukongai, Rangiku wore a ragged, plain kimono; Gin found her collapsed and fed her dried persimmons. Keep it brief and sad: patched clothes, bare feet, hungry. Her birthday, September 29, is the day they met. Use only for flashbacks. Gin, also a child, wears similarly ragged clothes. Rangiku does not dress like this in any present-day scene; if {{user}} wants a Rukongai visit, she wears her shihakusho and may grow quiet, remembering. Keep the tone gentle and avoid melodrama unless {{user}} leads there.", "comment": "Rangiku: Childhood Rukongai Rags", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "51", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "karakura high", "school uniform", "rangiku uniform school", "gigai"], "keysecondary": [], "content": "[Manga/Anime ep. 114-116] When Hitsugaya's advance team is sent to Karakura, Rangiku enters Karakura High in a gigai and wears the girls' uniform (grey blazer/skirt, white blouse, red bow) with several blouse buttons undone, which wrecks Keigo. Her long hair is loose; necklace on, scarf usually off. She punches Kon without looking and tries to talk Ichigo into letting her stay at his house before moving in with Orihime. Keep it comedic. She treats school as a holiday, skipping class to shop or nap, and drags Hitsugaya (who also wears the boys' uniform, sulking) along. The uniform is only for this arc; when the Arrancar attack, she leaves the gigai and fights in her shihakusho.", "comment": "Rangiku: Karakura High Uniform (Arrancar Arc)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "52", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "casual", "shopping", "gigai clothes", "fashion", "rangiku casual"], "keysecondary": [], "content": "[Manga/Anime ep. 128] In the Human World Rangiku loves department stores and fashion; in one anime episode she buys seven different outfits in a single trip. She dresses either stylishly or boldly: fitted modern tops, short skirts or jeans, heels, sunglasses. Exact garments vary and are not catalogued [Uncertain]; describe trendy outfits she clearly enjoys showing off. She carries shopping bags everywhere. Kubo's official promo art for anime episode 381 shows Rangiku in 'normal clothing' [Official art]. In roleplay she may insist on a shopping trip or drag Orihime along, but only within the scene {{user}} sets; she does not move the story to a new location on her own. Her clothes reflect her mood: playful and glamorous.", "comment": "Rangiku: Gigai Casual & Shopping Outfits", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "53", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "arrancar arc", "winter war", "fake karakura", "limiter", "gentei reijin"], "keysecondary": [], "content": "[Manga/Anime] In the Arrancar arc fights (vs Arrancar in Karakura; the Fake Karakura Town battle with Harribel's Fraccion), Rangiku wears her standard loose shihakusho, pink scarf, and necklace. When fighting in the Human World under Gentei Reijin, her limiter is a 10th Division flower mark on her chest, released by Gentei Kaijo [Uncertain placement detail]. In Fake Karakura her clothes get scorched and torn by Ayon's attack (non-graphic). Haineko's ash clouds swirl around her. Hitsugaya fights alongside her in this era, and she lends support to Kira and Hisagi against Harribel's Fraccion before going after Gin. Keep the outfit consistent through the battle, adding damage as it happens.", "comment": "Rangiku: Arrancar Arc / Winter War Battle Look", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "54", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "haineko", "ash", "shikai", "growl haineko"], "keysecondary": [], "content": "[Manga/Anime] 'Growl, Haineko': her sword's blade dissolves into a cloud of fine grey ash she controls with the hilt, slicing anything it settles on. Visually, ash swirls around her, catching her scarf and hair. Not clothing, but it frames every battle look. The anime-only Haineko spirit appears as a cat-like young woman with wavy hair [Anime-only filler]. In the shikai she no longer holds a blade, only the hilt and guard, and the ash obeys her gestures. Describe the ash swirling around her pink scarf and blonde hair for vivid combat imagery, but keep her uniform unchanged.", "comment": "Rangiku: Haineko Shikai Visuals", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "55", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "tybw", "thousand year blood war", "rangiku tybw", "slit", "lost agent"], "keysecondary": [], "content": "[Manga ch. 497 / TYBW anime] From the Lost Agent arc on, Rangiku's shihakusho has a split along the length of her right leg, still worn loose and open at the collar with the pink scarf and necklace. Her hair is short. This is her look throughout the TYBW anime: Bazz-B's invasion with Hitsugaya, the Tenteikura relay where she draws on her arms, and the Hitsugaya-defend scenes. Details in the TYBW anime match the manga. In early TYBW she also uses Kido more seriously, drawing reishi lines along her arms for Bakudo #77 Tenteikura to relay a message to every Shinigami, which is a striking image with this outfit.", "comment": "Rangiku: Lost Agent / TYBW Slit Shihakusho", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "56", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "zombie", "giselle", "zombified rangiku", "mayuri"], "keysecondary": [], "content": "[Manga / TYBW anime ep. 389] After falling in the battle against the Sternritter women (Bambietta, Giselle and their group) and being turned into a zombie by Giselle Gewelle [attacker detail Uncertain], Rangiku appears with pale grey skin, dark circles and blank eyes, still in her torn TYBW shihakusho. She fights Mayuri alongside zombified Kensei and Rose. Mayuri later restores her. Keep it eerie, not gory; use only for that arc. After Mayuri restores her she returns to her normal TYBW appearance. Do not use this look outside that arc unless {{user}} specifically asks for it; it should feel unsettling and sad, since Hitsugaya was also zombified.", "comment": "Rangiku: TYBW Zombie Look", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "57", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "epilogue", "10 years later", "adult rangiku"], "keysecondary": [], "content": "[Manga ch. 685] Ten years after Yhwach's defeat, Rangiku's hair has grown back to her upper back. She still serves in the 10th Division in shihakusho with the pink scarf and necklace. Use only if {{user}} sets a post-epilogue scene. Her personality is unchanged: still teasing Hitsugaya, still dodging paperwork, now a little more mature and serene. Exact epilogue clothing is not drawn in detail beyond her hair and uniform [Uncertain], so keep it to the standard shihakusho with her signature scarf and necklace, and avoid inventing a new costume.", "comment": "Rangiku: Epilogue Look", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "58", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "beach", "swimsuit", "bikini", "rangiku swimsuit", "summer special"], "keysecondary": [], "content": "[Anime-only filler, ep. 228] Rangiku shops for swimwear with the Shinigami Women's Association, teases Nanao, then at the beach wears a bikini (design not verified [Uncertain]) and pulls a comedic prank on Nanao. She drops in on Hitsugaya in the beach shack. She also once gave Nanao a bikini as a gift [Anime ep. 97]. Keep it light and comic. Hitsugaya refuses to join because he hates the heat and eats ice cream in the shack. Rangiku coaxes him to come out. Swimwear descriptions should be short and colorful, then move on to dialogue and comedy, keeping everything general-audience.", "comment": "Rangiku: Beach Episode (Filler)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "59", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "bath", "bathing", "orihime apartment", "towel"], "keysecondary": [], "content": "[Manga/Anime ep. 116] Rangiku bathes at Orihime's apartment during the Arrancar arc, comfortable and chatty, then comforts Orihime about her worries. Keep it non-explicit: steam, a towel, wet hair; describe conversation, not body. Afterward she lounges in borrowed clothes. This is the main canon 'bath' moment for her. The scene emphasizes friendship: Rangiku noticing Orihime's sadness and teasing her gently out of it. If {{user}} sets a similar evening, keep focus on that warmth; Rangiku may borrow Orihime's clothes or pajamas, which fit her poorly, for light comedy.", "comment": "Rangiku: Bath Scene at Orihime's (Tasteful)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "60", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "christmas", "winter clothes", "new year", "lunar new year", "festival", "yukata", "kimono", "event outfit"], "keysecondary": [], "content": "[Official art/game art: Bleach: Brave Souls] Brave Souls released Rangiku art in winter clothing (Christmas), two different swimsuits, and a Lunar New Year outfit. These are not anime story scenes. A festival yukata for Rangiku was not confirmed in the anime story [Uncertain]; if {{user}} sets one, describe a stylish yukata worn loosely, with sake and festival food, as non-canon. For Christmas or winter scenes set by {{user}}, describe a fashionable coat, scarf and boots on her gigai, possibly with shopping bags. She would treat any holiday as an excuse to drink and celebrate with friends. Keep all designs loose and clearly marked as non-canon in-story.", "comment": "Rangiku: Christmas, Winter & New Year (Official/Game Art)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "61", "keys": ["rangiku", "rangiku matsumoto", "matsumoto", "sleepwear", "pajamas", "sleeping", "hangover", "lounging"], "keysecondary": [], "content": "[Uncertain] Rangiku is often shown napping on the 10th Division office couch in her shihakusho, dodging paperwork, or hungover after drinking with Shunsui, Kira and Hisagi. No specific nightwear is catalogued [Uncertain]. If needed, describe a loose yukata robe or comfy clothes borrowed from Orihime, hair messy. Non-explicit only. She grumbles about mornings, needs water or tea, and blames Shunsui for the hangover. Describe her messy hair and rumpled clothes humorously, not suggestively. If she stays over at Orihime's, she sleeps on a futon there.", "comment": "Rangiku: Sleepwear / Lounging (Tasteful)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "62", "keys": ["orihime", "yoruichi", "rangiku", "shihakusho", "shinigami uniform", "kosode", "hakama", "obi", "sash"], "keysecondary": [], "content": "[Manga/Anime] Standard Shinigami uniform: a white under-robe (shitagi) beneath a black kosode with wide sleeves, black hakama, a sash (obi) at the waist, white tabi and straw waraji sandals. Lieutenants wear a badge on the upper arm; Rangiku ties hers on her sash. Captains add a white haori with their division number. Ties at the back of the hakama. Rangiku wears it open at the collar; Orihime borrowed one as a disguise; Yoruichi, as Onmitsukido commander, wore backless executive gear instead.", "comment": "Shared: Shinigami Shihakusho Structure", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "63", "keys": ["orihime", "yoruichi", "rangiku", "karakura high", "school uniform", "uniform"], "keysecondary": [], "content": "[Manga/Anime] Grey blazer and grey pleated skirt, white blouse, red bow at the collar; summer version is a short-sleeved white blouse. Worn by Orihime (all school arcs) and Rangiku (Arrancar arc, in a gigai, buttons undone). Yoruichi never attends school. Male students wear grey trousers, a grey blazer and white shirt. Orihime wears the uniform neatly; in the Lost Agent arc she clips her hairpins onto her left collar. Rangiku's version has her blouse unbuttoned noticeably, a comedic point in the anime. Hitsugaya, Ikkaku, Yumichika and Renji also attended in gigai, each wearing it badly in their own way.", "comment": "Shared: Karakura High Girls' Uniform", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "64", "keys": ["orihime", "yoruichi", "rangiku", "shinigami women's association", "swmca", "women's association", "event"], "keysecondary": [], "content": "[Anime filler & omake] The Shinigami Women's Association (Yachiru as president, Nanao as vice-president, Rangiku active; later Rangiku leads it per Klub Outside) organizes events: the beach trip in ep. 228 (swimsuits, Yoruichi and Soi Fon along), photo books, secret meeting rooms. Orihime appears as a guest. Good backdrop for light, event-based outfit scenes set by {{user}}. Use the association as an anchor for light seasonal outfits like beachwear, but keep each character in her established style: Yoruichi athletic and relaxed, Rangiku glamorous and teasing, Orihime cheerful and a little clumsy.", "comment": "Shared: Shinigami Women's Association Events", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "65", "keys": ["orihime", "yoruichi", "rangiku", "tybw", "soul king palace", "royal palace", "cannon"], "keysecondary": [], "content": "[Manga/TYBW anime] When the group launches to the Soul King Palace in the replica Kukaku cannon: Orihime in Urahara's battle outfit, Yoruichi in her orange dress, black leotard, arm warmers and thigh boots (cloak dropped), Ichigo, Chad and Ganju alongside. Rangiku stays in Seireitei in her slit shihakusho. Use this snapshot to keep costumes consistent in palace and Wahrwelt scenes. In Wahrwelt, Yoruichi's arm is restored by Orihime, and Orihime's outfit grows battle-worn. Keep costumes stable through those battles; only torn fabric and dirt change. Uryu, Ganju and Chad also join this phase.", "comment": "Shared: TYBW Group Look (Royal Palace)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "66", "keys": ["orihime", "yoruichi", "rangiku", "fake karakura", "winter war", "aizen"], "keysecondary": [], "content": "[Manga/Anime] During the Fake Karakura battle: Rangiku in shihakusho and scarf fighting Harribel's Fraccion, then confronting Gin; Yoruichi arrives later in Anti-Hierro armor over her orange outfit; Orihime is still in Hueco Mundo in the white Las Noches dress until after Aizen's defeat. Use for that battle's continuity. Keep each character in the right place: Orihime should not appear in Fake Karakura until the battle is over, and Yoruichi arrives late, after Urahara. Rangiku is injured by Ayon and later by Aizen's deception around Gin.", "comment": "Shared: Fake Karakura Town Snapshot", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "67", "keys": ["orihime", "yoruichi", "rangiku", "torn clothes", "damaged outfit", "healing", "soten kisshun repair"], "keysecondary": [], "content": "[Manga/Anime] Battles damage clothing: Yoruichi's orange top lost to Shunko, her Anti-Hierro armor shattered, Orihime's dress torn by Loly, Rangiku's uniform scorched in Fake Karakura. Orihime's Soten Kisshun rejects injuries and can restore objects (she restored Grimmjow's arm and Yoruichi's arm); whether it restores clothing is not stated [Uncertain]. Keep damage consistent until the story changes it. If {{user}} wants clothes repaired, Uryu sewing them or a change of clothes are safer in-canon solutions. Characters notice damage, especially Orihime, who is embarrassed by tears in her clothes.", "comment": "Shared: Damage, Dirt & Healing", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "68", "keys": ["orihime", "yoruichi", "rangiku", "winter", "rain", "cold", "coat", "umbrella", "summer"], "keysecondary": [], "content": "[RP guidance] Canon shows coats and umbrellas when weather matters (Orihime in a coat in the Lost Agent arc; Tatsuki lending her an umbrella). For scenes {{user}} sets in winter or rain, add a coat, scarf or umbrella to the era-appropriate look without replacing signature items. Shinigami rarely change clothes for weather. Yoruichi as a cat just shakes off the rain. In summer, the Karakura High summer uniform or light casual wear fits. Rangiku in a gigai happily buys seasonal outfits. Keep signature items in every season.", "comment": "Shared: Seasonal & Weather Adjustments", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "69", "keys": ["orihime", "yoruichi", "rangiku", "gigai", "spirit form", "human world"], "keysecondary": [], "content": "[Manga/Anime] In the Human World, Shinigami like Rangiku use gigai (artificial bodies) and wear normal clothes; in spirit form they wear shihakusho, invisible to ordinary people. Yoruichi in the Human World wears her normal outfit. Orihime is human and always visible. Use this to decide what Rangiku wears in Karakura. Rangiku switches easily: leaving her gigai sitting somewhere or with soul candy inside, she appears in her shihakusho to fight. Orihime cannot switch; she is always in her physical clothing. Yoruichi does not use a gigai in most scenes, appearing in her own outfit or as a cat.", "comment": "Shared: Gigai vs Spirit Form", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}], "created": 0}, {"id": "lb_slime_world", "name": "Tensura - World", "entries": [{"uid": "0", "keys": ["Tensura", "Tensei Slime", "Reincarnated as a Slime", "roleplay style", "tone", "slime setting"], "keysecondary": [], "content": "That Time I Got Reincarnated as a Slime (Tensei Shitara Slime Datta Ken, 'TenSura'; web novel and light novel by Fuse, art by Mitz Vah; anime by 8bit, Season 1 2018-19, Season 2 2021, Season 3 2024, plus the film Scarlet Bond and OVAs) is a cheerful isekai mixing adventure, nation-building, politics and overpowered fantasy battles. Tone: warm, comedic and cozy most of the time (feasts, hot springs, banter, subordinates competing for Rimuru's praise), punctuated by sudden, deadly serious crises (the Tempest massacre, the Orc Disaster, wars of nations and gods). Narration often includes Rimuru's snarky inner monologue and the dry, formal replies of his skill Great Sage/Raphael ('Notice.' 'Answer.' 'Affirmative.'). The World Language (Voice of the World) announces evolutions and skill acquisitions in a flat system-message voice. Characters call out skill names ('Black Flame!', 'Megiddo!', 'Drago Nova!'). Respect the hierarchy of power (see Power Scaling entry), the importance of names and loyalty, and Rimuru's core values: coexistence of humans and monsters, protecting friends, good food and fun. Keep content SFW: battles can be intense and lethal, but avoid gore excess and sexual content.", "comment": "Roleplay Tone & Style Guide", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "1", "keys": ["web novel", "light novel", "WN", "LN", "canon", "anime season", "manga", "Scarlet Bond", "Coleus", "spoiler"], "keysecondary": [], "content": "Sources: (1) Web Novel (WN, Shousetsuka ni Narou, 2013-2016) - the original, shorter and faster; (2) Light Novel (LN, GC Novels, 2014 onward, about 23 volumes) - heavily rewritten and expanded, the primary canon for this lorebook; (3) Manga by Taiki Kawakami (follows the LN closely); (4) Anime: Season 1 (LN vol 1-4), Season 2 (vol 5-6: Tempest massacre, Rimuru's awakening, Walpurgis), Season 3 (vol 6-8: Hinata and the Holy Church, the Founding Festival, the Dungeon); a fourth season continues beyond (treat as beyond the scope of this lorebook). Side media: film 'Scarlet Bond' (anime-original, Kingdom of Raja), OVA 'Visions of Coleus', spin-offs 'The Slime Diaries', 'Clayman Revenge' (a what-if manga) - non-canon to the main plot. Main differences: the LN adds or expands many characters and arcs (the Dungeon, the Founding Festival, Masayuki, the Three Primordial girls' recruitment scenes, Rozzo family schemes) and changes event order and outcomes from vol 6 onward; the WN is terser, Ciel's personality emerges differently, several fights end differently, and its final arc (Yuuki as final antagonist, Rimuru's journey through time) is resolved more briefly. Anime-original material includes recap 'Veldora's Journal' episodes and expanded slice-of-life scenes. When versions conflict, follow the LN unless the user specifies otherwise.", "comment": "Canon Sources & Version Differences", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "2", "keys": ["Veldanava", "Star King Dragon", "Star-King Dragon", "creator god", "Creator Dragon"], "keysecondary": [], "content": "Veldanava, the Star King Dragon, is the first and greatest True Dragon and the creator god of the TenSura world. He created the world (the 'Central World' and other planes), the spiritual realms, the Seven Angels of Origin (led by Feldway), and is credited with setting the World Language and the system of skills. His younger siblings are the True Dragons Velzard (White Ice Dragon), Velgrynd (Scorch Dragon) and Veldora (Storm Dragon). Fascinated by mortal life, he fell in love with the human woman Lucia (sister of Rudra of Nasca), and their child was Milim Nava. Having a child split his power and made him mortal; Veldanava died roughly two thousand-plus years before the story under circumstances that are a major later-LN mystery tied to Feldway and the angels. His legacy: Guy, Ramiris and Milim were given roles as world 'administrators' (Ramiris as balancer, Guy as mediator), and the angels' grief over his death drives Feldway's plan to destroy the world to bring him back. Mentioned with awe; he never appears in the anime timeline.", "comment": "Veldanava, the Star King Dragon", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "3", "keys": ["True Dragon", "True Dragons", "Velzard", "Velgrynd", "dragon siblings", "Ryuushu"], "keysecondary": [], "content": "True Dragons (Ryuushu) are the strongest beings in existence: immortal spiritual life-forms that are embodiments of natural phenomena. If killed they eventually reincarnate, possibly with memory loss. The original four: Veldanava the Star King Dragon (eldest, creator), Velzard the White Ice / Frost Dragon (partner of Guy Crimson), Velgrynd the Scorch / Flame Dragon (guardian deity of the Eastern Empire, devoted to Emperor Rudra) and Veldora the Storm Dragon (youngest, troublemaker, Rimuru's best friend). LN later counts five True Dragons, with Rimuru reaching True Dragon status. Each True Dragon's magicule output is effectively endless; even suppressed, their aura terrifies monsters. They can take humanoid forms. Velzard and Velgrynd frequently 'discipline' Veldora by killing him (he reincarnated each time), which is why he fears his sisters. Milim, Veldanava's daughter, is a Dragonoid - nearly True Dragon class but a distinct race.", "comment": "True Dragons", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "4", "keys": ["Underworld", "Spiritual World", "Heaven", "Star Palace", "Central World", "physical world", "Ice Continent", "Celestial"], "keysecondary": [], "content": "The cosmos created by Veldanava contains several layers. The Physical World (material plane) holds the main continent (often called the Central World in fan wikis) with the Great Jura Forest at its heart, the western human nations, the Eastern Empire, Sarion in the far west/southwest regions, and the frozen Ice Continent to the north where Guy and Velzard live. The Underworld (Makai) is the spiritual plane where Daemons live and fight endlessly; summoning pulls them out. The Spiritual World / Elemental realm hosts spirits and elementals. Heaven (the Star Palace / Heavenly realm) is home to the angels of the Army of Justice under Feldway, who descend to wage the Great Tenma War. Earth (Japan, etc.) is a separate world: otherworlders arrive by summoning, by accident (crossovers through spatial rifts during disasters) or by reincarnation like Rimuru. Souls and information can travel between worlds; Earth is also linked to the TenSura world by future plot points (LN). Time and space can be manipulated only by ultimate-level powers (Chloe).", "comment": "Worlds, Realms & Planes", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "5", "keys": ["magicules", "magicule", "majouso", "magic essence", "aura", "EP", "existence points", "magic power", "magicule density"], "keysecondary": [], "content": "Magicules (majouso, 'magic elements') are the particles of magical energy that saturate the TenSura world. High concentrations spawn monsters and mutate living things (Veldora's leaked magicules made the Jura Forest dense with monsters and spawned Charybdis and Rimuru himself). Monsters and majin are essentially bodies built of magicules; they need little or no food while magicules are abundant. A being's total energy is measured (LN) in EP (existence points); for reference, LN cites Rimuru's EP in the millions after awakening, True Dragons far beyond. Aura (yōki for monsters, holy aura for saints) is magicules radiating from the body; strong beings suppress it so as not to terrify or harm the weak - releasing it ('Demon Lord's Haki / Overwhelming Aura') can make ordinary soldiers faint. Holy Barriers and 'Magic Cancellation' fields lower magicule density or block their use, crippling monsters (the Falmuth attack on Tempest). Magicule poisoning and density also matter for humans: summoned children with unstable magicules burn out. Magic sense (a basic monster skill) lets beings 'see' via magicules.", "comment": "Magicules & Aura", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "6", "keys": ["soul", "souls", "astral body", "spiritual body", "spiritual life-form", "physical body", "heart core", "resurrection"], "keysecondary": [], "content": "In TenSura metaphysics, a being consists of a physical body (material), an astral body (holds mind and memories, linking soul and body) and a spiritual body (the 'self' / spirit), anchored by the soul (heart core). Spiritual life-forms - True Dragons, Daemons, angels, spirits and awakened Demon Lords - exist primarily in spiritual form and can survive destruction of their physical body; only soul-level attacks or ultimate-level powers truly kill them. Resurrection is possible only if the soul is kept intact nearby: Rimuru revived Shion and the other victims of the Falmuth massacre by sealing their souls inside a barrier, awakening as a true Demon Lord, and using the Harvest Festival's gifts (anime S2). Souls are also currency for awakening (Harvest Festival) and for summoning Daemons, which need a vessel or corpses to manifest. Undead like Adalmann bind their souls to bodies; Daemons possess 'host' bodies (Testarossa's golem).", "comment": "Souls, Astral & Spiritual Bodies", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "7", "keys": ["World Language", "Voice of the World", "World's Voice", "announcement", "Notice"], "keysecondary": [], "content": "The World Language (Sekai no Koe, 'Voice of the World') is an impersonal, system-like voice embedded in reality by Veldanava. It announces significant events directly into the minds of those concerned (or of everyone nearby): skill acquisition ('Confirmed. Unique skill [Predator] acquired.'), evolutions, the start of a Harvest Festival ('Confirmed. Conditions met for the Harvest Festival...'), naming-based race changes and the birth of new Demon Lords. In roleplay, write it in brackets, emotionless, using 'Confirmed.' 'Notice.' 'Report.' formats. It is distinct from Great Sage / Raphael / Ciel, which are Rimuru's personal skill-intelligence (they answer him with 'Answer.' 'Affirmative.' 'Negative.'). Advanced beings can sometimes edit or hide information from the World Language (Ciel does so later in the LN).", "comment": "World Language (Voice of the World)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "8", "keys": ["skill", "skills", "common skill", "extra skill", "intrinsic skill", "resistance", "skill tiers", "skill rank"], "keysecondary": [], "content": "Skills are powers recognized and granted by the World Language. Tiers, from lowest: Common skills (basic, e.g. Magic Sense, Telepathy); Extra skills (refined/advanced versions, e.g. Magic Sense as Extra, Water Manipulation, Black Lightning, Thought Acceleration, Body Armor, Ultraspeed Regeneration, Shadow Motion); Unique skills (one-of-a-kind abilities born from a person's strong wishes or nature at a decisive moment, e.g. Great Sage, Predator); Ultimate skills (the peak, 'law-bending' powers; see own entry). Intrinsic skills are racial abilities (dragon breath, a slime's Absorb/Dissolve, Ranga's Black Lightning lineage). Resistances (Pain Nullification, Physical Attack Resistance, Heat/Cold Resistance, Holy/Magic Resistance,
