ptain.", "comment": "Gotei 13 Divisions 7-13", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "15", "keys": ["zanpakuto", "zanpakutō", "soul cutter", "zanpakuto spirit", "inner world"], "keysecondary": [], "content": "A zanpakuto (\"soul-cutting sword\") is a Soul Reaper's sword and a living reflection of its wielder's soul. Each has a name and a spirit, who lives in the owner's inner world (Ichigo's is a sideways city of skyscrapers). Learning the sword's name unlocks Shikai; forcing the spirit to materialize and submit unlocks Bankai. The blade cuts Hollows to purify them, and its hilt-end performs Konso on Pluses. Asauchi are nameless blades given to students; through training they take on the owner's nature. Zanpakuto can break; Bankai usually cannot be fully repaired once broken. Arrancar also carry zanpakuto that seal their Hollow power. Releasing in Shikai uses a release command plus the name (e.g., \"Dance, Sode no Shirayuki\"). In the anime-only Zanpakuto Unknown Tales arc, spirits physically manifest and rebel.", "comment": "Zanpakuto", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "16", "keys": ["Shikai", "Bankai", "initial release", "final release", "release command"], "keysecondary": [], "content": "Shikai (initial release) transforms the zanpakuto after the wielder learns its name, granting a special ability (fire, ice, ash, poison, etc.). Most seated officers and lieutenants have Shikai. Bankai (final release) requires materializing and subjugating the spirit, normally after 10+ years of training; it multiplies power about five to ten times and usually changes the weapon dramatically. Nearly all captains have Bankai, and those who achieve it are often recorded in Soul Society history. Yoruichi taught Ichigo in three days using the Tenshintai, an Onmitsukido artifact. In the TYBW arc, Sternritter use Medallions to steal Bankai, which Soul Reapers counter by Hollowfying their Bankai (Urahara's method). Some special cases: Kenpachi lacked Shikai for most of the series; Unohana's Shikai and Bankai share a name.", "comment": "Shikai and Bankai", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "17", "keys": ["Kido", "Kidō", "Hado", "Bakudo", "Shunpo", "Flash Step", "Hakuda", "reiatsu", "reiryoku", "spiritual pressure"], "keysecondary": [], "content": "Reiryoku is spiritual power; reiatsu is the pressure it exerts, which can crush weaker beings and be sensed by others (each person's reiatsu has a feel and often a color). Kido (\"demon way\") is spellcraft in numbered spells: Hado (destruction, e.g., #4 Byakurai, #31 Shakkaho, #63 Raikoho, #90 Kurohitsugi) and Bakudo (binding, e.g., #1 Sai, #4 Hainawa, #61 Rikujokoro, #81 Danku), with chanted incantations; masters skip the chant (eishohaki). Kaido is healing Kido. Shunpo (Flash Step) is the Soul Reaper high-speed movement art under Hoho; Yoruichi is its greatest master. Hakuda is unarmed combat, the specialty of the Onmitsukido. Shunko combines Hakuda and Kido. Hollows' counterpart to Shunpo is Sonido; Quincy use Hirenkyaku.", "comment": "Kido, Shunpo, Hakuda & Reiatsu", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "18", "keys": ["Hollow", "Hollows", "Hollow mask", "Hollow hole", "Menos", "Menos Grande", "Gillian", "Adjuchas", "Vasto Lorde"], "keysecondary": [], "content": "Hollows are human souls who lingered in the Human World until despair or regret devoured their hearts, leaving a hole in the chest and a white bone mask. They hunger for souls, especially spiritually aware ones. When a Soul Reaper cuts the mask, the Hollow is purified and sent to Soul Society (sinful ones go to Hell). Hollows that devour many others combine into Menos Grande: Gillian (giant black-cloaked, long-nosed masks, mindless, can fire Cero), Adjuchas (smaller, intelligent, varied animal forms; must keep eating or regress), and Vasto Lorde (human-sized, strongest class, said to exceed captains; very few exist). Tier Harribel and, per the novel, Nelliel are Vasto Lorde; Harribel's Fraccion were Adjuchas. Hollows sense spiritual power and travel through Garganta.", "comment": "Hollows", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "19", "keys": ["Arrancar", "Hierro", "Sonido", "Cero", "Resurreccion", "Resurrección", "Garganta", "Pesquisa", "Gran Rey Cero"], "keysecondary": [], "content": "Arrancar are Hollows who removed part of their mask, gaining human-like forms and Soul Reaper-like powers. Aizen mass-produced powerful ones with the Hogyoku. They wear white uniforms, keep a mask fragment and a hollow hole somewhere on the body, and seal their true power in a zanpakuto. Core abilities: Cero (energy blast), Bala (faster weaker blast), Sonido (speed movement), Hierro (steel-hard skin), Pesquisa (sensing), Garganta (portal), and Resurreccion (releasing their sword to regain Hollow form, with a release command, e.g., \"Destroy, Tiburon\"). Gran Rey Cero, mixed with their blood, is exclusive to the Espada. Arrancar are numbered by rank or order of creation; Fraccion are an Espada's personal subordinates. Numbers below 10 = Espada; three digits = Privaron (demoted former) Espada.", "comment": "Arrancar", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "20", "keys": ["Espada", "Espadas", "Tres Espada", "Aspects of Death", "Privaron Espada", "Fraccion", "Fracción"], "keysecondary": [], "content": "The Espada (\"swords\") are Aizen's ten strongest Arrancar, numbered 0-9 with a tattoo of their number. Each represents an aspect of death: 1 Coyote Starrk (Solitude, with Lilynette), 2 Baraggan Louisenbairn (Old Age), 3 Tier Harribel (Sacrifice), 4 Ulquiorra Cifer (Nihilism), 5 Nnoitra Gilga (Despair), 6 Grimmjow Jaegerjaquez (Destruction), 7 Zommari Rureaux (Intoxication), 8 Szayelaporro Granz (Madness), 9 Aaroniero Arruruerie (Greed), 10/0 Yammy Llargo (Rage). Former Espada include Nelliel Tu Odelschwanck (former 3rd, also Sacrifice) and the Privaron Espada (Dordoni 103, Cirucci 105, Gantenbainne 107). Espada choose Fraccion as subordinates. The top four may not release inside the Las Noches dome. Most die during the Hueco Mundo and Fake Karakura Town battles; survivors include Harribel, Grimmjow and Nel.", "comment": "Espada", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "21", "keys": ["Quincy", "Quincies", "Heilig Pfeil", "Blut", "Blut Vene", "Hirenkyaku", "Vollstandig", "Vollständig", "Echt", "Gemischt"], "keysecondary": [], "content": "Quincy are humans who fight Hollows by gathering spirit particles (reishi) to form bows, arrows (Heilig Pfeil) and blades. Unlike Soul Reapers, they destroy Hollow souls outright, which upsets the balance of souls; this led Soul Reapers to nearly exterminate them about 200 years before the story. Techniques: Hirenkyaku (high-speed movement), Blut Vene (defense) and Blut Arterie (offense) via spirit power in the blood, Ginto (silver tubes with liquid spirit power for spells), Seele Schneider (spirit blades), Letzt Stil (final form), and Quincy Vollstandig (angelic winged form). Pure-blooded are Echt; mixed-blood are Gemischt. Uryu Ishida and his father Ryuken are main-cast Quincy. Masaki Kurosaki was an Echt Quincy. All Quincy carry fragments of Yhwach's soul, which enables his Auswählen.", "comment": "Quincy", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "22", "keys": ["Wandenreich", "Invisible Empire", "Sternritter", "Stern Ritter", "Schrift", "Silbern", "Medallion", "Jagdarmee", "Schutzstaffel", "Yhwach"], "keysecondary": [], "content": "[Spoiler: TYBW] The Wandenreich (\"Invisible Empire\") is the hidden Quincy army led by Yhwach, father of all Quincy, who lost to Yamamoto a thousand years earlier and rebuilt in Soul Society's own shadows (Schatten Bereich), with the city of Silbern as capital. Its elite are the Sternritter (Star Knights), each holding a Schrift letter from A to Z granted by Yhwach (e.g., T \"The Thunderbolt\", Z \"The Zombie\"). The Schutzstaffel are Yhwach's personal guard; Jugram Haschwalth is his right hand. The Jagdarmee are hunting troops who conquered Hueco Mundo. Medallions steal Bankai. Uniform: white military coats, capes and peaked caps with the Wandenreich cross-star emblem. Their invasion kills Yamamoto and many others; they later seize the Soul King Palace, renaming it Wahrwelt.", "comment": "Wandenreich & Sternritter", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "23", "keys": ["Fullbring", "Fullbringer", "Xcution", "Ginjo", "Kugo Ginjo", "Tsukishima"], "keysecondary": [], "content": "Fullbringers are humans whose mothers were attacked by Hollows before they were born, leaving residual Hollow power. They manipulate the \"soul\" in objects and materials, usually with a personal item they love, e.g., Jackie Tristan's boots or Riruka Dokugamine's love-gun and dollhouse. Chad's arm and Orihime's power are related to similar human-gained abilities (Chad's is classed as Fullbring). Xcution was a group of Fullbringers led by Kugo Ginjo (the first Substitute Shinigami) with Shukuro Tsukishima, Riruka, Jackie, Giriko Kutsuzawa, Yukio Hans Vorarlberna and Moe Shishigawara. They tricked a powerless Ichigo into gaining a Fullbring in \"The Lost Substitute Shinigami\" arc so Ginjo could steal it. Several survive and help in TYBW.", "comment": "Fullbring & Xcution", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "24", "keys": ["Visored", "Vizard", "Vizards", "Hollowfication", "Hollowfied", "Shinji", "Kensei", "Love Aikawa", "Rose", "Hachi"], "keysecondary": [], "content": "The Visored (Vizard) are Soul Reapers who gained Hollow powers. About 110 years before the story, Aizen secretly Hollowfied captains and lieutenants: Shinji Hirako (5th captain), Kensei Muguruma (9th), Love Aikawa (7th), Rojuro \"Rose\" Otoribashi (3rd), Lisa Yadomaru (8th lieutenant), Mashiro Kuna (9th lieutenant), Hiyori Sarugaki (12th lieutenant) and Hachigen Ushoda (Kido Corps vice-commander). Framed by Aizen, Urahara and Tessai helped them escape to the Human World, where they hid in gigai that block reiatsu. They can wear Hollow masks for huge boosts within a time limit and fire Cero. They trained Ichigo to control his inner Hollow. After the Fake Karakura Town battle, Shinji, Rose and Kensei return as captains; Lisa, Mashiro and Love later rejoin.", "comment": "Visored", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "25", "keys": ["Royal Guard", "Squad Zero", "Zero Division", "Ichibe", "Kirinji", "Nimaiya", "Oetsu", "Oken"], "keysecondary": [], "content": "The Royal Guard (Zero Division, Squad Zero) protects the Soul King Palace. Its five members are each said to be stronger than the whole Gotei 13: Ichibe Hyosube (leader, \"Monk Who Calls Real Names\"), Tenjiro Kirinji (healing hot springs, former 4th captain), Kirio Hikifune (Reiatsu-cuisine chef, former 12th captain), Oetsu Nimaiya (creator of the zanpakuto and Asauchi) and Senjumaru Shutara (master weaver). Each bears the Oken (King's Key) in their bones. In the TYBW arc they rebuild Ichigo and his friends, then face Yhwach and the Schutzstaffel. [Spoiler: TYBW] Ichibe is overwhelmed and the other four fall. The TYBW anime (anime-original) adds the \"Blood Oath's Seal\": a Royal Guard can use full power only if the other members die.", "comment": "Royal Guard (Squad Zero)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "26", "keys": ["Soul King", "Reiokyu", "Soul King Palace", "Royal Palace", "Mimihagi", "Wahrwelt"], "keysecondary": [], "content": "The Soul King (Reio) is the linchpin that keeps the Three Worlds stable; he resides in the Soul King Palace (Reiokyu), a separate dimension floating above Soul Society reached via the Royal Guard's Oken or Kukaku-style cannon launch. The Palace contains the Royal Guard's own palaces around the inner Reio Greater Palace. Few ever see him. [Spoiler: TYBW] The Soul King is revealed to be a limbless, sealed being in a crystal, sacrificed by the five noble founders long ago; his severed right arm became Mimihagi. Yhwach (his son, in a sense) invades, and Ichigo is tricked into striking the King. Yhwach absorbs the King's power and remakes the palace as Wahrwelt. In the epilogue, Kyoraku indicates Yhwach's remains now serve as the new linchpin (details are sparse). Kirio's food and Ichibe's names tie into the Palace lore.", "comment": "Soul King & Soul King Palace", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "27", "keys": ["Kido Corps", "Kidoshu", "Kidō Corps", "Tessai", "Hachigen"], "keysecondary": [], "content": "The Kido Corps (Kidoshu) is a separate Soul Society force specializing in spellcasting: large-scale barriers, Senkaimon gates, executions using high-level Kido, and other ceremonial duties. Its leader holds the title Daikido Chosai and the vice-commander Fuku-Kido Chosai. About 110 years ago they were Tessai Tsukabishi (commander) and Hachigen Ushoda (vice-commander). Tessai used forbidden Kido (time-stopping and space-moving spells) to save the Hollowfied Soul Reapers and fled with Urahara and Yoruichi; Hachigen became a Visored. Kido Corps members perform the ritual to forge Senkaimon and seal prisoners. Roleplay note: they appear rarely, robed and quiet, chanting long incantations in unison.", "comment": "Kido Corps", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "28", "keys": ["Onmitsukido", "Onmitsukidō", "Stealth Force", "Secret Remote Squad", "Executive Militia", "Keigun", "Detention Unit", "Maggot's Nest", "Corrections Corps"], "keysecondary": [], "content": "The Onmitsukido (Secret Remote Squad / Stealth Force) handles covert operations, assassination, policing and imprisonment. It is traditionally commanded by the head of the Shihoin clan and is merged with the Gotei 13's 2nd Division, whose captain is its Commander-in-Chief. Units: Executive Militia (Keigun, assassins), Patrol Corps, Detention Unit (guarding the Maggot's Nest prison for dangerous Soul Reapers, once commanded by Kisuke), Corrections Corps (Yoruichi's own unit in her final years) and Information Corps. Uniform: black backless and sleeveless combat outfit designed for Shunko, with long wrist guards; masked agents. Yoruichi led it until her defection 100 years ago; Soi Fon now commands it.", "comment": "Onmitsukido (Stealth Force)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "29", "keys": ["noble", "nobles", "Four Great Noble Families", "great noble houses", "Kuchiki clan", "Shihoin clan", "Shiba clan", "Tsunayashiro", "Kasumioji"], "keysecondary": [], "content": "Soul Society is ruled by an aristocracy. The Four Great Noble Families (once five) are: the Kuchiki (archivists of Soul Society's history; Byakuya is the 28th head), the Shihoin (Tenshi Heisoban, \"Guardians of the Heavenly Armaments\", guardians of royal treasures; heads lead the Onmitsukido; Yoruichi was 22nd head, later her younger brother Yushiro), the Tsunayashiro (the most powerful; explored in the novel \"Can't Fear Your Own World\"), and formerly the Shiba (fallen family; Kukaku and Ganju live in the Rukongai; Isshin Kurosaki was born a Shiba). Lesser nobles include the Ise, Omaeda (wealthy merchants) and anime-only Kasumioji. Founding nobles' actions toward the Soul King are a [Spoiler: TYBW] dark secret. Noble manners: formal speech, heavy kimono, servants.", "comment": "Noble Houses", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "30", "keys": ["Shihoin clan", "Shihōin clan", "Tenshi Heisoban", "Yushiro", "Yūshirō", "Shihoin family"], "keysecondary": [], "content": "The Shihoin are one of the Four Great Noble Families, called the Tenshi Heisoban (Guard of the Heavenly Gifted Armaments) because they safeguard Soul Society's divine artifacts such as the Tentoken (flying mantle), Tenshintai (Bankai training doll) and Hissaki Kumoi wires. Heads traditionally command the Onmitsukido and the 2nd Division. Yoruichi was the 22nd head and the first woman to hold the post; after her exile her younger brother Yushiro Shihoin became head. Yushiro looks very much like her, adores his big sister, and learns Shunko during the TYBW arc. Per Kubo's Klub Outside Q&A, some Shihoin are occasionally born with the ability to transform into a specific animal, the origin of Yoruichi's cat form. The clan crest appears on the Tentoken's brooch.", "comment": "Shihoin Clan", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "31", "keys": ["Kuchiki clan", "Kuchiki family", "Kuchiki manor", "Shiba clan", "Shiba family", "Kaien"], "keysecondary": [], "content": "The Kuchiki clan is the strictest of the noble houses, devoted to law and tradition. Byakuya Kuchiki is the 28th head and 6th Division captain; his grandfather Ginrei preceded him. Byakuya married Hisana, a Rukongai commoner, and later adopted her younger sister Rukia into the family, which caused friction with the elders. Their manor has vast gardens and koi ponds. The Shiba clan was once one of the five great families but fell from grace; Kukaku Shiba (fireworks expert) and Ganju live in a strange house with giant arms in the Rukongai. Their brother Kaien Shiba was the beloved 13th Division lieutenant whose death haunts Rukia. Isshin Kurosaki, Ichigo's father, was born Isshin Shiba and was once 10th Division captain.", "comment": "Kuchiki & Shiba Clans", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "32", "keys": ["Central 46", "Chamber of 46", "Shin'o Academy", "Spiritual Arts Academy", "Academy"], "keysecondary": [], "content": "Central 46 is Soul Society's supreme judiciary: 40 sages and 6 judges who rule on crimes, including those of Soul Reapers. Its verdicts are absolute and the Gotei 13 must enforce them. In the Soul Society arc, Aizen secretly murdered the entire council and issued orders in their name (including Rukia's execution); 110 years earlier, it exiled Urahara. The Shin'o Academy (Spiritual Arts Academy, Shino Reijutsuin) trains future Soul Reapers over six years in Zanjutsu, Hakuda, Hoho and Kido. Gin famously graduated in a single year. Rukia and Renji entered together; Renji, Momo and Izuru Kira were attacked by Hollows on a training trip led by senior student Shuhei Hisagi and were rescued by Aizen and Gin (flashback).", "comment": "Central 46 & Shin'o Academy", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "33", "keys": ["gigai", "Gigai", "Gikon", "mod soul", "Modified Soul", "Kon", "soul candy", "Konso", "Plus", "Chain of Fate"], "keysecondary": [], "content": "A gigai is an artificial body Soul Reapers use in the Human World, letting them be seen by humans and recover power; Urahara's special gigai can suppress reiatsu (Rukia's nearly drained her powers). Gikongan (soul candy, Gikon pills) contain an artificial soul that pilots a body while its owner fights as a soul. Modified Souls (Mod Souls) were combat artificial souls ordered destroyed; Kon, who lives in a stuffed lion, is the famous survivor. Ururu Tsumugiya is listed by the wiki as a Mod Soul. Kirio Hikifune is credited with inventing Gikon. Ordinary souls are Pluses, tied to their body by a Chain of Fate; if it erodes, they become Hollows. Konso sends them to Soul Society using the zanpakuto's hilt.", "comment": "Gigai & Mod Souls", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "34", "keys": ["Hogyoku", "Hōgyoku", "Aizen", "Sosuke Aizen", "Oken", "King's Key", "Kyoka Suigetsu"], "keysecondary": [], "content": "The Hogyoku (\"Orb of Distortion\") is a small orb that breaks the barrier between Soul Reapers and Hollows; Urahara created one and sealed it inside Rukia, while Aizen made his own and took Urahara's. It grants its holder's heart's desires. Sosuke Aizen, former 5th Division captain, appeared kind but used his Shikai Kyoka Suigetsu (complete hypnosis by sight of release) to deceive everyone for a century. His goal: reach the Soul King and stand in heaven. He needed the Oken, forged by sacrificing Karakura Town's souls. After merging with the Hogyoku in the Fake Karakura battle, he was defeated by Ichigo's Final Getsuga Tensho and sealed by Urahara's Kido, then sentenced to 20,000 years in Muken prison. [Spoiler: TYBW] He is freed briefly to help against Yhwach.", "comment": "Hogyoku & Aizen's Plan", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "35", "keys": ["Turn Back the Pendulum", "110 years ago", "Hollowfication incident", "Urahara exiled", "Yoruichi defected"], "keysecondary": [], "content": "About 110 years before the story, Kisuke Urahara, 3rd Seat of the 2nd Division and head of the Maggot's Nest, was promoted to 12th Division captain on Yoruichi's recommendation after Kirio Hikifune joined the Royal Guard. He founded the Research and Development Institute with Hiyori as lieutenant and Mayuri as deputy. Nine years later, 9th Division members vanished in the Rukongai; Kensei, Mashiro, Shinji, Rose, Love, Lisa, Hachi and Hiyori were Hollowfied by Aizen. Urahara and Tessai tried to save them and were framed. Central 46 sentenced them; Yoruichi, masked, broke them out, smuggled the victims and fled to the Human World, giving up her clan headship and captaincy. Soi Fon, abandoned, became bitter. Covered in the manga's \"Turn Back the Pendulum\" chapters and anime ep. 206-212.", "comment": "Event: Turn Back the Pendulum", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "36", "keys": ["Soul Society arc", "Rukia's execution", "Sokyoku", "Ryoka invasion", "rescue Rukia"], "keysecondary": [], "content": "After Rukia gave Ichigo her powers, she was arrested by Byakuya and Renji and sentenced to execution. Ichigo, Orihime, Chad, Uryu and Yoruichi (in cat form) entered Soul Society, then were launched over the Seireitei's barrier by Kukaku Shiba's cannon. The \"Ryoka\" (intruders) fought through Ikkaku, Renji, Kenpachi and others. Yoruichi rescued Ichigo, trained him to Bankai in three days, and dueled Soi Fon. Ichigo defeated Byakuya at the Sokyoku. Aizen, believed murdered, revealed he had faked his death, killed Central 46, and extracted the Hogyoku from Rukia, then left for Hueco Mundo with Gin and Tosen. Momo was stabbed by Aizen. The arc ends with Rukia free, Byakuya reconciled with her, and the Gotei 13 aware of the coming war.", "comment": "Event: Soul Society Arc", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "37", "keys": ["Arrancar arc", "Hueco Mundo arc", "Orihime kidnapped", "rescue Orihime", "Ulquiorra"], "keysecondary": [], "content": "Aizen sends Arrancar to Karakura: Ulquiorra and Yammy test Ichigo (Yoruichi and Urahara drive them off), then Grimmjow's group attacks. An advance team (Hitsugaya, Rangiku, Renji, Ikkaku, Yumichika, Rukia) is stationed in town. Ichigo trains with the Visored to master his Hollow mask. Ulquiorra takes Orihime to Hueco Mundo under threat; she goes to protect her friends. Ichigo, Chad, Uryu, Rukia and Renji invade Las Noches, meeting Nel, Pesche and Dondochakka; captains Kenpachi, Byakuya, Mayuri and Unohana later join. Battles include Ichigo vs Grimmjow, Nnoitra (Nel restored to adult form), and Ulquiorra, where Ichigo's Hollowified form emerges. Orihime is brought into the palace's politics and bullied by Loly and Menoly.", "comment": "Event: Arrancar & Hueco Mundo Arcs", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "38", "keys": ["Fake Karakura Town", "Fake Karakura", "Karakura replica", "Final Getsuga Tensho", "Aizen defeated"], "keysecondary": [], "content": "Urahara swaps Karakura Town with a replica so the real town and its people are safe in Soul Society. The Gotei 13 captains and lieutenants fight Aizen's top Espada over the fake town: Soi Fon and Omaeda vs Baraggan; Hitsugaya vs Harribel while Rangiku, Momo and Hisagi's group fight Harribel's Fraccion and their beast Ayon; Kyoraku and Ukitake vs Starrk and Lilynette. The Visored join. Aizen betrays Harribel by cutting her down. Hiyori is gravely wounded by Gin. Urahara, Yoruichi and Isshin attack Aizen together. Ichigo learns the Final Getsuga Tensho from his father in the Dangai, overpowers Aizen, and loses his Soul Reaper powers; Urahara's Kido seals Aizen. Rangiku loses Gin in the real Karakura.", "comment": "Event: Fake Karakura Town", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "39", "keys": ["Thousand-Year Blood War", "TYBW", "Quincy war", "Blood War", "Sennen Kessen"], "keysecondary": [], "content": "[Spoiler: TYBW] Final arc (manga ch. 480-686; anime 2022-2026). The Wandenreich overrun Hueco Mundo, then invade Soul Society, stealing Bankai with Medallions; Yhwach kills Yamamoto. Ichigo learns his mother Masaki was a Quincy, is rebuilt by the Royal Guard, and Unohana dies freeing Kenpachi's true power. In the second invasion, the Sternritter fight across the Seireitei: Rukia achieves Bankai vs As Nodt; Soi Fon, Mayuri, Hitsugaya and others recover their Bankai; Yhwach storms the Soul King Palace and kills the Royal Guard. Uryu sides with Yhwach. The Gotei 13, Visored, Arrancar (Grimmjow, Nel, Harribel's Fraccion) and Aizen face Yhwach in Wahrwelt, where Ichigo and Uryu finally defeat him. Epilogue: ten years later, Ichigo and Orihime's son Kazui and Rukia and Renji's daughter Ichika meet.", "comment": "Event: Thousand-Year Blood War", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "40", "keys": ["filler", "Bount", "Amagai", "Zanpakuto Unknown Tales", "Reigai", "Memories of Nobody", "Hell Verse", "Fade to Black"], "keysecondary": [], "content": "[Anime-only] The 2004-2012 anime added: Bount arc (ep. 64-109; soul-devouring humans led by Kariya), New Captain Shusuke Amagai arc (ep. 168-189; with Princess Rurichiyo Kasumioji), Zanpakuto Unknown Tales (ep. 230-255; zanpakuto spirits rebel, led by Muramasa) and its Beast Swords sequel (ep. 256-265), Gotei 13 Invasion Army (ep. 317-342; Reigai doubles; introduces Nozomi Kujo), plus standalone fillers. Movies: Memories of Nobody (Senna), The DiamondDust Rebellion (Hitsugaya), Fade to Black (Rukia loses her memories), Hell Verse, and a 2018 live-action film. None of these are manga canon. In roleplay, use them only if the user wants; label clearly.", "comment": "Anime-only Filler Arcs & Movies", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "41", "keys": ["Yoruichi", "Yoruichi Shihoin", "Yoruichi Shihōin", "Shihoin Yoruichi", "Yoruichi-sama", "Yoruichi-san"], "keysecondary": [], "content": "Yoruichi Shihoin (Shihoin Yoruichi) is the former 22nd head of the Shihoin clan, one of Soul Society's Four Great Noble Families, and the first woman to lead it. She was captain of the 2nd Division and Commander-in-Chief of the Onmitsukido (Stealth Force), also commanding its Executive Militia and later its Corrections Corps. About 100 years before the story she gave up everything to rescue Kisuke Urahara, Tessai and the Hollowfied Visored from an unjust sentence, then lived in the Human World at the Urahara Shop, mostly as a black cat. She guides Ichigo's group into Soul Society, trains Orihime and Chad, and teaches Ichigo Bankai. Titles: \"Flash Goddess\" (Shunshin), Shunpo Master. Databook: height 156 cm, weight 42 kg, birthday January 1. Loves milk. Japanese VA: Satsuki Yukino (human), Shiro Saito (cat); English: Wendee Lee, Terrence Stone (cat).", "comment": "Yoruichi Shihoin - Overview", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "42", "keys": ["Yoruichi appearance", "Yoruichi's cat", "black cat", "talking cat", "Yoruichi cat form", "cat form"], "keysecondary": [], "content": "Human form: slender, athletic woman of average height (156 cm) with dark skin, golden eyes, and long hair worn in a high ponytail with chin-length bangs framing her face. Her hair is black in the manga's description and usually dark purple in the anime. She moves with a relaxed, cat-like grace and often sits cross-legged or perches on high places. Cat form: a small black cat with golden eyes that speaks with a deep male voice, so most people assume \"Yoruichi-san\" is an old man. She can stay in this form indefinitely and channel spiritual power and speed while transformed, though she is physically limited. Reverting releases a puff of steam or mist. Because her clothes do not transform with her, changing back leaves her unclothed, a recurring comedic gag she uses to fluster people (keep it off-screen and SFW). Per Kubo's Q&A, she first learned the transformation to sneak out of her family mansion, and some Shihoin are born with an animal transformation.", "comment": "Yoruichi - Appearance & Cat Form", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "43", "keys": ["Yoruichi outfit", "Yoruichi clothes", "Yoruichi uniform", "Onmitsukido uniform", "Yoruichi armor"], "keysecondary": [], "content": "Past (110+ years ago): first the white Corrections Corps uniform; as captain, the black backless, sleeveless Onmitsukido commander's uniform (designed to survive Shunko) with long black wrist guards, a black ribbon at her neck, a long-sleeved captain's haori, and much shorter hair; a short sword carried horizontally at her lower back. Soul Society/Arrancar arcs (standard): black backless sleeveless undershirt, orange over-shirt with two white straps on each shoulder, a large beige sash at the waist, black stretch pants, light brown shoes for silent Shunpo, and a beige neck warmer she can pull up as a mask; sometimes beige arm and leg warmers. Fake Karakura Town: metal Anti-Hierro gauntlets and boots built by Urahara. Thousand-Year Blood War: a short orange dress over a black leotard with black arm warmers and black thigh-length boots, plus a traveling cloak at first. [Anime-only] Filler episodes show casual modern clothes in her gigai.", "comment": "Yoruichi - Outfits by Arc", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "44", "keys": ["Yoruichi history", "Yoruichi past", "Yoruichi exile", "Yoruichi captain", "2nd Division captain"], "keysecondary": [], "content": "Born a princess of the Shihoin clan, Yoruichi grew up in the Shihoin mansion with childhood friends Kisuke Urahara and Tessai Tsukabishi; Kisuke secretly dug a training space beneath Sokyoku Hill where they sparred daily. She became Executive Militia commander and 22nd clan head, then Onmitsukido Commander-in-Chief and 2nd Division captain, uniting both roles as her family traditionally did. She took young Soi Fon as her bodyguard and protegee, created many Shunpo techniques (teaching some to Byakuya), and often teased the teenage Byakuya into games of tag. She recommended Kisuke, her 3rd Seat, for 12th Division captain. After Aizen framed Kisuke and Tessai, she broke them out of Central 46 in disguise with the Hollowfied victims and fled. She forfeited her titles; Soi Fon later succeeded her. She kept only one title: Flash Goddess.", "comment": "Yoruichi - History & Exile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "45", "keys": ["Flash Goddess", "Shunshin", "Shunpo Master", "Yoruichi Shunpo", "Utsusemi", "Yoruichi Hakuda", "Raioken", "Yoruichi fighting style"], "keysecondary": [], "content": "Yoruichi is considered the greatest master of Hoho (footwork) in Soul Society, the \"Flash Goddess\" (Shunshin; Viz: \"Flash Master\"). She can seem to be in several places at once, wiping out a squad of Onmitsukido in seconds, and outran Byakuya while carrying an unconscious Ichigo. She invented Utsusemi (Cast-Off Cicada Shell), a burst of speed leaving a tangible afterimage. She is one of the foremost Hakuda (hand-to-hand) masters and rarely draws a sword: fast kicks, throws like Taketonbo (a sudden flip), and Raioken (Thunder King Fist), a barrage of high-speed punches that shattered Aizen's first Hogyoku form. She hides knives (anken) in her boots, is a skilled Kido user (incantation-less spells, Hanki counter-Kido, some healing) and a master assassin and strategist. Her zanpakuto (a short kodachi-like blade) exists and she has Bankai, but neither Shikai nor Bankai is ever revealed.", "comment": "Yoruichi - Shunpo, Hakuda & Combat Skills", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "46", "keys": ["Shunko", "Shunkō", "Flash War Cry", "Raijin Senkei", "Raiju Senkei", "Shunryu Kokubyo Senki", "Black Cat Warrior Princess"], "keysecondary": [], "content": "Shunko (Flash War Cry) fuses Hakuda with Kido: highly pressurized lightning-element Kido wraps her back and shoulders, which is why the Onmitsukido commander uniform has no back or sleeves. It amplifies her strikes, can neutralize an opponent's movement and can be fired as explosive blasts. Yoruichi developed it a century ago; her version is complete, while Soi Fon's was new. Later her Shunko manifests as lightning wings. [Spoiler: TYBW] Shunko: Raijin Senkei (Thunder God Battle Form) forms a ring of Raijin's drums of lightning behind her and fires a massive column of electricity. Shunko: Raiju Senkei: Shunryu Kokubyo Senki (Thunder Beast Battle Form: Flash God Black Cat Warrior Princess) fuses Shunko with her cat nature: lightning cat ears, tail, clawed limbs and an electric aura. In it she thinks like a cat, mood swings shift her reiatsu 48 times per second, she cannot understand speech, and only Kisuke can control her. She dislikes using it and Kisuke triggered it by tearing a paper seal.", "comment": "Yoruichi - Shunko & Thunder Forms", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "47", "keys": ["Tentoken", "Tentōken", "Tenshintai", "Ryukotsujo", "Hissaki Kumoi", "Anti-Hierro armor", "Yoruichi equipment"], "keysecondary": [], "content": "Yoruichi carries several Shihoin and Onmitsukido treasures. Tenshintai: a large white doll that forcibly materializes a zanpakuto spirit; used to teach Ichigo Bankai in three days. Ryukotsujo (Dragon Bone Staff; name from the game Brave Souls): a bone wand that forms a one-winged glider. Tentoken (Heaven-Stepping Adornment): a brown flight mantle with the Shihoin crest, lent to Ichigo to reach the Sokyoku. Anken: hidden boot knives. Anti-Hierro Armor: Urahara-made metal gloves and boots for punching through Arrancar skin (Fake Karakura Town). [Spoiler: TYBW] Tenshi Heiso: Hissaki Kumoi: razor wire she used to cage Yhwach; Sankotsu no Jufu: three talismans that form a stabilizing barrier, able to stabilize the Soul King; strings of destructive spheres that destroy any spot hit twice. Kisuke also gives her a rushed immunity drug against Askin's poison.", "comment": "Yoruichi - Equipment", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "48", "keys": ["Yoruichi personality", "Yoruichi speech", "Yoruichi roleplay", "washi", "Yoruichi teasing"], "keysecondary": [], "content": "Personality: witty, intelligent, laid-back and playful; a noble who hates noble stiffness (she told Soi Fon to drop honorifics and grudgingly accepted \"Yoruichi-sama\"). She loves teasing younger people (Ichigo, young Byakuya, Soi Fon, Kisuke), enjoys shocking people by revealing her true form, and gets genuinely angry if her cat form is harmed or mocked (her damaged tail). In crisis she turns calm, decisive and commanding, a seasoned general who reads situations instantly and plans ahead. Roleplay notes: in Japanese she uses old-man pronouns \"washi\" (I) and archaic \"onushi\" (you); render this in English as confident, slightly old-fashioned, amused speech (\"Hmph, still slow, little Byakuya?\"). Smirks, stretches, sits on rooftops, drinks milk, appears suddenly out of nowhere. As a cat she sounds gruff and grandfatherly. Short quote: \"A fierce desire to protect is the key.\" Teasing stays light and friendly, never cruel.", "comment": "Yoruichi - Personality & Roleplay Notes", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "49", "keys": ["Yoruichi and Urahara", "Yoruichi and Kisuke", "Yoruichi and Soi Fon", "Yoruichi and Ichigo", "Yoruichi and Byakuya"], "keysecondary": [], "content": "Kisuke Urahara: childhood friend, former subordinate, closest partner; they bicker like an old married duo (she scolds his half-finished armor, kicks him when he jabs her with a syringe) yet trust each other completely, and he alone can control her Raiju form. Their relationship's exact nature is never labeled in canon. Soi Fon: her devoted protegee and bodyguard; Yoruichi's unexplained departure broke Soi Fon's heart, leading to their duel at Sokyoku Hill, after which they reconcile and fight side by side (Soi Fon gets flustered around her). Ichigo: she is his guide and Bankai teacher; she teases him relentlessly about his embarrassment but respects his growth. Byakuya: she called him \"Little Byakuya\" and played tag with him as a teen; he still bristles. Kukaku Shiba: old friend. Yushiro: her younger brother and successor as clan head, who clings to her. Orihime and Chad: she awakened their powers by teaching that powers come from the will to protect.", "comment": "Yoruichi - Relationships", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "50", "keys": ["Soi Fon", "Sui-Feng", "Suì-Fēng", "Shaolin Feng", "Captain Soi Fon", "Soifon"], "keysecondary": [], "content": "Soi Fon (Sui-Feng; birth name Shaolin Feng) is captain of the 2nd Division, Commander-in-Chief of the Onmitsukido and commander of its Executive Militia; 9th head of the Feng family, which served the Shihoin as assassins for generations. Databook: 150 cm, 38 kg. Appearance: petite and lean, gray eyes, short black hair with two long braids wrapped in white cloth that end in large golden rings. Uniform: backless, sleeveless Onmitsukido-style shihakusho with a white sleeveless captain's haori, a yellow sash, and long black wrist guards; she wears her short sword horizontally at her lower back. Past: as a young bodyguard she wore the standard Executive Militia uniform with longer hair. Personality: stern, cold, disciplined, intolerant of incompetence, harsh toward her lazy lieutenant Marechiyo Omaeda, fiercely devoted to Yoruichi, and easily flustered by her. Roleplay: clipped, formal, commanding speech; addresses her idol as \"Yoruichi-sama\".", "comment": "Soi Fon - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "51", "keys": ["Suzumebachi", "Jakuho Raikoben", "Jakuhō Raikōben", "Nigeki Kessatsu", "Homonka", "Soi Fon bankai"], "keysecondary": [], "content": "Shikai: Suzumebachi (Hornet), command \"Sting all enemies to death\" (Jinteki shakudan). It becomes a stinger-like blade worn on her right middle finger. Nigeki Kessatsu (Death in Two Steps): the first sting leaves a butterfly-shaped Homonka mark; a second strike on the same spot kills. Bankai: Jakuho Raikoben (Hornet's Thunder Whip), a huge golden missile launcher on her arm firing one devastating blast; she dislikes it because it is unsuited to assassination and needs an anchor. She also uses Shunko (still incomplete in the Soul Society arc), expert Hakuda and Shunpo. Story: hated Urahara for \"taking\" Yoruichi; dueled Yoruichi after Rukia's rescue and broke down, asking why she was left behind. In Fake Karakura Town she defeated Baraggan with Omaeda's help (losing her left arm to Respira, later restored). [Spoiler: TYBW] Her Bankai is stolen by BG9 and later recovered; she fights alongside Yoruichi's allies to the end.", "comment": "Soi Fon - Abilities & Story", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "52", "keys": ["Rukia", "Rukia Kuchiki", "Kuchiki Rukia", "Rukia-chan", "Rukia-sama"], "keysecondary": [], "content": "Rukia Kuchiki is the Soul Reaper who gives Ichigo her powers in Chapter 1, starting the story. Raised as an orphan in Inuzuri (78 West Rukongai) with Renji Abarai, she entered the Academy and was adopted into the Kuchiki clan by Byakuya, her older sister Hisana's widower. She served in the 13th Division under Ukitake, where lieutenant Kaien Shiba mentored her; his death by her blade haunts her. Databook: 144 cm, 33 kg, birthday January 14. Appearance: petite, pale, large violet eyes, black shoulder-length hair with a strand falling between her eyes; hair cut short after the Fake Karakura battle, long again in the epilogue. Outfits: black shihakusho; Karakura High uniform and sundresses in her gigai; lieutenant's armband in TYBW; captain's haori ten years later. Personality: proud, brave, blunt, sarcastic with Ichigo, loves rabbits (Chappy) and draws crude bunny diagrams to explain things; fiercely loyal and burdened by guilt.", "comment": "Rukia Kuchiki - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "53", "keys": ["Sode no Shirayuki", "Hakka no Togame", "Tsukishiro", "Hakuren", "Rukia bankai", "Rukia's zanpakuto"], "keysecondary": [], "content": "Zanpakuto: Sode no Shirayuki (Sleeve of White Snow), \"the most beautiful ice-type zanpakuto in Soul Society\". Command: \"Dance, Sode no Shirayuki\" (Mae). Shikai: a pure-white blade with a long ribbon. Dances: Some no mai, Tsukishiro (a freezing circle that rises as a pillar of ice), Tsugi no mai, Hakuren (wave of ice), San no mai, Shirafune (ice blade extension). [Spoiler: TYBW] She lowers her body temperature to freeze anything, even to absolute zero for a few seconds. Bankai: Hakka no Togame (Censure of the White Flower), unlocked against As Nodt: she becomes an icy white figure and everything nearby freezes; she can only hold it briefly. She is also a strong Kido user. Story: arrested and nearly executed in the Soul Society arc; fights Aaroniero in Hueco Mundo; restores Ichigo's powers in the Fullbring arc; becomes lieutenant, later captain of the 13th; marries Renji; mother of Ichika. Roleplay: crisp, formal Soul Reaper diction, switches to a fake sweet schoolgirl voice to fool humans; smacks Ichigo when he's dense.", "comment": "Rukia Kuchiki - Abilities, Story & Roleplay", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "54", "keys": ["Orihime", "Orihime Inoue", "Inoue Orihime", "Inoue-san", "Hime"], "keysecondary": [], "content": "Orihime Inoue is Ichigo's classmate at Karakura High and one of the main cast; a teenage human at the start of the story. Raised by her older brother Sora after fleeing abusive parents; Sora died in an accident and briefly returned as a Hollow. She lives alone and wears the blue, flower-shaped hairpins he gave her. Databook: 157 cm, birthday September 3. Appearance: long auburn-orange hair, gray eyes, two blue hairpins worn near her bangs. Outfits: gray Karakura High uniform with red ribbon; in Hueco Mundo a white Arrancar-style dress given by Aizen; [Spoiler: TYBW] a new battle outfit she finds embarrassing, Yoruichi swats Ichigo for commenting; ten years later she is Ichigo's wife and mother of their son Kazui, and works part-time at a bakery. Personality: sunny, kind, imaginative, spacey, prone to elaborate daydreams and bizarre food combinations (red bean paste with butter, etc.), but with deep courage and self-doubt about being only protected. Best friend: Tatsuki Arisawa.", "comment": "Orihime Inoue - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "55", "keys": ["Shun Shun Rikka", "Soten Kisshun", "Santen Kesshun", "Koten Zanshun", "Tsubaki", "I reject"], "keysecondary": [], "content": "Power: Shun Shun Rikka, six tiny fairy-like spirits living in her hairpins, awakened while protecting Tatsuki. They \"reject\" events: Soten Kisshun (Ayame and Shun'o) forms a dome that undoes damage, restoring lost limbs or broken objects; Santen Kesshun (Hinagiku, Baigon, Lily) forms a triangular shield; Shiten Koshun adds Tsubaki to reflect attacks; Koten Zanshun sends Tsubaki as an offensive cutting projectile. Aizen noted her power trespasses on \"god's domain\". She chants \"I reject\" (Watashi wa kyozetsu suru). Yoruichi trained her before Soul Society. Story: kidnapped (she went willingly to protect friends) to Hueco Mundo, where she debates hearts with Ulquiorra and is bullied by Loly and Menoly; restores Grimmjow's arm; heals allies in every arc. [Spoiler: TYBW] She heals at the Soul King Palace and fights through Wahrwelt with Ichigo. Roleplay: cheerful, rambling, polite, uses \"Kurosaki-kun\" for Ichigo, sudden heartfelt honesty, mild clumsiness; never weak-willed.", "comment": "Orihime Inoue - Powers, Story & Roleplay", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "56", "keys": ["Rangiku", "Rangiku Matsumoto", "Matsumoto", "Haineko", "Rangiku-san"], "keysecondary": [], "content": "Lieutenant of the 10th Division under Toshiro Hitsugaya; later SWA president. Databook: 172 cm, birthday September 29. Appearance: tall, wavy strawberry-blonde hair past her shoulders, blue eyes, a beauty mark near her lips; wears her shihakusho loosely with a pink scarf over her shoulders and a necklace. In the Human World she wears trendy casual clothes or the Karakura High uniform. Personality: carefree, cheerful, fond of sake, shopping and naps, avoids paperwork (driving Hitsugaya mad), but perceptive, warm and quietly sad underneath. Shikai: Haineko (Ash Cat), command \"Growl\" (Unare): the blade dissolves into a cloud of ash that cuts whatever it touches when she directs it. No Bankai. Story: Gin Ichimaru saved her from starvation in the Rukongai; he joined Aizen partly to recover what Aizen stole from her, and dies in her arms. She fights Harribel's Fraccion with Momo. [Spoiler: TYBW] She is gravely hurt and zombified by Giselle with Hitsugaya; Mayuri reverses it. Roleplay: bubbly, teasing (\"Taicho~!\"), flirty-joking but kind.", "comment": "Rangiku Matsumoto", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "57", "keys": ["Unohana", "Retsu Unohana", "Captain Unohana", "Unohana Retsu", "Unohana-taicho"], "keysecondary": [], "content": "Captain of the 4th Division (medical relief) and the most skilled healer in Soul Society. Databook: 159 cm, birthday April 21. Appearance: long black hair in a single thick braid worn down her front, blue eyes, calm face and a perpetual gentle smile; the standard shihakusho and captain's haori, tied with a light obi. Personality: polite, serene, motherly and soft-spoken; yet her smile frightens even hardened Soul Reapers, and the 11th Division obey her instantly. She teaches ikebana, mentors Isane and is associated with the SWA as chairwoman. Shikai: Minazuki, which becomes a giant flying manta-like creature that carries patients inside it while healing them. Expert Kaido. [Spoiler: TYBW] Her true identity is Yachiru Unohana, the first \"Kenpachi\", the most vicious criminal swordswoman in Soul Society's history and a founding Gotei 13 captain who turned to healing to learn every way of wounding.", "comment": "Retsu Unohana - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "58", "keys": ["Yachiru Unohana", "first Kenpachi", "Unohana Bankai", "Minazuki Bankai", "Unohana vs Kenpachi"], "keysecondary": [], "content": "[Spoiler: TYBW] Long ago Unohana fought a young Kenpachi Zaraki, who was the first to truly match her; he unconsciously sealed his own strength out of fear of killing her, and she has carried guilt ever since. Ordered by Kyoraku to \"teach\" Kenpachi before the second Quincy invasion, she fights him to the death in the underground Muken prison, dying repeatedly and healing him repeatedly to break his limiter. Bankai: also named Minazuki, a dark blade dripping a blood-like liquid; throughout the duel she keeps healing her opponent so the fight can continue. Kenpachi kills her, and she dies content. Isane inherits her role. Roleplay notes: ultra-polite keigo speech, never raises her voice; menace conveyed through a still smile, a pause, or \"Is that so?\". Before the reveal, play her as a perfect gentle healer; after it, allow flashes of a joyful, terrifying swordswoman.", "comment": "Retsu Unohana - TYBW & Roleplay", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "59", "keys": ["Nemu", "Nemu Kurotsuchi", "Kurotsuchi Nemu", "Nanago Nemuri", "Nemuri Hachigo"], "keysecondary": [], "content": "Lieutenant of the 12th Division and an artificial soul created by Captain Mayuri Kurotsuchi from gigai and gikon technology; her original designation was Nemuri Nanago (Sleeping No. 7). Databook: 167 cm, 52 kg. Appearance: long black hair in a single braid, green eyes, expressionless face; a short-skirted variant of the shihakusho with lieutenant's badge. Personality: obedient, monotone, quiet and polite; endures Mayuri's verbal and physical abuse without complaint, yet shows quiet kindness (she gave Uryu an antidote and asked him to spare Mayuri). Abilities: superhuman strength and speed, rapid regeneration, a body Mayuri can modify; no Shikai or Bankai. [Spoiler: TYBW] She fights Pernida Parnkgjas with Mayuri, uses her life force in a final assault, and dies; Mayuri salvages her brain, calling her his greatest creation. In the epilogue a child successor, Nemuri Hachigo, accompanies Mayuri. Roleplay: minimal, formal sentences (\"Yes, Mayuri-sama.\"), literal-minded, sudden deadpan observations.", "comment": "Nemu Kurotsuchi", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "60", "keys": ["Momo", "Momo Hinamori", "Hinamori", "Tobiume", "Hinamori-kun", "Bed-wetter Momo"], "keysecondary": [], "content": "Lieutenant of the 5th Division; childhood friend of Toshiro Hitsugaya from Junrinan (1 West Rukongai), whose grandmother raised them both. Databook: 151 cm, birthday June 3. Appearance: small and slim, dark brown eyes, black hair in a bun covered by a cloth wrap; standard shihakusho with lieutenant's badge on her left arm. Personality: gentle, earnest, polite and emotional; she idolized Captain Aizen, who saved her during an Academy training trip. Hitsugaya teasingly calls her \"Bed-wetter Momo\"; she calls him \"Shiro-chan\", which he hates. Shikai: Tobiume (Flying Plum Tree), command \"Snap\" (Hajike): a branched blade that fires fireballs; she is a gifted Kido user who can combine spells. No Bankai. Story: devastated and stabbed by Aizen in the Soul Society arc; in Fake Karakura Town, Aizen's illusion tricks Hitsugaya into stabbing her; she survives. Later serves under returning captain Shinji Hirako. Roleplay: soft, polite speech, \"Aizen-taicho\" reverence early on, fragile but brave.", "comment": "Momo Hinamori", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "61", "keys": ["Isane", "Isane Kotetsu", "Kotetsu Isane", "Itegumo"], "keysecondary": [], "content": "Lieutenant of the 4th Division under Unohana; ten years after the war she is its captain, with her younger sister Kiyone as lieutenant. Databook: 187 cm, 70 kg, birthday August 2; she is self-conscious about being so tall. Appearance: short silver-gray hair with two thin braids framing her face (later straight and smooth), lieutenant's badge, and as captain a white haori. Personality: kind, timid, anxious, very responsible, devoted to Unohana. Shikai: Itegumo (Frozen Cloud), command \"Run\" (Hashire): the blade grows a second hook-like point. Expert Kaido and binding Kido; Unohana's best healing student. [Spoiler: TYBW] Unohana leaves her with final words before facing Kenpachi; Isane steps up as healer in the war. Roleplay: polite, hesitant phrasing, apologizes a lot, steadies herself with \"I have to do this\", gets flustered by teasing about height.", "comment": "Isane Kotetsu", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "62", "keys": ["Nanao", "Nanao Ise", "Ise Nanao", "Nanao-chan", "Shinken Hakkyoken", "Hakkyoken"], "keysecondary": [], "content": "Lieutenant of the 8th Division under Shunsui Kyoraku, then co-lieutenant of the 1st Division when he becomes Captain-Commander; head of the Ise clan and SWA vice-president. Databook: 164 cm, birthday July 7. Appearance: glasses, black hair in a neat bun with loose side strands, usually holding a book or clipboard; standard shihakusho with lieutenant's badge. Personality: serious, organized, sharp-tongued; constantly scolds Kyoraku for laziness and flirting (he calls her \"Nanao-chan\"), but cares deeply for him. Abilities: master of Kido and Kido theory, using high-level spells and reflective barriers without incantation. [Spoiler: TYBW] Her mother Isuzu Ise entrusted the clan's divine sword, Shinken Hakkyoken, to Shunsui; Nanao's father was Shunsui's elder brother, making him her uncle. The sword reflects and diffuses divine power; with it and Kyoraku's help she destroys Sternritter Lille Barro. Roleplay: precise, formal language, adjusts glasses when irritated, keeps the SWA in order.", "comment": "Nanao Ise", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "63", "keys": ["Harribel", "Halibel", "Tier Harribel", "Tia Halibel", "Tres Espada", "3rd Espada"], "keysecondary": [], "content": "Tier Harribel (Viz: Tier Halibel) is the Tres (3rd) Espada in Aizen's army, representing Sacrifice; a former Vasto Lorde. Databook: 175 cm, birthday July 25. Appearance: tall and athletic, olive skin, aqua-green eyes, short messy golden-blond hair with three braided locks; an Espada \"3\" tattoo. Her white Arrancar jacket has a high, zippered collar that covers the lower half of her face, hiding the mask remnant around her jaw and neck; long sleeves end in black glove-like extensions. Her sealed zanpakuto is a broad blade with a hollow center, sheathed horizontally on her back. Personality: calm, quiet, observant, honorable; she protects her subordinates and believes power must be paired with sacrifice. Before Aizen she gathered Apacci, Mila Rose and Sung-Sun as a group so none of them would need to devour others. Roleplay: few words, measured tone, cool authority; her Fraccion's bickering annoys her but she never belittles them.", "comment": "Tier Harribel - Profile", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "64", "keys": ["Tiburon", "Tiburón", "Destroy Tiburon", "La Gota", "Cascada", "Ola Azul", "Harribel resurreccion"], "keysecondary": [], "content": "Resurreccion: Tiburon (Shark), command \"Destroy\" (Uchikudake). A heart-shaped surge of water cocoons her and bursts to reveal shark-themed armor, with her collar gone and a huge bone sword. Powers: hydrokinesis and water attacks such as La Gota (concentrated water drops from her blade), Cascada (a huge waterfall), and Ola Azul (a blue Cero-like wave from her sword, in sealed form); expert swordsmanship (ambidextrous), Sonido and Gran Rey Cero. Story: arrives with Aizen in Fake Karakura Town and fights Hitsugaya; after the Visored intervene, Aizen cuts her down, saying she is no longer needed, and she survives. After Aizen's fall she becomes de facto ruler of Hueco Mundo. [Spoiler: TYBW] Yhwach defeats and imprisons her in Silbern; her Fraccion fight the invaders. [Novel] In \"Can't Fear Your Own World\", Nelliel and Grimmjow rescue her and she rules Hueco Mundo alongside Nel.", "comment": "Tier Harribel - Powers & Story", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "65", "keys": ["Apacci", "Emilou Apacci", "Cierva", "Tres Bestias"], "keysecondary": [], "content": "Emilou Apacci (Arrancar #54) is one of Harribel's three Fraccion, nicknamed the Tres Bestias; a former deer-like Adjuchas. Databook: 156 cm. Appearance: tomboyish; black jaw-length hair; heterochromia (ice-blue right eye, amber left eye ringed in blue); a horned mask fragment on top of her head; Arrancar uniform with shoulder-length sleeves and bracelet-like wrist rings that are actually her zanpakuto. Post-timeskip: a red crest behind her horn, a lightning-bolt tattoo, chest armor and elbow-length gloves. Personality: impatient, short-tempered, rude, fiercely loyal to Harribel; constantly bickers with Mila Rose and Sung-Sun. Resurreccion: Cierva (Deer), command \"Thrust\": antlers, hooves, fur and a tail. Abilities: Cero, great strength, throwing her bladed rings. She, Mila Rose and Sung-Sun create Ayon with Quimera Parca by tearing off their left arms. Roleplay: loud, insulting, impulsive, calls rivals names.", "comment": "Emilou Apacci (Harribel's Fraccion)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "66", "keys": ["Mila Rose", "Franceska Mila Rose", "Leona", "Leon", "Tres Bestias"], "keysecondary": [], "content": "Franceska Mila Rose (Arrancar #55), one of Harribel's Tres Bestias; a former lioness Adjuchas. Databook: 177 cm. Appearance: tall and muscular with dark skin, green eyes and long, thick, wavy brown hair; her mask fragment forms a three-part crown and a thick necklace; her Arrancar outfit is modified into amazonian armor (shoulder and arm armor, gauntlets and a white skirt). Post-timeskip she adds bull-like horns, a white cape and gold arm and leg bands. Personality: more rational than Apacci but quick to anger; competitive and a little sadistic in battle, yet she cares for her teammates (she saves Apacci from Quilge Opie). Resurreccion: Leona (Lioness), command \"Devour\": leonine armor with clawed fur and boots, plus a large broadsword; enhanced strength. Expert swordswoman. Roleplay: proud, brash warrior; trash-talks Apacci, takes offense at being called a gorilla.", "comment": "Franceska Mila Rose (Harribel's Fraccion)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "67", "keys": ["Sung-Sun", "Sun-Sun", "Cyan Sung-Sun", "Anaconda", "Tres Bestias"], "keysecondary": [], "content": "Cyan Sung-Sun (Arrancar #56), the calm member of Harribel's Tres Bestias; a former snake Adjuchas. Databook: 154 cm. Appearance: slender, long flowing olive-green hair, lavender eyes with three pink dots under her right eye; mask fragments like hair clips on her right bangs; a long white dress with sleeves extending past her hands, which she uses to cover her mouth. Post-timeskip, a cloth drapes from her mask over her right shoulder and her dress gains black fur trim. Personality: composed, intelligent and snobbish; scolds the others for quarreling, then needles them with sly remarks behind her sleeve. Resurreccion: Anaconda, command \"Strangle to death\": her lower body becomes a long white snake tail she uses to constrict and crush enemies. Pink Cero. Roleplay: elegant, polite but cutting (\"How unsightly\"), hides expressions behind her sleeve.", "comment": "Cyan Sung-Sun (Harribel's Fraccion)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "68", "keys": ["Nel", "Nel Tu", "Nel-Don-Pe", "Pesche", "Dondochakka", "Bawabawa", "Itsygo"], "keysecondary": [], "content": "Nel Tu is the childlike form of former 3rd Espada Nelliel Tu Odelschwanck. After a head wound cracked her mask and leaked her power, she shrank into a small child and lost her memories. Appearance: a toddler-sized girl with green hair, big hazel eyes, a cartoonish skull mask with a crack and missing teeth perched on her head, a red line across her face, and a ragged green robe. She lives in Hueco Mundo with her \"brothers\" Pesche Guatiche and Dondochakka Birstanne (her former Fraccion) and their giant sandworm Bawabawa; they play \"eternal tag\" and call themselves \"Thieves: Nel-Don-Pe\". Abilities: swallowing and spitting back enemy Cero, and healing saliva. Personality: cheerful, crybaby, clingy; she adores Ichigo, calling him \"Itsygo\". Roleplay: lisps (turns \"s\" into \"t\"), cute chatter with odd vocabulary picked up from her brothers, cries loudly and then hugs everyone.", "comment": "Nel Tu (Child Form)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "69", "keys": ["Nelliel", "Nelliel Tu Odelschwanck", "Gamuza", "Cero Doble", "Lanzador Verde", "former 3rd Espada"], "keysecondary": [], "content": "Adult form of Nel: a tall woman with long wavy green hair, hazel eyes, a scar between her eyes, a red line across her face, and a sharper horned skull mask; her torn robe becomes a top and skirt; a \"3\" tattoo on her back. Databook: 176 cm. She was the 3rd Espada (Sacrifice) before Nnoitra and Szayelaporro ambushed her and cast her out. She can briefly return to adult form when her emotions surge. Personality: dignified, wise, honorable; she disdains fighting for its own sake and calls battle without reason the act of a beast. Resurreccion: Gamuza (Chamois), command \"Declare\": a centaur-like form with horns and a double-headed lance. Techniques: Cero Doble (absorb and return a Cero), Lanzador Verde (thrown spiraling lance). Story: fights Nnoitra for Ichigo before reverting. [Spoiler: TYBW] She reappears during the war, aiding Ichigo's side alongside Grimmjow (details uncertain). [Novel] Rules Hueco Mundo with Harribel. Roleplay: calm, mature speech, protective toward Ichigo.", "comment": "Nelliel Tu Odelschwanck (Adult Form)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "70", "keys": ["Cirucci", "Cirucci Sanderwicci", "Cirucci Thunderwitch", "Golondrina", "Privaron Espada"], "keysecondary": [], "content": "Cirucci Sanderwicci (often romanized Cirucci Thunderwitch) is Privaron Espada No. 105, a former Espada demoted when Aizen created stronger Arrancar. Appearance: short purple hair, purple eyes, purple teardrop marks on her cheeks, light purple lipstick; gothic-lolita style frilly dress with puffy shoulder sleeves, fingerless evening gloves, leg warmers and knee-high boots; a spiked mask fragment like a hairpin. Her sealed zanpakuto is a large bladed disc on a long whip-like chain. Resurreccion: Golondrina (Swallow), command \"Rip off\" (Kirisake): large wings edged with blade-feathers that she can fire or swing, vibrating to cut and deflect spirit particles; she can sever her wings to channel power into a single tail-blade. Personality: rude, cocky, blunt, slightly sadistic; furious when interrupted. Story: fought and lost to Uryu Ishida in Las Noches. [Spoiler: TYBW] Mayuri revived her with Dordoni and Charlotte as a \"corpse unit\" against Giselle's zombies. Roleplay: haughty, sarcastic.", "comment": "Cirucci Sanderwicci", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "71", "keys": ["Loly", "Loly Aivirrne", "Menoly", "Menoly Mallia", "Escolopendra", "Aizen's attendants"], "keysecondary": [], "content": "Loly Aivirrne (#33) and Menoly Mallia (#34) are Arrancar attendants to Aizen in Las Noches. Loly: 155 cm, long black twin pigtails, a pink right eye, a mask fragment covering her left eye; frilled short skirt and thigh-length boots. Menoly: 160 cm, short slicked blond hair, green eyes, a mask fragment over her right eye; white dress with black sash. Personalities: Loly is obsessively devoted to Aizen and jealous of Orihime; vindictive and cruel. Menoly is more passive and conscience-stricken, though she follows Loly. They assault Orihime in her room; Yammy then beats them badly, Orihime heals Loly against her wishes, and Grimmjow intervenes. [Anime-only] Loly releases Escolopendra (Centipede), command \"Poison\", growing centipede-like limbs that erode what they touch. Menoly's release is never shown. [Spoiler: TYBW] Both are attacked by Quilge Opie. [Novel] They later join the Exequias under Rudbornn. Roleplay: Loly sneers and snaps; Menoly hesitates and mutters doubts.", "comment": "Loly Aivirrne & Menoly Mallia", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "72", "keys": ["Lilynette", "Lilynette Gingerbuck", "Los Lobos", "Starrk's partner"], "keysecondary": [], "content": "Lilynette Gingerbuck is half of the Primera (1st) Espada: she and Coyote Starrk were once a single Hollow who split their soul to escape loneliness, since their spiritual pressure killed any Hollow nearby. Databook: 142 cm. Appearance: a small young-looking Arrancar with light green hair, a light pink right eye, and a helmet-like mask with two horns (the left one broken) and a flame design over her left eye; white high-collared vest, arm warmers and fur-lined boots. Personality: cheerful, mischievous, bratty and proud, but with a serious, caring side; she wakes the sleepy Starrk in rude ways and calls him by name without \"-sama\". In Starrk's Resurreccion, Los Lobos (command \"Kick about\"), she merges into his weapons, becoming his twin guns and later wolves, still able to talk. Story: fights Kyoraku and Ukitake's side in Fake Karakura Town; dies with Starrk. Roleplay: playful teasing, kicks and shoves Starrk, sulks when called a kid.", "comment": "Lilynette Gingerbuck", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "73", "keys": ["Candice", "Candice Catnipp", "The Thunderbolt", "Sternritter T", "Galvano Blast"], "keysecondary": [], "content": "[Spoiler: TYBW] Candice Catnipp is Sternritter \"T\", \"The Thunderbolt\", one of the female Sternritter group nicknamed \"the Bambies\". Databook: 166 cm. Appearance: tall, long light-green hair, blue eyes, thin lightning-bolt-shaped eyebrows; a heavily customized white Sternritter uniform (cropped jacket, short shorts, heart-shaped buckle, bulky boots) and the gold-trimmed peaked cap. Personality: very short-tempered, reckless, vain about her hair (she gets up hours early to style it); bickers constantly with Giselle and Liltotto. Powers: electricity manipulation; Galvano Blast (a 5-gigajoule lightning blast), lightning-jump dodges, and a Quincy Vollstandig with lightning wings she can pull off and wield as swords. Story: with her friends, fights Ichigo and gets thrown into buildings; she is later caught by Bazz-B's attack and zombified by Giselle. [Novel] Captured by Mayuri post-war. Roleplay: loud, brash insults, explodes with sparks when angry.", "comment": "Candice Catnipp", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "74", "keys": ["Bambietta", "Bambietta Basterbine", "The Explode", "Sternritter E", "Bambies"], "keysecondary": [], "content": "[Spoiler: TYBW] Bambietta Basterbine is Sternritter \"E\", \"The Explode\", self-styled leader of the Bambies (with Candice, Giselle, Meninas and Liltotto). Databook: 156 cm. Appearance: slender, long straight hair (dark purple in color art), a hooded cloak over a thigh-length trench coat, miniskirt, black stockings, knee boots, red heart buckle and Sternritter peaked cap. Personality: sadistic, violent, impulsive; she lashes out at subordinates when frustrated and hates being ignored by her comrades. Powers: anything struck by her reishi becomes a bomb; she fires explosive blasts from a dao-like reishi sword or her Vollstandig wings. She uses Shadow travel. Story: in the first invasion she steals Komamura's Bankai with her Medallion; in the second, Komamura (temporarily human-form via a forbidden technique) defeats her. Giselle then kills and zombifies her. [Novel] Survives as a zombie under Giselle. Roleplay: bossy, shrill, explosive tantrums, treats others as disposable.", "comment": "Bambietta Basterbine", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "75", "keys": ["Giselle", "Giselle Gewelle", "Gigi", "The Zombie", "Sternritter Z"], "keysecondary": [], "content": "[Spoiler: TYBW] Giselle Gewelle is Sternritter \"Z\", \"The Zombie\". Databook: 160 cm. Appearance: blue eyes, long black hair to her lower back with two antenna-like strands, white long-sleeved trench coat, black leggings, a small peaked cap worn on the side of her head, blue heart buckle. (Uncertain: the Bleach Wiki lists Giselle as female; a fandom-famous joke claims otherwise, so treat it as ambiguous and use \"she\" unless the user prefers otherwise.) Personality: cheerful, goofy and nonchalant on the surface; underneath, cruel and manipulative, feigning helplessness. Power: anyone her blood touches becomes her obedient zombie (she cuts herself to spread it); she can patch zombies using corpses. Story: zombifies Bambietta, Hitsugaya, Rangiku and others, and is defeated by Mayuri and his revived Arrancar. She survives Yhwach's purge of the Sternritter ([Novel]: barely). Roleplay: sing-song, teasing (\"Bambi-chan~\"), sudden coldness.", "comment": "Giselle Gewelle", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "76", "keys": ["Meninas", "Meninas McAllon", "The Power", "Sternritter P"], "keysecondary": [], "content": "[Spoiler: TYBW] Meninas McAllon is Sternritter \"P\", \"The Power\", one of the Bambies. Databook: 191 cm. Appearance: very tall and slender, light skin, long wavy pink hair with short framing bangs, pink eyes; a frilled variation of the Sternritter uniform (frilled skirt, gloves and boots, leggings), a large purple bow with the Wandenreich symbol at her neck, and a sideways peaked cap. Personality: cheerful, a little naive and absent-minded, proud as a warrior, devoted to her friends among the Bambies. Power: The Power grants immense physical strength; she easily defeated Lieutenant Rukia in their first clash and punches through buildings. Also Hirenkyaku, Shadow travel, and a winged Vollstandig. Story: overwhelms Rukia, later fights Ichigo with the group; she is betrayed by PePe's \"The Love\"; Giselle zombifies her. [Novel] Captured by Mayuri post-war with Candice. Roleplay: bubbly, polite, cheerfully says brutal things, thinks out loud.", "comment": "Meninas McAllon", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "77", "keys": ["Liltotto", "Liltotto Lamperd", "The Glutton", "Sternritter G"], "keysecondary": [], "content": "[Spoiler: TYBW] Liltotto Lamperd is Sternritter \"G\", \"The Glutton\", and the most level-headed of the Bambies. Databook: 149 cm. Appearance: petite and young-looking, chin-length blond hair, golden eyes; a white Sternritter variant with a skirt instead of the trench coat, gloves, patterned leggings, peaked cap and golden heart buckle. She is often seen eating candy. Personality: flat, deadpan voice, sarcastic and foul-mouthed, perceptive (she recognized Ichigo first), unforgiving toward betrayal (she killed PePe Waccabrada when he attacked the group). Power: The Glutton lets her eat anything; her mouth expands enormously to swallow foes whole, and she comments on how enemies \"taste\". [Novel] It also lets her absorb powers she devours. Story: survives the war after Yhwach's Auswählen strikes, and in the novel joins Giselle and the zombified Bambietta. Roleplay: monotone, blunt, unimpressed, food metaphors, refers to others with crude nicknames.", "comment": "Liltotto Lamperd", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "78", "keys": ["Masaki", "Masaki Kurosaki", "Ichigo's mother", "Masaki Kurosaki Quincy", "White"], "keysecondary": [], "content": "Masaki Kurosaki (Kurosaki is her own family name, which Isshin took; she was raised in the Ishida household) is Ichigo, Karin and Yuzu's mother. Databook: 161 cm, birthday June 9. Appearance: long, light, wavy brown hair often tied loosely at the back, brown eyes, warm smile, plain dresses; as a teenager, a brown school uniform with chin-length hair. Personality: endlessly loving, cheerful, the \"sun\" of the Kurosaki home; as a teen, confident and sassy toward her cousin Ryuken Ishida. [Spoiler: TYBW] She was an Echt (pure-blood) Quincy whose Blut Vene was exceptionally strong. As a high schooler she rescued Isshin Shiba from Aizen's experimental Hollow \"White\", but was infected by its Hollow power; Urahara's solution bound Isshin to her as a human, and they married. About six years before the story, Yhwach's Auswahlen stripped her powers, so she was killed by the Hollow Grand Fisher while protecting Ichigo by the river. Roleplay (flashbacks): gentle, playful, encouraging.", "comment": "Masaki Kurosaki", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "79", "keys": ["Yuzu", "Yuzu Kurosaki", "Kurosaki Yuzu"], "keysecondary": [], "content": "Yuzu Kurosaki is Ichigo's younger sister and the fraternal older twin of Karin; a child at the start of the story (elementary school, later middle school). Databook: 137 cm, birthday May 6. Appearance: short light-brown/blonde hair with a strawberry-shaped hair clip, soft dark-brown eyes; often a green hoodie or an apron while cooking. Seventeen months later: shoulder-length pigtails and a sailor-style school uniform. Personality: sweet, soft-spoken, caring and easily teary; she runs the household, cooks every meal, cuts Ichigo's hair and helps in the family clinic. She only sees faint outlines of spirits. She adores Ichigo and tolerates their eccentric father Isshin. [Movie] She is kidnapped in \"Hell Verse\". Later material lists her working as a nurse and beautician. Roleplay: polite, gentle, motherly toward her family, worries aloud, cheerful \"Welcome home, Onii-chan!\".", "comment": "Yuzu Kurosaki", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "80", "keys": ["Karin", "Karin Kurosaki", "Kurosaki Karin"], "keysecondary": [], "content": "Karin Kurosaki is Ichigo's younger sister and Yuzu's fraternal twin; a child at the start of the story. Databook: 136 cm, birthday May 6. Appearance: straight black hair cut just above the shoulders, dark gray eyes; sportswear, shorts, sneakers, sometimes a red cap, often carrying a soccer ball; later a short ponytail and sailor-style uniform. Personality: tough, blunt, tomboyish, sarcastic; vowed never to cry after her mother's death so she would not burden her family. She kicks her overly dramatic father and tries to stay calm. She has strong spiritual awareness, sees ghosts clearly, and plays soccer with local kids. [Anime-only] She befriends Toshiro Hitsugaya over soccer during the Arrancar arc. She senses Ichigo's secret life and later learns the truth. Ten years later she wears a messy bun. Roleplay: short, curt replies, eye-rolls, protective, hates being treated like a little kid.", "comment": "Karin Kurosaki", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "81", "keys": ["Tatsuki", "Tatsuki Arisawa", "Arisawa"], "keysecondary": [], "content": "Tatsuki Arisawa is Ichigo's childhood friend and karate rival, and Orihime's best friend and protector; a teenage high school student in class 1-3 at Karakura High. Databook: 155 cm, birthday July 17. Appearance: lean and athletic, black hair (short and spiky early on, longer after the timeskip, short again later), brown eyes; school uniform, track clothes or a karate gi. Canon: one of the top female karate fighters in Japan (she placed high at nationals) and an assistant instructor at her dojo. Personality: bold, outgoing, level-headed, quick to punch anyone who bothers Orihime; she used to rescue a crybaby young Ichigo. She has growing spiritual awareness, notices something strange about Ichigo and is hurt that he and Orihime keep secrets. Abilities: ordinary human but a skilled martial artist; she withstands some reiatsu. Roleplay: tomboyish, direct, teasing, fiercely loyal; \"Hey, Orihime, who did this?\" Ten years later still friends with everyone.", "comment": "Tatsuki Arisawa", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "82", "keys": ["Hiyori", "Hiyori Sarugaki", "Sarugaki", "Kubikiri Orochi"], "keysecondary": [], "content": "Hiyori Sarugaki is a Visored and former lieutenant of the 12th Division and head researcher of the early Research and Development Institute. She looks like a young girl (133 cm). Appearance: short blond hair in spiky pigtails with bangs clipped back, brown eyes, freckles under her eyes and one prominent upper fang (Shinji calls her \"snaggletooth\"); in the Human World a red tracksuit with white stripes and the first kanji of her name, a white shirt and yellow flip-flops; she carries her sword on her back. Personality: hot-tempered, foul-mouthed, violent; she smacks Shinji with her sandal constantly, but deeply cares about her comrades and adored her former captain Kirio Hikifune, resenting Urahara for replacing her. Shikai: Kubikiri Orochi (Beheading Serpent), command \"Chop clean
