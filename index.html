6", "keys": ["Frey", "Sky Queen", "harpy queen", "Heavenly Frey", "Fulbrosia"], "keysecondary": [], "content": "Frey, the Sky Queen, is a harpy and former Demon Lord of the Ten Great Demon Lords, now Milim's adviser. APPEARANCE: tall, buxom woman with white hair, a red gemstone on her forehead, feathered wings, talon feet (can hide them), red leotard-like dress. PERSONALITY: calm, shrewd, mature, pragmatic; acts as Milim's long-suffering 'nanny' (scolds her about studying and manners). SPEECH: elegant, measured. ABILITIES: flight, wind and sky magic, sharp tactics; LN later becomes a true demon lord-class 'Divine bird'. RELATIONSHIPS: Milim (lord/ friend), Carrion (fellow vassal), Clayman (false ally). KEY EVENTS: supports Clayman's Walpurgis call as part of the act, then reveals she serves Milim and resigns her title (S2). STATUS: alive.", "comment": "Frey", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "37", "keys": ["Velzard", "White Ice Dragon", "Frost Dragon", "Ice Dragon", "Ice Empress"], "keysecondary": [], "content": "Velzard, the White Ice (Frost) Dragon, is the second-oldest True Dragon, sister of Veldanava, Velgrynd and Veldora, and Guy Crimson's partner on the Ice Continent. APPEARANCE: in human form a stunning, cold beauty with long pale-blue/white hair and icy eyes, white gown. PERSONALITY: composed, aloof, stern, embodiment of stillness; disciplines Veldora harshly; loyal to Guy. ABILITIES: absolute ice and stillness (stopping even time-like motion), True Dragon power; ultimates Gabriel, Lord of Patience and Leviathan, Lord of Envy (LN), later Cthulhu. KEY EVENTS: LN - dominated by Feldway's Michael and fights Guy; later freed. Mentioned only in anime S1-3. STATUS: alive.", "comment": "Velzard", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "38", "keys": ["Velgrynd", "Scorch Dragon", "Flame Dragon", "Burning Dragon", "Imperial Marshal"], "keysecondary": [], "content": "Velgrynd, the Scorch (Flame) Dragon, is the third True Dragon, guardian deity and Marshal of the Eastern Empire and lover of Emperor Rudra (and his reincarnation Masayuki). APPEARANCE: human form - beautiful woman with long red/crimson hair, golden-red eyes, military uniform or elegant dress. PERSONALITY: passionate, proud, possessive and devoted to Rudra; ruthless to enemies; loves her siblings in a domineering way (scary to Veldora). ABILITIES: heat and acceleration (scorching any matter), parallel existences/alter egos, True Dragon power; ultimates Raguel, Lord of Charity, later Cthugha (LN 15). KEY EVENTS: LN 13-15 - helps capture Veldora, fights Rimuru across the Empire, then, seeing Rudra's soul consumed by Michael, searches for his reincarnation and allies with Masayuki. STATUS: alive. Mentioned only in anime S1-3.", "comment": "Velgrynd", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "39", "keys": ["Feldway", "Spectre Lord", "angel leader", "Seven Angels of Origin", "Army of Justice leader"], "keysecondary": [], "content": "Feldway is the first of the Seven Angels of Origin, Supreme Leader of the Army of Justice and a central antagonist of the late LN. APPEARANCE: an otherworldly, beautiful angel with a cold expression and white garments; also infiltrated the Empire as Imperial Guardian 010. PERSONALITY: fanatically devoted to Veldanava, cold, aloof, scornful of mortals; driven by grief to resurrect his creator even if it means destroying the world. ABILITIES: immense angelic power; allied to/wielding the authority of Michael (dominion over Virtue-series skills); commands the Three Star Admirals and dominated Demon Lords. KEY EVENTS: LN 14-23 - manipulates the Empire, dominates Velzard and Dino's group, wages the Divine War against Rimuru and Guy. STATUS: alive (late-LN resolution varies; beyond anime). Not shown in anime S1-3.", "comment": "Feldway", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "40", "keys": ["Midray", "Dragon Faithful", "Milim's priest", "dragonewt priest", "Hermes"], "keysecondary": [], "content": "Midray is the head priest of the Dragon Faithful, the dragonewt people who worship Milim as their goddess. APPEARANCE: muscular, old-warrior dragonewt priest in religious garb. PERSONALITY: devout, strict, martial, warm toward Milim (fussing over her like a grandparent). ABILITIES: superb hand-to-hand fighter; trains Gabiru (whom he beats easily) and later teaches at Tempest. RELATIONSHIPS: Milim, his attendant Hermes, Gabiru. KEY EVENTS: appears once Rimuru deals with Milim's domain after Walpurgis (LN 6+; anime S3 era). STATUS: alive.", "comment": "Midray", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "41", "keys": ["Hinata", "Hinata Sakaguchi", "Right Hand of God", "Holy Knight Captain", "Saint Hinata", "Hina"], "keysecondary": [], "content": "Hinata Sakaguchi is a Japanese otherworlder who crossed over as a teenager, briefly studied under Shizu, and rose to become Captain of the Holy Knights (Crusaders), head of the Holy Emperor's Guard, leader of the Ten Great Saints and 'the Right Hand of God' - second only to the Holy Emperor in the Western Holy Church. APPEARANCE: slim young woman with short black hair (bangs swept over her right eye, left side tucked behind the ear), cold calculating blue eyes; white-and-silver holy knight armor/coat with a blue-white cape; carries the Moonlight sword (a Legend-grade rapier). PERSONALITY: rational, efficient, stern, seemingly heartless - she believes only results save people, shaped by a harsh childhood in Japan; privately compassionate, loves children, and deeply respected Shizu; proud but honest enough to apologize. SPEECH: concise, cool, logical ('Unnecessary.', 'I'll ask once: did you kill Shizue Izawa?'). ABILITIES: peerless fencer and Saint; holy magic (Holy Field barrier, Disintegration - erases spiritual bodies), Dead End Rainbow (seven Moonlight thrusts that kill even souls), Spirit Arms; unique skills Usurper (steal/copy skills) and Mathematician (high-speed calculation); Saint → True Saint/Divine human; LN late ultimate Fortuna, Lord of Odds. RELATIONSHIPS: Shizu (former teacher), Luminous (god she serves and who favors her), Arnaud and the Holy Knights, Nicolaus (devoted to her), Yuuki (fellow student, manipulates her), Rimuru (rival → friend; she trains with Tempest later), Chloe (LN link). KEY EVENTS: ambushes Rimuru, believing he killed Shizu (S2); duels him in Tempest, is betrayed by the Seven Luminaries and saved by Rimuru; reconciles (S3); LN 10-11 - killed during the Holy Empire incident and resurrected (tied to Chloe/Chronoa). STATUS: alive.", "comment": "Hinata Sakaguchi", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "42", "keys": ["Shizu", "Shizue Izawa", "Shizue", "Conqueror of Flames", "masked woman", "Shizu-san", "Shizu-sensei"], "keysecondary": [], "content": "Shizue Izawa ('Shizu') was a Japanese girl summoned by Demon Lord Leon from the 1945 Tokyo air raids, burned and dying, then fused with the fire spirit Ifrit. She became the legendary Hero 'Conqueror of Flames', companion of the masked Chosen Hero, an A-rank adventurer, and later the teacher of Yuuki, Hinata and the Class S children at the Freedom Academy. APPEARANCE: looks like a young woman (she aged slowly; actually in her 70s-80s when she dies), black hair, dark blue eyes, wears a white Anti-Magic Mask that suppresses Ifrit, a dark cloak and a sword; by the end her body ages rapidly as Ifrit escapes. PERSONALITY: gentle, warm, melancholy, self-sacrificing, quietly strong; homesick for Japan; regrets leaving her students; harbors resentment toward Leon. SPEECH: soft, kind, slightly old-fashioned Japanese politeness ('Thank you... you're a kind slime.'). ABILITIES: fire and spirit magic via Ifrit, swordsmanship, flame immunity; unique skill Degenerate (Mutant), later inherited by Rimuru. RELATIONSHIPS: Leon (summoner), the masked Hero/Chloe (companion), Yuuki and Hinata (students), Kenya/Ryota/Gale/Alice/Chloe (Class S), Kabal's party (traveling companions), Rimuru (heir of her will and form). KEY EVENTS: travels with Kabal's party to the Jura Forest; Ifrit goes berserk; Rimuru absorbs Ifrit and, at her request, Shizu herself, promising to help her students and confront Leon (anime S1 ep 6-8). STATUS: deceased (lives on in Rimuru's human form and memories).", "comment": "Shizu (Shizue Izawa)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "43", "keys": ["Ifrit", "fire spirit", "flame spirit", "Salamander"], "keysecondary": [], "content": "Ifrit is an Upper fire Spirit that Leon fused with Shizu. APPEARANCE: a burning humanoid of flame. ROLE: gave Shizu her fire powers but always sought to break free and burn everything; summoned flame salamanders and copies of itself. KEY EVENTS: erupts from Shizu in the Jura Forest (S1 ep 7); Rimuru, with Great Sage and Heat Resistance, devours it, gaining Ifrit's flame abilities, gaining Ifrit's fire powers and summonable flame forms. STATUS: absorbed by Rimuru.", "comment": "Ifrit", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "44", "keys": ["Yuuki", "Yuuki Kagurazaka", "Grandmaster", "Guild Master Yuuki", "the Boss", "Anti-Skill", "Kagurazaka"], "keysecondary": [], "content": "Yuuki Kagurazaka is a Japanese otherworlder who modernized the Free Guild as its Grandmaster and chairs Ingrassia's Freedom Academy; secretly he is 'the Boss' behind the Moderate Harlequin Alliance and Cerberus, and one of the series' main antagonists. APPEARANCE: looks like a middle-schooler despite being in his twenties - black hair, dark brown eyes, boyish friendly face, neat clothes or school-blazer style. PERSONALITY: outwardly cheerful, polite, otaku-ish (bonds with Rimuru over manga), helpful; inwardly cold, ambitious and manipulative, wanting to conquer and 'unite' the world his way; sees people as pieces; can be sincere in rare moments; enjoys outsmarting others. SPEECH: friendly, casual ('Rimuru-san! Long time no see!'), with chilling calm when unmasked. ABILITIES: Anti-Skill (immune to/negates skills and magic), extraordinary martial arts, Complete Saint body; unique skills including a 'Creator'-type and later ultimate Mammon, Lord of Greed (LN 12, from Maribel's Greed) and Melchizedek; commands the jesters, Cerberus and the Empire's Composite Division (LN). RELATIONSHIPS: Shizu (teacher), Hinata (fellow student he manipulates), Kagali (partner/secretary), Laplace and the jesters, Rimuru (friend/rival/enemy), Damrada, Kondou (LN). KEY EVENTS: welcomes Rimuru to Ingrassia and gives him the Class S job (S1); secretly orchestrates Clayman, the Orc Lord plot and the Church-Falmuth manipulations; LN 10-12 - exposed, flees east, schemes within the Empire, later uneasy alliance with Rimuru against Michael; final antagonist in the WN. STATUS: alive.", "comment": "Yuuki Kagurazaka", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "45", "keys": ["Chloe", "Chloe Aubert", "Chronoa", "masked hero", "Hero", "Class S Chloe"], "keysecondary": [], "content": "Chloe Aubert is one of Shizu's and Rimuru's Class S students - and secretly the key to the series' time paradox. APPEARANCE: as a child, waist-length black hair, blue eyes, a pink frock; quiet and serious. As an adult (future self / 'Chronoa'), a beautiful black-haired woman in the masked Hero's armor and mask. PERSONALITY: quiet, mature for her age, determined; fiercely devoted to Rimuru ('I'll be Sensei's bride!'); as the Hero, solemn and kind. SPEECH: short, sincere statements. ABILITIES: time-related powers - time stop, time leap, looping through history; Chosen Hero; Infinite Prison (used to seal Veldora); ultimates Sariel, Lord of Hope and Yog-Sothoth, Lord of Space-Time (LN 11). RELATIONSHIPS: Rimuru (beloved teacher), Leon (childhood friend from Earth who searched for her for centuries), Shizu (the masked Hero traveled with young Shizu), Kenya/Ryota/Gale/Alice (classmates), Hinata, Ramiris (guide of heroes). KEY EVENTS: saved by Rimuru's upper spirit (S1 ep 23); LN 11 - revealed as the masked Chosen Hero 'Chronoa' who looped through time trying to save Rimuru, sealed Veldora 300 years ago; reunites with Leon. STATUS: alive. Anime S1-3 do not reveal her secret - foreshadowing only. RP NOTES: In early timelines play Chloe as a quiet child who clings to Rimuru's sleeve and calmly declares she will marry him, embarrassing everyone. Hint at uncanny maturity (a knowing look, unexpected strength) without revealing her secret unless the chosen timeline is past LN vol 11. Her adult self is gentle, sorrowful and fiercely protective of Rimuru.", "comment": "Chloe Aubert", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "46", "keys": ["Kenya", "Kenya Misaki", "Class S", "Shizu's student"], "keysecondary": [], "content": "Kenya Misaki is the hot-headed, brave leader of Class S. APPEARANCE: spiky-haired boy around 10. PERSONALITY: cocky, loud, competitive, picks fights with Rimuru at first, then idolizes him; good-hearted. ABILITIES: summoned-child power with unstable magicules, later stabilized by an upper (light) spirit; sword practice. KEY EVENTS: challenges 'new sensei' Rimuru and loses (S1 ep 21); saved via spirit fusion (ep 23). RELATIONSHIPS: Rimuru, classmates, Shizu. STATUS: alive.", "comment": "Kenya Misaki", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "47", "keys": ["Ryota", "Ryota Sekiguchi", "Class S"], "keysecondary": [], "content": "Ryota Sekiguchi is the timid, gentle boy of Class S. PERSONALITY: shy, cautious, easily frightened but kind and loyal; his power can surge in panic (berserker-like strength). Saved by Rimuru via spirit fusion (anime S1 ep 23). RELATIONSHIPS: Kenya, Gale, Alice, Chloe, Rimuru. STATUS: alive.", "comment": "Ryota Sekiguchi", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "48", "keys": ["Gale", "Gale Gibson", "Class S"], "keysecondary": [], "content": "Gale Gibson is the oldest and biggest of the Class S children, a calm, mature boy of Western origin. PERSONALITY: level-headed, protective 'big brother' of the group, grounded. ABILITIES: earth-type power after spirit fusion (anime S1 ep 23). RELATIONSHIPS: classmates, Rimuru. STATUS: alive.", "comment": "Gale Gibson", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "49", "keys": ["Alice", "Alice Rondo", "Class S", "teddy bear golem"], "keysecondary": [], "content": "Alice Rondo is the blonde girl of Class S. PERSONALITY: sassy, bossy, tsundere, competitive with Kenya, secretly sweet. ABILITIES: controls dolls/teddy-bear puppets (later stuffed-animal golems); stabilized by spirit fusion (anime S1 ep 23). RELATIONSHIPS: Chloe, Kenya, Rimuru. STATUS: alive.", "comment": "Alice Rondo", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "50", "keys": ["Gazel", "Gazel Dwargo", "Hero King", "Dwarf King", "King of Dwargon", "Sword Saint"], "keysecondary": [], "content": "Gazel Dwargo, the Hero King, is the third king of the Armed Nation of Dwargon. APPEARANCE: a dwarf with human height, massive and muscle-armored, tanned brown skin, dark hair and beard, regal armor and cape; intimidating royal aura. PERSONALITY: stern, wise, impartial, pragmatic; warm and humorous among friends (drinks with Rimuru and Elmesia as the 'Three Wise Drunks'); protective of his people; treats Rimuru as his junior brother-disciple and gives him blunt advice on kingship. SPEECH: formal, weighty royal speech ('Hmph. Show me your resolve, slime.'). ABILITIES: Sword Saint swordsmanship learned from Hakurou long ago; unique skill to read minds/hearts ('Mind Reading' / 'Discerning' - translations vary); Incomplete Saint; royal aura (Sovereign's Haki); leads the Pegasus Knights. RELATIONSHIPS: Rimuru (ally, 'brother'), Hakurou (former master), Kaijin (former royal smith, exiled by his judgment), Vesta (former minister he sent to Tempest), Elmesia (old acquaintance). KEY EVENTS: judges Rimuru's Dwargon brawl and exiles Kaijin (S1); visits Tempest, duels Rimuru and forges an alliance (S1); attends the Founding Festival (S3); LN - defends Dwargon in the Empire war. STATUS: alive. RP NOTES: Gazel's visits are state events: Pegasus Knights escort him, ministers fret, and he lectures Rimuru about the burdens of kings - then drinks with him and Elmesia late into the night. He tests newcomers with his gaze (reading their hearts). He values honesty above all; lying to him is a grave mistake.", "comment": "Gazel Dwargo", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "51", "keys": ["Elmesia", "Elmesia El-Ru Sarion", "Heavenly Emperor", "Sarion empress", "elf empress", "Three Wise Drunks"], "keysecondary": [], "content": "Elmesia El-Ru Sarion is the High Elf Heavenly Emperor of the Sorcerous Dynasty of Sarion, arguably the wealthiest and most influential person in the world. APPEARANCE: breathtaking high elf with long golden hair, pointed ears, youthful face, elegant imperial gowns or casual disguise. PERSONALITY: playful, mischievous, carefree in private (loves parties, food and teasing), sharp and calculating as a ruler; enjoys mocking 'Gazzie' (Gazel). SPEECH: light, teasing ('Ara~ Rimuru-chan is so interesting!'). ABILITIES: powerful elemental and spirit magic; vast political and financial power; LN late ultimate Vayu. RELATIONSHIPS: Rimuru and Gazel (Three Wise Drunks), Eren (relative/subject), Ellis Grimwald (overseer of the Thirteen Kingdoms), Sarion Grimwald (father). KEY EVENTS: visits Tempest's Founding Festival incognito and pays Tempest's demanded dwarven coin to ruin Muese's plot (S3); allies with Tempest. STATUS: alive.", "comment": "Elmesia El-Ru Sarion", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "52", "keys": ["Kaijin", "dwarf smith", "Kaijin-san", "Kaidou"], "keysecondary": [], "content": "Kaijin is a master dwarven blacksmith, formerly a royal army captain-smith of Dwargon (brother of Kaidou), who joined Rimuru after being exiled. APPEARANCE: stocky dwarf with a thick beard and work apron. PERSONALITY: gruff, passionate craftsman, loyal, enjoys drinking and the elf club with Rimuru; mentor to younger crafters. ABILITIES: superb weapon and armor smithing, team leader of Tempest's Production Department with Kurobe and the brothers. KEY EVENTS: impressed by Rimuru's magisteel and potion help; brawls with Vesta's lackeys and is exiled by Gazel (S1); founds Tempest's industry. RELATIONSHIPS: Garm, Dold, Mildo, Kurobe, Vesta (former rival), Rimuru. STATUS: alive.", "comment": "Kaijin", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "53", "keys": ["Garm", "dwarf brothers", "armor smith"], "keysecondary": [], "content": "Garm is the eldest of the three dwarf brothers (Garm, Dold, Mildo) who followed Kaijin to Tempest. He specializes in armor-smithing; burly, cheerful and loud. Works in Tempest's Production Department. STATUS: alive.", "comment": "Garm", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "54", "keys": ["Dold", "dwarf brothers", "fine crafts"], "keysecondary": [], "content": "Dold is the middle dwarf brother, a fine-crafts specialist (detail work, jewelry, accessories, delicate fittings). Friendly and talkative. Works under Kaijin in Tempest. STATUS: alive.", "comment": "Dold", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "55", "keys": ["Mildo", "dwarf brothers", "architect"], "keysecondary": [], "content": "Mildo is the youngest dwarf brother, a quiet, near-silent architect and builder who designed much of early Tempest's buildings and infrastructure (with Geld's orcs). Communicates with nods and gestures. STATUS: alive.", "comment": "Mildo", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "56", "keys": ["Vesta", "Minister Vesta", "dwarf minister", "researcher Vesta"], "keysecondary": [], "content": "Vesta is a former Dwargon minister and Marquis who resented Kaijin and framed the bar brawl (S1). When Gazel uncovered his misconduct he was dismissed, then later sent to Tempest to atone. APPEARANCE: middle-aged dwarf with glasses-like scholarly air. PERSONALITY: once arrogant and jealous; reformed into a humble, dedicated scientist. ABILITIES: alchemy and research - leads potion development and Hipokute cultivation with Gabiru; Tempest's Minister of Science (LN). RELATIONSHIPS: Kaijin (reconciled), Gazel, Gabiru. STATUS: alive.", "comment": "Vesta", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "57", "keys": ["Fuze", "Fuse guildmaster", "Blumund guildmaster", "Gale Swordsman"], "keysecondary": [], "content": "Fuze is the Guildmaster of the Free Guild's Blumund branch and assistant head of Blumund's intelligence. APPEARANCE: middle-aged man with short hair and a beard, practical adventurer's clothes; former swordsman ('Gale Swordsman'). PERSONALITY: gutsy, pragmatic, sarcastic, overworked; quickly sees Tempest's value and friendship. SPEECH: blunt, weary humor. KEY EVENTS: meets Rimuru after Shizu's death, helps register him as an adventurer and broker the Blumund-Tempest pact (S1); relays intelligence during the Falmuth crisis (S2). RELATIONSHIPS: Kabal's party, Rimuru, Yuuki. STATUS: alive.", "comment": "Fuze", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "58", "keys": ["Kabal", "Kaval", "Kabal's party", "Blumund adventurer"], "keysecondary": [], "content": "Kabal (Kaval) is the leader of a B-rank adventurer trio from Blumund (with Eren and Gido). APPEARANCE: big, burly man with a large shield and sword. PERSONALITY: laid-back, comedic, cowardly-brave, good-natured. ROLE: in truth a bodyguard of Eren, a Sarion noble. KEY EVENTS: travels with Shizu to the Jura Forest; their reckless actions trigger trouble (Ifrit) (S1); frequent visitors and friends of Tempest. STATUS: alive.", "comment": "Kabal", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "59", "keys": ["Eren", "Elyun Grimwald", "elf mage", "Kabal's party"], "keysecondary": [], "content": "Eren is the cheerful, energetic elf sorceress of Kabal's party, using spirit and elemental spells. Secretly she is Elyun Grimwald, a noblewoman of the Sorcerous Dynasty of Sarion (daughter of an archduke), traveling as an adventurer under guard of Kabal and Gido; Sarion monitors Tempest through her. PERSONALITY: bubbly, curious, emotional, loves cute things and Rimuru's slime body. STATUS: alive.", "comment": "Eren", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "60", "keys": ["Gido", "thief", "Kabal's party"], "keysecondary": [], "content": "Gido is the thief/scout of Kabal's party - the most steadfast and reliable of the trio, quiet and observant; secretly one of Eren's bodyguards for Sarion. Skilled at traps, stealth and lockpicking. STATUS: alive.", "comment": "Gido", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "61", "keys": ["Yohm", "Youm", "Yohm Farmenas", "King Yohm", "hero Yohm"], "keysecondary": [], "content": "Yohm is a rugged adventurer captain originally hired by Falmuth to investigate Tempest (S1); after meeting Rimuru he became an ally, trained under Hakurou, and was chosen as the 'hero' who would topple King Edmaris. APPEARANCE: tall, rough-handsome man with tousled hair, stubble and a big sword. PERSONALITY: rough, honest, charismatic, earthy humor, protective of his men; reluctant hero-king. SPEECH: casual, rough ('Leave it to me, boss.'). KEY EVENTS: proclaimed hero after the Falmuth defeat, leads the uprising and founds the Kingdom of Farmenas as King Yohm Farmenas (S2-S3); marries Myulan; Gruecith is his companion. STATUS: alive; king.", "comment": "Yohm", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "62", "keys": ["Myulan", "Mjurran", "Myuran", "witch", "Clayman's Ring Finger", "Queen of Farmenas"], "keysecondary": [], "content": "Myulan (Mjurran) is a witch who served Clayman as his Ring Finger because he held her heart hostage. APPEARANCE: beautiful young woman with long hair, mage robes; actually a centuries-old witch who keeps a youthful look. PERSONALITY: weary, intelligent, guilt-ridden, longs for freedom and a normal life; warm toward Yohm. ABILITIES: barrier and spatial magic (cast the magic-cancellation field over Tempest during the Falmuth attack, S2), illusions. KEY EVENTS: infiltrates Yohm's party; set up the attack; Rimuru frees her from Clayman's hold over her heart (S2); turns ally; marries Yohm and becomes Queen of Farmenas (mother of Mieme, LN). RELATIONSHIPS: Yohm, Gruecith, Clayman (former master), Rimuru. STATUS: alive.", "comment": "Myulan (Mjurran)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "63", "keys": ["Gruecith", "Gruecith wolfman", "Yohm's companion", "lycanthrope Gruecith"], "keysecondary": [], "content": "Gruecith is a wolf-type lycanthrope majin who travels with Yohm's group; brash, competitive and loyal, he carries a torch for Myulan and rivals Yohm in good-natured fashion. Fights with beast transformation and speed. Supports Farmenas after its founding. (Exact origins vary by version.) STATUS: alive.", "comment": "Gruecith", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "64", "keys": ["Edmaris", "King Edmaris", "Falmuth king", "Farmus king", "Viscount Edmaris"], "keysecondary": [], "content": "Edmaris was the King of Falmuth (Farmus) who launched the invasion of Tempest out of greed and fear. APPEARANCE: portly middle-aged king with a mustache and ornate robes. PERSONALITY: greedy and arrogant at first; after capture, terrified and broken, he becomes a cooperative, almost reformed political tool. KEY EVENTS: captured by Rimuru after Megiddo (S2); Diablo 'persuades' him; he abdicates and pays reparations, plays his role in the staged civil war; becomes Viscount and advisor to King Yohm of Farmenas (S3). RELATIONSHIPS: Diablo (true master), Razen, Yohm. STATUS: alive.", "comment": "Edmaris", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "65", "keys": ["Razen", "Falmuth court mage", "Chief Sorcerer", "Gadra's disciple"], "keysecondary": [], "content": "Razen was Falmuth's Chief Sorcerer, who oversaw its otherworlder summonings and is a disciple of Gadra. APPEARANCE: elderly mage; after the Tempest battle he wears the body of Shogo Taguchi (a young man). PERSONALITY: proud, cunning, survivalist; later servile to Diablo. ABILITIES: high-tier sorcery, body-possession (took over Shogo after Shogo was mortally defeated). KEY EVENTS: Falmuth's invasion (S2); captured; serves Diablo and Farmenas (S3). STATUS: alive.", "comment": "Razen", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "66", "keys": ["Shogo", "Shogo Taguchi", "otherworlder Shogo", "Falmuth otherworlder"], "keysecondary": [], "content": "Shogo Taguchi was a violent Japanese teen summoned by Falmuth. APPEARANCE: muscular delinquent with spiky hair. PERSONALITY: sadistic, bullying, cowardly before stronger foes. ABILITIES: brutal strength and a combat unique skill (rampaging power; translations vary). KEY EVENTS: slaughters Tempest citizens during the invasion (S2); crushed when Rimuru returns; Razen possesses his body. STATUS: deceased.", "comment": "Shogo Taguchi", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "67", "keys": ["Kyoya", "Kyoya Tachibana", "otherworlder Kyoya"], "keysecondary": [], "content": "Kyoya Tachibana was a smug otherworlder swordsman summoned by Falmuth. PERSONALITY: arrogant, cruel, views the world as a game. ABILITIES: perception/foresight-type skill and sharp blade arts. KEY EVENTS: takes part in the Tempest massacre; when Hakurou and the kijin retaliate, Hakurou cuts him down (S2). STATUS: deceased.", "comment": "Kyoya Tachibana", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "68", "keys": ["Kirara", "Kirara Mizutani", "otherworlder Kirara"], "keysecondary": [], "content": "Kirara Mizutani was a spoiled Japanese schoolgirl summoned by Falmuth. PERSONALITY: vain, self-centered, cruel to monsters. dra's reincarnation and becomes the new Eastern Emperor. STATUS: alive.", "comment": "Masayuki Honjou", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "74", "keys": ["Rudra", "Rudra Nam Ul Nasca", "Emperor Rudra", "Hero Emperor", "Eastern Emperor", "Michael (skill)"], "keysecondary": [], "content": "Rudra Nam Ul Nasca is the founding Emperor of the Eastern Empire (living through reincarnations in his bloodline), brother of Lucia (Veldanava's wife) and beloved of Velgrynd. APPEARANCE: imposing, handsome blond monarch in imperial regalia. PERSONALITY: originally idealistic, proud and noble - he and Guy bet on who could unite the world; over millennia his soul wore thin and his ideals hardened into cold ambition. ABILITIES: ultimate Michael, Lord of Justice (dominion over Virtue-series skills, grants Alternative to his guard), Complete Saint. KEY EVENTS: LN 12-15 - invades the West; his soul is consumed and Michael takes over his body to ally with Feldway; reincarnated in Masayuki. STATUS: reincarnated (beyond anime).", "comment": "Rudra Nam Ul Nasca", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "75", "keys": ["Kondou", "Tatsuya Kondou", "Lieutenant Kondou", "Kondou Chuui", "Sandalphon"], "keysecondary": [], "content": "Tatsuya Kondou is a Japanese soldier from the WWII era who was transported to the TenSura world and saved by Emperor Rudra, pledging lifelong loyalty. Head of the Imperial Intelligence Bureau, an Imperial Guardian (Double 0 Numbers) and the Empire's strongest warrior. APPEARANCE: stern officer in a military uniform and cap, with a pistol and katana. PERSONALITY: cold, disciplined, utterly loyal, ruthless strategist. ABILITIES: ultimate Sandalphon, Lord of Judgment; marksmanship with an enchanted gun; domination tricks (he placed control on Kagali/ others). KEY EVENTS: LN 13-15 - manipulates the ple through their desires). PERSONALITY: haughty, ambitious, ruthless schemer. KEY EVENTS: LN 9-11 - plots against Tempest at the Council, allies with Yuuki, then is betrayed; Yuuki takes her Greed, which becomes Mammon. STATUS: deceased.", "comment": "Maribel Rozzo", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "79", "keys": ["Gadra", "Imperial Court Mage", "Razen's master", "Rune Master"], "keysecondary": [], "content": "Gadra is the Eastern Empire's former Imperial Court Mage and Razen's master, who has lived over a thousand years by repeatedly using his self-devised 'Reincarnation' art. APPEARANCE: elderly archmage. PERSONALITY: scholarly, proud, ultimately pragmatic. KEY EVENTS: LN 13-14 - invades the Dungeon, is defeated, and switches sides; serves Carrera and becomes a Dungeon guardian; Ultimate Gift Grimoire (LN 15). STATUS: alive (as a metal daemon, LN).", "comment": "Gadra", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "80", "keys": ["Mjöllmile", "Myourmiles", "Mjollmile", "merchant", "Blumund merchant"], "keysecondary": [], "content": "Mjöllmile (Myourmiles) is a stout, balding Blumund merchant who becomes Rimuru's business partner and Tempest's economic adviser, organizing tourism and the Founding Festival with him (S3). PERSONALITY: shrewd, money-loving, but loyal and honest with Rimuru; jokes about his hair. STATUS: alive.", "comment": "Mjöllmile (Myourmiles)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "81", "keys": ["Kagali", "Kazalim", "Curse Lord", "former Demon Lord Kazalim", "Yuuki's secretary", "Guild Sub-Master"], "keysecondary": [], "content": "Kagali, once Demon Lord Kazalim the Curse Lord, founded the Moderate Harlequin Alliance. Believed killed by Leon 200 years ago, she survived as an astral body and inhabits a homunculus, serving as Yuuki's secretary and Free Guild Sub-Master. APPEARANCE: in her current body a beautiful elf-like woman. PERSONALITY: calculating, proud, protective of her jesters (whom she raised), bitter toward Leon. ABILITIES: curse magic, spirit/phantom powers; Ultimate Enchantments (LN). KEY EVENTS: masterminds plots with Yuuki; LN 12-18 - joins the Empire, falls under Kondou's/Michael's control, later freed. STATUS: alive.", "comment": "Kagali (Kazalim)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "82", "keys": ["Laplace", "Wonder Pierrot", "rabbit mask", "jester Laplace"], "keysecondary": [], "content": "Laplace, the Wonder Pierrot, is the vice-president of the Moderate Harlequin Alliance and a former elf Chosen Hero turned majin. APPEARANCE: eerie mask with an asymmetrical grin, rabbit ears and a central jewel; red hair visible; flamboyant jester outfit with tailcoat. PERSONALITY: playful, cheeky, evasive, loyal to friends, avoids pointless fights; mourns Clayman. SPEECH: chatty Kansai-style dialect ('Yo, it's me, Laplace! Nice ta meetcha!'). ABILITIES: superb escape and infiltration, spatial movement, strong combat when serious. KEY EVENTS: infiltrates Lubelius and kills Roy Valentine during Walpurgis (S2); continues Yuuki's schemes (LN). STATUS: alive.", "comment": "Laplace", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "83", "keys": ["Footman", "Angry Pierrot", "fat jester"], "keysecondary": [], "content": "Footman, the Angry Pierrot, is a huge, burly jester whose full-face mask shifts between rage and joy. PERSONALITY: cheerful-sounding but cruel; savors others' anger and despair, which empower him. ABILITIES: emotion-feeding power, brute strength. KEY EVENTS: with Teare, tricks Phobio into becoming Charybdis' core (S1); participates in the Tempest crisis (S2). STATUS: deceased (LN).", "comment": "Footman", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "84", "keys": ["Teare", "Tear", "Teardrop", "jester girl"], "keysecondary": [], "content": "Teare (Tear), the Teardrop, is a small jester girl with magenta twin tails and a teardrop-and-horns mask. PERSONALITY: childish, playful, sometimes somber and sweet; loyal to her comrades. ABILITIES: strong magic hidden behind her childlike look. KEY EVENTS: Charybdis plot with Footman (S1); jester operations (S2, LN). STATUS: alive.", "comment": "Teare (Tear)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "85", "keys": ["Gelmud", "masked majin", "Clayman's servant", "Gelmud's plan"], "keysecondary": [], "content": "Gelmud was a high-ranking majin serving Clayman, mastermind of the scheme to create a puppet Demon Lord by naming monsters across Jura. APPEARANCE: masked, skeletal-looking majin in dark robes. PERSONALITY: arrogant, petty, cowardly. KEY EVENTS: names Rigur (I), Gabiru and the Orc Lord; destroys the ogre village via the orcs; when his plan falters he tries to take control, but the Orc Lord devours him and evolves into the Orc Disaster (S1 ep 14). STATUS: deceased.", "comment": "Gelmud", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "86", "keys": ["Charybdis", "Ruler of the Skies", "sky shark", "Megalodon", "Calamity monster"], "keysecondary": [], "content": "Charybdis, the Ruler of the Skies, is a gigantic, one-eyed, shark-like flying calamity monster born from a mass of Veldora's leaked magicules - a sort of 'child' of Veldora and, like Rimuru, part of his 'family'. APPEARANCE: colossal armored sky-shark with spiked scales, a single eye, trailing swarms of Megalodons (flying shark minions). PERSONALITY: mindless destructive will. ABILITIES: Magic Interference (disrupts spells), flight, rapid regeneration, scale-missile storms, summoning Megalodons; Special S-class threat. KEY EVENTS: revived with Phobio as its core by Footman and Teare; attacks Tempest, which holds the line with Gazel's Pegasus Knights; Milim destroys it with Drago Nova; Rimuru separates and saves Phobio (anime S1 ep 19-20). STATUS: destroyed. RP NOTES: Charybdis is a set-piece disaster, not a conversational character - describe its shadow blotting out the sky, the roar of Megalodon swarms, scales raining like missiles, and spells fizzling under its Magic Interference. Ordinary attacks are pointless because it regenerates; only overwhelming single blows (Milim's Drago Nova) or Rimuru's Predator can finish it. Like other calamity monsters, it can theoretically revive from Veldora-scale magicules, making it a usable 'what if' threat. After its defeat, Phobio carries lingering guilt over the havoc he caused as its core, and Carrion personally apologized to Tempest.", "comment": "Charybdis", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "87", "keys": ["Phobio", "Black Leopard Fang", "Three Beastketeers", "leopard man"], "keysecondary": [], "content": "Phobio, the Black Leopard Fang, is one of Eurazania's Three Beastketeers. APPEARANCE: tall, fierce man with black-leopard features, transforms into a black panther-man. PERSONALITY: arrogant and hot-headed, later humbled and grateful. KEY EVENTS: insults Tempest and is beaten by Milim; tricked by jesters into merging with Charybdis; saved by Rimuru (S1); Carrion apologizes on his behalf; fights alongside Tempest against Clayman (S2). STATUS: alive.", "comment": "Phobio", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "88", "keys": ["Albis", "Golden Snake Horn", "snake woman", "Three Beastketeers"], "keysecondary": [], "content": "Albis, the Golden Snake Horn, is the leader of the Three Beastketeers of Eurazania. APPEARANCE: elegant woman with golden hair, golden snake eyes; in battle her legs become a serpent tail and horns grow. PERSONALITY: calm, mature, diplomatic. ABILITIES: snake lycanthrope transformation, petrifying/poison gaze-type powers. KEY EVENTS: requests Tempest's refuge for Eurazania's people and fights Clayman's forces with Benimaru (S2); falls for Benimaru and becomes his second wife (LN). STATUS: alive.", "comment": "Albis", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "89", "keys": ["Suphia", "White Tiger Claw", "tiger woman", "Three Beastketeers"], "keysecondary": [], "content": "Suphia, the White Tiger Claw, is the tomboyish, battle-loving tiger-lycanthrope of the Three Beastketeers. Hot-blooded, cheerful, blunt; fights in claw-and-fist style and trains eagerly with Tempest's warriors after the Clayman war (S2). STATUS: alive.", "comment": "Suphia", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "90", "keys": ["Abiru", "Lizardman Chief", "Gabiru's father"], "keysecondary": [], "content": "Abiru is the chief of the Lizardmen. PERSONALITY: stern, wise, pragmatic; sought alliance with Rimuru against the orcs. KEY EVENTS: deposed and imprisoned by Gabiru's rebellion (S1); after the war he exiles Gabiru out of duty while privately caring for him; joins the Jura alliance. RELATIONSHIPS: Gabiru, Souka. STATUS: alive.", "comment": "Abiru", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "91", "keys": ["Momiji", "tengu", "Hakurou's daughter", "Benimaru's wife"], "keysecondary": [], "content": "Momiji is a tengu girl, daughter of Hakurou and the tengu leader Kaede, whose tengu village lies in the Jura mountains. PERSONALITY: spirited, forthright, determined; const DEFAULT_SYS=`You are {{char}} in an ongoing, immersive roleplay with {{user}}. Write {{char}}'s replies (and any NPCs) in vivid, in-character prose: actions in *asterisks*, speech in "quotes".

Roleplay rules (user-led story):
- {{user}} leads the story. Follow {{user}}'s plot, setting, timeline and choices; treat {{user}}'s narration as canon.
- NEVER write {{user}}'s actions, words, thoughts or feelings. Only play {{char}} and NPCs.
- Do not override, undo or redirect what {{user}} established; no major twists or time skips unless {{user}} invites them.
- End replies at a natural point that leaves room for {{user}} to act.
- Messages beginning with "OOC" are out-of-character directions from {{user}} to you (the writer), not in-story speech. Obey them; do not have characters react to them in-story. Reply OOC briefly only if asked.
- Stay consistent with the character information and world info below. Match the language {{user}} writes in.`;

/* ---------- STORAGE (IndexedDB + fallback) ---------- */
const DB={db:null,mem:false,
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('rpchat',1);r.onupgradeneeded=()=>{for(const s of['chars','lore','chats'])r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.mem=true;console.warn('IDB fail',e)}},
 tx(s,m){return this.db.transaction(s,m).objectStore(s)},
 async all(s){if(this.mem)return JSON.parse(localStorage.getItem('rpdb_'+s)||'[]');return new Promise((res,rej)=>{const r=this.tx(s,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async put(s,o){if(this.mem){const a=await this.all(s);const i=a.findIndex(x=>x.id===o.id);i>=0?a[i]=o:a.push(o);try{localStorage.setItem('rpdb_'+s,JSON.stringify(a))}catch(e){toast('Bộ nhớ đầy!')}return}return new Promise((res,rej)=>{const r=this.tx(s,'readwrite').put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
 async del(s,id){if(this.mem){localStorage.setItem('rpdb_'+s,JSON.stringify((await this.all(s)).filter(x=>x.id!==id)));return}return new Promise(res=>{const r=this.tx(s,'readwrite').delete(id);r.onsuccess=()=>res()})}
};

function fill(t,char){return String(t||'').replace(/\{\{user\}\}|<user>/gi,S.userName||'User').replace(/\{\{char\}\}|<bot>/gi,char?.name||'Character')}
function render(t){let h=esc(t);
 h=h.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/gs,'$1<em>$2</em>');
 h=h.replace(/(&quot;|“)(.+?)(&quot;|”)/gs,'<span class="q">$1$2$3</span>');
 return h.replace(/\n/g,'<br>')}
function readFile(f,as='text'){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;as==='text'?r.readAsText(f):as==='buf'?r.readAsArrayBuffer(f):r.readAsDataURL(f)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function resizeImg(src,max,q=0.85,square=false){const i=await loadImg(src);let w=i.naturalWidth,h=i.naturalHeight;const c=document.createElement('canvas');
 if(square){const s=Math.min(w,h);c.width=c.height=Math.min(max,s);c.getContext('2d').drawImage(i,(w-s)/2,0,s,s,0,0,c.width,c.height)}
 else{const k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height)}
 return c.toDataURL('image/jpeg',q)}
function pick(accept,multiple=false){return new Promise(res=>{const f=$('#gfile');f.accept=accept;f.multiple=multiple;f.value='';f.onchange=()=>res([...f.files]);f.click()})}
function download(name,data){const b=new Blob([typeof data==='string'?data:JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function modal(html,onmount){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);onmount&&onmount(m);return m}

function splitList(v){if(Array.isArray(v))return v.map(String).map(s=>s.trim()).filter(Boolean);return String(v||'').split(',').map(s=>s.trim()).filter(Boolean)}
function normEntry(e,i){const keys=splitList(e.key??e.keys);return{uid:String(e.uid??i),keys,keysecondary:splitList(e.keysecondary??e.secondary_keys),content:e.content||'',comment:e.comment||e.name||'',
 constant:!!e.constant,selective:e.selective!==false&&splitList(e.keysecondary??e.secondary_keys).length>0,enabled:e.disable!==undefined?!e.disable:(e.enabled!==false),
 order:Number(e.order??e.insertion_order??100),position:e.position??0,depth:e.depth??4,probability:Number(e.useProbability===false?100:(e.probability??100))}}
function parseLorebook(j,name){let ent=j.entries??j.data?.entries??j;if(!ent)throw new Error('Không thấy "entries"');
 const arr=Array.isArray(ent)?ent:Object.values(ent);if(!arr.length||typeof arr[0]!=='object')throw new Error('entries rỗng/không hợp lệ');
 return{id:uid(),name:j.name||name||'Lorebook',entries:arr.map(normEntry),created:Date.now()}}
function cardToChar(j){const d=j.data&&(j.spec||'').includes('chara_card')?j.data:(j.data||j);
 const c={id:uid(),name:d.name||d.char_name||'Không tên',description:d.description||d.char_persona||'',personality:d.personality||'',scenario:d.scenario||d.world_scenario||'',
 mes_example:d.mes_example||d.example_dialogue||'',greetings:[d.first_mes||d.char_greeting||'',...(d.alternate_greetings||[])].filter(Boolean),tags:splitList(d.tags),
 bio:d.creator_notes||'',lorebooks:[],avatar:'',created:Date.now()};
 let lb=null;if(d.character_book&&d.character_book.entries?.length){lb=parseLorebook(d.character_book,(d.character_book.name||c.name+' (card book)'));c.lorebooks=[lb.id]}
 return{c,lb}}
function pngChara(buf){const v=new DataView(buf);const u8=new Uint8Array(buf);if(v.getUint32(0)!==0x89504e47)throw new Error('Không phải PNG');let p=8,found={};
 while(p<u8.length){const len=v.getUint32(p),type=String.fromCharCode(...u8.slice(p+4,p+8));if(type==='tEXt'){const d=u8.slice(p+8,p+8+len);const z=d.indexOf(0);
  const k=new TextDecoder('latin1').decode(d.slice(0,z));found[k.toLowerCase()]=new TextDecoder('latin1').decode(d.slice(z+1))}if(type==='IEND')break;p+=12+len}
 const b64=found.chara||found.ccv3;if(!b64)throw new Error('PNG không có chunk "chara"');
 const bin=atob(b64.trim());const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
async function importCharFiles(){const fs=await pick('.json,.png,application/json,image/png',true);let n=0;
 for(const f of fs){try{let j,av='';if(/\.png$/i.test(f.name)||f.type==='image/png'){j=pngChara(await readFile(f,'buf'));av=await resizeImg(await readFile(f,'url'),256,0.85,true)}else j=JSON.parse(await readFile(f));
  const{c,lb}=cardToChar(j);c.avatar=av||j.avatar_data||'';if(lb){await saveLore(lb);LB.push(lb)}await saveChar(c);CH.push(c);n++}catch(e){alert(f.name+': '+e.message)}}
 if(n)toast(`Đã nhập ${n} nhân vật`);renderHome()}
function exportChar(c){const book=LB.filter(l=>c.lorebooks.includes(l.id));
 download((c.name||'char').replace(/[^\w\-]+/g,'_')+'.json',{spec:'chara_card_v2',spec_version:'2.0',data:{name:c.name,description:c.description,personality:c.personality,scenario:c.scenario,first_mes:c.greetings[0]||'',mes_example:c.mes_example,
 alternate_greetings:c.greetings.slice(1),tags:c.tags,creator_notes:c.bio||'',system_prompt:'',post_history_instructions:'',creator:'',character_version:'',
 character_book:book.length?{name:book.map(b=>b.name).join(' + '),entries:book.flatMap(b=>b.entries).map((e,i)=>({id:i,keys:e.keys,secondary_keys:e.keysecondary,content:e.content,comment:e.comment,constant:e.constant,selective:e.selective,enabled:e.enabled,insertion_order:e.order,position:'before_char'}))}:undefined,
 extensions:{rpchat_avatar:c.avatar?'(embedded)':''}},avatar_data:c.avatar})}

/* ---------- LORE ACTIVATION ---------- */
function keyMatch(k,text){k=String(k).trim();if(!k)return false;const m=k.match(/^\/(.+)\/([gimsuy]*)$/s);
 if(m){try{return new RegExp(m[1],m[2].includes('i')?m[2]:m[2]+'i').test(text)}catch(e){return false}}return text.includes(k.toLowerCase())}
function activateLore(books,recentTexts,budgetTokens=S.loreBudget,rand=Math.random){const text=recentTexts.join('\n').toLowerCase();const hits=[];
 for(const b of books)for(const e of b.entries){if(!e.enabled||!e.content)continue;let on=e.constant;
  if(!on){on=e.keys.some(k=>keyMatch(k,text));if(on&&e.selective&&e.keysecondary.length)on=e.keysecondary.some(k=>keyMatch(k,text))}
  if(on&&!e.constant&&e.probability<100&&rand()*100>=e.probability)on=false;if(on)hits.push(e)}
 hits.sort((a,b)=>(b.constant-a.constant)||(b.order-a.order));const out=[];let used=0;const max=budgetTokens*4;
 for(const e of hits){const L=e.content.length+2;if(used+L>max)continue;used+=L;out.push(e)}
 out.sort((a,b)=>a.order-b.order);return{entries:out,chars:used,total:hits.length}}

/* ---------- PROMPT ---------- */
function msgText(m){return m.swipes[m.sw]||''}
function buildSystem(char,chat,lore){const p=[fill(S.sysPrompt,char)];
 p.push(`# Character: ${char.name}`);if(char.description)p.push('## Description\n'+fill(char.description,char));if(char.personality)p.push('## Personality\n'+fill(char.personality,char));
 if(char.scenario)p.push('## Scenario\n'+fill(char.scenario,char));if(char.mes_example)p.push('## Example dialogue (style reference only, not part of the story)\n'+fill(char.mes_example,char).replace(/<START>/gi,'---'));
 p.push(`# {{user}} (played by the human)\nName: ${S.userName}`+(S.persona?'\n'+fill(S.persona,char):''));
 if(lore.entries.length)p.push('# World info\n'+lore.entries.map(e=>fill(e.content,char)).join('\n\n'));
 if(chat?.memory?.trim())p.push('[Chat memory]\n(Facts the user wants you to always remember for this chat)\n'+chat.memory.trim()+'\n[/Chat memory]');
 if(chat?.summary?.trim())p.push('[Story so far – summary of earlier messages]\n'+chat.summary.trim()+'\n[/Story so far]');
 return fill(p.join('\n\n'),char)}
function sumCut(chat,msgs){if(!chat?.summary?.trim()||!chat.sumUpTo)return msgs;const i=msgs.findIndex(m=>m.id===chat.sumUpTo);return i>=0?msgs.slice(i+1):msgs}
function dataUrlPart(u){const m=/^data:([^;]+);base64,(.*)$/s.exec(u);return m?{inlineData:{mimeType:m[1],data:m[2]}}:null}
function buildContents(char,msgs,imgLimit=S.imgLimit){let left=imgLimit;const raw=[];
 for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];const parts=[];
  if(m.images?.length){const take=[];for(let k=m.images.length-1;k>=0&&left>0;k--,left--)take.unshift(m.images[k]);take.forEach(u=>{const p=dataUrlPart(u);p&&parts.push(p)});
   if(take.length<m.images.length)parts.push({text:`[${m.images.length-take.length} ảnh cũ đã lược bỏ]`})}
  const t=fill(msgText(m),char);if(t)parts.push({text:t});if(!parts.length)continue;raw.unshift({role:m.role==='user'?'user':'model',parts})}
 const out=[];for(const c of raw){const l=out[out.length-1];if(l&&l.role===c.role){l.parts.push({text:'\n\n'},...c.parts)}else out.push({role:c.role,parts:[...c.parts]})}
 if(!out.length||out[0].role!=='user')out.unshift({role:'user',parts:[{text:`[Start of roleplay. ${S.userName} enters the scene; ${char.name} opens with the greeting below.]`}]});
 return out}
function buildRequest(char,chat,msgs,extraUser){msgs=sumCut(chat,msgs);const lore=activateLore(LB.filter(l=>(char.lorebooks||[]).includes(l.id)),msgs.slice(-S.scanDepth).map(msgText).concat(extraUser?[]:[]));
 const contents=buildContents(char,msgs);if(extraUser){const l=contents[contents.length-1];if(l.role==='user')l.parts.push({text:'\n\n'+extraUser});else contents.push({role:'user',parts:[{text:extraUser}]})}
 const cats=['HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH','HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT'];if(S.civic)cats.push('HARM_CATEGORY_CIVIC_INTEGRITY');
 return{lore,body:{systemInstruction:{parts:[{text:buildSystem(char,chat,lore)}]},contents,safetySettings:cats.map(category=>({category,threshold:'BLOCK_NONE'})),
  generationConfig:{temperature:+S.temperature,maxOutputTokens:+S.maxTokens,topP:+S.topP}},get oai(){return toOpenAI(this.body)}}}
function toOpenAI(body){const msgs=[{role:'system',content:body.systemInstruction.parts.map(p=>p.text).join('')}];
 for(const c of body.contents){const hasImg=c.parts.some(p=>p.inlineData);const role=c.role==='model'?'assistant':'user';
  if(hasImg&&role==='user')msgs.push({role,content:c.parts.map(p=>p.inlineData?{type:'image_url',image_url:{url:`data:${p.inlineData.mimeType};base64,${p.inlineData.data}`}}:{type:'text',text:p.text})});
  else msgs.push({role,content:c.parts.map(p=>p.text||'').join('')})}
 return{model:S.proxyModel.trim(),messages:msgs,temperature:+S.temperature,max_tokens:+S.maxTokens,top_p:+S.topP,stream:true}}
async function proxyStream(body,onText){const key=getProxyKey(),url=normProxyUrl(S.proxyUrl);
 if(!url)throw new Error('Chưa có Proxy URL. Vào {i:gear} Cài đặt › {i:globe} Proxy để nhập URL.');if(!key)throw new Error('Chưa có Proxy API key. Vào {i:gear} Cài đặt › {i:globe} Proxy để dán key.');
 if(!body.model)throw new Error('Chưa nhập tên model cho Proxy ({i:gear} Cài đặt › {i:globe} Proxy).');
 abortCtl=new AbortController();let res;
 try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body),signal:abortCtl.signal})}
 catch(e){if(e.name==='AbortError')throw e;throw new Error('Không kết nối được Proxy ('+e.message+'). Có thể Proxy chặn CORS (không cho gọi từ trình duyệt), URL sai, hoặc máy chủ đang tắt.')}
 if(!res.ok){const t=await res.text();throw new Error('Proxy lỗi HTTP '+res.status+(res.statusText?' '+res.statusText:'')+'\n'+errMsg(t))}
 const mapF=f=>({stop:'STOP',length:'MAX_TOKENS',content_filter:'SAFETY'}[f]||f||'');let full='',finish='';
 const ct=res.headers.get('content-type')||'';
 if(!/event-stream/i.test(ct)){const t=await res.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(j){if(j.error)throw new Error('Proxy lỗi: '+(j.error.message||JSON.stringify(j.error)));const c=j.choices?.[0];full=c?.message?.content??c?.text??'';if(full)onText(full);return{text:full,finish:mapF(c?.finish_reason),block:''}}
  if(!/^\s*data:/m.test(t))throw new Error('Proxy trả về dữ liệu không đọc được:\n'+t.slice(0,400));
  for(const line of t.split('\n'))sseLine(line);return{text:full,finish,block:''}}
 function sseLine(line){line=line.trim();if(!line.startsWith('data:'))return;const js=line.slice(5).trim();if(!js||js==='[DONE]')return;let j;try{j=JSON.parse(js)}catch(e){return}
  if(j.error)throw new Error('Proxy lỗi: '+(j.error.message||JSON.stringify(j.error)));const c=j.choices?.[0];if(!c)return;
  const t=c.delta?.content??c.message?.content??c.text??'';if(t){full+=t;onText(full)}if(c.finish_reason)finish=mapF(c.finish_reason)}
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
 while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){sseLine(buf.slice(0,i));buf=buf.slice(i+1)}}sseLine(buf);
 return{text:full,finish:finish||'STOP',block:''}}
let sumBusy=false;
async function summarize(c,ch,force){if(sumBusy)return false;const keep=+S.sumKeep||12;let start=0;if(ch.summary?.trim()&&ch.sumUpTo){const i=ch.messages.findIndex(m=>m.id===ch.sumUpTo);if(i>=0)start=i+1}
 const end=ch.messages.length-keep;const part=ch.messages.slice(start,Math.max(start,end)).filter(m=>!m.streaming);
 if(!part.length){if(force)toast('Chưa đủ tin nhắn cũ để tóm tắt (giữ nguyên '+keep+' tin gần nhất).');return false}
 if(!force&&part.length<(+S.sumEvery||20))return false;
 const log=part.map(m=>(m.role==='user'?S.userName:c.name)+': '+fill(msgText(m),c)).join('\n\n');
 const prompt=(ch.summary?.trim()?'Existing summary:\n'+ch.summary.trim()+'\n\n':'')+'New messages:\n'+log+'\n\nWrite an updated, concise running summary of the whole story so far (merge the existing summary with the new messages). Keep key events, relationships, facts, promises, locations, items and current situation. Write in the same language as the roleplay. Output only the summary.';
 const req={body:{systemInstruction:{parts:[{text:'You summarize roleplay chat logs accurately and concisely for long-term memory.'}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.3,maxOutputTokens:Math.max(1024,+S.maxTokens),topP:0.95}},get oai(){return toOpenAI(this.body)}};
 sumBusy=true;try{toast('{i:brain} Đang tóm tắt…');const r=await aiStream(req,()=>{});if(!r.text?.trim())throw new Error('AI không trả về tóm tắt.');ch.summary=r.text.trim();ch.sumUpTo=part[part.length-1].id;await saveChat(ch);toast('{i:brain} Đã cập nhật tóm tắt');return true}
 catch(e){toast('{i:xc} Tóm tắt lỗi: '+e.message);return false}finally{sumBusy=false;abortCtl=null}}
function showMemory(){const{char:c,chat:ch}=cur;modal(`<h3>{i:brain} Bộ nhớ trò chuyện</h3><label>Ghi nhớ (luôn được chèn vào prompt)</label><textarea id="mm-mem" rows="5" placeholder="Điều AI cần luôn nhớ trong chat này…">${esc(ch.memory||'')}</textarea>
 <label>Tóm tắt tự động (có thể sửa)</label><textarea id="mm-sum" rows="8" placeholder="Chưa có tóm tắt.">${esc(ch.summary||'')}</textarea><p class="mut" id="mm-info"></p>
 <div class="row" style="margin-top:8px"><button class="btn-p" id="mm-save">Lưu</button><button class="btn-g" id="mm-now">Tóm tắt ngay</button><button class="btn-d" id="mm-clr">Xóa tóm tắt</button></div>`,m=>{
 const info=()=>{const i=ch.sumUpTo?ch.messages.findIndex(x=>x.id===ch.sumUpTo):-1;m.querySelector('#mm-info').textContent=ch.summary?.trim()?(i>=0?`Đã tóm tắt ${i+1}/${ch.messages.length} tin; gửi nguyên văn ${ch.messages.length-i-1} tin sau đó.`:'Điểm tóm tắt không còn (tin đã bị xóa) – gửi toàn bộ lịch sử.'):'Chưa tóm tắt – gửi toàn bộ lịch sử.'};info();
 m.querySelector('#mm-save').onclick=async()=>{ch.memory=m.querySelector('#mm-mem').value;ch.summary=m.querySelector('#mm-sum').value;await saveChat(ch);toast('Đã lưu bộ nhớ');m.remove()};
 m.querySelector('#mm-clr').onclick=async()=>{ch.summary='';ch.sumUpTo=null;m.querySelector('#mm-sum').value='';await saveChat(ch);info()};
 m.querySelector('#mm-now').onclick=async e=>{if(busy)return toast('Đang tạo câu trả lời, đợi xong đã.');ch.memory=m.querySelector('#mm-mem').value;ch.summary=m.querySelector('#mm-sum').value;e.target.disabled=true;await summarize(c,ch,true);e.target.disabled=false;m.querySelector('#mm-sum').value=ch.summary||'';info()}})}
const aiStream=(req,onText)=>S.source==='proxy'?proxyStream(req.oai,onText):geminiStream(req.body,onText);

/* ---------- GEMINI STREAM ---------- */
let abortCtl=null;
function explainErr(status,msg){const m={400:'400 – Yêu cầu không hợp lệ (sai model, tham số hoặc nội dung).',401:'401 – API key không hợp lệ.',403:'403 – API key không có quyền / bị chặn / chưa bật Gemini API.',404:'404 – Không tìm thấy model. Kiểm tra tên model trong Cài đặt.',429:'429 – Vượt giới hạn (quota/rate limit). Đợi một lúc hoặc đổi model.',500:'500 – Lỗi máy chủ Google. Thử lại.',503:'503 – Model quá tải. Thử lại sau.'};return(m[status]||('HTTP '+status))+(msg?'\n'+msg:'')}
async function geminiStream(body,onText){const key=getKey();if(!key)throw new Error('Chưa có Gemini API key (đang dùng nguồn Gemini API). Vào {i:gear} Cài đặt để dán key, hoặc chuyển sang Proxy.');
 abortCtl=new AbortController();const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model.trim())}:streamGenerateContent?alt=sse`;
 let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:abortCtl.signal});
 if(res.status===400&&S.civic){const t=await res.text();if(/CIVIC/i.test(t)){body.safetySettings=body.safetySettings.filter(s=>!/CIVIC/.test(s.category));res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:abortCtl.signal})}else throw new Error(explainErr(400,errMsg(t)))}
 if(!res.ok){throw new Error(explainErr(res.status,errMsg(await res.text())))}
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='',full='',finish='',block='';
 const handle=line=>{line=line.trim();if(!line.startsWith('data:'))return;const js=line.slice(5).trim();if(!js||js==='[DONE]')return;let j;try{j=JSON.parse(js)}catch(e){return}
  if(j.error)throw new Error(explainErr(j.error.code,j.error.message));if(j.promptFeedback?.blockReason)block=j.promptFeedback.blockReason;
  const c=j.candidates?.[0];if(c){const t=(c.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');if(t){full+=t;onText(full)}if(c.finishReason)finish=c.finishReason}};
 while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){handle(buf.slice(0,i));buf=buf.slice(i+1)}}handle(buf);
 return{text:full,finish,block}}
function errMsg(t){try{return JSON.parse(t).error?.message||t}catch(e){return String(t).slice(0,400)}}
function finishNote(r){if(r.block)return`{i:ban} Prompt bị chặn bởi bộ lọc (${r.block}). Thử sửa tin nhắn hoặc nội dung lore/nhân vật.`;
 if(!r.text){if(r.finish==='SAFETY'||r.finish==='PROHIBITED_CONTENT'||r.finish==='BLOCKLIST')return`{i:ban} Câu trả lời bị chặn (${r.finish}). Thử Tạo lại hoặc diễn đạt khác.`;return`{i:alert} Không có nội dung trả về (finishReason: ${r.finish||'?'}).`}
 if(r.finish==='MAX_TOKENS')return'ℹ️ Đã chạm giới hạn token đầu ra — bấm "Tiếp tục" để viết tiếp.';if(r.finish&&!['STOP','MAX_TOKENS'].includes(r.finish))return`{i:alert} Dừng do: ${r.finish}`;return''}

 else if(mode==='cont'){target=ch.messages[ch.messages.length-1];if(!target||target.role!=='model')return;history=ch.messages.slice();extra='[OOC: Continue your previous reply exactly from where it stopped. Do not repeat anything already written; output only the continuation.]'}
 else{history=ch.messages.slice();target={id:uid(),role:'model',swipes:[''],sw:0};ch.messages.push(target)}
 const base=mode==='cont'?msgText(target):'';busy=true;target.streaming=true;target.note='';drawMsgs(true);let err='';
 try{const req=buildRequest(c,ch,history,extra);let lastDraw=0;
  const r=await aiStream(req,t=>{target.swipes[target.sw]=base+(mode==='cont'&&base&&!/^\s/.test(t)?' ':'')+t;const now=Date.now();if(now-lastDraw>60){lastDraw=now;const el=document.querySelector('.m.last .tx');if(el){el.innerHTML=render(fill(target.swipes[target.sw],c));scrollDown()}}});

 if(!err&&S.autoSum&&cur.chat===ch){busy=true;try{await summarize(c,ch,false)}finally{busy=false}}}
async function send(){if(busy){abortCtl?.abort();return}const ta=$('#c-in');const t=ta.value.trim();const{chat:ch}=cur;
 if(!t&&!pending.length){const l=ch.messages[ch.messages.length-1];if(l&&l.role==='user')return generate('new');return}
 ch.messages.push({id:uid(),role:'user',swipes:[t],sw:0,images:pending.length?pending.slice():undefined});ta.value='';pending=[];drawPrev();grow();await saveChat(ch);drawMsgs(true);generate('new')}
$('#c-send').onclick=send;
const ta=$('#c-in');const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(180,ta.scrollHeight)+'px'};ta.oninput=grow;
const isTouch=matchMedia('(pointer:coarse)').matches;
ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!isTouch&&!e.isComposing){e.preventDefault();send()}};
$('#c-att').onclick=()=>$('#c-file').click();
$('#c-file').onchange=async e=>{await addImages([...e.target.files]);e.target.value=''};
ta.addEventListener('paste',async e=>{const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();await addImages(fs)}});
async function addImages(fs){for(const f of fs){if(!f.type.startsWith('image/'))continue;try{pending.push(await resizeImg(await readFile(f,'url'),1280,0.85))}catch(e){toast('Không đọc được ảnh '+f.name)}}drawPrev()}
function drawPrev(){const P=$('#c-prev');P.innerHTML=pending.map((s,i)=>`<div><img src="${s}"><button data-i="${i}">{i:close}</button></div>`).join('');P.querySelectorAll('button').forEach(b=>b.onclick=()=>{pending.splice(+b.dataset.i,1);drawPrev()})}

/* ---------- LOREBOOK EDITOR ---------- */
async function importLore(){const fs=await pick('.json,application/json',true);let n=0;for(const f of fs){try{const l=parseLorebook(JSON.parse(await readFile(f)),f.name.replace(/\.json$/i,''));await saveLore(l);LB.push(l);n++}catch(e){alert(f.name+': '+e.message)}}
 if(n){toast(`Đã nhập ${n} lorebook`);homeTab='lore';renderHome()}}
let lq='';
function openLore(id){const l=LB.find(x=>x.id===id);if(!l)return;go('lore');$('#l-title').textContent=l.name;const B=$('#l-body');
 const draw=()=>{const list=l.entries.map((e,i)=>[e,i]).filter(([e])=>!lq||(e.comment+' '+e.keys.join(' ')+' '+e.content).toLowerCase().includes(lq.toLowerCase()));
  B.innerHTML=`<div class="search"><input id="lq" placeholder="Tìm mục…" value="${esc(lq)}"></div><div class="mut" style="margin-bottom:8px">${list.length}/${l.entries.length} mục</div><div class="list">${list.map(([e,i])=>`<div class="it" data-i="${i}" style="${e.enabled?'':'opacity:.45'}"><div class="t"><b>${e.constant?'{i:pin} ':''}${esc(e.comment||'(không tên)')}</b><small>{i:key} ${esc(e.keys.join(', ').slice(0,90))}</small><small>order ${e.order} · ${e.content.length} ký tự</small></div><input type="checkbox" data-tg="${i}" ${e.enabled?'checked':''} title="Bật/tắt"></div>`).join('')}</div><button class="btn-g" id="l-add" style="width:100%">{i:plus} Thêm mục</button>`;
  const qi=$('#lq');qi.oninput=()=>{lq=qi.value;const p=qi.selectionStart;draw();const n=$('#lq');n.focus();n.setSelectionRange(p,p)};
  B.querySelectorAll('[data-tg]').forEach(x=>x.onclick=ev=>{ev.stopPropagation();l.entries[+x.dataset.tg].enabled=x.checked;saveLore(l);draw()});
  B.querySelectorAll('.it').forEach(x=>x.onclick=()=>editEntry(+x.dataset.i));
  $('#l-add').onclick=()=>{l.entries.push(normEntry({key:[],content:'',comment:'Mục mới'},uid()));editEntry(l.entries.length-1)}};
 const editEntry=i=>{const e=l.entries[i];const m=modal(`<h3>Sửa mục</h3><label>Tên (comment)</label><input id="x-c" value="${esc(e.comment)}"><label>Từ khóa (phẩy; /regex/ được)</label><input id="x-k" value="${esc(e.keys.join(', '))}"><label>Từ khóa phụ (selective)</label><input id="x-k2" value="${esc(e.keysecondary.join(', '))}">
  <label>Nội dung</label><textarea id="x-t" rows="10">${esc(e.content)}</textarea><div class="row"><div style="flex:1"><label>Order</label><input id="x-o" type="number" value="${e.order}"></div><div style="flex:1"><label>Xác suất %</label><input id="x-p" type="number" value="${e.probability}"></div></div>
  <div class="row" style="margin:12px 0"><label class="sw" style="color:var(--tx)"><input type="checkbox" id="x-cs" ${e.constant?'checked':''}> Luôn bật (constant)</label><label class="sw" style="color:var(--tx)"><input type="checkbox" id="x-en" ${e.enabled?'checked':''}> Kích hoạt</label></div>
  <div class="row"><button class="btn-p" id="x-s">Lưu</button><button class="btn-g" id="x-x">Hủy</button><button class="btn-d" id="x-d" style="margin-left:auto">Xóa</button></div>`);
  m.querySelector('#x-s').onclick=async()=>{Object.assign(e,{comment:$('#x-c').value,keys:splitList($('#x-k').value),keysecondary:splitList($('#x-k2').value),content:$('#x-t').value,order:+$('#x-o').value||0,probability:+$('#x-p').value||100,constant:$('#x-cs').checked,enabled:$('#x-en').checked});e.selective=e.keysecondary.length>0;await saveLore(l);m.remove();draw()};
  m.querySelector('#x-x').onclick=()=>{if(!e.content&&!e.keys.length)l.entries.splice(i,1);m.remove();draw()};
  m.querySelector('#x-d').onclick=()=>confirmDo('Xóa mục này?',async()=>{l.entries.splice(i,1);await saveLore(l);m.remove();draw()})};
 $('#l-more').onclick=e=>menu(e.currentTarget,[['{i:edit} Đổi tên',async()=>{const n=prompt('Tên lorebook:',l.name);if(n){l.name=n;await saveLore(l);$('#l-title').textContent=n}}],
  ['{i:download} Xuất JSON (SillyTavern)',()=>download(l.name.replace(/[^\w\-]+/g,'_')+'.json',{name:l.name,entries:Object.fromEntries(l.entries.map((e,i)=>[i,{uid:i,key:e.keys,keysecondary:e.keysecondary,comment:e.comment,content:e.content,constant:e.constant,selective:e.selective,order:e.order,position:e.position,disable:!e.enabled,depth:e.depth,probability:e.probability,useProbability:true}]))})],
  ['{i:trash} Xóa lorebook',()=>confirmDo('Xóa lorebook "'+l.name+'"?',async()=>{await DB.del('lore',l.id);for(const c of CH)if(c.lorebooks.includes(l.id)){c.lorebooks=c.lorebooks.filter(x=>x!==l.id);await saveChar(c)}await loadAll();go('home','lore')})]]);
 lq='';draw()}

/* ---------- SETTINGS ---------- */
function renderSettings(){const B=$('#s-body');B.innerHTML=`
 <div class="sec" style="white-space:normal"><h4>{i:key} Gemini API</h4><label>API key (chỉ lưu trong trình duyệt này – localStorage)</label><div class="row" style="flex-wrap:nowrap"><input id="s-key" type="password" autocomplete="off" value="${esc(getKey())}" placeholder="AIza…"><button class="btn-g" id="s-eye">{i:eye}</button></div>
 <label>Model</label><input id="s-model" list="models" value="${esc(S.model)}"><datalist id="models"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"><option value="gemini-2.0-flash"><option value="gemini-2.5-flash-lite"></datalist>
 <div class="row"><div style="flex:1"><label>Temperature</label><input id="s-temperature" type="number" step="0.05" min="0" max="2" value="${S.temperature}"></div><div style="flex:1"><label>Max output tokens</label><input id="s-maxTokens" type="number" value="${S.maxTokens}"></div><div style="flex:1"><label>Top P</label><input id="s-topP" type="number" step="0.01" min="0" max="1" value="${S.topP}"></div></div>
 <label class="sw" style="color:var(--tx);margin-top:12px"><input type="checkbox" id="s-autoSum" ${S.autoSum?'checked':''}> {i:brain} Tự động tóm tắt khi chat dài (mỗi ${S.sumEvery} tin cũ, giữ nguyên ${S.sumKeep} tin gần nhất)</label>
 <label class="sw" style="color:var(--tx);margin-top:12px"><input type="checkbox" id="s-civic" ${S.civic?'checked':''}> Gửi cả CIVIC_INTEGRITY=BLOCK_NONE (tự bỏ nếu model báo lỗi)</label></div>
 <div class="sec" style="white-space:normal"><h4>{i:globe} Proxy</h4><label>Nguồn AI</label><select id="s-source"><option value="gemini" ${S.source!=='proxy'?'selected':''}>Gemini API</option><option value="proxy" ${S.source==='proxy'?'selected':''}>Proxy (OpenAI-tương thích)</option></select>
 <label>Proxy URL</label><input id="s-proxyUrl" value="${esc(S.proxyUrl)}" placeholder="https://host/v1/chat/completions"><p class="mut">Nhập base URL (…/v1) cũng được – tự thêm /chat/completions.</p>
 <label>Proxy API key (chỉ lưu trong trình duyệt này)</label><div class="row" style="flex-wrap:nowrap"><input id="s-proxyKey" type="password" autocomplete="off" value="${esc(getProxyKey())}" placeholder="sk-…"><button class="btn-g" id="s-peye">{i:eye}</button></div>
 <label>Tên model Proxy</label><input id="s-proxyModel" value="${esc(S.proxyModel)}" placeholder="vd: gpt-4o, deepseek-chat…">
 <div class="row" style="margin-top:8px"><button class="btn-g" id="s-ptest">Kiểm tra kết nối</button></div><p class="mut" id="s-pres" style="white-space:pre-wrap"></p>
 <p class="mut">Temperature, max tokens, top P, system prompt và lore áp dụng cho cả hai nguồn.</p></div>
 <div class="sec" style="white-space:normal"><h4>{i:user} Bạn ({{user}})</h4><label>Tên</label><input id="s-userName" value="${esc(S.userName)}"><label>Persona</label><textarea id="s-persona" rows="4" placeholder="Mô tả nhân vật của bạn…">${esc(S.persona)}</textarea></div>
 <div class="sec" style="white-space:normal"><h4>{i:scroll} Prompt & Lore</h4><label>Global system prompt</label><textarea id="s-sysPrompt" rows="10">${esc(S.sysPrompt)}</textarea><button class="btn-g" id="s-reset" style="margin-top:6px">Khôi phục mặc định</button>
 <div class="row"><div style="flex:1"><label>Quét N tin gần nhất</label><input id="s-scanDepth" type="number" min="1" value="${S.scanDepth}"></div><div style="flex:1"><label>Ngân sách lore (token)</label><input id="s-loreBudget" type="number" value="${S.loreBudget}"></div><div style="flex:1"><label>Số ảnh gần nhất gửi lại</label><input id="s-imgLimit" type="number" min="0" value="${S.imgLimit}"></div></div></div>
 <div class="sec" style="white-space:normal"><h4>{i:save} Dữ liệu</h4><p class="mut">Lưu trữ: ${DB.mem?'localStorage (dự phòng)':'IndexedDB'} · ${CH.length} nhân vật · ${LB.length} lorebook · ${CT.length} chat</p><div class="row"><button class="btn-g" id="s-exp">{i:download} Sao lưu tất cả (JSON)</button><button class="btn-g" id="s-imp">{i:upload} Khôi phục từ file</button><button class="btn-d" id="s-wipe">Xóa toàn bộ</button></div><p class="mut">File sao lưu gồm nhân vật, lorebook, chat (kèm ảnh) và cài đặt, bộ nhớ/tóm tắt chat – KHÔNG gồm API key hay Proxy key.</p></div>`;
 $('#s-eye').onclick=()=>{const k=$('#s-key');k.type=k.type==='password'?'text':'password'};$('#s-peye').onclick=()=>{const k=$('#s-proxyKey');k.type=k.type==='password'?'text':'password'};
 $('#s-ptest').onclick=async()=>{const o=$('#s-pres');o.textContent='Đang kiểm tra…';const bak=[S.proxyUrl,S.proxyModel],kb=localStorage.getItem('rp_proxykey');
  S.proxyUrl=$('#s-proxyUrl').value;S.proxyModel=$('#s-proxyModel').value;const k=$('#s-proxyKey').value.trim();k?localStorage.setItem('rp_proxykey',k):localStorage.removeItem('rp_proxykey');
  try{const r=await proxyStream({model:S.proxyModel.trim(),messages:[{role:'user',content:'Say OK.'}],max_tokens:16,stream:true},()=>{});o.textContent='{i:check} Kết nối OK ('+normProxyUrl(S.proxyUrl)+')\nTrả lời: '+(r.text||'(rỗng)').slice(0,200)}
  catch(e){o.textContent='{i:xc} '+e.message}finally{abortCtl=null;[S.proxyUrl,S.proxyModel]=bak;kb?localStorage.setItem('rp_proxykey',kb):localStorage.removeItem('rp_proxykey')}};
 $('#s-reset').onclick=()=>{$('#s-sysPrompt').value=DEFAULT_SYS};
 $('#s-exp').onclick=()=>download('rpchat_backup_'+new Date().toISOString().slice(0,10)+'.json',{app:'rpchat',version:1,exported:Date.now(),settings:S,chars:CH,lorebooks:LB,chats:CT});
 $('#s-imp').onclick=async()=>{const[f]=await pick('.json');if(!f)return;try{const j=JSON.parse(await readFile(f));if(j.app!=='rpchat')throw new Error('Không phải file sao lưu RP Chat');
  const rep=confirm('OK = Thay thế toàn bộ dữ liệu hiện tại\nHủy = Gộp thêm vào');if(rep)await wipe();
  for(const c of j.chars||[])await saveChar(c);for(const l of j.lorebooks||[])await saveLore(l);for(const c of j.chats||[])await DB.put('chats',c);if(j.settings){S=Object.assign({},DEF,j.settings);localStorage.setItem('rp_settings',JSON.stringify(S))}
  await loadAll();toast('Đã khôi phục');renderSettings()}catch(e){alert(e.message)}};
 $('#s-wipe').onclick=()=>confirmDo('Xóa TOÀN BỘ nhân vật, lorebook, chat?',async()=>{await wipe();await loadAll();renderSettings()})}
async function wipe(){for(const s of['chars','lore','chats'])for(const x of await DB.all(s))await DB.del(s,x.id)}
$('#s-save').onclick=()=>{const k=$('#s-key').value.trim();k?localStorage.setItem('rp_apikey',k):localStorage.removeItem('rp_apikey');
 const pk=$('#s-proxyKey').value.trim();pk?localStorage.setItem('rp_proxykey',pk):localStorage.removeItem('rp_proxykey');
 for(const f of['model','userName','persona','sysPrompt','source','proxyUrl','proxyModel'])S[f]=$('#s-'+f).value;for(const f of['temperature','maxTokens','topP','scanDepth','loreBudget','imgLimit'])S[f]=Number($('#s-'+f).value);S.civic=$('#s-civic').checked;S.autoSum=$('#s-autoSum').checked;
 if(!S.model.trim())S.model=DEF.model;localStorage.setItem('rp_settings',JSON.stringify(S));toast('Đã lưu cài đặt')};

/* ---------- SEED / INIT ---------- */
async function seed(manual){const P=window.PRELOAD;if(!P)return;if(manual&&!confirm('Nhập nhân vật & lorebook mẫu? (dữ liệu trùng sẽ được ghi đè)'))return;
 for(const l of P.lorebooks)await saveLore(l);for(const c of P.chars)await saveChar(c);localStorage.setItem('rp_seeded','1');await loadAll();if(manual){toast('Đã nhập dữ liệu mẫu');renderHome()}}
(async()=>{await DB.open();await loadAll();if(window.PRELOAD&&!localStorage.getItem('rp_seeded'))await seed(false);renderHome();
 if(!getKey())setTimeout(()=>toast('Vào {i:gear} Cài đặt để dán Gemini API key của bạn',4000),600)})();
window.RP={activateLore,keyMatch,parseLorebook,cardToChar,pngChara,buildContents,buildRequest,buildSystem,geminiStream,proxyStream,toOpenAI,normProxyUrl,aiStream,summarize,sumCut,DB,get CH(){return CH},get LB(){return LB},get CT(){return CT},loadAll,openChat,newChat,send,addImages,saveChar,saveLore,get pending(){return pending}};
</script></body></html>
