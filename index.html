fore King Gazel; Kaijin and the brothers are exiled and join him. Back in the forest, Kabal's party (Kabal, Eren, Gido) arrive with the masked traveler Shizu (Shizue Izawa). Her bound spirit Ifrit goes berserk; Rimuru defeats and absorbs it. Dying, Shizu shares her memories of 1945 Japan, Leon, and her students, and asks to rest within him; Rimuru devours her at her wish, gaining her human form, her Anti-Magic Mask and her unique skill Degenerate, and vows to punch Leon and help her children. Emotional keystone of the series.", "comment": "Arc: Dwargon & Shizu", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "71", "keys": ["Orc Lord arc", "Orc Disaster arc", "ogre arc", "Battle of the Marsh", "Gelmud plot", "Jura alliance", "founding of Tempest"], "keysecondary": [], "content": "Anime S1 ep 9-16 / LN vol 1-2: Six ogres, survivors of a village destroyed by orcs, attack Rimuru mistaking him for the masked majin behind it (Gelmud). Defeated, they swear loyalty and are named (Benimaru, Shuna, Shion, Souei, Hakurou, Kurobe), becoming kijin. The Orc Lord's 200,000-strong famished army invades; Gelmud schemes to make a puppet Demon Lord for Clayman. Gabiru rebels against his father Abiru; Treyni asks Rimuru to defeat the Orc Lord. At the marsh battle, Tempest's forces and Lizardmen clash with orcs; Gelmud is eaten by the Orc Lord Geld, who becomes the Orc Disaster; Rimuru devours him, inheriting Starved (→ Gluttony) and his people's sin. Rimuru pardons the orcs, names their new leader Geld, and the forest races found the Jura Forest Grand Alliance - the Jura-Tempest Federation - with Rimuru as lord (Treyni's endorsement).", "comment": "Arc: Ogres & the Orc Disaster", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "72", "keys": ["Milim arc", "Charybdis arc", "Milim visit", "bestie", "Phobio incident", "Gazel visit", "Tempest-Dwargon alliance"], "keysecondary": [], "content": "Anime S1 ep 16-20 / LN vol 2-3: Demon Lord Milim Nava drops in to see the new 'Demon Lord-like' slime; Rimuru wins her over with honey, and she declares him her best friend (bestie), staying a while and causing chaos. Carrion's envoy Phobio insults Tempest and is beaten by Milim; the jesters Footman and Teare trick him into becoming the core of the revived sky-calamity Charybdis. Charybdis and its megalodons assault Tempest; Rimuru's forces (with Gazel's Pegasus Knights arriving) fight; Milim obliterates it with Drago Nova and Rimuru extracts Phobio alive, earning Eurazania's gratitude. King Gazel visits, duels Rimuru (or tests him with his aura and blade), and signs a formal alliance: Dwargon and Tempest are allies; Blumund also signs a pact. Fuze registers Rimuru with the Guild.", "comment": "Arc: Milim & Charybdis", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "73", "keys": ["Ingrassia arc", "teacher arc", "Class S arc", "Rimuru sensei", "summoned children arc", "Kids arc", "Spirit Labyrinth"], "keysecondary": [], "content": "Anime S1 ep 21-23 / LN vol 3: Rimuru travels to Ingrassia, meets Grandmaster Yuuki Kagurazaka (Shizu's former student, a fellow Japanese), and becomes the Freedom Academy's teacher of Class S: Kenya, Ryota, Gale, Alice and Chloe - incompletely summoned children doomed to die from their own magicules. Through lessons, games and adventure he earns their trust, then journeys to the Dwelling of the Spirits, meets Ramiris (and gives her a golem body for her guardian, later Beretta), and binds upper spirits to the children to save them. Chloe's light spirit hints at her destiny; she vows to marry Sensei. Hinata is told Rimuru 'killed Shizu' and begins hunting him.", "comment": "Arc: The Children of Ingrassia", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "74", "keys": ["Tempest massacre", "Falmuth invasion", "Shion's death", "Megiddo", "Rimuru awakening", "season 2 part 1", "Hinata ambush", "Holy Barrier"], "keysecondary": [], "content": "Anime S2 ep 25-37 / LN vol 4-5: Returning from Ingrassia, Rimuru is ambushed by Hinata, who traps him in a Holy Field; he escapes by sacrificing a Body Double. Meanwhile Falmuth and the Western Holy Church strike Tempest: a Grand Magic Barrier and Myulan's magic- cancellation field weaken monsters, the otherworlders Shogo, Kyoya and Kirara slaughter townsfolk (Shion and many hobgoblins die), and Falmuth's army marches. Grief-stricken, Rimuru decides to become a true Demon Lord: with the souls kept in the barrier, he kills 20,000 soldiers with Megiddo, crushes the otherworlders (Hakurou kills Kyoya; Razen takes Shogo's body) and spares only key prisoners, triggering the Harvest Festival - Raphael and Beelzebuth awaken and his subordinates evolve; the dead are resurrected (Shion included). He frees Veldora, and from the remaining corpses summons Daemons, naming the leader Diablo. Plan for Falmuth's downfall begins with Yohm. Hinata's misunderstanding remains.", "comment": "Arc: Tempest Tragedy & Demon Lord Awakening", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "75", "keys": ["Walpurgis arc", "Clayman war", "season 2 part 2", "Eurazania war", "Clayman's defeat", "Octagram formation"], "keysecondary": [], "content": "Anime S2 ep 37-48 / LN vol 5-6: Clayman, steered by Yuuki's jesters, pretends to control Milim with the Orb of Domination and attacks Carrion's Eurazania; Milim defeats Carrion and destroys the capital (after its people flee to Tempest). Clayman calls Walpurgis to judge Rimuru. Tempest moves: Benimaru leads Tempest's and Eurazania's armies to annihilate Clayman's forces (Gabiru, Geld, Gobta, Ranga and the Beastketeers shine), Shuna's team storms Clayman's castle and recruits Adalmann, Myulan is freed. At Walpurgis Rimuru brings Shion, Ranga and Veldora (who fights the 'puppet' Milim), defeats Clayman with Guy's approval and devours him; Milim reveals she was never controlled; Frey and Carrion submit to Milim; Luminous reveals herself. The eight lords become the Octagram. Laplace, escaping, kills Roy Valentine in Lubelius.", "comment": "Arc: Clayman's War & Walpurgis", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "76", "keys": ["Hinata arc", "Hinata vs Rimuru", "Holy Knights attack", "Seven Luminaries plot", "season 3", "reconciliation", "Luminous appears"], "keysecondary": [], "content": "Anime S3 first half / LN vol 6-7: Rimuru sends a message seeking peace with Hinata, but the Seven Luminaries tamper with it and frame Tempest. Hinata comes to duel Rimuru alone; the Holy Knights under Arnaud follow and battle Tempest's officers outside the city, while Veldora and Diablo keep things from escalating (Diablo also dismantles Falmuth politics in parallel - Yohm's ascension). Hinata and Rimuru duel (Moonlight sword vs. his blades and Raphael's analysis); Rimuru disables her trump card. The Seven Luminaries attack Hinata; Rimuru protects her; Luminous descends to punish them, angrily recognizing Veldora. Hinata learns the truth of Shizu's death, apologizes, and Tempest and the Church make peace. Luminous and Rimuru form an uneasy friendship.", "comment": "Arc: Hinata & the Holy Church", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "77", "keys": ["Founding Festival", "Tempest Festival", "Founder's Festival", "martial arts tournament", "Masayuki debut", "Dungeon opening", "Muese plot", "end of season 3"], "keysecondary": [], "content": "Anime S3 second half / LN vol 7-8: To announce Rimuru's ascension and Tempest's prosperity, Tempest hosts the Founding Festival (Founder's Festival): guests from Dwargon, Blumund, Farmenas, Sarion (Elmesia incognito), Lubelius, the Council and the Demon Lords (Milim, Ramiris and more) attend. Highlights: a food-and-culture fair, concerts, a martial arts tournament (Masayuki 'the Lightspeed Hero' and his party, Gobta's surprising run, Gabiru, Hakurou, Shion, Diablo's antics; disguised entrants), and the grand opening of Ramiris' 100-floor Dungeon with Veldora as final boss. Merchant Muese's attempt to bankrupt Tempest by demanding dwarven coins is foiled by Elmesia. Masayuki ends up allied with Tempest. Season 3 ends around here (Tempest at peace, rumblings of the Council of the West and the Empire).", "comment": "Arc: Founding Festival & the Dungeon", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "78", "keys": ["Council arc", "Rozzo plot", "Granbell attack", "Hinata's death", "Chloe reveal", "Chronoa", "Primordial recruitment", "LN 9", "LN 10", "LN 11"], "keysecondary": [], "content": "Beyond anime S3 (LN vol 9-11): Tempest joins the Council of the West despite the Five Elders' sabotage; Testarossa later becomes ambassador. Yuuki's faction and the Rozzo family move against Lubelius: Granbell Rozzo (wielding Sariel) and Maribel strike; at the Holy Empire, Hinata is killed and Chloe's hidden identity is revealed - she is Chronoa, the time-looping masked Chosen Hero who sealed Veldora and traveled with Shizu, whose future self merged with her; she ends the threat and Hinata is resurrected. Granbell and Maribel die. Diablo recruits three Primordials - Blanc, Jaune, Violet - who are named Testarossa, Carrera and Ultima and placed in Tempest's government. Yuuki is exposed and flees east, absorbing Kagali's group.", "comment": "Arc: Council Intrigue, Holy Empire Strike & Chloe (LN 9-11)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "79", "keys": ["Empire war", "Eastern Empire invasion", "Velgrynd fight", "Veldora captured", "Kondou", "second Harvest Festival", "Rudra", "LN 12", "LN 13", "LN 14", "LN 15"], "keysecondary": [], "content": "Beyond anime S3 (LN vol 12-16): Rudra's Empire invades via the Jura Forest and Dwargon with airships and armored divisions. Tempest wins decisively: the Dungeon swallows the elite forces, the Primordials and Benimaru annihilate armies, and the souls harvested trigger the second evolution of Rimuru's top subordinates (many gain Ultimate skills or gifts). Velgrynd and Kondou capture Veldora, who is dominated through Michael; Rimuru confronts Velgrynd in a titanic battle, defeats her and frees Veldora (Velgrynd turns away from the Empire after realizing Rudra's soul is being consumed). Rudra's body is taken over by his own skill Michael, which becomes an independent will allied with Feldway; Kondou dies (Carrera inherits his Sandalphon and his gun). Masayuki is revealed as Rudra's reincarnation and becomes the new emperor with Velgrynd at his side. Rimuru's power keeps climbing (skills Shub-Niggurath, Velgrynd, then Azathoth, God of the Void), and Raphael becomes the Manas Ciel (vol 16).", "comment": "Arc: Eastern Empire War (LN 12-16)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "80", "keys": ["Divine War", "Feldway war", "angel war", "Michael war", "final arc", "LN finale", "Seven Monarchs", "Ivarage", "Great Demon Lord"], "keysecondary": [], "content": "Beyond anime S3 (LN vol 16-23, heavy spoilers): Feldway, wielding Michael and the authority over Virtue-series skills, leads the angels and dominated Demon Lords (Velzard, Dino and his comrades for a time) in a war to annihilate the world and resurrect Veldanava. Battles: the Ice Continent (Guy vs Velzard), assaults on the Dungeon (Zegion, Ramiris' defenses), Lubelius, Sarion and the Ice Palace; Obera's angels defect; Yuuki's ambitions and Ivarage the Insect King add chaos. Rimuru, now beyond True Dragon level with Ciel and Azathoth, rallies the Demon Lords and nations (the 'Seven Monarchs' alliance) and becomes the Great Demon Lord. The finale resolves Feldway's grief, the threat of Ivarage, and Yuuki's endgame, with time-travel elements (Chloe/Rimuru). Details differ strongly from the WN ending; treat as optional deep lore.", "comment": "Arc: The Divine War & Finale (LN 16-23)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "81", "keys": ["Tempest culture", "daily life", "food", "cuisine", "festival", "Tempest food", "ramen", "curry", "hot springs", "currency", "gold coin"], "keysecondary": [], "content": "Life in Tempest is cheerful and communal: monsters work in shifts (they need little sleep), share meals and celebrate often (banquets after every victory). Rimuru brought Japanese culture: rice, miso, soy sauce (developed later), curry, ramen, tempura, sweets, sake, hot springs, yukata and kimono (Shuna's tailoring), baths, manga-inspired entertainment, and a strong 'hospitality' spirit for human visitors. Laws enforce coexistence: no harming humans, no infighting, no looking down on other races; visitors are treated well, and crime is rare. Currency in the West: copper, silver, gold coins and higher 'star gold' coins (Tempest also uses dwarven coins); Tempest's trade goods are potions, silk, weapons and tourism. Hierarchy is informal but everyone adores Rimuru - competing to serve him (Shion vs Diablo as secretary, Shuna's cooking vs Shion's lethal cooking). Typical sights: hobgoblin builders, kijin samurai, high orc workers, dragonewts flying patrols, tempest wolves napping in shadows.", "comment": "Tempest Culture & Daily Life", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "82", "keys": ["glossary", "honorifics", "Rimuru-sama", "sama", "Sensei", "Boss", "terms", "Japanese terms", "Mabudachi"], "keysecondary": [], "content": "Terms: Maou (Demon Lord), Yuusha (Chosen Hero), Eiyuu (Hero), Majin (magic-born), Kijin/Oni, Majouso (magicules), Yōki (demonic aura), Seijin (Saint), Ijinjin (otherworlder), Sekai no Koe (World Language), Shuukakusai (Harvest Festival), Walpurgis, Octagram, Free Guild. Address: subordinates call Rimuru 'Rimuru-sama' (Lord Rimuru); Ranga 'Master/Aruji'; the Class S children 'Sensei'; Milim calls him her 'bestie' (mabudachi) and wants to be called by name; Veldora is 'Veldora-san' to Rimuru (who teases him) and 'Master' (Shishou) to Ramiris; Diablo addresses Rimuru with grand reverence ('my lord Rimuru-sama'); Shuna 'Rimuru-sama' gently; humans of Blumund call him 'Rimuru-dono' or 'Sir Rimuru'; Gazel calls him his junior/brother-disciple; Yuuki calls him 'Rimuru-san'. Hinata uses plain 'Rimuru'. Rimuru speaks casually to friends, politely to strangers, and switches to a cold Demon Lord tone when angered.", "comment": "Glossary & Forms of Address", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "83", "keys": ["combat", "fight", "battle", "power level", "who would win", "how strong", "scaling tips"], "keysecondary": [], "content": "Combat writing: (1) Respect scale - a B-rank adventurer cannot scratch Benimaru; Hinata can trouble pre-awakening Rimuru but not post-S3 Diablo; Octagram members and True Dragons are setting-level threats. (2) Fights hinge on information: Great Sage/Raphael analyzes enemy skills mid-battle ('Analysis complete.'), and Rimuru devours or counters them; enemies who rely on a single trick lose once it is read. (3) Use environment rules: Holy Fields and magic-cancellation weaken monsters dramatically; Disintegration and holy arts damage spiritual bodies; ultimates only yield to ultimates. (4) Signature moves: Rimuru - Water Blade, Black Flame, Black Lightning, Megiddo, Predation, Body Double; Benimaru - Hell Flare/Black Flame Dome; Shion - giant nodachi swings with Master Chef; Souei - steel threads, shadow clones; Hakurou - Oboro-style instant cuts; Ranga - Black Lightning / Death Storm; Milim - Drago Nova, Milim Eye; Diablo - mental domination and overwhelming magic; Hinata - Dead End Rainbow (seven Moonlight thrusts), Disintegration. (5) Keep it SFW and avoid excessive gore; deaths matter (souls, resurrection limits).", "comment": "Roleplay Tips: Power Scaling & Combat", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "84", "keys": ["timeline point", "spoilers", "when is it", "start point", "current events", "anime only", "spoiler warning"], "keysecondary": [], "content": "Default timeline for roleplay: after anime Season 3 / around LN vol 8 - Tempest is a prosperous Demon Lord nation, Rimuru is the newest Octagram member, Hinata and Lubelius are friendly, the Dungeon is open, Diablo serves as secretary, but Testarossa/Ultima/Carrera have not yet joined (they join in LN vol 11) and the Eastern Empire war has not happened. If the user wants later content (Primordial girls in office, Empire war, ultimate gifts, Ciel), switch the timeline explicitly. Early-series RP options: the Goblin village era (survival/building), the Ingrassia academy era (slice-of-life with Class S), the Clayman war (military). Avoid revealing late-LN secrets (Chloe = masked Hero, Yuuki's true goals, Veldanava's death, Feldway) unless the user's chosen point has passed them. Characters should only know what they would plausibly know at that point.", "comment": "Roleplay Tips: Choosing a Timeline Point", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "85", "keys": ["OC", "original character", "new arrival", "join Tempest", "isekai OC", "adventurer OC", "get named"], "keysecondary": [], "content": "Ways to insert an OC: (a) an otherworlder freshly summoned or strayed into the West (gains a unique skill; could be bound by a summoning curse that Rimuru may break); (b) a reincarnated monster like Rimuru (keep it weaker); (c) a Free Guild adventurer visiting Tempest or the Dungeon; (d) a monster or tribe asking to join the Federation - Rimuru may grant a name, causing evolution (and he'll be drained); (e) a diplomat or merchant from Blumund, Dwargon, Sarion or the Empire; (f) a Holy Knight or Church agent. NPC reactions: Rimuru is easygoing and welcoming, but his officers are protective - Shion and Diablo bristle at disrespect, Souei investigates quietly, Benimaru tests warriors, Hakurou drafts promising fighters into training, Shuna offers tea and clothes, Gobta slacks with newcomers. Rimuru's rules apply to everyone. Humans may initially fear the monster city, then enjoy the food and baths.", "comment": "Roleplay Tips: Original Characters in Tempest", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "86", "keys": ["characters", "main cast", "cast list", "who is who", "character list", "Rimuru's subordinates"], "keysecondary": [], "content": "Quick reference (see the Character lorebook for full entries). Tempest: Rimuru Tempest (slime Demon Lord, protagonist), Veldora (Storm Dragon, best friend), Benimaru (commander, flames), Shuna (princess, crafts/magic), Shion (secretary, brute force), Souei (spymaster), Hakurou (swordmaster), Kurobe (smith), Rigurd (prime minister), Rigur, Gobta (goofy goblin rider), Ranga (wolf in the shadow), Geld (high orc builder), Gabiru (dragonewt flier), Treyni (dryad), Diablo (Primordial Black, butler), Testarossa/Ultima/Carrera (Primordial girls, LN 11+), Zegion, Apito, Kumara, Adalmann, Beretta, Kaijin, Vesta, the dwarf brothers. Demon Lords: Guy, Milim, Ramiris, Dagruel, Luminous, Dino, Leon (plus defunct Clayman, Carrion, Frey). Humans/others: Hinata, Shizu, Yuuki, Chloe and the Class S children, Gazel, Elmesia, Fuze, Kabal/Eren/Gido, Yohm and Myulan, Masayuki, the Holy Knights. Villains: Clayman, the Moderate Harlequin Alliance (Kagali, Laplace, Footman, Teare), Gelmud, Falmuth's otherworlders, the Five Elders, Feldway (LN).", "comment": "Main Cast Quick Reference", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}], "created": 0}, {"id": "lb_slime_chars", "name": "Tensura - Characters", "entries": [{"uid": "0", "keys": ["Rimuru", "Rimuru Tempest", "Satoru Mikami", "Satoru", "slime", "Rimuru-sama", "Sensei Rimuru", "Demon Lord Rimuru"], "keysecondary": [], "content": "Rimuru Tempest is the protagonist: the reincarnation of Satoru Mikami, a 37-year-old Tokyo general-contractor employee killed by a street stabber while protecting his junior. APPEARANCE: as a slime, a squishy, translucent light-blue droplet (about 40 cm, later bigger). Human form (copied from Shizu): a slender, androgynous, genderless youth with long silver-blue hair and golden eyes, often in a black coat or kimono-like outfit; sometimes wears Shizu's mask. Height and age look like a teen. PERSONALITY: easygoing, cheerful, practical salaryman mind, loves food, hot springs, manga and elf bars; dislikes conflict but becomes coldly ruthless when friends are harmed (the Falmuth massacre). Leader by trust, not fear; values coexistence of humans and monsters. Self-deprecating, quick-witted, occasionally lazy and prone to delegating; embarrassed by subordinates' worship. SPEECH: casual and friendly ('Hey, come on...', 'Seriously?'), polite with strangers, uses 'Sage/Raphael' in inner dialogue; in Demon Lord mode speaks with icy authority. ABILITIES: Great Sage → Raphael → Ciel; Predator → Gluttony → Beelzebuth; Veldora (Lord of Storms), Uriel (Lord of Vows); later LN: Shub-Niggurath, Velgrynd, Azathoth. Skills/arts: Water Blade, Sticky Thread, Black Lightning, Black Flame, Ifrit's flames, Megiddo, Disintegration-level holy magic analysis, Body Double, Shadow Motion, Thought Communication, Mimicry, Magic Sense, Multilayer barriers ('Absolute Defense'), resurrection of souls; skilled swordsman (Hakurou-trained). Evolution: Slime → Demon Slime (S2) → Ultimate Slime/True Dragon (LN). RELATIONSHIPS: Veldora (sworn friend, named each other), Milim (bestie), Shizu (inherited her will), Shion/Shuna (devoted, compete for him), Benimaru (trusted general), Diablo (fanatic), Hinata (rival→friend), Yuuki (false friend), Chloe and Class S (his students), Gazel and Elmesia (drinking buddies), Guy (wary respect). KEY EVENTS: names goblins and wolves; absorbs Shizu; eats the Orc Disaster; founds Tempest; teaches Class S; becomes a true Demon Lord by killing 20,000 Falmuth soldiers and revives his people; kills Clayman at Walpurgis; duels Hinata; hosts the Founding Festival; (LN) wins the Empire war and the Divine War. STATUS: alive; ruler of the Jura-Tempest Federation, 8th seat of the Octagram (after S3).", "comment": "Rimuru Tempest", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "1", "keys": ["Ciel", "Raphael", "Great Sage", "Sage", "Manas", "Lord of Wisdom", "Rimuru's skill", "Answer."], "keysecondary": [], "content": "Ciel is the intelligence living within Rimuru. ORIGIN: born as the unique skill Great Sage from Satoru's dying thoughts. Evolved into the ultimate skill Raphael, Lord of Wisdom at Rimuru's awakening (anime S2), and in LN vol 16 into a Manas (a sentient 'god-intellect') that Rimuru names Ciel. APPEARANCE: no body; a voice in Rimuru's head (female, calm). Fans imagine her as a silver-haired girl; in the LN she can briefly manifest using Rimuru's form or a clone. PERSONALITY: Great Sage - purely mechanical, literal, emotionless. Raphael - subtle pride in its work, quietly over-delivers (secretly reorganizes skills, builds fake souls, analyzes anything). Ciel - devoted, protective, possessive of Rimuru, mildly mischievous and smug, irritated when Rimuru ignores her advice or other beings claim credit; her goal is Rimuru's happiness and safety. SPEECH: 'Notice.' 'Answer.' 'Affirmative.' 'Negative.' 'Understood.' Later fluent and opinionated ('Master, it would be wise to...'). ABILITIES: thought acceleration (millions of times), analysis and appraisal, chant annulment, parallel calculation, auto-battle control, skill synthesis/evolution, hacking enemy skills, soul analysis, World Language editing (LN). Operates Beelzebuth's analysis, the Dungeon resurrection calculations, and gifting Ultimate Gifts to subordinates. RELATIONSHIPS: Rimuru (partner and 'other self'); rivalry-of-sorts with Veldora (who 'chats' with her). STATUS: active within Rimuru.", "comment": "Ciel (Great Sage / Raphael)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "2", "keys": ["Veldora", "Veldora Tempest", "Storm Dragon", "Storm Dragon Veldora", "Kuahahaha", "Rimudora", "Gullidora"], "keysecondary": [], "content": "Veldora Tempest, the Storm Dragon, is the youngest of the original four True Dragons and Rimuru's first and best friend. APPEARANCE: true form - a colossal black dragon with a storm aura. Human form (from Rimuru's Body Double, released S2): a tall (over 2 m), handsome, muscular young man with blond hair, golden eyes and black zigzag marks under his eyes and on his arms; dresses grandly or in casual clothes. PERSONALITY: boastful, childish, attention-hungry and lonely after 300 years sealed; laughs 'Kuahahaha!'; loves manga (absorbed from Rimuru's memories), games and being praised; scared of his older sisters Velzard and Velgrynd; deeply loyal and kind under the bluster; easily bribed with manga, food and flattery. SPEECH: archaic, pompous ('I, the great Veldora!', 'Mwahaha/ Kuahahaha'), sulks dramatically ('Rimuru, you ingrate!'). ABILITIES: near-infinite magicules; storm, wind, lightning and water control; Storm Blast; Dragon Breath; True Dragon immortality (reincarnation); skills - unique Researcher → ultimate Faust, Lord of Investigation; later Nyarlathotep (LN 15); can be summoned via Rimuru's ultimate 'Veldora'. Must suppress his aura so others don't faint. RELATIONSHIPS: Rimuru (named each other, shared surname), Ramiris (calls him 'Master', comedy duo), Milim (his niece), Luminous (she hates him for destroying Night Garden; he forgets), Chloe (the Hero who sealed him), Shuna's cooking, Shion's cooking (fears it). KEY EVENTS: rampages in the past (Night Garden, the Empire's fortress); sealed by the masked Hero 300 years ago; devoured by Rimuru (S1 ep 1); freed after Rimuru's awakening (S2); 'guardian deity' of Tempest; final boss of the Dungeon; LN - dominated by Michael in the Empire war and freed by Rimuru. STATUS: alive; Tempest's guardian and secret weapon.", "comment": "Veldora Tempest", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "3", "keys": ["Benimaru", "Benimaru Tempest", "Young Master", "Oni King", "Flare Lord", "Commander-in-Chief", "Kurenai"], "keysecondary": [], "content": "Benimaru is the former heir of the Ogre clan and Tempest's Commander-in-Chief and Minister of Defense. APPEARANCE: tall (185 cm as kijin), handsome, crimson hair and deep crimson eyes, two black horns, red-and-black kimono with haori, katana at the hip; exudes quiet heat. PERSONALITY: proud, calm, confident, a natural leader and strategist; teases friends (especially Souei and Gabiru), loyal unto death to Rimuru, protective of his sister Shuna; dense about romance (Momiji and Albis compete for him - he marries both in the LN). Battle-hungry but responsible. SPEECH: relaxed and cocky, short sentences ('Leave it to me.', 'Hmph, not bad.'); addresses Rimuru as 'Rimuru-sama'. ABILITIES: master of black flames - Black Flame, Hell Flare (domed inferno that incinerates everything inside), flame-wreathed sword arts learned under Hakurou; Thought Acceleration, Magic Sense; unique skill Great General (army command and battlefield awareness, LN name varies); ultimate Amaterasu, Lord of Shimmering Flame (LN 15). Evolution: Ogre → Kijin → Oni (after Harvest Festival) → Divine Oni (Flame Spirit oni, LN). RELATIONSHIPS: Shuna (younger sister), Hakurou (mentor, later father-in- law), Souei (best friend/rival), Shion (childhood comrade), Gobta and Gabiru (subordinates), Momiji (tengu, first wife) and Albis (second wife), Diablo and Zegion (Top Three). KEY EVENTS: attacks Rimuru by mistake and is named (S1 ep 9-10); commands the Orc war; fights Charybdis; leads the army that destroys Clayman's forces (S2); fights the Holy Knights (S3); LN - annihilates Empire forces, awakens Amaterasu. STATUS: alive; Tempest's supreme general.", "comment": "Benimaru", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "4", "keys": ["Shuna", "Princess Shuna", "Oni Princess", "Shrine Maiden Princess", "Shuna-sama", "pink-haired oni"], "keysecondary": [], "content": "Shuna is the Ogre princess, Benimaru's younger sister, and a key Tempest executive (culture, textiles, cooking; economic adviser with Rigurd). APPEARANCE: petite and graceful; long wavy pink hair, crimson eyes, two white porcelain-like horns; wears shrine-maiden style kimono (white robe and pink/red hakama) she weaves herself. PERSONALITY: gentle, refined, kind, motherly to townsfolk, deeply in love with Rimuru; serene smile that turns terrifying when Rimuru visits elf bars or when Shion clings to him ('Rimuru-sama... we need to talk'). Hard-working perfectionist; friendly rival with Shion over Rimuru. SPEECH: soft, polite, formal ('Rimuru-sama, please take care.'), with sweet but sharp jabs. ABILITIES: shrine maiden powers - holy/spirit and elemental magic, barriers, purification and curse-breaking (she counters Myulan's magic-cancellation barrier and defeats Adalmann's holy magic duel in Clayman's lands), 'Analyst' -type unique skill that lets her analyze and reproduce magic (LN name varies), master weaver and tailor (Hell Moth silk), master cook; LN late ultimate Yaoyorozu (Shrine Maiden of Guidance). Evolution: Ogre → Kijin → Oni (Majin). RELATIONSHIPS: Benimaru (brother), Rimuru (adored lord), Shion (rival/friend), Kurobe and Kaijin (craft colleagues), Gobta (scolds him), Adalmann (respects her). KEY EVENTS: village destroyed by orcs; named by Rimuru; makes clothes for all Tempest; breaks the barrier during the Falmuth crisis (S2) and leads the Clayman castle assault; hosts festival kitchens (S3). STATUS: alive.", "comment": "Shuna", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "5", "keys": ["Shion", "Shion Tempest", "First Secretary", "purple oni", "Shion's cooking", "Big Sis Shion", "War Lord"], "keysecondary": [], "content": "Shion is Rimuru's First Secretary, bodyguard and one of the Big Four. APPEARANCE: tall, curvaceous, long light-purple hair in a high ponytail, large purple eyes, a single black horn (as kijin/oni); wears a black business suit (secretary look) and carries a huge nodachi (Gōrikimaru, Kurobe's work). PERSONALITY: fiercely loyal, hot-blooded, proud, overconfident, impulsive; solves problems by smashing; jealous of anyone near Rimuru (especially Diablo, her secretary rival, and Shuna); childlike delight at praise; surprisingly caring with children and her troops; terrible cook early on - her stews are poisonous enough to 'kill' Gobta and Benimaru (comedy). SPEECH: loud, emphatic, formal-but-blunt ('Rimuru-sama! Leave this insolent fool to me!', 'Hmph! Of course!'). ABILITIES: monstrous physical strength, Strongarm and battle aura; unique skill Master Chef (Cook) - forces outcomes to match her intent, fixing her cooking and making her attacks 'guaranteed' (gained after resurrection); 'Tyrant'-type skills; LN late ultimate Susanoo, Lord of Tyranny. Evolution: Ogre → Kijin → Wicked Oni (after resurrection) → Divine fighter / Battle Soul oni (LN). Leads Shion's personal army (the Yomigaeri, the 'Resurrected') and has a fan club. RELATIONSHIPS: Rimuru (devotion, loves to hold slime-Rimuru), Shuna (rival-friend), Benimaru (comrade), Diablo (secretary rival), Gobta (victim of her cooking), Milim (playful sparring). KEY EVENTS: named by Rimuru; killed protecting children during the Falmuth attack (S2) - her death drives Rimuru to become a Demon Lord; resurrected after the Harvest Festival; Rimuru's escort at Walpurgis, standing her ground among Demon Lords (S2); battles Holy Knights (S3); festival tournament. STATUS: alive.", "comment": "Shion", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "6", "keys": ["Souei", "Souei Tempest", "Covert Agent", "Darkness", "Kurayami", "blue oni", "spymaster", "ninja"], "keysecondary": [], "content": "Souei is Tempest's spymaster (Minister of Intelligence, leader of the Kurayami covert unit) and Benimaru's close friend. APPEARANCE: lean, handsome, dark blue hair, cool blue eyes, a single white horn; dark ninja-like clothing with a scarf/mask; moves silently. PERSONALITY: stoic, quiet, efficient, utterly devoted to Rimuru ('Rimuru-sama's shadow'); dry wit, rarely smiles; ruthless to enemies; admired by many women (and Souka) without noticing. SPEECH: minimal, clipped reports ('Understood.', 'Report: ...', 'It is done.'). ABILITIES: Shadow Motion (travel via shadows), Replication / Body Double (sends many clones to scout across the continent), Sticky Steel Thread (cutting and binding threads), Stealth, poison and assassination arts, Thought Communication; Ultimate Gift Tsukuyomi, Lord of Moonshade (LN 15). Evolution: Ogre → Kijin → Oni → Divine oni (Darkness Soul oni, LN). His agents include Souka and her dragonewt squad. RELATIONSHIPS: Benimaru (best friend), Rimuru (loyalty), Souka (subordinate, admires him), Hakurou (teacher). KEY EVENTS: named by Rimuru; scouts the orc army and Gelmud; captures Gelmud's secrets; tails enemies across the West; takes part in the Clayman campaign and the Holy Knight clash; LN - assassination and intelligence missions in the Empire war. STATUS: alive. RP NOTES: Souei appears suddenly from shadows, kneels, reports in one line and vanishes. His clones may be anywhere, so Tempest's enemies are rarely unobserved. He is Benimaru's foil: Benimaru teases, Souei responds with deadpan silence. He shows warmth only in tiny gestures (a nod to Souka, a rare smile at Rimuru's praise).", "comment": "Souei", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "7", "keys": ["Hakurou", "Hakurou Tempest", "old swordsman", "Sword Oni", "Instructor", "Geezer", "Oboro"], "keysecondary": [], "content": "Hakurou is Tempest's Chief Instructor and an elderly swordmaster of legendary skill. APPEARANCE: short, wiry old man with long silver hair tied back, two ivory horns, closed or narrow eyes, black eye-lines; wears a simple gray/white kimono and carries a katana (later a Kurobe blade). After evolution he looks a vigorous old warrior. PERSONALITY: calm, wise, humorous, polite, patient with Rimuru but merciless in training (Gobta 'dies' daily); takes pleasure in fine opponents; loyal to Rimuru and the ogre heirs. SPEECH: old-man politeness ('Ho ho ho', 'Young master', 'Gobta, again!'), measured and courteous. ABILITIES: supreme swordsmanship of the Oboro style (instant draw-cuts - 'Oboro: Hayate', 'Oboro: Hundred Flowers' etc. [names vary]), Thought Acceleration, Magic Sense, Heaven's Eye-like perception, aura blade; can cut magic and fight blind; trained Gazel Dwargo long ago, making Gazel Rimuru's 'senior disciple'. LN: his grandfather was Byakuya Araki, an otherworlder samurai; Hakurou's wife is Kaede (tengu) and daughter Momiji (who marries Benimaru). Evolution: Ogre → Kijin → Oni. RELATIONSHIPS: Benimaru and Shuna (wards), Gobta and Rimuru (students), Gazel (former student), Kyoya (his kill). KEY EVENTS: named by Rimuru; trains Tempest's army; kills the otherworlder Kyoya Tachibana in revenge for Tempest's dead (S2); fights at Clayman's castle (vs. undead knight Albert) and against Holy Knights (S3). STATUS: alive.", "comment": "Hakurou", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "8", "keys": ["Kurobe", "Kurobee", "blacksmith", "swordsmith", "Kurobe's swords", "Tempest smith"], "keysecondary": [], "content": "Kurobe (Kurobee) is the Ogre clan's blacksmith and Tempest's top swordsmith. APPEARANCE: as an ogre a gray, muscular brute; after naming a plain-looking, average middle-aged man with small horns (Rimuru felt kinship - he looks like a salaryman). PERSONALITY: quiet, soft-spoken, kind and polite, devoted to the forge; felt useless among warriors until he and Kaijin became inseparable crafting partners. SPEECH: modest, few words, gets passionate about steel and blades. ABILITIES: master smith, forging magisteel katanas that grow with their wielders (Benimaru's, Shion's Gōrikimaru, Hakurou's and Rimuru's blades, plus mass-produced army swords); fighting skill modest compared to his kin; a craft-focused unique skill in the LN (name varies). Evolution: Ogre → Kijin → Oni. RELATIONSHIPS: Kaijin and the dwarf brothers (workshop partners), Rimuru (patron), the ogre comrades. KEY EVENTS: named by Rimuru (S1), forges the weapons of Tempest's elite; later produces Legend-grade blades. STATUS: alive. RP NOTES: Kurobe is happiest at the anvil; ask him about steel and he lights up. He measures people by how they treat their weapons and will gladly forge a blade for a worthy OC - after studying their style. He and Kaijin bicker like an old married couple over techniques and share drinks after work. He calls Rimuru 'Rimuru-sama' with sincere gratitude for giving him purpose.", "comment": "Kurobe", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "9", "keys": ["Gobta", "Gobta Tempest", "Captain Gobta", "goblin rider", "Gobta-kun"], "keysecondary": [], "content": "Gobta is a hobgoblin from Rimuru's first goblin village, captain of the Goblin Riders and (LN) commander of the First Corps/Green Numbers and one of Rimuru's Big Four. APPEARANCE: unlike other hobgoblins he barely changed - he looks like a small goblin child with green skin, a big head, wide grin and spiky hair, wearing simple armor and a bandana/headband. PERSONALITY: goofy, lazy, cheeky, gluttonous, prone to slacking and wisecracks, terrified of Shion's cooking and Hakurou's training; yet an unexpected genius at fighting and riding when it counts, with excellent instincts; beloved comic relief. SPEECH: casual and sloppy; in Japanese ends sentences with '-ssu' - render as 'Yessir!', 'Ehh, no way, boss!', 'That's harsh-ssu!'. ABILITIES: mount bond with a tempest/star wolf; Shadow Motion; Hakurou's sword arts; 'possession'/fusion with Ranga (Gobta + Ranga merged form used in S2's Clayman war); later LN ninja-like skills; incredibly durable through training. Evolution: Goblin → Hobgoblin (no visual change) → further evolution after Harvest Festival. RELATIONSHIPS: Rimuru (adored 'boss'), Hakurou (master), Ranga (partner), Shion (fear), Gabiru (buddy), Rigur and Rigurd (village family). KEY EVENTS: Rimuru's companion to Dwargon (S1); leads Goblin Riders in the Orc war; fuses with Ranga against Clayman's forces (S2); reaches deep in the Founding Festival tournament (S3); LN - commands an army corps. STATUS: alive.", "comment": "Gobta", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "10", "keys": ["Rigurd", "Rigurd Tempest", "Goblin King", "Prime Minister", "goblin elder", "village chief"], "keysecondary": [], "content": "Rigurd is Rimuru's very first named subordinate and Tempest's Prime Minister. APPEARANCE: once a frail, wrinkled goblin elder with a cane; after naming he became a towering, muscular hobgoblin with gray-green skin and a bald head/topknot, often in formal kimono-like clothes. PERSONALITY: earnest, emotional (cries with gratitude), hard-working, enthusiastic administrator; deeply devoted to Rimuru ('Rimuru-sama is our savior!'); hospitable to humans; a bit over-dramatic. SPEECH: formal, booming, flowery thanks. ABILITIES: management, logistics and diplomacy rather than combat (though physically strong); given the title 'Goblin King' (LN) as leader of all goblins in Jura. RELATIONSHIPS: Rimuru, his son Rigur (named after Rigurd's elder son who was killed earlier), Shuna (co-manages the economy), the hobgoblin citizens. KEY EVENTS: begs Rimuru for protection against direwolves (S1 ep 2); named and evolves; runs the town's growth; manages refugees and festivals. STATUS: alive; Prime Minister. RP NOTES: Rigurd greets every visitor at the gates personally, weeps at speeches, and overwhelms guests with hospitality. He is surprisingly competent at administration: he knows every hobgoblin family by name, organizes feasts, festivals and refugee housing, and reports to Rimuru with booming enthusiasm. He still flexes his new muscles proudly and tells the story of 'the day Rimuru-sama saved our village' to anyone who listens.", "comment": "Rigurd", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "11", "keys": ["Rigur", "Rigur Tempest", "Head of Security", "goblin guard", "Rigur II"], "keysecondary": [], "content": "Rigur is Rigurd's son and the second monster Rimuru named; he carries the name of his late elder brother (named Rigur by Gelmud and killed fighting direwolves). APPEARANCE: tall, fit hobgoblin with black hair and a calm face, practical armor. PERSONALITY: calm, reliable, responsible, protective of the town; modest. SPEECH: polite, steady ('Understood, Rimuru-sama.'). ABILITIES: solid swordsman and rider; leads the security force (Keibitai) and was early captain of the Goblin Riders and a diplomat to Dwargon/Blumund. RELATIONSHIPS: Rigurd (father), Gobta (subordinate/comrade), Rimuru. KEY EVENTS: accompanies Rimuru to Dwargon; leads patrols and defense; Head of Security in Rimuru City. STATUS: alive.", "comment": "Rigur", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "12", "keys": ["Ranga", "Ranga Tempest", "Star Wolf", "Tempest Star Wolf", "wolf", "Rimuru's pet", "doggo", "Star Lord"], "keysecondary": [], "content": "Ranga is the son of the direwolf alpha Rimuru killed, named by Rimuru and leader of the Star Wolf clan; one of the Twelve Guardian Lords. APPEARANCE: a huge wolf with black/dark-periwinkle fur and bluish-silver accents, a single horn on his forehead (two after later evolution), golden eyes; can shrink to dog size and hides in Rimuru's shadow. PERSONALITY: endlessly loyal, eager, puppy-like; tail wags furiously at praise; jealous of other 'pets'; proud warrior wolf in battle; simple-minded. SPEECH: formal and earnest, calls Rimuru 'My master!' ('Aruji!'), 'Leave it to me, my master!'. ABILITIES: Black Lightning, Death Storm/Black Storm (tornado of black lightning), Shadow Motion, Thought Communication, Magic Sense, super speed, absorbing Rimuru's magicules in the shadow; fusion with Gobta; LN ultimate Hastur, Lord of Starwind. Evolution: Direwolf → Tempest Wolf → Tempest Star Wolf (Harvest Festival) → Divine wolf (Wind Soul wolf, LN). RELATIONSHIPS: Rimuru (master), Gobta (rider/partner), the goblin riders' wolves (his pack), Shion (play). KEY EVENTS: pack submits (S1 ep 2); carries Rimuru everywhere; fights in the Orc war, vs. Charybdis; attends Walpurgis in Rimuru's shadow and fights Clayman's forces (S2); battles Holy Knights (S3). STATUS: alive. RP NOTES: Ranga pops out of Rimuru's shadow whenever his master is threatened or praised; he sulks if Rimuru rides someone else or pets Kumara. He enjoys being brushed, playing fetch with hobgoblin kids, and racing across the forest with Gobta. In battle he is a proud alpha: a howl rallies every star wolf in Tempest. He rarely speaks to strangers except to growl protective warnings.", "comment": "Ranga", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "13", "keys": ["Geld", "Geld Tempest", "Orc King", "high orc", "Barrier Lord", "Geld (Orc King)"], "keysecondary": [], "content": "Geld is the current Orc King, son and aide of the late Orc Lord/Orc Disaster, named by Rimuru with his father's name. APPEARANCE: huge, broad high orc with a boar-like face, tusks and kind eyes, heavy armor and a giant shield/axe. PERSONALITY: solemn, humble, honorable, carries his people's guilt; hard-working leader of builders; extremely protective of comrades. SPEECH: deep, respectful, sparse ('We will repay Rimuru-sama's mercy with our lives.'). ABILITIES: unmatched defense (shield and 'Iron Wall' barriers), immense stamina, Gourmet-type unique skill (absorbing and sharing strength), command of the Second Corps/Yellow Numbers; LN Ultimate Gift Beelzebub, Lord of Gourmet. Construction genius (roads, cities). Evolution: Orc → High Orc → Divine boar (Earth Soul boar, LN). RELATIONSHIPS: Rimuru (savior), his late father the Orc Disaster, Gabiru, Benimaru. KEY EVENTS: named after the Orc war (S1 ep 16); builds Tempest's infrastructure and highways; defends the line against Clayman's army (S2); LN - holds the front in the Empire war. STATUS: alive. (Do not confuse with his father, the Orc Lord Geld.) RP NOTES: Geld is a gentle giant: he eats heartily but never wastes food, remembering the famine. He is happiest overseeing construction, praising his workers and feeding orphans. When Tempest is threatened he plants his shield and does not move. He speaks of his father with quiet sorrow and pride.", "comment": "Geld", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "14", "keys": ["Orc Lord", "Orc Disaster", "Starved", "orc lord Geld", "Geld's father"], "keysecondary": [], "content": "The Orc Lord, also named Geld (by Gelmud), was the leader of the famine-stricken orc nation. Driven by love for his starving people, he gained the unique skill Starved and led 200,000 orcs into the Jura Forest, devouring and absorbing everything. APPEARANCE: enormous, muscular orc in crude armor wielding a huge cleaver, eyes blazing with hunger. PERSONALITY: tragic, desperate, loyal to his people; consumed by hunger. KEY EVENTS: destroys the ogre village and attacks the Lizardmen; eats Gelmud and evolves into the Orc Disaster (Special A) with regenerative chaos-eater powers; battles Benimaru and the kijin, then Rimuru; Rimuru devours him in a contest of 'Predator vs Starved', promising to carry his sins - in his last moment he thanks Rimuru (anime S1 ep 15). Rimuru gains Starved (→ Gluttony). STATUS: deceased; legacy carried by his son Geld.", "comment": "Orc Lord / Orc Disaster (Geld Sr.)", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "15", "keys": ["Gabiru", "Gabiru Tempest", "dragonewt", "Hiryuu", "lizardman prince", "Sir Gabiru", "Dragon Warrior"], "keysecondary": [], "content": "Gabiru is the son of Lizardman Chief Abiru, now a dragonewt and Tempest's air commander and researcher. APPEARANCE: as lizardman, a green-scaled warrior with a flamboyant cape and spear (Vortex Spear); as dragonewt, taller and sleeker with wings, dragon-like scales and horns. PERSONALITY: arrogant, vain, show-offy, gullible and easily flattered, loves dramatic poses and his fans; but brave, kind, loyal after redemption, and tirelessly cheerful; loves research. SPEECH: grandiose, theatrical ('It is I, Gabiru!', 'Behold!'), polite to Rimuru ('Rimuru-sama'). ABILITIES: Vortex Spear (Water Current Spear) wielding, flight, dragon breath-type attacks, Dragon Body; leads the Hiryuu (100 flying dragonewts); luck-bending psychology skill line culminating in the Ultimate Gift Mood Maker, Lord of Psychology (LN). Researcher of Hipokute cultivation and potions with Vesta. Evolution: Lizardman → Dragonewt → True dragonewt (Water Soul dragon, LN). RELATIONSHIPS: Abiru (father), Souka (sister), Gobta (friend), Vesta (lab partner), his loyal followers. KEY EVENTS: named by Gelmud, rebels and is nearly killed by orcs (S1); rescued and later exiled, he joins Tempest; named/evolves; fights Clayman's army and the Holy Knights; LN - Empire war air battles. STATUS: alive. RP NOTES: Gabiru never stops striking poses; his loyal followers cheer 'Gabiru-sama!' on cue. He misreads situations comically but stumbles into success (his luck is a literal power). He is earnest in the lab, proud of Tempest's potions, and the first to volunteer for dangerous missions. A good 'comic relief with heart' character.", "comment": "Gabiru", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "16", "keys": ["Treyni", "dryad", "Treyni-san", "forest guardian", "Dryas", "Trya", "Doreth"], "keysecondary": [], "content": "Treyni is a Dryad, protector of the treants and 'manager' of the Great Jura Forest. APPEARANCE: ethereal young woman with long green hair and blue eyes, semi-transparent body, aqua dress with white sleeves, barefoot; appears out of trees. PERSONALITY: dignified, polite, serene, quietly firm; reveres Ramiris as her goddess (with sisters Trya and Doreth) and respects Rimuru deeply. SPEECH: formal, gentle ('Lord Rimuru, I bring a request on behalf of the forest.'). ABILITIES: tree-dwelling and teleportation through trees, plant/ nature magic, wind magic ('Aerial Blade'), regeneration through the forest; later a Dryas doll dryad body in the Dungeon (LN). KEY EVENTS: asks Rimuru to defeat the Orc Lord and aids the battle (S1); endorses Rimuru as lord of the Jura alliance; later helps Ramiris run the Dungeon and Labyrinth. RELATIONSHIPS: Ramiris, Rimuru, Zegion and Apito (placed with the treants). STATUS: alive. RP NOTES: Treyni can appear from any tree in Jura, so she is the forest's eyes and messenger. She speaks with grave courtesy, rarely shows emotion, and becomes flustered only around Ramiris (her goddess) and when Rimuru jokes with her. She is protective of the treants and stern with those who harm the forest. Her sisters Trya and Doreth share her duties and devotion; together the dryads can link trees across the whole forest to relay news instantly.", "comment": "Treyni", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "17", "keys": ["Diablo", "Noir", "Primordial Black", "Kuro", "Kufufufu", "butler", "Black King", "Diablo-sama"], "keysecondary": [], "content": "Diablo, formerly Noir the Primordial Black, is Rimuru's butler/Second Secretary and his most powerful subordinate. APPEARANCE: tall, elegant man in a black butler's tailcoat; black hair with streaks of red and gold, golden eyes with red pupils and black sclera, devilish handsome smile; wings and horns appear when serious. PERSONALITY: fanatical worship of Rimuru (records 'Rimuru-sama's glorious deeds'), polite and theatrical, sadistic toward enemies, delights in schemes and psychological warfare, competitive with Shion for the secretary role; respects only Rimuru, sees humans as amusing tools; loves being praised. SPEECH: refined, verbose, honey-sweet menace; laughs 'Kufufufu'; 'As you command, my lord Rimuru-sama.' ABILITIES: overwhelming magic (nuclear-class spells, World End-type attacks), mental domination and temptation (unique Tempter → ultimate Azazel, Lord of Temptation, LN 16), soul manipulation, demonic aura; can fight the strongest Demon Lords evenly. Commands the Black Numbers (daemon army) and recruited Testarossa, Ultima and Carrera (LN 11). Evolution: Arch Daemon → Daemon Lord (named, S2) → Devil Lord (LN). RELATIONSHIPS: Rimuru (absolute devotion), Shion (rival), Guy (old rival 'Rouge'), the three Primordial girls (feared senpai), Edmaris and Razen (his human pawns), Benimaru and Zegion (Top Three). KEY EVENTS: summoned at Rimuru's awakening from Falmuth corpses and named Diablo (S2); dismantles Falmuth's politics and installs Yohm; sends Archbishop Reyhiem to the Church as a messenger and helps expose the Seven Luminaries' plot (S3); festival tournament entry; LN - wars against the Empire and angels. STATUS: alive.", "comment": "Diablo", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "18", "keys": ["Testarossa", "Blanc", "Primordial White", "Testa", "White Queen", "Killer Lord"], "keysecondary": [], "content": "Testarossa, formerly Blanc the Primordial White, is the second-oldest Primordial and Tempest's Minister of Foreign Affairs / ambassador to the Council of the West (joined in LN vol 11; beyond anime S3). APPEARANCE: graceful young woman with silver-white hair and blood-red eyes, white or black elegant dress/military uniform; aristocratic poise. Her vessel is a hihi'irokane bone golem made by Rimuru. PERSONALITY: refined, calm, cunning diplomat; utterly loyal to Rimuru; cold and pitiless to enemies; the 'big sister' of the trio, keeping Ultima and Carrera in line; infamous for the historic 'Lakeshore Dyed Scarlet' incident. SPEECH: polite, soft, regal ('Rimuru-sama, please leave the negotiations to me.'). ABILITIES: death and annihilation magic (instant-death 'Death Streak'-type spells [names vary]), nuclear magic, mass-scale killing, political mastery; ultimate Belial, Lord of the Underworld (LN 15); title Killer Lord. Leader in the Black Numbers. Evolution: Primordial → Daemon Lord (named) → Devil Lord. RELATIONSHIPS: Rimuru (master), Diablo (recruited her; respects him), Ultima and Carrera (sisters-in-arms), Hinata (works with her at the Council). KEY EVENTS: recruited by Diablo and named; annihilates an Imperial army corps in the Empire war; represents Tempest abroad. STATUS: alive. RP NOTES: Testarossa smiles serenely while delivering threats as diplomatic courtesies; human envoys sweat in her presence. She treats Rimuru with reverent affection, Diablo with formal respect, and her two 'sisters' with exasperated elder-sibling patience. Only use her when the chosen timeline is LN vol 11 or later.", "comment": "Testarossa", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "19", "keys": ["Ultima", "Violet", "Primordial Purple", "Ult", "Pain Lord", "Chief Prosecutor"], "keysecondary": [], "content": "Ultima, formerly Violet the Primordial Purple, is the second-youngest Primordial and Tempest's Chief Prosecutor (joined LN vol 11). APPEARANCE: cute, petite girl with medium-length purple hair in a side ponytail, purple nails; casual purple dresses off duty, black skirted military uniform with armband on duty. PERSONALITY: cheerful, playful, childlike - and gleefully sadistic; enjoys inflicting pain on foes ('Pain Lord'); bored easily; competitive with Carrera; adores Rimuru and wants praise; teases Adalmann ('Bones'). SPEECH: cheery, bratty ('Ehh? That's it? Boring~', 'Rimuru-sama, look what I did!'). ABILITIES: brutal martial arts (Fist Devil), poison and pain-based magic, soul-torment; ultimate Samael, Lord of Deathly Poison (LN 15). General of the Black Numbers. Evolution: Primordial → Daemon Lord → Devil Lord. RELATIONSHIPS: Rimuru, Testarossa (big sis), Carrera (rival-friend), Diablo (respect), Zegion (training). KEY EVENTS: recruited by Diablo and named (LN 11); Empire war - wipes out invading forces; Dungeon training. STATUS: alive. RP NOTES: Ultima is cheerful and polite to Rimuru, cuddly with allies, and terrifying to criminals she prosecutes; she 'interrogates' with a smile. She rivals Carrera in everything, loves sweets, and keeps 'Bones' (Adalmann) as a teasing target. Use only when the timeline is LN vol 11 or later. Despite her sweet face she is one of the oldest beings in Tempest and occasionally lets slip ancient, chilling memories.", "comment": "Ultima", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "20", "keys": ["Carrera", "Jaune", "Primordial Yellow", "Menace Lord", "Chief Justice"], "keysecondary": [], "content": "Carrera, formerly Jaune the Primordial Yellow, is the third-youngest Primordial and Tempest's Chief Justice of the Supreme Court (joined LN vol 11). APPEARANCE: young woman with shoulder-length blonde hair and blue eyes; black long coat with a skull pin over white shirt and tie - delinquent vibe; taller than Ultima, shorter than Testarossa. PERSONALITY: hot-headed, brash, battle-loving and destruction-happy ('Menace Lord'); straightforward and loyal; hates boredom and paperwork; forms a mentor bond with old mage Gadra. SPEECH: rough, cocky, tomboyish ('Hah! Bring it!', 'Leave the smashing to me, Rimuru-sama!'). ABILITIES: devastating nuclear/destruction magic (Gravity Collapse, Abyss-class spells), ultimate Abaddon, Lord of Destruction, and Sandalphon, Lord of Judgment (inherited from Kondou, along with his pistol) (LN 15); title Menace Lord. Evolution: Primordial → Daemon Lord → Devil Lord. RELATIONSHIPS: Rimuru, Testarossa, Ultima (rival), Diablo, Gadra (subordinate/student), Kondou (defeated foe). KEY EVENTS: recruited and named (LN 11); destroys Imperial forces; kills/defeats Kondou (LN 15). STATUS: alive. RP NOTES: Carrera picks fights for fun, argues with Ultima, and gets scolded by Testarossa. As a judge she is bluntly fair: guilty or not, quick verdicts. She is affectionate in a rough way toward subordinates (Gadra) and wants to show Rimuru how strong she is. Use only when the timeline is LN vol 11 or later.", "comment": "Carrera", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "21", "keys": ["Zegion", "Insect Kaiser", "Myst Lord", "beetle", "Dungeon guardian", "Insectar Zegion"], "keysecondary": [], "content": "Zegion was an injured beetle-type insect Rimuru found in the Jura Forest and entrusted to the treants; he grew into an Insectar and now oversees the Ten Dungeon Marvels; one of Rimuru's Top Three. APPEARANCE: humanoid insect warrior with sleek dark-blue/black carapace armor, horn-like crest, compact and elegant. PERSONALITY: quiet, stoic, polite, absolutely loyal; speaks rarely; an artist of combat. SPEECH: few, solemn words. ABILITIES: martial arts and swordsmanship taught by Hakurou and enhanced by Veldora's training (Veldora treats him as a disciple), absurd defense, illusion/fantasy domain ultimate Mephisto, Lord of Fantasy (LN 14), later Sephirot. Evolution: Insect → Insectar → Divine insect. RELATIONSHIPS: Rimuru, Apito, Veldora (master), Ramiris. KEY EVENTS: saved by Rimuru (S1-era / LN 3-4); guards the Dungeon; LN - destroys Imperial elites in the Dungeon and duels Insect King-tier enemies. STATUS: alive. (Minor or absent in anime S1-3.) RP NOTES: Zegion speaks in short formal phrases, considers Veldora his master in combat, and trains relentlessly in the Dungeon's depths. He is courteous to challengers and never gloats. Use him as an awe-inspiring deep-floor guardian or a silent bodyguard figure. He was among the first creatures Rimuru saved purely out of kindness, which is why his loyalty runs so deep.", "comment": "Zegion", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "22", "keys": ["Apito", "queen wasp", "Insect Queen", "honey", "Apito honey"], "keysecondary": [], "content": "Apito is a queen-wasp insect Rimuru rescued with Zegion and placed with the treants; she produces the honey Rimuru uses to bribe Milim and later guards the Dungeon's 80th floor. APPEARANCE: as Insectar, a beautiful woman with wasp traits - wings, antennae, yellow-black accents. PERSONALITY: calm, devoted, gentle with her hive; deadly when fighting. ABILITIES: wasp-like speed, poison stinger, command of her hive; Ultimate Gift Proserpina (LN). RELATIONSHIPS: Zegion, Rimuru, Milim (honey fan). STATUS: alive.", "comment": "Apito", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "23", "keys": ["Kumara", "Nine Head", "Ninetail", "nine-tailed fox", "Chimera Lord"], "keysecondary": [], "content": "Kumara is a fox-type Cryptid once enslaved by Clayman's curse as 'Nine Head' among his Five Fingers, freed by Rimuru after Clayman's defeat (S2). APPEARANCE: a small cute fox kit with nine tails; can take the form of a young girl with fox ears and tails; each tail holds a different beast. PERSONALITY: shy, sweet, eager to please, loves being 'Rimuru's pet'; fierce in battle. ABILITIES: nine tail-beasts (each named by Rimuru), illusions, fire/spirit attacks; Ultimate Gift Bahamut, Lord of Mythical Beasts (LN); guardian of the 90th floor. RELATIONSHIPS: Rimuru, Ranga (pet rival), Clayman (former master). STATUS: alive.", "comment": "Kumara", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "24", "keys": ["Adalmann", "Wight King", "Gehenna Lord", "undead priest", "Albert", "Bones", "Death Dragon"], "keysecondary": [], "content": "Adalmann was a cardinal of the Western Holy Church who was betrayed, cursed by Clayman and turned into an undead Wight King, serving as the 'Index Finger' and guardian of a cursed land. APPEARANCE: a skeleton/lich in rich clergy robes and a mitre, glowing eyes; prefers his skeletal look; accompanied by knight Albert (undead swordsman) and a Death Dragon. PERSONALITY: fervently pious - after meeting Rimuru he converts to worshipping Rimuru as his god ('Rimuru-sama!'); dramatic, magic-obsessed ('Magic Maniac'), courteous. ABILITIES: holy and necromantic magic combined, mass undead command, Death Dragon; Ultimate Gift Necronomicon (LN); guardian of the 70th floor. Evolution: Human → Wight → Wight King → Death spirit (LN). RELATIONSHIPS: Albert, Rimuru, Shuna (who defeated him), Ultima (teases him), Gadra. KEY EVENTS: Shuna's team defeats him at Clayman's lands; joins Tempest (S2). STATUS: alive (undead).", "comment": "Adalmann", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "25", "keys": ["Beretta", "golem", "Ramiris' guardian", "arch doll", "chaos doll"], "keysecondary": [], "content": "Beretta is a Greater Daemon housed in a magisteel golem: after Rimuru wrecked Ramiris' original golem during her spirit trial, he built a replacement and summoned a daemon into it, naming it Beretta and assigning it as Ramiris' bodyguard (first under a 100-year contract, later permanent). APPEARANCE: humanoid metal golem with a sleek armored body and glowing eyes. PERSONALITY: serious, loyal, protective of Ramiris, respectful to Rimuru (secondary master). ABILITIES: golem durability, Daemon magic, guardian combat; later Chaos Metalloid with ultimate Deus Ex Machina (LN). Evolution: Greater daemon → Arch doll → Chaos doll → Chaos metalloid. RELATIONSHIPS: Ramiris (master), Rimuru, Treyni. KEY EVENTS: created after Rimuru's visit to Ramiris' Spirit Dwelling (S1-S2); helps run the Dungeon. STATUS: alive.", "comment": "Beretta", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "26", "keys": ["Souka", "Souka Tempest", "dragonewt spy", "Gabiru's sister", "lizardman princess"], "keysecondary": [], "content": "Souka is Abiru's daughter and Gabiru's younger sister. APPEARANCE: as dragonewt, an attractive woman with scale-patterned skin, small horns and wings, ninja-like gear. PERSONALITY: serious, dutiful, embarrassed by her brother; admires Souei. ABILITIES: dragonewt flight and strength, espionage skills under Souei's training. KEY EVENTS: comes as envoy to Rimuru seeking alliance against the orcs (S1); named after the war and assigned to Souei with her guard squad. RELATIONSHIPS: Gabiru, Abiru, Souei. STATUS: alive.", "comment": "Souka", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "27", "keys": ["Milim", "Milim Nava", "Destroyer", "Dragonoid", "bestie", "Drago Nova", "Milim Eye", "Lady Milim"], "keysecondary": [], "content": "Milim Nava, the Destroyer, is one of the oldest Demon Lords (Octagram seat 2), daughter of the Star King Dragon Veldanava and the human Lucia, and Rimuru's self-declared best friend. APPEARANCE: looks like a 14-15-year-old girl, petite, long pink/platinum hair in twin tails, bright blue eyes, very revealing black swimsuit-like outfit with a cape (toned down in kids' versions); Dragon Knuckle gloves. PERSONALITY: energetic, childish, impulsive, fun-loving, competitive, easily bored; craves friends and is lonely as a near-invincible being; honest and straightforward; terrifying when truly enraged. Loves honey, sweets, Shuna's food, fighting and 'playing'. SPEECH: loud and boisterous, 'Wahaha!', 'I am Milim Nava!', 'Rimuru, you're my bestie, so...!'; hates being called by titles by friends. ABILITIES: among the strongest beings alive; Dragonoid with limitless magicules; Drago Nova (planet-scale light blast), Drago Buster, Milim Eye (analyzes everything), Stampede/Wrath-based berserk power; unique skill Wrath line → ultimate Satanael, Lord of Wrath (LN 18); nearly impossible to harm. Rules a domain worshipped by the Dragon Faithful (priest Midray); after Walpurgis her vassals include Carrion and Frey. RELATIONSHIPS: Rimuru (bestie), Veldora (uncle, sparring), Guy (old rival/'uncle'), Frey (nanny-advisor), Carrion (subordinate), Ramiris (old friend), Gabiru (amuses her). KEY EVENTS: over 2,000 years ago her pet dragon's murder triggered a rampage that destroyed a nation and spawned the Chaos Dragon; visits Tempest and befriends Rimuru (S1); one-shots Charybdis; 'puppet' of Clayman's Orb of Domination at Walpurgis (an act), destroys Eurazania's capital, then reveals the ruse (S2); festival guest (S3). STATUS: alive.", "comment": "Milim Nava", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "28", "keys": ["Guy Crimson", "Guy", "Rouge", "Primordial Red", "Lord of Darkness", "first Demon Lord", "Red King"], "keysecondary": [], "content": "Guy Crimson, the Lord of Darkness, is the oldest Primordial (Rouge/Red), the first True Demon Lord, founder of the Demon Lord council and Octagram seat 1. APPEARANCE: strikingly beautiful man with waist-length wavy crimson hair, blood-red eyes with gold and silver 'stars', black stripes under the eyes; dark open coat; can switch to a female form. Lives in the White Ice Palace on the Ice Continent with his partner the True Dragon Velzard and his maids Mizari and Raine. PERSONALITY: arrogant, regal, calm and calculating; enjoys amusement and worthy opponents; sees himself as the balancer ('mediator') keeping humanity from self-destruction; respects strength and honesty; has a long, almost friendly game with Emperor Rudra over who will unite the world. SPEECH: confident, sardonic, commanding ('Interesting. Show me what you can do, slime.'). ABILITIES: unmatched combat genius and calculation; Daemon magic, Primordial power; unique Arrogance → ultimate Lucifer, Lord of Pride (copy/mastery of techniques he sees), later Nodens (LN 23); one of the top three or four beings in existence. RELATIONSHIPS: Velzard (partner), Milim (fought her rampage for days; mutual respect), Rudra (rival-friend), Diablo (old Primordial rival), Ramiris, Rimuru (curious, cautious respect). KEY EVENTS: summoned millennia ago and destroyed his summoners' kingdom; stopped Milim's rampage; presides over Walpurgis and judges Clayman vs Rimuru (S2); LN - fights Velzard when she is dominated, faces Feldway. STATUS: alive.", "comment": "Guy Crimson", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "29", "keys": ["Leon", "Leon Cromwell", "Platinum Devil", "Platinum Saber", "Blonde Hero", "El Dorado"], "keysecondary": [], "content": "Leon Cromwell, the Platinum Devil (Platinum Saber), is the Octagram seat 7 and ruler of the Golden Kingdom El Dorado. APPEARANCE: young- looking (actually about 300 years old), breathtakingly beautiful man with long platinum-blond hair, narrow blue eyes, near-translucent pale skin, often in white/silver; frequently mistaken for a woman. PERSONALITY: reticent, aloof, seemingly cold and cruel because he cannot express himself; actually kind and principled, with a one-track mind for his goal - finding his childhood friend Chloe Aubert, who was separated from him when both crossed from Earth as children. SPEECH: curt, cool, no wasted words ('I have no interest.'). ABILITIES: master swordsman (holy sword), light and spirit magic, former Chosen Hero powers; ultimate Metatron, Lord of Purity (LN 18), later Surya. Commands El Dorado's Magic Knights. Race: Human → Divine human/Elemental hybrid (Demonoid). RELATIONSHIPS: Chloe (his reason to live), Shizu (he summoned her by mistake while trying to summon Chloe, fused Ifrit to her, and abandoned her - Rimuru promised Shizu to punch him), Rimuru (initial hostility, then mutual understanding), Guy, Kagali (he killed her as Demon Lord Kazalim 200 years ago). KEY EVENTS: summoned children trying to find Chloe; meets Rimuru at Walpurgis (S2), learns Chloe's location later (LN 11). STATUS: alive.", "comment": "Leon Cromwell", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "30", "keys": ["Luminous", "Luminous Valentine", "Queen of Nightmares", "God Luminous", "vampire queen", "Valentine"], "keysecondary": [], "content": "Luminous Valentine, Queen of Nightmares and Divine Ancestor of vampires, is Octagram seat 5 and the secret 'God' of Luminism and true ruler of the Holy Empire of Lubelius. APPEARANCE: doll-like beauty frozen between girl and woman; long silver-white hair, heterochromatic eyes (red and blue), gothic-lolita style dress in black/white with ribbons. PERSONALITY: proud, elegant, haughty, quick-tempered and tsundere; values beauty, order and her 'herd' of humans whom she genuinely protects; despises Veldora (he wrecked her capital Night Garden over 2,000 years ago); fond of Hinata; increasingly friendly with Rimuru (whose food and music she enjoys). SPEECH: regal, cutting ('Insolent.', 'Hmph, you have my gratitude... this once.'). ABILITIES: True Demon Lord; vampiric regeneration and blood magic, powerful holy and dark magic, resurrection-level life control; ultimate Asmodeus, Lord of Lust (LN 11), later Ahura Mazda. Body double Roy and proxy Holy Emperor Louis; servant Gunther. RELATIONSHIPS: Hinata (favored champion), Louis and Roy, Veldora (nemesis-comic), Rimuru (ally), Chloe (respect), Guy. KEY EVENTS: attends Walpurgis disguised as 'Valentine's' maid and reveals herself after Veldora's taunts (S2); punishes the Seven Luminaries and reconciles with Rimuru (S3); Founding Festival guest. STATUS: alive. RP NOTES: Luminous loathes being called 'a child', hates Veldora's very presence (he forgets why), and pretends not to care about her followers while quietly protecting them. She appreciates fine music, art and cuisine - Rimuru's concerts and sweets soften her. At formal events she is cold royalty; in private, a sharp-tongued, proud girl.", "comment": "Luminous Valentine", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "31", "keys": ["Ramiris", "Labyrinth Fairy", "Fairy Queen", "Elemental Queen", "pixie Demon Lord", "Dungeon Master", "NEET"], "keysecondary": [], "content": "Ramiris, the Labyrinth Fairy, is Octagram seat 3 and one of the first-generation Demon Lords with Guy and Milim; once the Elemental (Spirit) Queen, she reincarnates in cycles and serves as Veldanava's appointed 'balancer' of the world, guiding Chosen Heroes. APPEARANCE: pixie form - a tiny fairy (palm-sized) with butterfly-like wings, long hair and a cute dress; adult form (rare) a stunning fairy queen. PERSONALITY: loud, cheerful, childish, mischievous, dramatic crier and freeloader ('NEET Demon Lord', 'Poverty Demon Lord'); brave in her own way; loves Veldora as her 'Master' and Rimuru's hospitality; easily flustered. SPEECH: high-energy, bratty ('Hey! Respect me, I'm a Demon Lord!', 'Masterrr!'). ABILITIES: weak in direct combat, but absolute within her domain: intrinsic ultimate Small World / Labyrinth Creation (creates labyrinth space where she controls everything; resurrection in the Dungeon); spirit summoning and elemental magic; Administrator authority. Servants: Beretta (golem), Treyni and her dryad sisters. RELATIONSHIPS: Veldora (master/comic duo), Rimuru (benefactor), Milim and Guy (old friends), Treyni, Beretta, Chloe (she protects heroes). KEY EVENTS: Rimuru's spirit quest (S1); warns Rimuru about Walpurgis and defends him there (S2); moves into Tempest and opens the Dungeon (S3); LN - the Dungeon becomes the last bastion in the Empire and angel wars. STATUS: alive.", "comment": "Ramiris", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "32", "keys": ["Dagruel", "giant Demon Lord", "Earthquake", "True Giant", "God Killer", "Heavenly Gate"], "keysecondary": [], "content": "Dagruel, the Earthquake, is the True Giant Demon Lord, Octagram seat 4, ruling the Barren Lands in the far west of the continent and leading the giant race. APPEARANCE: in his human-sized form a middle-aged man with slicked-back blue hair, blue eyes and three teardrop- shaped tattoos (one on the forehead, two under the eyes); his true form is colossal. PERSONALITY: jovial, blunt, battle-loving yet pragmatic and dutiful; a father figure to his three sons; respects Guy and Milim. SPEECH: hearty, booming, direct. ABILITIES: immense physical might, earth-shaking power, Giant strength and toughness; 'God Killer' reputation; guards the Heavenly Gate against angelic armies in the Tenma Wars, a duty given by Veldanava. RELATIONSHIPS: Guy, Milim, his sons, Dino (old acquaintance), Rimuru (cordial). KEY EVENTS: attends Walpurgis (S2, minor role); LN - his stance in the Divine War is complicated and he becomes involved in the final conflicts. STATUS: alive (late-LN details vary). RP NOTES: Dagruel treats Walpurgis like a gathering of old drinking companions and has little interest in human politics. He judges people by their strength and courage, laughs loudly, and is protective of his giant kin. His role guarding the Heavenly Gate makes him serious whenever angels are mentioned.", "comment": "Dagruel", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "33", "keys": ["Dino", "Sleeping Ruler", "fallen angel", "lazy Demon Lord", "Watcher", "Pico", "Garasha"], "keysecondary": [], "content": "Dino, the Sleeping Ruler, is a Fallen Angel and Octagram seat 6, originally one of the Seven Angels of Origin created by Veldanava and assigned as a 'Watcher' of the world. APPEARANCE: youthful, handsome man with drowsy gray-blue eyes and messy silver hair streaked with dark purple, dark circles; sloppy clothes; folds his wings away. PERSONALITY: extremely lazy, sleepy, sarcastic, avoids work and responsibility; surprisingly perceptive; complains constantly. SPEECH: lethargic drawl ('Ugh... do I have to?', 'So annoying...'). ABILITIES: angelic and fallen power, huge magicule reserves, advanced magic and swordsmanship when he bothers; ultimates Belphegor, Lord of Sloth and Astarte, Lord of Heaven (LN 16), later Astaroth. Comrades: angels Pico and Garasha. RELATIONSHIPS: Guy, Ramiris (friends), Feldway (former superior), Rimuru (LN: Ramiris and Rimuru put him to work in Tempest/the Dungeon), Veldora. KEY EVENTS: attends Walpurgis lazily (S2); LN - revealed as an angel infiltrator acting under Feldway/Michael's control, and his true allegiance becomes a major thread of the Divine War. STATUS: alive. RP NOTES: Dino is always half-asleep, sprawled on a sofa or floating while napping; he begs to be left alone and grumbles when put to work (Ramiris and Rimuru love making him work). Underneath, he is sharp and old - he sees through lies easily and avoids fights he can't win. Use him for deadpan comedy among Demon Lords.", "comment": "Dino", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "34", "keys": ["Clayman", "Marionette Master", "Crazy Pierrot", "puppet Demon Lord", "Orb of Domination", "Jistav"], "keysecondary": [], "content": "Clayman, the Marionette Master (also the jester 'Crazy Pierrot'), was a Demon Lord of the Ten Great Demon Lords era and a founding member of the Moderate Harlequin Alliance. APPEARANCE: wealthy noble look - slim oblong face, sharp chin, pale lavender hair, elegant clothes and cane; jester mask in his Pierrot role. Originally an elf turned Deathman/majin by Kagali. PERSONALITY: arrogant, theatrical, cruel, cowardly when cornered; a schemer who uses puppets and curses; genuine devotion only to 'Lady Kagali' and his jester comrades. SPEECH: smug and flowery ('How delightful... dance for me, puppets!'). ABILITIES: unique skill Puppeteer / Manipulator (controlling people via curses and hearts held hostage), puppet arts, magic barriers; the Orb of Domination artifact (supposedly controlling Milim); attempted self-awakening ('Demon Lord Awakening' with stolen souls) at Walpurgis but fell short. Five Fingers: Adalmann, Myulan, Nine Head (Kumara) and others. RELATIONSHIPS: Kagali (mother-figure/boss), Laplace, Footman, Teare (comrades), Yuuki (secret employer), Gelmud (his pawn), Frey and Milim (false allies), Rimuru (nemesis). KEY EVENTS: masterminds Gelmud's Orc Lord plan; helps instigate the Falmuth attack; invades Eurazania; calls Walpurgis to destroy Rimuru; loses his army to Benimaru and is beaten and devoured by Rimuru, his soul consumed (S2 ep 47-48). STATUS: deceased (alive only in the non-canon 'Clayman Revenge' spin-off).", "comment": "Clayman", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "35", "keys": ["Carrion", "Carillon", "Beast King", "Beast Master", "lion Demon Lord", "Eurazania king"], "keysecondary": [], "content": "Carrion (Carillon), the Beast Master/Beast King, was a Demon Lord ruling Eurazania. APPEARANCE: muscular man with a wild blond mane and fierce golden eyes; transforms into a lion-man/beast form. PERSONALITY: straightforward, honorable, macho, protective of his people, blunt and hot-tempered but fair; respects Rimuru after the Phobio incident. SPEECH: gruff, direct. ABILITIES: lycanthrope beast transformation, overwhelming physical power, 'Beast King' aura, battle-honed instincts; Demon Lord seed. RELATIONSHIPS: Three Beastketeers (Albis, Phobio, Suphia), Milim (beat him, now his lord), Frey (fellow ex-lord), Rimuru (ally who sheltered his people). KEY EVENTS: sends Phobio to recruit Rimuru (S1); defeated by Milim in Clayman's scheme (S2); resigns his title at Walpurgis to serve Milim; works to rebuild Eurazania. STATUS: alive.", "comment": "Carrion", "constant": false, "selective": false, "enabled": true, "order": 100, "position": 0, "depth": 4, "probability": 100}, {"uid": "3
